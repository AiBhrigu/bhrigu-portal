name: BTC Clarification Resolution PR

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/scripts/verify-btc-public-acceptance-scope.py
      - .github/workflows/btc-clarification-resolution-pr.yml
      - .github/workflows/btc-public-live-visual-information-acceptance-pr.yml
      - components/btc/BtcCosmographerDialogue.tsx
      - lib/btc-cosmographer-evidence-navigation-runtime.ts
      - lib/btc-cosmographer-route-graph.ts
      - pages/crypto-astro/btc/live.tsx
      - scripts/run-btc-evidence-navigation-runtime-fixture.mjs
      - scripts/verify-btc-cosmographer-route-surface.py

permissions:
  contents: read

concurrency:
  group: btc-clarification-resolution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BTC_ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BTC_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  exact-head-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify current exact acceptance scope
        run: |
          git fetch origin "${GITHUB_BASE_REF}"
          python3 .github/scripts/verify-btc-public-acceptance-scope.py

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify decision runtime and inherited routing
        run: |
          node scripts/run-btc-evidence-navigation-runtime-fixture.mjs
          npm run verify:btc-routing

      - name: Verify production build
        run: npm run build

      - name: Start exact-head production server
        run: |
          npm start > /tmp/btc-next.log 2>&1 &
          echo $! > /tmp/btc-next.pid
          for attempt in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:3000/crypto-astro/btc/live?lang=ru' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/btc-next.log
          exit 1

      - name: Install browser driver client
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Verify real sessionStorage and form chain
        run: |
          python3 - <<'PY'
          import json
          from urllib.parse import parse_qs, quote, urlparse
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = "http://127.0.0.1:3000/crypto-astro/btc/live?lang=ru"
          session_key = "bhrigu:btc-cosmographer:session:v0_3"
          options = webdriver.ChromeOptions()
          for argument in ("--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1280,1000"):
              options.add_argument(argument)
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 25)
          checks = []

          def record(name, condition, details=""):
              checks.append({"name": name, "passed": bool(condition), "details": details})
              if not condition:
                  raise AssertionError(f"{name}: {details}")

          def turns():
              return driver.find_elements(By.CSS_SELECTOR, "article[data-route-domain]")

          def exchanges():
              return driver.find_elements(By.CSS_SELECTOR, ".dialogueExchange")

          def latest():
              wait.until(lambda _: len(turns()) > 0)
              return turns()[-1]

          def value(node, name):
              return node.get_attribute(name) or ""

          def relation(node):
              return value(node, "data-semantic-context-relation") or value(node, "data-context-relation")

          def session():
              raw = driver.execute_script("return window.sessionStorage.getItem(arguments[0])", session_key)
              return json.loads(raw) if raw else None

          def session_turn_count():
              current = session()
              return len(current.get("turns", [])) if isinstance(current, dict) else 0

          def current_question():
              return parse_qs(urlparse(driver.current_url).query).get("q", [""])[0]

          def wait_for_session_question(question):
              wait.until(lambda _: any(
                  turn.get("user_text") == question
                  for turn in ((session() or {}).get("turns", []))
              ))

          def wait_for_composer():
              return wait.until(lambda d: d.find_element(By.CSS_SELECTOR, 'textarea[name="q"]'))

          def reset():
              driver.get(base)
              wait_for_composer()
              driver.execute_script("window.sessionStorage.clear()")
              driver.get(base)
              wait_for_composer()

          def open_question(question):
              driver.get(f"{base}&q={quote(question)}")
              node = latest()
              wait_for_session_question(question)
              return node

          def submit(
              question,
              expected_disposition,
              expected_domain,
              expected_subject,
              expected_relation,
              expected_mode,
          ):
              before_url = driver.current_url
              before_session_turns = session_turn_count()
              before_dom_turns = len(exchanges())
              before_route_turns = len(turns())
              textarea = wait_for_composer()
              textarea.clear()
              textarea.send_keys(question)
              wait.until(lambda _: textarea.get_attribute("value") == question)
              form = driver.find_element(By.CSS_SELECTOR, "form.liveComposer")
              button = form.find_element(By.CSS_SELECTOR, 'button[type="submit"]')
              driver.execute_script(
                  "arguments[0].scrollIntoView({block:'center',inline:'nearest'});",
                  button,
              )
              wait.until(lambda _: button.is_displayed() and button.is_enabled())
              button.click()

              wait.until(lambda _: current_question() == question)
              wait.until(lambda _: session_turn_count() > before_session_turns)
              wait.until(lambda _: len(exchanges()) > before_dom_turns)
              wait.until(lambda _: len(turns()) > before_route_turns)
              wait_for_session_question(question)
              wait.until(lambda _: value(latest(), "data-route-disposition") == expected_disposition)
              wait.until(lambda _: value(latest(), "data-route-domain") == expected_domain)
              wait.until(lambda _: value(latest(), "data-route-subject") == expected_subject)
              wait.until(lambda _: relation(latest()) == expected_relation)
              wait.until(lambda _: value(latest(), "data-answer-mode") == expected_mode)
              wait_for_composer()
              node = latest()

              tag = str(before_session_turns + 1)
              record(f"form_request_submitted_{tag}", driver.current_url != before_url, driver.current_url)
              record(f"url_updated_{tag}", current_question() == question, current_question())
              record(f"session_turn_incremented_{tag}", session_turn_count() > before_session_turns, session_turn_count())
              record(f"dom_turn_incremented_{tag}", len(exchanges()) > before_dom_turns, len(exchanges()))
              record(f"newest_turn_exists_{tag}", len(turns()) > before_route_turns, len(turns()))
              record(
                  f"newest_turn_route_exact_{tag}",
                  value(node, "data-route-disposition") == expected_disposition
                  and value(node, "data-route-domain") == expected_domain
                  and value(node, "data-route-subject") == expected_subject
                  and relation(node) == expected_relation
                  and value(node, "data-answer-mode") == expected_mode,
                  json.dumps({
                      "disposition": value(node, "data-route-disposition"),
                      "domain": value(node, "data-route-domain"),
                      "subject": value(node, "data-route-subject"),
                      "relation": relation(node),
                      "mode": value(node, "data-answer-mode"),
                  }, ensure_ascii=False),
              )
              record(f"composer_available_{tag}", bool(wait_for_composer()))
              return node

          try:
              reset()
              seed = open_question("Текущая позиция Биткоина в каком окне?")
              record("method_seed_clarifies", value(seed, "data-route-disposition") == "CLARIFY")
              origin = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, 'input[name="pof"]')).get_attribute("value")
              record("pending_origin_present", bool(origin))
              method = submit("метод", "CONTINUE", "methodology", "source_and_method", "NEW_TOPIC", "METHODOLOGY")
              record("method_domain", value(method, "data-route-domain") == "methodology", value(method, "data-route-domain"))
              record("method_continues", value(method, "data-route-disposition") == "CONTINUE", value(method, "data-route-disposition"))

              reset()
              seed = open_question("Текущая позиция Биткоина в каком окне?")
              record("protocol_seed_clarifies", value(seed, "data-route-disposition") == "CLARIFY")
              protocol = submit("протокол Bitcoin", "CONTINUE", "bitcoin_protocol", "overview", "NEW_TOPIC", "PROTOCOL_EXPLAIN")
              record("protocol_domain", value(protocol, "data-route-domain") == "bitcoin_protocol", value(protocol, "data-route-domain"))
              record("protocol_subject", value(protocol, "data-route-subject") == "overview", value(protocol, "data-route-subject"))
              record("protocol_continues", value(protocol, "data-route-disposition") == "CONTINUE", value(protocol, "data-route-disposition"))

              reset()
              open_question("Текущая позиция Биткоина в каком окне?")
              first_unknown = submit("неизвестный предмет один", "CLARIFY", "unsupported", "unknown", "GENUINELY_AMBIGUOUS", "CLARIFICATION")
              record("first_unknown_clarifies", value(first_unknown, "data-route-disposition") == "CLARIFY", value(first_unknown, "data-route-disposition"))
              second_unknown = submit("неизвестный предмет два", "CLARIFY", "unsupported", "unknown", "GENUINELY_AMBIGUOUS", "CLARIFICATION")
              record("distinct_unknown_clarifies", value(second_unknown, "data-route-disposition") == "CLARIFY", value(second_unknown, "data-route-disposition"))
              record("distinct_unknown_not_loop", value(second_unknown, "data-anti-loop-blocked") == "false", value(second_unknown, "data-anti-loop-blocked"))

              reset()
              open_question("Текущая позиция Биткоина в каком окне?")
              repeated = submit("неизвестный предмет", "CLARIFY", "unsupported", "unknown", "GENUINELY_AMBIGUOUS", "CLARIFICATION")
              record("first_repeat_clarifies", value(repeated, "data-route-disposition") == "CLARIFY", value(repeated, "data-route-disposition"))
              repeated = submit("неизвестный предмет", "STOP", "unsupported", "unknown", "GENUINELY_AMBIGUOUS", "CLARIFICATION")
              record("exact_repeat_stops", value(repeated, "data-route-disposition") == "STOP", value(repeated, "data-route-disposition"))
              record("exact_repeat_loop_flag", value(repeated, "data-anti-loop-blocked") == "true", value(repeated, "data-anti-loop-blocked"))

              reset()
              mars = open_question("Марс и его цикл в 2026 году")
              record("mars_domain", value(mars, "data-route-domain") == "astromodule", value(mars, "data-route-domain"))
              record("mars_subject", value(mars, "data-route-subject") == "mars", value(mars, "data-route-subject"))
              halving = submit("Халвинг и его влияние на окна в циклах", "CONTINUE", "bitcoin_protocol", "halving", "NEW_TOPIC", "PROTOCOL_EXPLAIN")
              record("halving_domain", value(halving, "data-route-domain") == "bitcoin_protocol", value(halving, "data-route-domain"))
              record("halving_subject", value(halving, "data-route-subject") == "halving", value(halving, "data-route-subject"))
              record("halving_new_topic", relation(halving) == "NEW_TOPIC", relation(halving))

              current_session = session()
              record("session_v0_3_present", isinstance(current_session, dict))
              record("session_has_chain", len(current_session.get("turns", [])) >= 2, str(len(current_session.get("turns", []))))
          finally:
              driver.quit()

          report = {
              "schema": "btc_clarification_resolution_real_chain_v0_3",
              "status": "PASS" if all(item["passed"] for item in checks) else "FAIL",
              "check_count": len(checks),
              "checks": checks,
          }
          with open("/tmp/btc-clarification-resolution-report.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False))
          PY

      - name: Stop server
        if: always()
        run: |
          if test -f /tmp/btc-next.pid; then kill "$(cat /tmp/btc-next.pid)" || true; fi
          if test -f /tmp/btc-next.log; then tail -n 120 /tmp/btc-next.log; fi

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-clarification-resolution-${{ github.event.pull_request.head.sha }}
          path: /tmp/btc-clarification-resolution-report.json
          if-no-files-found: warn
          retention-days: 14
