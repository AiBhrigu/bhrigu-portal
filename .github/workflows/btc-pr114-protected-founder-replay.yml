name: BTC PR114 Protected Founder Replay

on:
  push:
    branches:
      - agent/btc-pr114-stacked-session-verifier-v0-3
    paths:
      - .github/scripts/verify-btc-public-acceptance-scope.py
      - .github/workflows/btc-pr114-protected-founder-replay.yml

concurrency:
  group: btc-pr114-protected-founder-replay
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  protected-founder-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HANDOFF_ISSUE: '118'
      EXPECTED_RUNTIME_HEAD: a13475bc65c16009bd682a5f7a6d0bb40f7d5db3
      STACKED_HEAD: ${{ github.sha }}
      PREVIEW_BASE: https://bhrigu-portal-5suefn94b-aibhrigus-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish ephemeral RSA public key
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          base64 -w0 /tmp/public.pem > /tmp/public.b64
          python3 - <<'PYKEY'
          import json, os, urllib.request
          key=open('/tmp/public.b64').read().strip()
          body='\n'.join(['PR114_BROWSER_PUBLIC_KEY_V1',f"RUN_ID={os.environ['RUN_ID']}",f"STACKED_HEAD={os.environ['STACKED_HEAD']}",f"EXPECTED_RUNTIME_HEAD={os.environ['EXPECTED_RUNTIME_HEAD']}",f"PUBLIC_KEY_B64={key}"])
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/issues/{os.environ['HANDOFF_ISSUE']}/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'pr114-browser-handoff'})
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status==201
          print('EPHEMERAL_PUBLIC_KEY_PUBLISHED=PASS')
          PYKEY

      - name: Receive and decrypt temporary share grant
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PYCIPHER'
          import json,os,time,urllib.request
          marker=f"RUN_ID={os.environ['RUN_ID']}"
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/issues/{os.environ['HANDOFF_ISSUE']}/comments?per_page=100"
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'pr114-browser-handoff'}
          for _ in range(180):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r: comments=json.load(r)
            for c in comments:
              body=c.get('body','')
              if 'PR114_BROWSER_CIPHERTEXT_V1' in body and marker in body:
                for line in body.splitlines():
                  if line.startswith('CIPHERTEXT_B64=') and line.split('=',1)[1].strip():
                    open('/tmp/cipher.b64','w').write(line.split('=',1)[1].strip()); print('ENCRYPTED_HANDOFF_RECEIVED=PASS'); raise SystemExit
            time.sleep(4)
          raise SystemExit('encrypted handoff timeout')
          PYCIPHER
          base64 -d /tmp/cipher.b64 > /tmp/cipher.bin
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/cipher.bin -out /tmp/share-url -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PYVALIDATE'
          import os
          from urllib.parse import urlparse,parse_qs
          value=open('/tmp/share-url').read().strip(); parsed=urlparse(value); expected=urlparse(os.environ['PREVIEW_BASE'])
          assert parsed.scheme=='https' and parsed.netloc==expected.netloc and parse_qs(parsed.query).get('_vercel_share',[''])[0]
          open('/tmp/share-token','w').write(parse_qs(parsed.query)['_vercel_share'][0])
          print('DECRYPTED_SHARE_GRANT_VALIDATED=PASS')
          PYVALIDATE
          U=$(cat /tmp/share-url); T=$(cat /tmp/share-token)
          echo "::add-mask::$U"; echo "::add-mask::$T"
          { echo 'PROTECTED_SHARE_URL<<EOF'; cat /tmp/share-url; echo; echo EOF; } >> "$GITHUB_ENV"
          rm -f /tmp/cipher.b64 /tmp/cipher.bin /tmp/share-token

      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Materialize protected replay verifier
        run: |
          echo '' | base64 -d | gzip -d > /tmp/pr114-protected-replay.py
          chmod 700 /tmp/pr114-protected-replay.py

      - name: Execute protected desktop and mobile replay
        run: python /tmp/pr114-protected-replay.py

      - name: Publish sanitized completion callback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYCALLBACK'
          import json,os,urllib.request
          body='\n'.join(['PR114_BROWSER_REPLAY_COMPLETE_V1',f"RUN_ID={os.environ['RUN_ID']}",f"STACKED_HEAD={os.environ['STACKED_HEAD']}",f"EXPECTED_RUNTIME_HEAD={os.environ['EXPECTED_RUNTIME_HEAD']}",'CONCLUSION=SUCCESS','CREDENTIAL_EXPOSURE=NO'])
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/issues/{os.environ['HANDOFF_ISSUE']}/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'pr114-browser-handoff'})
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status==201
          print('SANITIZED_COMPLETION_CALLBACK=PASS')
          PYCALLBACK

      - name: Upload protected founder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-pr114-protected-founder-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr114-protected-founder-replay/
          if-no-files-found: warn
          retention-days: 30
