name: BTC Free Corridor Conversational Surface PR

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/btc-free-corridor-conversational-surface-pr.yml
      - components/btc/BtcFreeCorridorSurfaceAdapter.js
      - package.json
      - pages/_app.js
      - scripts/verify-btc-free-corridor-surface-adapter.mjs

permissions:
  contents: read

concurrency:
  group: btc-free-corridor-conversational-surface-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-head-product-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact base and five-file scope
        run: |
          git fetch origin master
          test "$(git merge-base HEAD origin/master)" = "c1d60096055aa4591f3ee32b43799100dc0b75b1"
          git diff --name-only c1d60096055aa4591f3ee32b43799100dc0b75b1 HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/btc-free-corridor-conversational-surface-pr.yml
          components/btc/BtcFreeCorridorSurfaceAdapter.js
          package.json
          pages/_app.js
          scripts/verify-btc-free-corridor-surface-adapter.mjs
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify static conversational contract
        run: npm run verify:btc-free-corridor

      - name: Verify production build
        run: npm run build

      - name: Start exact-head production server
        run: |
          npm start > /tmp/btc-free-corridor-next.log 2>&1 &
          echo $! > /tmp/btc-free-corridor-next.pid
          for attempt in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:3000/crypto-astro/btc/live?lang=ru' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/btc-free-corridor-next.log
          exit 1

      - name: Install browser driver client
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Verify desktop mobile conversation and expiry boundary
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.parse import quote, unquote
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = "http://127.0.0.1:3000"
          options = webdriver.ChromeOptions()
          for argument in (
              "--headless=new",
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--window-size=1280,1000",
          ):
              options.add_argument(argument)
          options.set_capability("goog:loggingPrefs", {"browser": "ALL"})
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 30)
          checks = []

          def record(name, condition, details=""):
              checks.append({"name": name, "passed": bool(condition), "details": details})
              if not condition:
                  raise AssertionError(f"{name}: {details}")

          def no_horizontal_overflow():
              return driver.execute_script(
                  "return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1"
              )

          try:
              driver.get(f"{base}/crypto-astro/btc?lang=ru")
              buttons = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, ".btcPublicQuestionGrid button"))
              record("entry_five_question_navigator", len(buttons) == 5, str(len(buttons)))
              labels = [button.find_element(By.TAG_NAME, "span").text for button in buttons]
              record("entry_exact_labels", labels == [
                  "Ситуация сейчас",
                  "Что изменилось",
                  "Где расхождение",
                  "Что дальше",
                  "Проверить источники",
              ], repr(labels))
              record("desktop_no_horizontal_overflow", no_horizontal_overflow())

              driver.set_window_rect(width=390, height=844)
              driver.refresh()
              mobile_buttons = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, ".btcPublicQuestionGrid button"))
              record("mobile_five_question_navigator", len(mobile_buttons) == 5, str(len(mobile_buttons)))
              positions = [round(button.rect["x"]) for button in mobile_buttons]
              record("mobile_single_column", len(set(positions)) == 1, repr(positions))
              record("mobile_no_horizontal_overflow", no_horizontal_overflow())

              liquidity = quote("Что сейчас с ликвидностью BTC?")
              driver.get(f"{base}/crypto-astro/btc/live?lang=ru&q={liquidity}")
              wait.until(lambda d: d.find_element(By.CSS_SELECTOR, "article[data-route-subject='liquidity']"))
              conclusion = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, ".btcPublicConclusion"))
              record("first_public_conclusion_visible", len(conclusion.text) > 20, conclusion.text)
              record("sources_collapsed", all(
                  not node.get_attribute("open")
                  for node in driver.find_elements(By.CSS_SELECTOR, "details.answerSource, details.answerSourceHistory")
              ))
              next_step = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, ".answerNextStep[role='button']"))
              record("next_question_actionable", next_step.get_attribute("tabindex") == "0")
              contract = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, "[data-free-session-contract='60-minutes']"))
              record("free_contract_visible", "60 минут" in contract.text, contract.text)

              form = driver.find_element(By.CSS_SELECTOR, "form.liveComposer")
              textarea = form.find_element(By.CSS_SELECTOR, "textarea[name='q']")
              textarea.clear()
              textarea.send_keys("Почему?")
              driver.execute_script("arguments[0].requestSubmit()", form)
              wait.until(lambda d: "Почему%20текущие%20сигналы%20ликвидности" in d.current_url or "Почему+текущие+сигналы+ликвидности" in d.current_url)
              record("why_follow_up_subject_expanded", "ликвидности" in unquote(driver.current_url), driver.current_url)
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, "article[data-route-subject='liquidity']")) >= 1)

              driver.execute_script(
                  "window.sessionStorage.setItem('bhrigu:btc-free-corridor:start:v0_1', String(Date.now() - 3600001))"
              )
              driver.refresh()
              gate = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, ".btcFreeGate"))
              record("expiry_preserves_answers", bool(driver.find_elements(By.CSS_SELECTOR, ".liveThread")))
              record("expiry_two_actions", len(gate.find_elements(By.TAG_NAME, "button")) == 2)

              severe = [entry for entry in driver.get_log("browser") if entry.get("level") == "SEVERE"]
              record("severe_browser_errors_zero", len(severe) == 0, json.dumps(severe, ensure_ascii=False))
          finally:
              print(json.dumps({
                  "schema": "btc_free_corridor_browser_acceptance_v0_1",
                  "total": len(checks),
                  "passed": sum(1 for check in checks if check["passed"]),
                  "checks": checks,
              }, ensure_ascii=False, indent=2))
              driver.quit()
          PY

      - name: Stop server
        if: always()
        run: |
          test ! -f /tmp/btc-free-corridor-next.pid || kill "$(cat /tmp/btc-free-corridor-next.pid)" || true
          test ! -f /tmp/btc-free-corridor-next.log || tail -n 120 /tmp/btc-free-corridor-next.log
