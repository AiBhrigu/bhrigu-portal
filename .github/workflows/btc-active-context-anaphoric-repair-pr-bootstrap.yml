name: BTC active-context anaphoric repair PR bootstrap

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/btc-active-context-anaphoric-followup-routing-v0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Execute bounded repair and checks from locked bootstrap
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/btc-active-context-anaphoric-repair-bootstrap.yml').read_text()

          def run_named(name: str) -> None:
              marker = f'      - name: {name}\n        shell: bash\n        run: |\n'
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'missing locked bootstrap block: {name}')
              start += len(marker)
              end = source.find('\n      - name:', start)
              if end < 0:
                  end = len(source)
              block = textwrap.dedent(source[start:end])
              subprocess.run(block, shell=True, check=True, executable='/bin/bash')

          run_named('Apply bounded repair')
          run_named('Targeted and adjacent regression checks')
          PY

      - name: Commit repaired exact head
        shell: bash
        run: |
          rm .github/workflows/btc-active-context-anaphoric-repair-bootstrap.yml
          rm .github/workflows/btc-active-context-anaphoric-repair-pr-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/btc-cosmographer-route-graph.ts \
                  lib/btc-cosmographer-specialized-answer.ts \
                  lib/btc-cosmographer-answer.ts \
                  pages/crypto-astro/btc/live.tsx \
                  tests/btc-active-context-anaphoric-followup-routing-acceptance.ts \
                  .github/workflows/btc-active-context-anaphoric-repair-bootstrap.yml \
                  .github/workflows/btc-active-context-anaphoric-repair-pr-bootstrap.yml
          git diff --cached --check
          git commit -m "repair active-context anaphoric followups"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
