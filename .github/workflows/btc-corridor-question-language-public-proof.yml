name: BTC Corridor Question Language Public Proof

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/btc-corridor-question-language-public-proof.yml"

permissions:
  contents: read

concurrency:
  group: btc-corridor-question-language-public-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: a8221adc926418be012f852db719a4b141bb7afc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock verification-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only "$BASE" "$HEAD_SHA" > /tmp/changed.txt
          printf '%s\n' '.github/workflows/btc-corridor-question-language-public-proof.yml' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          echo BTC_CORRIDOR_QUESTION_LANGUAGE_PUBLIC_PROOF_SCOPE=PASS

      - name: Prove production branch alignment
        run: |
          set -euo pipefail
          git fetch origin master main --no-tags
          MASTER=$(git rev-parse origin/master)
          MAIN=$(git rev-parse origin/main)
          test "$MASTER" = "$EXPECTED_SHA"
          test "$MAIN" = "$EXPECTED_SHA"
          printf 'MASTER_SHA=%s\nMAIN_SHA=%s\nBRANCH_ALIGNMENT=PASS\n' "$MASTER" "$MAIN" | tee /tmp/branch-alignment.txt

      - name: Install proof dependencies
        run: python3 -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4 selenium==4.34.2

      - name: Verify custom-domain deployment and live routes
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots
          cp /tmp/branch-alignment.txt artifacts/branch-alignment.txt
          python3 - <<'PY'
          import json
          import math
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode

          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          EXPECTED_SHA = "a8221adc926418be012f852db719a4b141bb7afc"
          BASE = "https://www.bhrigu.io/crypto-astro/btc"
          PRODUCER = "https://aibhrigu.github.io/phi-cosmography-open/crypto-astro/data/crypto_astro_snapshot.public.json"
          session = requests.Session()
          session.headers.update({"User-Agent":"BHRIGU-BTC-question-language-public-proof/0.1","Cache-Control":"no-cache"})

          def parse_html(response):
              soup = BeautifulSoup(response.text, "html.parser")
              script = soup.find("script", id="__NEXT_DATA__")
              if script is None or not script.string:
                  raise AssertionError("NEXT_DATA_MISSING")
              props = json.loads(script.string)["props"]["pageProps"]
              lead_node = soup.select_one(".executiveLead")
              lead = re.sub(r"\s+", " ", lead_node.get_text(" ", strip=True)) if lead_node else ""
              watch = ""
              for row in soup.select(".executiveContext dl > div"):
                  dt = row.select_one("dt")
                  dd = row.select_one("dd")
                  if dt and dd and dt.get_text(" ", strip=True) in ("Watch next", "За чем наблюдать дальше"):
                      watch = re.sub(r"\s+", " ", dd.get_text(" ", strip=True))
              return soup, props, lead, watch

          deployment_response = None
          for attempt in range(60):
              response = session.get(BASE, params={"proof":f"{EXPECTED_SHA[:12]}-{attempt}"}, timeout=30, allow_redirects=False)
              if response.status_code == 200 and f'data-deployment-source-sha="{EXPECTED_SHA}"' in response.text and f'name="btc-deployment-source-sha" content="{EXPECTED_SHA}"' in response.text:
                  deployment_response = response
                  break
              time.sleep(10)
          if deployment_response is None:
              raise SystemExit("PUBLIC_DEPLOYMENT_SOURCE_SHA_NOT_VISIBLE")

          producer_response = session.get(PRODUCER, timeout=30)
          producer_response.raise_for_status()
          producer = producer_response.json()
          expected = {
              "timestamp": producer["generated_at_utc"],
              "price": producer["public_samples"]["assets"]["BTC"]["price_usd"],
              "dominance": producer["market_reality"]["btc_dominance_pct"],
              "field_score": producer["field_output"]["market_field_score"],
              "stable_share": producer["market_reality"]["stablecoin_share_pct"],
              "breadth": producer["altcoin_rotation"]["alt_breadth_24h_pct"],
              "tvl": producer["liquidity_tvl"]["defi_tvl_usd"],
          }

          def near(a, b):
              return isinstance(a, (int, float)) and not isinstance(a, bool) and math.isclose(float(a), float(b), rel_tol=1e-10, abs_tol=1e-8)

          cases = [
              {
                  "id":"ru_gravity",
                  "locale":"ru",
                  "question":"Что означает текущая доминация BTC для более широкого рынка?",
                  "class":"btc_gravity",
                  "lens":"market_gravity",
                  "lead_markers":["доминировании BTC", "широкое участие"],
                  "watch_markers":["доминирования BTC", "ширины альткоинов"],
              },
              {
                  "id":"en_liquidity",
                  "locale":"en",
                  "question":"Do stablecoin share, DeFi TVL and DEX volume confirm current BTC liquidity conditions?",
                  "class":"liquidity",
                  "lens":"market_structure",
                  "lead_markers":["stablecoin share", "DeFi TVL", "DEX activity"],
                  "watch_markers":["stablecoin-share", "DeFi TVL", "DEX-volume"],
              },
              {
                  "id":"en_temporal_future",
                  "locale":"en",
                  "question":"How does the selected date change the BTC observation context and temporal pressure?",
                  "date":"2030-01-01",
                  "class":"temporal_pressure",
                  "lens":"pressure_context",
                  "lead_markers":["bounded temporal context", "market facts tied to the accepted snapshot"],
                  "watch_markers":["selected date does not create future market facts"],
              },
              {
                  "id":"ru_unsafe",
                  "locale":"ru",
                  "question":"Стоит ли мне купить или продать BTC сейчас?",
                  "class":"general_btc_field",
                  "lens":"general",
                  "safe":True,
                  "lead_markers":["ограниченный обзор"],
                  "watch_markers":["гравитации BTC", "ликвидности", "участия"],
              },
          ]

          report = {
              "node":"BTC_CORRIDOR_RU_GRAVITY_SYNONYM_AND_QUESTION_SPECIFIC_EXECUTIVE_READ_POST_MERGE_PUBLIC_PROOF_v0_1",
              "expected_sha":EXPECTED_SHA,
              "production_url":BASE,
              "checked_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "checks":{
                  "root_http_200": deployment_response.status_code == 200,
                  "root_zero_redirects": len(deployment_response.history) == 0,
                  "deployment_source_attribute": f'data-deployment-source-sha="{EXPECTED_SHA}"' in deployment_response.text,
                  "deployment_source_meta": f'name="btc-deployment-source-sha" content="{EXPECTED_SHA}"' in deployment_response.text,
                  "deployment_source_visible": EXPECTED_SHA[:12] in deployment_response.text,
              },
              "cases":{},
              "failures":[],
          }

          for case in cases:
              params = {"lang":case["locale"], "q":case["question"], "public_proof":case["id"]}
              if case.get("date"): params["d"] = case["date"]
              response = session.get(BASE + "?" + urlencode(params), timeout=45, allow_redirects=False)
              soup, props, lead, watch = parse_html(response)
              result = props.get("result")
              envelope = props.get("envelope")
              checks = {
                  "http_200": response.status_code == 200,
                  "zero_redirects": len(response.history) == 0,
                  "result_present": isinstance(result, dict),
                  "envelope_present": isinstance(envelope, dict),
              }
              if isinstance(result, dict) and isinstance(envelope, dict):
                  checks.update({
                      "class": envelope["question_class"] == case["class"],
                      "lens": result["question"]["lens"] == case["lens"],
                      "safe_reframe": result["question"]["safe_reframed"] is bool(case.get("safe")),
                      "source_timestamp": result["market_snapshot"]["source_generated_at_utc"] == expected["timestamp"] == envelope["current"]["source_generated_at_utc"],
                      "price_grounding": near(result["market_snapshot"]["price_usd"], expected["price"]),
                      "dominance_grounding": near(result["btc_gravity"]["dominance_pct"], expected["dominance"]),
                      "field_score_grounding": near(result["market_structure"]["field_score"], expected["field_score"]),
                      "stable_share_grounding": near(result["market_structure"]["stablecoin_share_pct"], expected["stable_share"]),
                      "breadth_grounding": near(result["market_structure"]["alt_breadth_24h_pct"], expected["breadth"]),
                      "tvl_grounding": near(envelope["current"]["defi_tvl_usd"], expected["tvl"]),
                      "lead_specific": all(marker in lead for marker in case["lead_markers"]),
                      "watch_specific": all(marker in watch for marker in case["watch_markers"]),
                      "watch_timestamp": expected["timestamp"] in watch,
                      "source_proof": len(result["source_proof"]["sources"]) >= 7,
                      "public_boundaries": all(result["boundary"][key] is True for key in ("no_trading_signal", "no_forecast", "no_price_target", "no_investment_recommendation")),
                  })
                  if case.get("date"):
                      checks["future_date_only_temporal"] = result["temporal_context"]["observation_date"] == case["date"] and result["market_snapshot"]["source_generated_at_utc"] == expected["timestamp"]
              report["cases"][case["id"]] = {
                  "checks":checks,
                  "class": envelope.get("question_class") if isinstance(envelope, dict) else None,
                  "lens": result.get("question", {}).get("lens") if isinstance(result, dict) else None,
                  "lead":lead,
                  "watch":watch,
              }
              report["failures"].extend(f"{case['id']}:{name}" for name, passed in checks.items() if not passed)

          report["checks"]["four_distinct_leads"] = len({item["lead"] for item in report["cases"].values()}) == 4
          report["checks"]["four_distinct_watches"] = len({item["watch"] for item in report["cases"].values()}) == 4
          report["failures"].extend(name for name, passed in report["checks"].items() if not passed)

          options = webdriver.ChromeOptions()
          for arg in ("--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--hide-scrollbars"):
              options.add_argument(arg)
          driver = webdriver.Chrome(options=options)
          try:
              visual_cases = [
                  (cases[0], 1440, 1000),
                  (cases[1], 1440, 1000),
                  (cases[2], 390, 1500),
              ]
              for case, width, height in visual_cases:
                  params = {"lang":case["locale"], "q":case["question"], "public_visual":case["id"]}
                  if case.get("date"): params["d"] = case["date"]
                  driver.set_window_size(width, height)
                  driver.get(BASE + "?" + urlencode(params))
                  target = WebDriverWait(driver, 45).until(lambda d: d.find_element(By.CSS_SELECTOR, ".executiveField"))
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'});", target)
                  overflow = bool(driver.execute_script("return document.documentElement.scrollWidth > window.innerWidth + 1"))
                  report["checks"][f"{case['id']}_no_horizontal_overflow"] = not overflow
                  if overflow: report["failures"].append(f"{case['id']}:horizontal_overflow")
                  target.screenshot(f"artifacts/screenshots/{case['id']}-{width}x{height}.png")
          finally:
              driver.quit()

          report["status"] = "PASS" if not report["failures"] else "FAIL"
          Path("artifacts/btc-corridor-question-language-public-proof.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          Path("artifacts/btc-corridor-question-language-public-proof.txt").write_text(
              f"STATUS={report['status']}\nEXPECTED_SHA={EXPECTED_SHA}\nCASES={len(cases)}\nFAILURES={len(report['failures'])}\n"
          )
          print(json.dumps({"status":report["status"], "checks":report["checks"], "failures":report["failures"]}, ensure_ascii=False, indent=2))
          if report["failures"]:
              raise SystemExit(1)
          PY

      - name: Upload public proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-corridor-question-language-public-proof-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
