name: BTC Mobile Scroll Clearance

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/scripts/verify-btc-public-acceptance-scope.py"
      - ".github/workflows/btc-mobile-clearance-pr.yml"
      - "components/btc/BtcCosmographerDialogue.tsx"
      - "components/btc/BtcHeroQuestionLaunch.tsx"
      - "components/btc/BtcQuestionMembrane.tsx"
      - "lib/btc-live-dialogue-style.ts"
      - "lib/btc-product-rebalance-style.ts"
      - "pages/crypto-astro/btc.tsx"
      - "pages/crypto-astro/btc/live.tsx"
      - "scripts/verify-btc-public-acceptance-two-screen.py"

permissions:
  contents: read

concurrency:
  group: btc-mobile-clearance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BTC_ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BTC_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact public acceptance scope
        run: python3 .github/scripts/verify-btc-public-acceptance-scope.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run verify:btc-routing
      - run: npm run build

      - name: Install browser driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Start exact-head production preview
        run: |
          set -euo pipefail
          npm run start -- -p 3000 >/tmp/btc-mobile-clearance.log 2>&1 &
          echo $! >/tmp/btc-mobile-clearance.pid
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/crypto-astro/btc >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/btc-mobile-clearance.log
          exit 1

      - name: Verify entry and live mobile clearance
        env:
          BTC_COSMOGRAPHER_PREVIEW_BASE: http://127.0.0.1:3000
        run: python3 scripts/verify-btc-public-acceptance-two-screen.py

      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/btc-mobile-clearance.pid; then kill "$(cat /tmp/btc-mobile-clearance.pid)" || true; fi

      - name: Upload mobile clearance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-mobile-clearance-pr-${{ github.event.pull_request.number }}-${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          path: |
            artifacts/btc-public-acceptance-two-screen/
            /tmp/btc-mobile-clearance.log
          if-no-files-found: error
          retention-days: 30
