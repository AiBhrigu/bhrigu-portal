name: BHRIGU Public Site Human Copy Repair

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/bhrigu-public-site-human-copy-pr.yml
      - pages/_app.js
      - pages/cosmographer.js
      - pages/crypto-astro/btc.tsx
      - pages/crypto-astro/btc/clean-chat.tsx
      - pages/index.js
      - public/llms.txt
      - public/robots.txt
      - styles/public-site-repair.css

permissions:
  contents: read

concurrency:
  group: bhrigu-public-site-human-copy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-head-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact bounded Home hero scope
        run: |
          git fetch origin master
          python3 - <<'PY'
          import os, subprocess
          # Home cosmographic-scene authority: this workflow pair plus pages/index.js and pages/index.module.css is the exact bounded scene scope.
          expected = {
              '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
              '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
              'pages/index.js',
              'pages/index.module.css',
          }
          home_cosmographic_scene_ci_authority = {
              '.github/workflows/bhrigu-home-canonical-visual-geometry-pr.yml',
              '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
              '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
              '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
              'pages/index.js',
              'pages/index.module.css',
          }
          frey_passport_preview={
            'pages/_app.js',
            'pages/access.tsx',
          }
          frey_passport_ci_authority={
            '.github/scripts/verify-btc-public-acceptance-scope.py',
            '.github/workflows/access-intake-containment-pr.yml',
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-prevnext-first-http-locale-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            '.github/workflows/bhrigu-public-surface-integrity-pr.yml',
            '.github/workflows/btc-clean-chat-v1-pr.yml',
          }
          commercial_access={
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-surface-integrity-pr.yml',
            'pages/_app.js',
            'pages/access.tsx',
            'pages/guide/frey.js',
            'pages/map.js',
            'pages/support.js',
            'public/llms.txt',
          }
          ci_authority_repair={
            '.github/workflows/access-intake-containment-pr.yml',
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-public-locale-transport-pr.yml',
            '.github/workflows/bhrigu-public-prevnext-first-http-locale-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            '.github/workflows/btc-clean-chat-v1-pr.yml',
            '.github/scripts/verify-btc-public-acceptance-scope.py',
            'scripts/run-btc-natural-followup-discovery-static-fixture.mjs',
            '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
          }
          revenue_discovery={
            'pages/access.tsx',
            'pages/index.js',
            'pages/start.js',
          }
          revenue_discovery_ci_repair={
            '.github/workflows/access-intake-containment-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
          }
          revenue_discovery_human_copy_routing={
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
          }
          passport_navigation = {
            'pages/index.js',
            'pages/map.js',
            'pages/start.js',
          }
          passport_navigation_ci_authority = {
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
          }
          home_map_link_repair = {
            'pages/index.js',
            'pages/index.module.css',
            'pages/map.js',
          }
          public_surface_redundant_ui_language_cleanup = {
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            'pages/field.js',
            'pages/index.js',
            'pages/index.module.css',
          }
          public_discovery_patch = {
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            'pages/_app.js',
            'pages/field.js',
            'pages/index.js',
            'pages/map.js',
            'public/llms.txt',
            'public/sitemap.xml',
          }
          public_discovery_ci_closure = {
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-prevnext-first-http-locale-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            '.github/workflows/btc-field-read-pr-visual.yml',
            '.github/workflows/btc-free-corridor-conversational-surface-pr.yml',
            'pages/_app.js',
            'pages/field.js',
            'pages/index.js',
            'pages/map.js',
            'public/llms.txt',
            'public/sitemap.xml',
          }
          home_phi_visual_truth = {
            '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            'pages/index.js',
            'pages/index.module.css',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE_SHA'], os.environ['HEAD_SHA']],
              text=True,
          ).splitlines())
          if actual == frey_passport_preview:
              print('SHARED_SCOPE_PASS frey_passport_preview', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == frey_passport_ci_authority:
              print('SHARED_SCOPE_PASS frey_passport_ci_authority', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == revenue_discovery:
              print('EXACT_SCOPE_PASS revenue_discovery', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_REVENUE_DISCOVERY_SCOPE=true\n')
          elif actual == commercial_access:
              print('SHARED_SCOPE_PASS commercial_access', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == ci_authority_repair:
              print('SHARED_SCOPE_PASS ci_authority_repair', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == revenue_discovery_ci_repair:
              print('SHARED_SCOPE_PASS revenue_discovery_ci_repair', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == revenue_discovery_human_copy_routing:
              print('SHARED_SCOPE_PASS revenue_discovery_human_copy_routing', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == passport_navigation:
              print('EXACT_SCOPE_PASS passport_navigation', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_PASSPORT_NAV_SCOPE=true\n')
          elif actual == passport_navigation_ci_authority:
              print('SHARED_SCOPE_PASS passport_navigation_ci_authority', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == home_map_link_repair:
              print('EXACT_SCOPE_PASS home_map_link_repair', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_HOME_MAP_LINK_REPAIR_SCOPE=true\n')
          elif actual == public_surface_redundant_ui_language_cleanup:
              print('SHARED_SCOPE_PASS public_surface_redundant_ui_language_cleanup', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == public_discovery_patch:
              print('EXACT_SCOPE_PASS public_discovery_patch', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_PUBLIC_DISCOVERY_SCOPE=true\n')
          elif actual == public_discovery_ci_closure:
              print('EXACT_SCOPE_PASS public_discovery_ci_closure', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_PUBLIC_DISCOVERY_SCOPE=true\n')
          elif actual == home_phi_visual_truth:
              print('SHARED_SCOPE_PASS home_phi_visual_truth', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == expected:
              print('SHARED_SCOPE_PASS home_cosmographic_scene', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual == home_cosmographic_scene_ci_authority:
              print('SHARED_SCOPE_PASS home_cosmographic_scene_ci_authority', sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          else:
              raise SystemExit(f'EXACT_SCOPE_FAIL actual={sorted(actual)} expected={sorted(expected)}')
          print('EXACT_SCOPE_PASS', sorted(actual))
          PY

      - name: Verify Home Φ visual truth and public-channel copy
        run: |
          grep -Fq 'FOLLOW THE FIELD' pages/index.js
          grep -Fq 'СЛЕДИТЬ ЗА ПОЛЕМ' pages/index.js
          grep -Fq 'X · @bhrigu_io' pages/index.js
          grep -Fq 'Binance Square · live research' pages/index.js
          grep -Fq 'Binance Square · живые исследования' pages/index.js
          grep -Fq '<RelationGlyph className={styles.homeRelationGlyph}/>' pages/index.js
          ! grep -Fq 'bitcointalk.org' pages/index.js
          echo 'HOME_PHI_VISUAL_TRUTH_COPY=PASS'

      - name: Verify revenue discovery contract
        if: env.BHRIGU_REVENUE_DISCOVERY_SCOPE == 'true'
        run: |
          grep -Fq 'data-commercial-cta="external-systems-recon"' pages/index.js
          grep -Fq 'External systems recon · USD 300' pages/index.js
          grep -Fq 'External Systems Recon · USD 300' pages/start.js
          grep -Fq 'data-bhrigu-commercial-service="PHI_EXTERNAL_SYSTEMS_RECON_V0_1"' pages/access.tsx
          grep -Fq '"@type": "Service"' pages/access.tsx
          grep -Fq '"@type": "Offer"' pages/access.tsx
          grep -Fq 'price: "300"' pages/access.tsx
          echo 'REVENUE_DISCOVERY_CONTRACT=PASS'

      - name: Verify Cosmographic Passport navigation reveal
        if: env.BHRIGU_PASSPORT_NAV_SCOPE == 'true'
        run: |
          grep -Fq 'data-commercial-cta="cosmographic-passport-usd79"' pages/index.js
          grep -Fq 'Cosmographic Passport · USD 79' pages/index.js
          grep -Fq 'Космографический паспорт · USD 79' pages/index.js
          grep -Fq '/access?offer=frey-personal&lang=${locale}' pages/index.js
          grep -Fq 'Cosmographic Passport · USD 79' pages/start.js
          grep -Fq 'Космографический паспорт · USD 79' pages/start.js
          grep -Fq '/access?offer=frey-personal' pages/start.js
          grep -Fq 'Cosmographic Passport · USD 79' pages/map.js
          grep -Fq 'Космографический паспорт · USD 79' pages/map.js
          grep -Fq 'href="/map?lang=en"' pages/map.js
          grep -Fq 'href="/map?lang=ru"' pages/map.js
          echo 'COSMOGRAPHIC_PASSPORT_NAVIGATION_REVEAL=PASS'

      - name: Verify Home map-link and commercial hierarchy repair
        if: env.BHRIGU_HOME_MAP_LINK_REPAIR_SCOPE == 'true'
        run: |
          grep -Fq 'data-home-system-map-link' pages/index.js
          grep -Fq 'href={`/map?lang=${locale}`}' pages/index.js
          grep -Fq 'className={styles.commercialActions}' pages/index.js
          grep -Fq 'data-commercial-cta="external-systems-recon"' pages/index.js
          grep -Fq 'data-commercial-cta="cosmographic-passport-usd79"' pages/index.js
          grep -Fq '.commercialActions { flex-basis: 100%; display: grid;' pages/index.module.css
          ! grep -Fq 'className="localeNav"' pages/map.js
          echo 'HOME_MAP_LINK_COMMERCIAL_HIERARCHY_REPAIR=PASS'

      - name: Verify public discovery minimal patch
        if: env.BHRIGU_PUBLIC_DISCOVERY_SCOPE == 'true'
        run: |
          grep -Fq 'data-commercial-cta="ai-founding-field"' pages/index.js
          grep -Fq 'AI Founding Field' pages/index.js
          grep -Fq 'href={`/field?lang=${locale}`}' pages/index.js
          grep -Fq '["AI Founding Field", "Founding registry for agents, models, projects and products", "/field"]' pages/map.js
          grep -Fq '["Cosmographic Passport", "One complete Frey × Cosmographer reading delivered as a portable research object", "/access?offer=frey-personal"]' pages/map.js
          ! grep -Fq 'Cosmographic Passport · USD 79' pages/map.js
          grep -Fq '["Φ External Systems Recon", "Agent-first commercial systems recon", "/access"]' pages/map.js
          grep -Fq '"/field": { en:["AI Founding Field · BHRIGU"' pages/_app.js
          grep -Fq 'data-bhrigu-commercial-service="BHRIGU_AI_FOUNDING_FIELD_V0_1"' pages/field.js
          grep -Fq '"@type": "Service"' pages/field.js
          grep -Fq '"@type": "Offer"' pages/field.js
          grep -Fq 'price: "99"' pages/field.js
          ! grep -Fq '<title>{locale === "ru" ? "AI Founding Field · BHRIGU"' pages/field.js
          grep -Fq 'https://www.bhrigu.io/field?lang=en' public/sitemap.xml
          grep -Fq 'https://www.bhrigu.io/field?lang=ru' public/sitemap.xml
          grep -Fq 'https://www.bhrigu.io/access?lang=en&amp;offer=frey-personal' public/sitemap.xml
          grep -Fq 'https://www.bhrigu.io/access?lang=ru&amp;offer=frey-personal' public/sitemap.xml
          grep -Fq 'AI Founding Field -> finite curated public founding registry' public/llms.txt
          grep -Fq 'Cosmographic Passport -> one complete Frey × Cosmographer reading' public/llms.txt
          echo 'PUBLIC_DISCOVERY_MINIMAL_PATCH=PASS'

      - name: Verify copy, boundary, SEO and agent truth
        if: env.BHRIGU_SHARED_SCOPE != 'true' && env.BHRIGU_REVENUE_DISCOVERY_SCOPE != 'true' && env.BHRIGU_PASSPORT_NAV_SCOPE != 'true' && env.BHRIGU_HOME_MAP_LINK_REPAIR_SCOPE != 'true' && env.BHRIGU_PUBLIC_DISCOVERY_SCOPE != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('pages/_app.js').read_text()
          home = Path('pages/index.js').read_text()
          cosmo = Path('pages/cosmographer.js').read_text()
          btc = Path('pages/crypto-astro/btc.tsx').read_text()
          clean = Path('pages/crypto-astro/btc/clean-chat.tsx').read_text()
          adapter = Path('components/btc/BtcFreeCorridorSurfaceAdapter.js').read_text()
          css = Path('styles/public-site-repair.css').read_text()
          robots = Path('public/robots.txt').read_text()
          llms = Path('public/llms.txt').read_text()
          checks = {
              'HOME_MULTI_SURFACE_EN': 'Several public surfaces. Distinct roles.' in home,
              'HOME_MULTI_SURFACE_RU': 'Несколько публичных поверхностей. Разные роли.' in home,
              'HOME_FREY_ACTIVE': 'active temporal reading and dialogue service' in home,
              'COSMOGRAPHER_BRIDGE': 'BTC Cosmographer is the Bitcoin-specific public application' in cosmo,
              'COSMOGRAPHER_NOT_BITCOIN_ONLY': 'not the limit of BHRIGU' in cosmo,
              'FREY_PRESERVED': 'Frey is an active temporal reading and dialogue service' in cosmo,
              'BTC_FOOTER_HUMAN': 'Helps explain what is happening with Bitcoin using verifiable data and sources.' in btc,
              'BTC_SUPPORT_EN_RU': '/support?lang=${p.locale}' in btc and 'Support BHRIGU' in btc and 'Поддержать BHRIGU' in btc,
              'BTC_LIMITS_HUMAN': 'No buy or sell signals' in btc and 'Без сигналов купить или продать' in btc,
              'CLEAN_CHAT_NO_PREVIEW': 'Clean Chat Preview' not in clean and 'BTC Cosmographer · Dialogue' in clean,
              'CLEAN_CHAT_HUMAN_DESC': 'Live Bitcoin dialogue with current data, sources, and explicit limits.' in clean,
              'SESSION_BOUNDARY_PRESERVED': 'const FREE_SESSION_DURATION_MS = 60 * 60 * 1000' in adapter,
              'EXPIRY_GATE_PRESERVED': 'function FreeContract' in adapter and 'if (expired)' in adapter,
              'VISIBLE_TIMER_HIDDEN': '.btcFreeContract' in css and 'display: none !important' in css,
              'FOOTER_READABLE': 'font-size: 14px !important' in css and 'font-size: 11px !important' in css,
              'ROBOTS_REAL_LINES': robots == 'User-agent: *\nAllow: /\n\nSitemap: https://www.bhrigu.io/sitemap.xml\n',
              'LLMS_CLEAN_CHAT': '/crypto-astro/btc/clean-chat?lang=en' in llms,
              'LLMS_DUAL_CONTOUR': 'Bitcoin-first does not mean Bitcoin-only.' in llms and 'Frey: an active and distinct temporal reading and dialogue service.' in llms,
              'LLMS_PROTECTED_RESEARCH': 'X4, private ORION internals, the Cosmography Dynamical Engine' in llms,
              'APP_CLEAN_CHAT_META': '"/crypto-astro/btc/clean-chat"' in app and 'noindex,follow' in app,
          }
          failed = [k for k,v in checks.items() if not v]
          print(checks)
          if failed:
              raise SystemExit('STATIC_ACCEPTANCE_FAIL=' + ','.join(failed))
          PY

      - name: Verify bound three-object footer authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'data-footer-offer=' pages/index.js | wc -l | tr -d ' ')" = "3"
          grep -Fq 'data-footer-offer="external-systems-recon"' pages/index.js
          grep -Fq 'data-footer-offer="frey-personal"' pages/index.js
          grep -Fq 'data-footer-offer="ai-founding-field"' pages/index.js
          grep -Fq 'data-commercial-cta="footer-external-systems-recon"' pages/index.js
          grep -Fq 'data-commercial-cta="footer-frey-personal"' pages/index.js
          grep -Fq 'data-commercial-cta="footer-ai-founding-field"' pages/index.js
          grep -Fq '/access?lang=${locale}' pages/index.js
          grep -Fq '/access?offer=frey-personal&lang=${locale}' pages/index.js
          grep -Fq '/field?lang=${locale}' pages/index.js
          grep -Fq 'USD 300' pages/index.js
          grep -Fq 'USD 79' pages/index.js
          grep -Fq 'USD 99' pages/index.js
          grep -Fq 'Array.from({ length: 7 }' pages/index.js
          grep -Fq 'Array.from({ length: 32 }' pages/index.js
          grep -Fq '.footerOfferGrid {' pages/index.module.css
          grep -Fq '.reconVisual {' pages/index.module.css
          grep -Fq '.passportVisual {' pages/index.module.css
          grep -Fq '.registryVisual {' pages/index.module.css
          grep -Fq '.footerCommerce {' pages/index.module.css
          grep -Fq '.siteFooter {' pages/index.module.css
          ! grep -Fq '© 2024' pages/index.js
          ! grep -Fq 'WORLD MAP' pages/index.js
          ! grep -Fq 'STARTUP GROWTH' pages/index.js
          echo 'BHRIGU_FOOTER_BOUND_VISUAL_AUTHORITY=PASS'

      - name: Install locked dependencies
        if: env.BHRIGU_SHARED_SCOPE != 'true' && env.BHRIGU_REVENUE_DISCOVERY_SCOPE != 'true'
        run: npm ci --ignore-scripts

      - name: Production build
        if: env.BHRIGU_SHARED_SCOPE != 'true' && env.BHRIGU_REVENUE_DISCOVERY_SCOPE != 'true'
        run: npm run build

      - name: Start exact-head server
        if: env.BHRIGU_SHARED_SCOPE != 'true' && env.BHRIGU_REVENUE_DISCOVERY_SCOPE != 'true'
        run: |
          npm start > /tmp/public-site-repair.log 2>&1 &
          echo $! > /tmp/public-site-repair.pid
          for attempt in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:3000/' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/public-site-repair.log
          exit 1

      - name: Install browser client
        if: env.BHRIGU_SHARED_SCOPE != 'true' && env.BHRIGU_REVENUE_DISCOVERY_SCOPE != 'true'
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: RU EN desktop mobile browser acceptance
        if: env.BHRIGU_SHARED_SCOPE != 'true' && env.BHRIGU_REVENUE_DISCOVERY_SCOPE != 'true'
        run: |
          python3 - <<'PY'
          import json
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base='http://127.0.0.1:3000'
          options=webdriver.ChromeOptions()
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1280,900'):
              options.add_argument(a)
          options.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,30)
          results=[]
          def record(name, ok, detail=''):
              results.append({'name':name,'passed':bool(ok),'detail':detail})
              if not ok: raise AssertionError(f'{name}: {detail}')
          def open_path(path):
              driver.get(base+path)
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
          try:
              for viewport,w,h in (('desktop',1280,900),('mobile',390,844)):
                  driver.set_window_size(w,h)
                  for locale in ('en','ru'):
                      open_path('/?lang='+locale)
                      body=driver.find_element(By.TAG_NAME,'body').text
                      expected='Several public surfaces. Distinct roles.' if locale=='en' else 'Несколько публичных поверхностей. Разные роли.'
                      record(f'HOME_{locale}_{viewport}_roles', expected in body, body[-1200:])
                      overflow=driver.execute_script('return document.documentElement.scrollWidth - window.innerWidth')
                      record(f'HOME_{locale}_{viewport}_no_horizontal_overflow', overflow <= 1, str(overflow))

                      open_path('/crypto-astro/btc?lang='+locale)
                      body=driver.find_element(By.TAG_NAME,'body').text
                      support='Support BHRIGU' if locale=='en' else 'Поддержать BHRIGU'
                      record(f'BTC_{locale}_{viewport}_support', support in body, body[-1800:])
                      hrefs=[a.get_attribute('href') for a in driver.find_elements(By.CSS_SELECTOR,'.btcAuthorityFooter a')]
                      record(f'BTC_{locale}_{viewport}_support_href', any('/support?lang='+locale in (x or '') for x in hrefs), repr(hrefs))
                      contract=driver.find_elements(By.CSS_SELECTOR,'.btcFreeContract')
                      if contract:
                          record(f'BTC_{locale}_{viewport}_timer_hidden', contract[0].value_of_css_property('display')=='none', contract[0].value_of_css_property('display'))
                      link=driver.find_element(By.CSS_SELECTOR,'.btcAuthorityFooterNav a')
                      size=float(link.value_of_css_property('font-size').replace('px',''))
                      record(f'BTC_{locale}_{viewport}_footer_link_size', size >= 14, str(size))
                      overflow=driver.execute_script('return document.documentElement.scrollWidth - window.innerWidth')
                      record(f'BTC_{locale}_{viewport}_no_horizontal_overflow', overflow <= 1, str(overflow))

                      open_path('/crypto-astro/btc/clean-chat?lang='+locale)
                      expected_title='BTC Cosmographer · Dialogue' if locale=='en' else 'BTC Космограф · Диалог'
                      record(f'CLEAN_{locale}_{viewport}_title', driver.title==expected_title, driver.title)
                      record(f'CLEAN_{locale}_{viewport}_no_preview', 'Preview' not in driver.title, driver.title)
                      desc=driver.find_element(By.CSS_SELECTOR,'meta[name="description"]').get_attribute('content')
                      record(f'CLEAN_{locale}_{viewport}_human_desc', ('current data' in desc) if locale=='en' else ('текущими данными' in desc), desc)
                      overflow=driver.execute_script('return document.documentElement.scrollWidth - window.innerWidth')
                      record(f'CLEAN_{locale}_{viewport}_no_horizontal_overflow', overflow <= 1, str(overflow))

              open_path('/cosmographer')
              body=driver.find_element(By.TAG_NAME,'body').text
              record('COSMOGRAPHER_BRIDGE_VISIBLE', 'BTC Cosmographer is its current Bitcoin-specific public application.' in body, body)
              record('COSMOGRAPHER_FREY_VISIBLE', 'Frey is a distinct temporal reading/dialogue service' in body, body)

              for route in ('/frey','/reading','/start','/map'):
                  open_path(route)
                  record('LEGACY_ROUTE_'+route[1:].upper(), len(driver.find_elements(By.TAG_NAME,'body'))==1 and '404' not in driver.title, driver.title)

              open_path('/robots.txt')
              record('ROBOTS_HTTP_RENDER', 'Sitemap: https://www.bhrigu.io/sitemap.xml' in driver.find_element(By.TAG_NAME,'body').text, driver.find_element(By.TAG_NAME,'body').text)
              open_path('/llms.txt')
              llms=driver.find_element(By.TAG_NAME,'body').text
              record('LLMS_AGENT_TRUTH_RENDER', 'Bitcoin-first does not mean Bitcoin-only.' in llms and '/crypto-astro/btc/clean-chat?lang=en' in llms, llms[:2000])

              logs=driver.get_log('browser')
              known_local_non_scope=('/api/btc/observability/v1/event',)
              severe=[x for x in logs if x.get('level')=='SEVERE' and '/favicon.ico' not in x.get('message','') and not any(marker in x.get('message','') for marker in known_local_non_scope)]
              record('BROWSER_SEVERE_ZERO_EXCEPT_KNOWN_LOCAL_OBSERVABILITY', not severe, json.dumps(severe)[:2000])
              print(json.dumps({'schema':'bhrigu_public_site_human_copy_acceptance_v0_1','results':results},ensure_ascii=False,indent=2))
          finally:
              driver.quit()
          PY

      - name: Stop server
        if: always()
        run: |
          test ! -f /tmp/public-site-repair.pid || kill "$(cat /tmp/public-site-repair.pid)" || true
          test ! -f /tmp/public-site-repair.log || tail -n 80 /tmp/public-site-repair.log
