name: BHRIGU Astro Ephemerides P1 Integrity

on:
  pull_request:
    branches: [master]
    paths:
      - pages/_app.js
      - components/astro/PublicEphemeridesV1.tsx
      - components/astro/PublicEphemeridesToday.tsx
      - components/astro/BhriguPhiCosmograph.tsx
      - lib/public-ephemerides-live.ts
      - lib/public-ephemerides-v1.ts
      - lib/public-zodiac-position.ts
      - lib/btc-public-astro-evidence.ts
      - tests/astro-ephemerides-p1-integrity-acceptance.ts
      - tests/astro-ephemerides-sexagesimal-format-acceptance.ts
      - tests/public-ephemerides-v2-acceptance.ts
      - tests/astro-sky-now-phi-cosmograph-acceptance.ts
      - .github/workflows/astro-ephemerides-p1-integrity-pr.yml
      - .github/scripts/verify-btc-public-acceptance-scope.py
      - .github/workflows/btc-clean-chat-v1-pr.yml

permissions:
  contents: read

jobs:
  exact-head-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact bounded scope
        run: |
          git fetch origin master
          python3 - <<'PY'
          import os, subprocess
          legacy={
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            'pages/_app.js',
            'components/astro/PublicEphemeridesV1.tsx',
            'components/astro/PublicEphemeridesToday.tsx',
            'tests/astro-ephemerides-p1-integrity-acceptance.ts',
          }
          sky_now_phi={
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            'components/astro/BhriguPhiCosmograph.tsx',
            'components/astro/PublicEphemeridesToday.tsx',
            'lib/public-ephemerides-live.ts',
            'tests/astro-sky-now-phi-cosmograph-acceptance.ts',
          }
          phi_visual_parity={
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            'components/astro/BhriguPhiCosmograph.tsx',
            'tests/astro-sky-now-phi-cosmograph-acceptance.ts',
          }
          sexagesimal_repair={
            '.github/scripts/verify-btc-public-acceptance-scope.py',
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/btc-clean-chat-v1-pr.yml',
            'components/astro/BhriguPhiCosmograph.tsx',
            'components/astro/PublicEphemeridesToday.tsx',
            'components/astro/PublicEphemeridesV1.tsx',
            'lib/btc-public-astro-evidence.ts',
            'lib/public-ephemerides-live.ts',
            'lib/public-ephemerides-v1.ts',
            'lib/public-zodiac-position.ts',
            'tests/astro-ephemerides-sexagesimal-format-acceptance.ts',
          }
          frey_passport_preview={
            'pages/_app.js',
            'pages/access.tsx',
          }
          frey_passport_ci_authority={
            '.github/scripts/verify-btc-public-acceptance-scope.py',
            '.github/workflows/access-intake-containment-pr.yml',
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-prevnext-first-http-locale-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            '.github/workflows/bhrigu-public-surface-integrity-pr.yml',
            '.github/workflows/btc-clean-chat-v1-pr.yml',
          }
          commercial_access={
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-surface-integrity-pr.yml',
            'pages/_app.js',
            'pages/access.tsx',
            'pages/guide/frey.js',
            'pages/map.js',
            'pages/support.js',
            'public/llms.txt',
          }
          ci_authority_repair={
            '.github/workflows/access-intake-containment-pr.yml',
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-public-locale-transport-pr.yml',
            '.github/workflows/bhrigu-public-prevnext-first-http-locale-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            '.github/workflows/btc-clean-chat-v1-pr.yml',
            '.github/scripts/verify-btc-public-acceptance-scope.py',
            'scripts/run-btc-natural-followup-discovery-static-fixture.mjs',
            '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
          }
          agent_commerce_v0_ci_authority={
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-surface-integrity-pr.yml',
            '.github/workflows/btc-clean-chat-v1-pr.yml',
            'lib/btc-agent-evidence-answer-v0.ts',
            'lib/btc-agent-x402-preview-v0.ts',
            'lib/btc-clean-chat-model-runtime.ts',
            'pages/api/agent/btc/evidence-answer/v0.ts',
            'public/.well-known/bhrigu-agent-commerce.json',
            'public/openapi/agent-commerce-v0.json',
            'tests/btc-agent-evidence-answer-v0-acceptance.ts',
          }
          public_discovery_ci_closure={
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-prevnext-first-http-locale-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            '.github/workflows/btc-field-read-pr-visual.yml',
            '.github/workflows/btc-free-corridor-conversational-surface-pr.yml',
            'pages/_app.js',
            'pages/field.js',
            'pages/index.js',
            'pages/map.js',
            'public/llms.txt',
            'public/sitemap.xml',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA'],os.environ['HEAD_SHA']],text=True).splitlines())
          if actual==legacy:
            print('EXACT_SCOPE_PASS legacy',sorted(actual))
          elif actual==sky_now_phi:
            print('EXACT_SCOPE_PASS sky_now_phi',sorted(actual))
          elif actual==phi_visual_parity:
            print('EXACT_SCOPE_PASS phi_visual_parity',sorted(actual))
          elif actual==sexagesimal_repair:
            print('EXACT_SCOPE_PASS sexagesimal_repair',sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SEXAGESIMAL_SCOPE=true\n')
          elif actual==frey_passport_preview:
            print('SHARED_SCOPE_PASS frey_passport_preview',sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual==frey_passport_ci_authority:
            print('SHARED_SCOPE_PASS frey_passport_ci_authority',sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual==commercial_access:
            print('SHARED_SCOPE_PASS commercial_access',sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual==ci_authority_repair:
            print('SHARED_SCOPE_PASS ci_authority_repair',sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual==agent_commerce_v0_ci_authority:
            print('SHARED_SCOPE_PASS agent_commerce_v0_ci_authority',sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          elif actual==public_discovery_ci_closure:
            print('SHARED_SCOPE_PASS public_discovery_ci_closure',sorted(actual)); open(os.environ['GITHUB_ENV'],'a').write('BHRIGU_SHARED_SCOPE=true\n')
          else:
            raise SystemExit(f'EXACT_SCOPE_FAIL actual={sorted(actual)} legacy={sorted(legacy)} sky_now_phi={sorted(sky_now_phi)} phi_visual_parity={sorted(phi_visual_parity)}')
          PY

      - name: Install locked dependencies
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: npm ci --ignore-scripts

      - name: Static P1 contract
        if: env.BHRIGU_SHARED_SCOPE != 'true' && env.BHRIGU_SEXAGESIMAL_SCOPE != 'true'
        run: npx tsx tests/astro-ephemerides-p1-integrity-acceptance.ts

      - name: Sexagesimal public format contract
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: npx tsx tests/astro-ephemerides-sexagesimal-format-acceptance.ts

      - name: Existing public ephemerides V2 contract
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: npx tsx tests/public-ephemerides-v2-acceptance.ts

      - name: SKY TODAY Phi cosmograph contract
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: npx tsx tests/astro-sky-now-phi-cosmograph-acceptance.ts

      - name: Production build
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: npm run build

      - name: Start exact-head server
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: |
          npm start > /tmp/astro-p1.log 2>&1 &
          echo $! > /tmp/astro-p1.pid
          for attempt in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:3000/ephemerides?lang=ru' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/astro-p1.log
          exit 1

      - name: Install mobile browser client
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Today RU mobile runtime visual acceptance
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base='http://127.0.0.1:3000'
          opts=webdriver.ChromeOptions()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu'):
              opts.add_argument(arg)
          driver=webdriver.Chrome(options=opts)
          wait=WebDriverWait(driver,30)
          try:
              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride', {
                  'mobile': True,
                  'width': 390,
                  'height': 844,
                  'deviceScaleFactor': 1,
                  'screenWidth': 390,
                  'screenHeight': 844,
                  'positionX': 0,
                  'positionY': 0,
              })
              driver.get(base+'/ephemerides?lang=ru')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.planetGrid')))
              inner_width=driver.execute_script('return window.innerWidth')
              inner_height=driver.execute_script('return window.innerHeight')
              assert inner_width == 390, (inner_width, inner_height)

              body_text=driver.find_element(By.TAG_NAME,'body').text
              articles=driver.find_elements(By.CSS_SELECTOR,'.planetGrid article')
              assert len(articles) == 10, len(articles)
              positions=[]
              for article in articles:
                  assert article.is_displayed(), article.text
                  name=article.find_element(By.TAG_NAME,'strong').text.strip()
                  position=article.find_element(By.TAG_NAME,'small').text.strip()
                  assert re.fullmatch(r'.{2,}\s(?:[0-9]|[12][0-9])°[0-5][0-9]′[0-5][0-9]″', f'{name} {position}'), (name, position)
                  assert driver.execute_script('return arguments[0].scrollWidth <= arguments[0].clientWidth + 2', article), f'article overflow: {name}'
                  rect=driver.execute_script('const r=arguments[0].getBoundingClientRect(); return {left:r.left,right:r.right,width:r.width}', article)
                  assert rect['left'] >= -1 and rect['right'] <= inner_width + 1, (name, rect, inner_width)
                  positions.append({'name':name,'position':position})

              jupiter=next(row for row in positions if row['name']=='Юпитер')
              assert jupiter['position']=='Лев 17°49′51″', jupiter
              assert driver.execute_script('return document.documentElement.scrollWidth <= window.innerWidth + 2'), (
                  driver.execute_script('return document.documentElement.scrollWidth'), inner_width
              )

              svg=driver.find_element(By.CSS_SELECTOR,'[data-phi-cosmograph="BHRIGU_PHI_COSMOGRAPH_V0_1"]')
              assert svg.is_displayed()
              svg_rect=driver.execute_script('const r=arguments[0].getBoundingClientRect(); return {left:r.left,right:r.right,width:r.width,height:r.height}', svg)
              assert svg_rect['width'] >= 300 and svg_rect['right'] <= inner_width + 1, svg_rect
              assert svg_rect['height'] > 300, svg_rect
              planet_glyphs=svg.find_elements(By.CSS_SELECTOR,'[data-planet-glyph]')
              assert len(planet_glyphs) == 10, len(planet_glyphs)
              assert all(g.is_displayed() for g in planet_glyphs)

              assert 'СХОДЯТСЯ' in body_text and 'APPLYING' in body_text, 'applying panel missing'
              assert 'РАСХОДЯТСЯ' in body_text and 'SEPARATING' in body_text, 'separating panel missing'

              screenshot='/tmp/astro-ephemerides-mobile-ru-390x844.png'
              driver.save_screenshot(screenshot)
              report={
                  'schema':'bhrigu_ephemerides_mobile_final_acceptance_v0_1',
                  'viewport':{'width':inner_width,'height':inner_height},
                  'planet_count':len(articles),
                  'positions':positions,
                  'jupiter':jupiter,
                  'horizontal_overflow':False,
                  'phi_cosmograph':{'width':svg_rect['width'],'height':svg_rect['height'],'planet_glyphs':len(planet_glyphs)},
                  'aspect_panels':{'applying':True,'separating':True},
                  'result':'PASS',
              }
              Path('/tmp/astro-ephemerides-mobile-ru.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              print(json.dumps(report,ensure_ascii=False,indent=2))
              print('EPHEMERIDES_TODAY_RU_MOBILE_RUNTIME=PASS')
              print('EPHEMERIDES_MOBILE_10_PLANETS=PASS')
              print('EPHEMERIDES_MOBILE_DMS=PASS')
              print('EPHEMERIDES_MOBILE_JUPITER=PASS')
              print('EPHEMERIDES_MOBILE_NO_HORIZONTAL_OVERFLOW=PASS')
              print('EPHEMERIDES_MOBILE_PHI_COSMOGRAPH=PASS')
              print('EPHEMERIDES_MOBILE_ASPECT_PANELS=PASS')
          finally:
              driver.quit()
          PY

      - name: First HTTP semantic integrity
        if: env.BHRIGU_SHARED_SCOPE != 'true'
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen
          def get(path): return urlopen('http://127.0.0.1:3000'+path,timeout=20).read().decode('utf-8')
          ru=get('/astro?lang=ru'); en=get('/astro?lang=en')
          for html,lang,other in ((ru,'ru','en'),(en,'en','ru')):
            assert f'<html lang="{lang}"' in html
            assert f'href="/?lang={lang}"' in html
            assert f'href="/frey?lang={lang}"' in html
            assert f'href="/orion?lang={lang}"' in html
            assert f'href="/astro?lang={other}"' in html
          ru_m=get('/ephemerides/2026/09?lang=ru'); en_m=get('/ephemerides/2026/09?lang=en')
          assert 'Планетные эфемериды · сентябрь 2026' in ru_m
          assert 'Planetary ephemerides · September 2026' in en_m
          assert 'property="og:title" content="Эфемериды · сентябрь 2026 | BHRIGU"' in ru_m
          assert 'property="og:title" content="September 2026 ephemerides · BHRIGU"' in en_m
          assert 'name="twitter:title" content="Эфемериды · сентябрь 2026 | BHRIGU"' in ru_m
          assert 'name="twitter:title" content="September 2026 ephemerides · BHRIGU"' in en_m
          for html in (ru_m,en_m):
            assert html.count('"temporalCoverage":"2026-09-01/2026-09-30"') >= 2
            assert '"temporalCoverage":"2026-01-01/2026-12-31"' not in html
          today_ru=get('/ephemerides?lang=ru'); today_en=get('/ephemerides?lang=en')
          assert 'Небо сегодня.' in today_ru
          assert 'The Sky Today.' in today_en
          for html,label in ((today_ru,'Источник и проверяемость'),(today_en,'Source &amp; proof')):
            assert label in html
            assert 'data-sky-today="BHRIGU_SKY_TODAY_PHI_V0_1"' in html
            assert 'data-phi-cosmograph="BHRIGU_PHI_COSMOGRAPH_V0_1"' in html
            assert 'data-zero-aries="left"' in html
            assert 'data-ninety-cancer="bottom"' in html
            assert 'data-one-eighty-libra="right"' in html
            assert 'data-two-seventy-capricorn="top"' in html
            assert 'data-observer-origin="EARTH_PHI"' in html
            assert 'AiBhrigu/orion_ai' in html
            assert '0b9998c669b9b50e926b1891604b1969c642e046' in html
            assert 'CANONICAL_PUBLIC_SAFE_DAILY_EXPORT' in html
            assert '28bfad7e2d12617757e4f742e1722f2965b6a2f6369b50973e4890f1f8f6781a' in html
          print('ASTRO_EPHEMERIDES_P1_FIRST_HTTP=PASS')
          print('SKY_NOW_PHI_FIRST_HTTP=PASS')
          PY

      - name: Upload mobile visual evidence
        if: always() && env.BHRIGU_SHARED_SCOPE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: astro-ephemerides-mobile-pr286
          path: |
            /tmp/astro-ephemerides-mobile-ru-390x844.png
            /tmp/astro-ephemerides-mobile-ru.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop server
        if: always()
        run: |
          test ! -f /tmp/astro-p1.pid || kill "$(cat /tmp/astro-p1.pid)" || true
          test ! -f /tmp/astro-p1.log || tail -n 80 /tmp/astro-p1.log
