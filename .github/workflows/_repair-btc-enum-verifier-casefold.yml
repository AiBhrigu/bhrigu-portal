name: Repair BTC Enum Verifier Casefold

on:
  push:
    branches:
      - agent/btc-public-enum-disclosure-repair-v0-1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/btc-public-enum-disclosure-repair-v0-1
          fetch-depth: 0
      - name: Apply case-insensitive public-label assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/verify-btc-natural-followup-conversations.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'record("current_subject_label", labels["current"] in visible, visible)': 'record("current_subject_label", labels["current"].casefold() in visible.casefold(), visible)',
              'record("temporal_subject_label", labels["temporal"] in visible, visible)': 'record("temporal_subject_label", labels["temporal"].casefold() in visible.casefold(), visible)',
              'record("unsupported_subject_label", labels["unsupported"] in visible, visible)': 'record("unsupported_subject_label", labels["unsupported"].casefold() in visible.casefold(), visible)',
              'record("public_stop_title", labels["stop_title"] in visible, visible)': 'record("public_stop_title", labels["stop_title"].casefold() in visible.casefold(), visible)',
              'record("public_stop_reason", labels["stop_reason"] in visible, visible)': 'record("public_stop_reason", labels["stop_reason"].casefold() in visible.casefold(), visible)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/_repair-btc-enum-verifier-casefold.yml").unlink()
          PY
          python3 -m py_compile scripts/verify-btc-natural-followup-conversations.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: compare public BTC labels case-insensitively"
          git push origin HEAD:agent/btc-public-enum-disclosure-repair-v0-1
