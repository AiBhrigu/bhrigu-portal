name: BTC Cosmographer Multi-Body Local RC

on:
  pull_request:
    paths:
      - ".github/workflows/btc-cosmographer-multi-body-local-rc-pr.yml"
      - ".github/workflows/btc-cosmographer-multi-body-local-linux-pinned-v0-5.yml"
      - "lib/btc-cosmographer-multi-body-astro-rc.ts"
      - "components/btc/BtcCosmographerMultiBodyAstroRc.tsx"
      - "pages/crypto-astro/btc/local-rc.tsx"
      - "scripts/run-btc-cosmographer-multi-body-local-rc-fixture.mjs"
      - "scripts/run-btc-cosmographer-multi-body-local-linux-pinned-v0-5.sh"
      - "scripts/run-btc-cosmographer-multi-body-pinned-v0-5-semantic-acceptance.mjs"
      - "scripts/verify-btc-cosmographer-local-rc-usability.py"
      - "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_LINUX_RELEASE_CANDIDATE_v0_1.md"
      - "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_LINUX_PINNED_V0_5_ACCEPTANCE_v0_1.md"
      - "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_RC_USABILITY_AND_INFORMATION_DESIGN_TARGETED_REPAIR_v0_1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-cosmographer-multi-body-local-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BTC_LOCAL_RC: "1"
      BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify local-only exact scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA"
          python - <<'PY'
          import os
          import subprocess

          base = os.environ.get("GITHUB_BASE_REF")
          if not base:
              print("workflow_dispatch: exact pull-request diff gate deferred")
              raise SystemExit(0)
          subprocess.run(["git", "fetch", "origin", base, "--depth=1"], check=True)
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"origin/{base}...HEAD"],
              text=True,
          ).splitlines()
          allowed = {
              ".github/workflows/btc-cosmographer-multi-body-local-rc-pr.yml",
              ".github/workflows/btc-cosmographer-multi-body-local-linux-pinned-v0-5.yml",
              "lib/btc-cosmographer-multi-body-astro-rc.ts",
              "components/btc/BtcCosmographerMultiBodyAstroRc.tsx",
              "pages/crypto-astro/btc/local-rc.tsx",
              "scripts/run-btc-cosmographer-multi-body-local-rc-fixture.mjs",
              "scripts/run-btc-cosmographer-multi-body-local-linux-pinned-v0-5.sh",
              "scripts/run-btc-cosmographer-multi-body-pinned-v0-5-semantic-acceptance.mjs",
              "scripts/verify-btc-cosmographer-local-rc-usability.py",
              "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_LINUX_RELEASE_CANDIDATE_v0_1.md",
              "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_LINUX_PINNED_V0_5_ACCEPTANCE_v0_1.md",
              "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_RC_USABILITY_AND_INFORMATION_DESIGN_TARGETED_REPAIR_v0_1.md",
          }
          unexpected = sorted(set(changed) - allowed)
          missing = sorted(allowed - set(changed))
          if unexpected or missing:
              raise SystemExit(f"scope mismatch: unexpected={unexpected}, missing={missing}")
          print({"status": "PASS_LOCAL_RC_USABILITY_REPAIR_SCOPE", "changed": changed})
          PY

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run static acceptance
        run: node scripts/run-btc-cosmographer-multi-body-local-rc-fixture.mjs

      - name: Build exact local candidate
        run: npm run build

      - name: Start isolated local route
        run: |
          mkdir -p artifacts
          npm run start -- -H 127.0.0.1 -p 4185 > artifacts/btc-local-rc-server.log 2>&1 &
          echo $! > artifacts/btc-local-rc-server.pid
          for _ in $(seq 1 90); do
            if curl --fail --silent "http://127.0.0.1:4185/crypto-astro/btc/local-rc?lang=ru&q=%D0%9A%D0%B0%D0%BA%D0%B8%D0%B5%20%D0%B0%D1%81%D0%BF%D0%B5%D0%BA%D1%82%D1%8B%20%D0%BF%D0%BB%D0%B0%D0%BD%D0%B5%D1%82%20%D0%B2%D0%B0%D0%B6%D0%BD%D1%8B%20%D0%B2%202026%20%D0%B3%D0%BE%D0%B4%D1%83%3F" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/btc-local-rc-server.log
          exit 1

      - name: Run multi-turn runtime acceptance
        env:
          BTC_COSMOGRAPHER_LOCAL_RC_BASE: http://127.0.0.1:4185
        run: node scripts/run-btc-cosmographer-multi-body-local-rc-fixture.mjs

      - name: Install usability visual verifier
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Run six-state desktop and mobile usability acceptance
        env:
          BTC_COSMOGRAPHER_LOCAL_RC_BASE: http://127.0.0.1:4185
        run: python3 scripts/verify-btc-cosmographer-local-rc-usability.py

      - name: Prove public gate is closed without env
        run: |
          kill "$(cat artifacts/btc-local-rc-server.pid)" || true
          unset BTC_LOCAL_RC
          npm run start -- -H 127.0.0.1 -p 4186 > artifacts/btc-local-rc-gate.log 2>&1 &
          echo $! > artifacts/btc-local-rc-gate.pid
          for _ in $(seq 1 60); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4186/crypto-astro/btc/local-rc' || true)"
            if [ "$code" = "404" ]; then
              echo "PASS_LOCAL_ENV_GATE"
              exit 0
            fi
            sleep 1
          done
          cat artifacts/btc-local-rc-gate.log
          exit 1

      - name: Upload exact-head local RC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-cosmographer-multi-body-local-rc-${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
