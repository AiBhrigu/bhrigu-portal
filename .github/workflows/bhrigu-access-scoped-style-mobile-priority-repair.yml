name: BHRIGU Access Scoped Style Mobile Priority Repair

on:
  push:
    branches: [ "agent/bhrigu-access-scoped-style-mobile-priority-repair-v0-1" ]
    paths:
      - ".github/workflows/bhrigu-access-scoped-style-mobile-priority-repair.yml"

concurrency:
  group: bhrigu-access-scoped-style-mobile-priority-repair
  cancel-in-progress: false

env:
  LOCKED_BASE_SHA: 99997ade460cd9cb6fd52e5c1896f61613a20fee
  LOCKED_BRANCH: agent/bhrigu-access-scoped-style-mobile-priority-repair-v0-1
  WORKFLOW_PATH: .github/workflows/bhrigu-access-scoped-style-mobile-priority-repair.yml
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  implement-and-prove:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove locked source head
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$LOCKED_BASE_SHA" HEAD
          test "$(git rev-parse HEAD^)" = "$LOCKED_BASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply deterministic one-file access repair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const postcss = require('postcss');
          const path = 'pages/access.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const original = source;

          function replaceOnce(needle, replacement, label) {
            const first = source.indexOf(needle);
            if (first < 0) throw new Error(`missing ${label}`);
            if (source.indexOf(needle, first + needle.length) >= 0 && label === 'crypto context panel') {
              throw new Error(`non-unique ${label}`);
            }
            source = source.slice(0, first) + replacement + source.slice(first + needle.length);
          }

          function functionBounds(name) {
            const start = source.indexOf(`function ${name}(`);
            if (start < 0) throw new Error(`missing function ${name}`);
            const next = source.indexOf('\nfunction ', start + 10);
            return [start, next < 0 ? source.length : next];
          }

          function appendClassToFirstSection(name, className) {
            const [start, end] = functionBounds(name);
            const segment = source.slice(start, end);
            const match = segment.match(/<section\s+className="([^"]+)"/);
            if (!match) throw new Error(`missing first section class in ${name}`);
            if (match[1].split(/\s+/).includes(className)) return;
            const updated = match[0].replace(match[1], `${match[1]} ${className}`);
            const local = match.index;
            source = source.slice(0, start + local) + updated + source.slice(start + local + match[0].length);
          }

          replaceOnce(
            '<section className="panel stack" aria-labelledby="crypto-astro-research-surface">',
            '<section className="panel stack accessContextPanel" aria-labelledby="crypto-astro-research-surface">',
            'crypto context panel'
          );

          appendClassToFirstSection('IntroBlock', 'accessContextPanel');
          appendClassToFirstSection('AccessBridgeContextBlock', 'accessContextPanel');

          for (const name of [
            'LoadingBlock',
            'RestoreDraftBlock',
            'RequestStep',
            'DatesStep',
            'ScopeStep',
            'AmbiguityState',
            'ReviewStep',
            'SuccessStep',
          ]) {
            appendClassToFirstSection(name, 'accessWorkflowPanel');
          }

          const noticeOld = `  return (\n    <div className="noticeStack" aria-live="polite">\n      {activeNotice ?? <div className="notice noticePlaceholder" aria-hidden="true" />}\n    </div>\n  );`;
          const noticeNew = `  if (!activeNotice) return null;\n\n  return (\n    <div className="noticeStack" aria-live="polite">\n      {activeNotice}\n    </div>\n  );`;
          replaceOnce(noticeOld, noticeNew, 'empty notice reserve');

          const openTag = '<style jsx>{`';
          const open = source.indexOf(openTag);
          if (open < 0) throw new Error('missing primary style block');
          const cssStart = open + openTag.length;
          const closeTag = '`}</style>';
          const cssEnd = source.indexOf(closeTag, cssStart);
          if (cssEnd < 0) throw new Error('missing primary style close');
          const css = source.slice(cssStart, cssEnd);
          const root = postcss.parse(css);
          root.walkRules((rule) => {
            if (rule.parent?.type === 'atrule' && /keyframes$/i.test(rule.parent.name || '')) return;
            rule.selectors = rule.selectors.map((selector) => {
              const trimmed = selector.trim();
              if (
                trimmed === '.accessPage' ||
                trimmed.startsWith('.accessPage ') ||
                trimmed.startsWith('.accessPage:')
              ) return trimmed;
              return `.accessPage ${trimmed}`;
            });
          });

          const repairCss = `

          /* ACCESS_SCOPED_STYLE_BINDING_AND_MOBILE_WORKFLOW_PRIORITY_V0_1 */
          .accessPage p.muted { font-size: 14px !important; }
          .accessPage p.tiny { font-size: 12px !important; }
          .accessPage p.sectionTitle { font-size: 12px !important; }
          .accessPage p.formLead { font-size: 15px !important; }
          .accessPage p.formSectionText { font-size: 14px !important; }
          .accessPage p.formSectionTitle { font-size: 12px !important; }
          .accessPage .accessBridgeNote div { font-size: 13px !important; }
          .accessPage .fieldControl { font: inherit; }

          @media (max-width: 760px) {
            .accessPage .shell {
              display: flex;
              flex-direction: column;
            }
            .accessPage .heroFrame { order: 0; }
            .accessPage .noticeStack { order: 1; }
            .accessPage .progress { order: 2; }
            .accessPage .accessWorkflowPanel { order: 3; }
            .accessPage .accessContextPanel { order: 10; }
            .accessPage .formFrame { gap: 20px; }
            .accessPage .formSection { gap: 14px; }
            .accessPage .formHero { gap: 10px; }
          }
          `;

          const scopedCss = root.toString() + repairCss;
          source = source.slice(0, open) + '<style jsx global>{`' + scopedCss + source.slice(cssEnd);

          if (source === original) throw new Error('repair produced no change');
          if (!source.includes('ACCESS_SCOPED_STYLE_BINDING_AND_MOBILE_WORKFLOW_PRIORITY_V0_1')) {
            throw new Error('repair marker missing');
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Lock final one-file repair head
        run: |
          set -euo pipefail
          rm "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/access.tsx "$WORKFLOW_PATH"
          git commit -m "Repair Access scoped styles and mobile workflow priority"
          git push origin HEAD:"$LOCKED_BRANCH"
          final_head="$(git rev-parse HEAD)"
          echo "FINAL_HEAD=$final_head" >> "$GITHUB_ENV"
          echo "FINAL_REPAIR_HEAD=$final_head" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove exact one-file net scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$LOCKED_BASE_SHA" HEAD
          git diff --name-only "$LOCKED_BASE_SHA...HEAD" | sort > /tmp/actual-scope.txt
          printf '%s\n' 'pages/access.tsx' > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          test "$(git diff --numstat "$LOCKED_BASE_SHA...HEAD" | wc -l)" -eq 1
          git diff --check "$LOCKED_BASE_SHA...HEAD"
          echo "EXACT_ONE_FILE_SCOPE=PASS"

      - name: Verify inherited BTC contracts
        run: |
          npm run verify:btc-paid-x402-sandbox
          npm run verify:btc-routing
          npm run verify:btc-binance-observation

      - name: Install pinned Chromium with Linux dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: npx playwright install --with-deps chromium

      - name: Build production portal
        run: npm run build

      - name: Start production-mode localhost
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run start -- --hostname 127.0.0.1 --port 4317 > artifacts/server.log 2>&1 &
          echo $! > /tmp/bhrigu-server.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:4317/access >/dev/null; then
              echo "LOCALHOST_READY=YES"
              exit 0
            fi
            sleep 1
          done
          cat artifacts/server.log
          exit 1

      - name: Prove Access mobile conversion and workflow integrity
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const baseUrl = 'http://127.0.0.1:4317';
          const browser = await chromium.launch({ headless: true });
          const evidence = { node: 'BHRIGU_ACCESS_INTAKE_SCOPED_STYLE_BINDING_AND_MOBILE_WORKFLOW_PRIORITY_TARGETED_REPAIR_FULL_CYCLE_v0_1', final_head: process.env.FINAL_HEAD, status: 'PASS' };

          try {
            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
            const page = await mobile.newPage();
            const response = await page.goto(`${baseUrl}/access`, { waitUntil: 'networkidle', timeout: 45000 });
            if (!response || response.status() !== 200) throw new Error(`mobile status ${response?.status()}`);

            const metrics = await page.evaluate(() => {
              const firstControl = document.querySelector('.fieldControl');
              const textarea = document.querySelector('textarea.fieldControl');
              const continueButton = Array.from(document.querySelectorAll('button')).find((node) => node.textContent?.trim() === 'Continue');
              const contextPanel = document.querySelector('.accessContextPanel');
              const notice = document.querySelector('.noticeStack');
              if (!firstControl || !textarea || !continueButton || !contextPanel) return { missing: true };
              const rect = (node) => {
                const r = node.getBoundingClientRect();
                return { top: r.top + window.scrollY, width: r.width, height: r.height };
              };
              const inputStyle = getComputedStyle(firstControl);
              const textareaStyle = getComputedStyle(textarea);
              const buttonStyle = getComputedStyle(continueButton);
              return {
                missing: false,
                pageHeight: document.documentElement.scrollHeight,
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                firstControl: rect(firstControl),
                textarea: rect(textarea),
                continueButton: rect(continueButton),
                contextPanel: rect(contextPanel),
                noticePresent: Boolean(notice),
                inputBackground: inputStyle.backgroundImage,
                inputBorderRadius: inputStyle.borderRadius,
                inputColor: inputStyle.color,
                textareaMinHeight: textareaStyle.minHeight,
                buttonBorderRadius: buttonStyle.borderRadius,
              };
            });

            if (metrics.missing) throw new Error('required Access elements missing');
            if (metrics.firstControl.top > 1974) throw new Error(`first control y ${metrics.firstControl.top}`);
            if (metrics.continueButton.top > 2550) throw new Error(`Continue y ${metrics.continueButton.top}`);
            if (metrics.firstControl.height < 53) throw new Error(`input height ${metrics.firstControl.height}`);
            if (metrics.textarea.height < 145) throw new Error(`textarea height ${metrics.textarea.height}`);
            if (metrics.continueButton.height < 49) throw new Error(`button height ${metrics.continueButton.height}`);
            if (metrics.continueButton.width < 300) throw new Error(`mobile CTA width ${metrics.continueButton.width}`);
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error(`horizontal overflow ${metrics.scrollWidth - metrics.viewportWidth}`);
            if (metrics.firstControl.top >= metrics.contextPanel.top) throw new Error('workflow does not precede context on mobile');
            if (metrics.noticePresent) throw new Error('empty notice reserve remains visible in DOM');
            if (metrics.inputBorderRadius === '0px') throw new Error('native input radius remains');
            if (metrics.buttonBorderRadius === '0px') throw new Error('native CTA radius remains');

            await page.getByLabel('Name').fill('Access Proof');
            await page.getByLabel('Email').fill('proof@example.com');
            await page.getByLabel('Subject type').selectOption({ label: 'Project' });
            await page.getByLabel('Main question').fill('How should this project be structured?');
            await page.getByLabel('Short description').fill('A deterministic local workflow transition proof without submission.');
            await page.getByLabel('Preferred depth').selectOption({ label: 'Structured Snapshot' });
            await page.getByText('I understand that all requests are reviewed manually before confirmation, pricing, and processing.').click();
            await page.getByRole('button', { name: 'Continue', exact: true }).click();
            await page.getByText('Relevant dates', { exact: true }).waitFor({ state: 'visible', timeout: 10000 });
            evidence.mobile = { ...metrics, request_to_dates: 'PASS' };
            await page.screenshot({ path: 'artifacts/access-mobile-repaired.png', fullPage: true });
            await mobile.close();

            const desktop = await browser.newContext({ viewport: { width: 1440, height: 1200 }, locale: 'en-US' });
            const desktopPage = await desktop.newPage();
            const desktopResponse = await desktopPage.goto(`${baseUrl}/access`, { waitUntil: 'networkidle', timeout: 45000 });
            if (!desktopResponse || desktopResponse.status() !== 200) throw new Error(`desktop status ${desktopResponse?.status()}`);
            const desktopMetrics = await desktopPage.evaluate(() => {
              const firstControl = document.querySelector('.fieldControl');
              const contextPanel = document.querySelector('.accessContextPanel');
              if (!firstControl || !contextPanel) return { missing: true };
              const r1 = firstControl.getBoundingClientRect();
              const r2 = contextPanel.getBoundingClientRect();
              return {
                missing: false,
                firstControlTop: r1.top + window.scrollY,
                contextTop: r2.top + window.scrollY,
                inputHeight: r1.height,
                horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth,
              };
            });
            if (desktopMetrics.missing) throw new Error('desktop Access elements missing');
            if (desktopMetrics.contextTop >= desktopMetrics.firstControlTop) throw new Error('desktop source order changed');
            if (desktopMetrics.inputHeight < 53) throw new Error(`desktop input height ${desktopMetrics.inputHeight}`);
            if (desktopMetrics.horizontalOverflow > 1) throw new Error(`desktop overflow ${desktopMetrics.horizontalOverflow}`);
            evidence.desktop = desktopMetrics;
            await desktopPage.screenshot({ path: 'artifacts/access-desktop-repaired.png', fullPage: true });
            await desktop.close();
          } finally {
            await browser.close();
          }

          fs.writeFileSync('artifacts/access-layout-audit.json', JSON.stringify(evidence, null, 2));
          console.log('ACCESS_SCOPED_STYLE_BINDING=PASS');
          console.log('ACCESS_MOBILE_WORKFLOW_PRIORITY=PASS');
          console.log('ACCESS_REQUEST_TO_DATES=PASS');
          NODE

      - name: Run full 25-route 50-capture harness
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
          BHRIGU_VISUAL_ARTIFACT_ROOT: artifacts/local-visual
        run: |
          export BHRIGU_VISUAL_SOURCE_SHA="$FINAL_HEAD"
          export BHRIGU_VISUAL_HARNESS_SHA="$FINAL_HEAD"
          node scripts/local-visual/capture.mjs

      - name: Prove 50 of 50 technical visual pass
        run: |
          set -euo pipefail
          manifest="$(find artifacts/local-visual -name manifest.json -type f | sort | tail -n 1)"
          test -n "$manifest"
          node - "$manifest" <<'NODE'
          const fs = require('fs');
          const manifestPath = process.argv[2];
          const data = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const required = {
            public_routes_and_scenarios: 25,
            expected_captures: 50,
            completed_captures: 50,
            passing_captures: 50,
            blocking_captures: 0,
            production_writes: 0,
            vercel_writes: 0,
            x402_live_transfers: 0,
          };
          for (const [key, expected] of Object.entries(required)) {
            if (data[key] !== expected) throw new Error(`${key}: expected ${expected}, got ${data[key]}`);
          }
          if (data.status !== 'PASS') throw new Error(`manifest status ${data.status}`);
          console.log('FULL_VISUAL_HARNESS=50_OF_50_PASS');
          NODE

      - name: Publish exact-head evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=""
          for attempt in $(seq 1 36); do
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$LOCKED_BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [[ -n "$pr_number" ]]; then break; fi
            sleep 5
          done
          test -n "$pr_number"
          cat > /tmp/comment.md <<EOF
          ## OPS/F exact-head evidence

          \`BHRIGU_ACCESS_INTAKE_SCOPED_STYLE_BINDING_AND_MOBILE_WORKFLOW_PRIORITY_TARGETED_REPAIR_FULL_CYCLE_v0_1\`

          - final repair head: \`$FINAL_HEAD\`
          - exact net scope: \`pages/access.tsx\`
          - workflow run: \`${{ github.run_id }}\`
          - platform: \`ubuntu-24.04\`
          - scoped child-component style binding: \`PASS\`
          - first mobile form control: \`≤1974px\`
          - first mobile Continue CTA: \`≤2550px\`
          - empty notice reserve: \`REMOVED\`
          - Request → Dates transition: \`PASS\`
          - production build: \`PASS\`
          - inherited BTC regressions: \`PASS\`
          - visual captures: \`50/50 PASS\`
          - artifact: \`bhrigu-access-mobile-conversion-evidence-${{ github.run_id }}\`

          No merge, production deployment, manual Vercel write, intake submission or x402 live transfer was performed.
          EOF
          gh api repos/${{ github.repository }}/issues/$pr_number/comments --method POST --field body="$(cat /tmp/comment.md)"
          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"

      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/access-layout-audit.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/access-layout-audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          summary="$(find artifacts/local-visual -name summary.md -type f | sort | tail -n 1 || true)"
          if [[ -n "$summary" && -f "$summary" ]]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhrigu-access-mobile-conversion-evidence-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
