name: BTC Freshness Target Rebase

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: btc-freshness-target-rebase
  cancel-in-progress: false

jobs:
  rebase-target:
    if: >-
      github.event.issue.title == 'BTC_FRESHNESS_TARGET_REBASE_BHRIGU_v0_1' &&
      github.event.issue.user.login == 'AiBhrigu' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify transport-only default delta and target lock
        run: |
          set -euo pipefail
          git fetch origin master repair/btc-freshness-contract-24h-v0-1
          test "$(git diff --name-only c858ccf6a62a3798982c9b5446d83a8699811eca..origin/master | sort)" = ".github/workflows/btc-freshness-target-rebase.yml"
          test "$(git rev-parse origin/repair/btc-freshness-contract-24h-v0-1)" = "8a3393f55daece315c32079cc03b6ce56009e529"

      - name: Rebuild target from clean base and exact code commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B repair/btc-freshness-contract-24h-v0-1 c858ccf6a62a3798982c9b5446d83a8699811eca
          git cherry-pick 31906c9ee3b030052a561e7ccb95b9f72221eb11
          EXPECTED=$(printf '%s\n' \
            lib/btc-freshness-contract.ts \
            lib/btc-market-envelope.ts \
            lib/btc-public-static-source.ts \
            tests/btc-market-envelope-fixture.ts \
            tests/btc-source-contract-fixture.ts | sort)
          test "$(git diff --name-only c858ccf6a62a3798982c9b5446d83a8699811eca...HEAD | sort)" = "$EXPECTED"
          git push --force-with-lease=refs/heads/repair/btc-freshness-contract-24h-v0-1:8a3393f55daece315c32079cc03b6ce56009e529 origin HEAD:repair/btc-freshness-contract-24h-v0-1

      - name: Record closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "STATUS=PASS_TARGET_REBASED
          CLEAN_BASE=c858ccf6a62a3798982c9b5446d83a8699811eca
          CODE_COMMIT=31906c9ee3b030052a561e7ccb95b9f72221eb11
          TARGET_SCOPE=5_FILES
          MERGE=FORBIDDEN"
          gh issue close "${{ github.event.issue.number }}" --reason completed
