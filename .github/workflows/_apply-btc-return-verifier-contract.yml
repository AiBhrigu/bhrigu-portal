name: Apply BTC return verifier contract

on:
  push:
    branches:
      - agent/btc-natural-followup-evidence-discovery-v0-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/btc-natural-followup-evidence-discovery-v0-1
          fetch-depth: 0
          persist-credentials: true
      - name: Verify bounded scope
        run: test -f scripts/apply-btc-return-verifier-contract.py
      - name: Apply verifier-only repair
        run: python3 scripts/apply-btc-return-verifier-contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Static, syntax, and build acceptance
        run: |
          npm ci --ignore-scripts
          node scripts/run-btc-natural-followup-discovery-static-fixture.mjs
          python3 -m py_compile scripts/verify-btc-natural-followup-conversations.py
          npm run build
      - name: Commit verifier repair only
        run: |
          git checkout HEAD -- .github/workflows/_apply-btc-return-verifier-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Unexpected workflow mutation' >&2
            exit 1
          fi
          git commit -m "test: accept explicit topic switch before return"
          git push origin HEAD:agent/btc-natural-followup-evidence-discovery-v0-1
