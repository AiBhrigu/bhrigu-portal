name: Apply BTC natural follow-up repair

on:
  push:
    branches:
      - agent/btc-natural-followup-evidence-discovery-v0-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/btc-natural-followup-evidence-discovery-v0-1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact contour
        run: |
          git fetch origin master
          test "$(git merge-base HEAD origin/master)" = "5a45750fc98bd1a902ede300f2e45d6ec3fa7f0e"
          git diff --name-only 5a45750fc98bd1a902ede300f2e45d6ec3fa7f0e HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/_apply-btc-natural-followup-repair.yml
          .github/workflows/btc-natural-followup-discovery-pr.yml
          scripts/apply-btc-natural-followup-repair.py
          scripts/normalize-btc-repair-patcher.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Normalize exact-head anchors
        run: python3 scripts/normalize-btc-repair-patcher.py

      - name: Apply bounded repair
        run: python3 scripts/apply-btc-natural-followup-repair.py

      - name: Static acceptance
        run: node scripts/run-btc-natural-followup-discovery-static-fixture.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Production build
        run: npm run build

      - name: Commit bounded repair without workflow mutation
        run: |
          git checkout HEAD -- \
            .github/workflows/_apply-btc-natural-followup-repair.yml \
            .github/workflows/btc-natural-followup-discovery-pr.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow mutation must be connector-authored.' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m "fix: bind BTC follow-ups and public discovery"
          git push origin HEAD:agent/btc-natural-followup-evidence-discovery-v0-1
