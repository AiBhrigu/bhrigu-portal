name: Apply BTC natural follow-up repair

on:
  push:
    branches:
      - agent/btc-natural-followup-evidence-discovery-v0-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/btc-natural-followup-evidence-discovery-v0-1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact contour
        run: |
          git fetch origin master
          test "$(git merge-base HEAD origin/master)" = "5a45750fc98bd1a902ede300f2e45d6ec3fa7f0e"
          git diff --name-only 5a45750fc98bd1a902ede300f2e45d6ec3fa7f0e HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/_apply-btc-natural-followup-repair.yml
          scripts/apply-btc-natural-followup-repair.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Align exact-head inheritance anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-btc-natural-followup-repair.py")
          text = path.read_text(encoding="utf-8")
          old = '''    ''' + "'''  const resolvedDomain =\n  relation === \"FOLLOW_UP\" && domain === \"unsupported\" && packet\n    ? packet.prior_domain\n    : domain;\n  const resolvedSubject =\n  relation === \"FOLLOW_UP\" && subject === \"unknown\" && packet\n    ? packet.prior_subject\n    : subject;''',"
          new = '''    ''' + "'''  const resolvedDomain =\n    relation === \"FOLLOW_UP\" && domain === \"unsupported\" && packet\n      ? packet.prior_domain\n      : domain;\n  const resolvedSubject =\n    relation === \"FOLLOW_UP\" && subject === \"unknown\" && packet\n      ? packet.prior_subject\n      : subject;''',"
          if text.count(old) != 1:
              raise SystemExit(f"inheritance patcher anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply bounded repair
        run: python3 scripts/apply-btc-natural-followup-repair.py

      - name: Static acceptance
        run: node scripts/run-btc-natural-followup-discovery-static-fixture.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Production build
        run: npm run build

      - name: Commit bounded repair
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind BTC follow-ups and public discovery"
          git push origin HEAD:agent/btc-natural-followup-evidence-discovery-v0-1
