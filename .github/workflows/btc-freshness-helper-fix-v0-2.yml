name: BTC Freshness Helper Fix v0.2

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: btc-freshness-helper-fix-v0-2
  cancel-in-progress: false

jobs:
  fix-helper:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'repair/btc-freshness-contract-24h-v0-1' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.user.login == 'AiBhrigu' &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/btc-freshness-contract-24h-v0-1
          fetch-depth: 0

      - name: Patch only the proven transient-scope defect
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "c3d38c1d67d8ef3b89ba7fc686f4a683e314cf18"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/btc-freshness-contract-repair-apply.yml')
          text = path.read_text(encoding='utf-8')
          expected_anchor = "          EXPECTED=$(printf '%s\\n' \\\n"
          assert text.count(expected_anchor) == 1
          text = text.replace(
              expected_anchor,
              expected_anchor + "            .github/workflows/btc-freshness-contract-repair-apply.yml \\\n",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          test "$(git diff --name-only)" = ".github/workflows/btc-freshness-contract-repair-apply.yml"

      - name: Commit helper fix to target branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/btc-freshness-contract-repair-apply.yml
          git commit -m "CI: allow transient helper deletion in freshness scope"
          git push origin HEAD:repair/btc-freshness-contract-24h-v0-1
