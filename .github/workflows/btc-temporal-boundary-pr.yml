name: BTC Temporal Route and Date Boundary

on:
  pull_request:
    paths:
      - "lib/btc-public-snapshot-composer.ts"
      - "lib/btc-market-envelope.ts"
      - "lib/btc-public-language-contract.ts"
      - "components/btc/BtcQuestionMembrane.tsx"
      - "components/btc/BtcLiveDialogue.tsx"
      - "pages/crypto-astro/btc.tsx"
      - "pages/crypto-astro/btc/live.tsx"
      - ".github/workflows/btc-temporal-boundary-pr.yml"

permissions:
  contents: read

jobs:
  temporal-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:btc-routing
      - run: npm run build
      - name: Install browser driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2
      - name: Start production preview
        run: |
          npm run start -- -p 3000 >/tmp/btc-temporal-boundary.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/crypto-astro/btc/live >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/btc-temporal-boundary.log
          exit 1
      - name: Verify live dialogue temporal boundary
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.parse import urlencode
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base='http://127.0.0.1:3000/crypto-astro/btc/live'
          today=datetime.now(timezone.utc).date().isoformat()
          tomorrow=(datetime.now(timezone.utc).date()+timedelta(days=1)).isoformat()
          report={'checks':{},'measurements':{'today_utc':today,'tomorrow_utc':tomorrow},'scenarios':{},'failures':[]}
          options=webdriver.ChromeOptions()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars'):
            options.add_argument(arg)
          options.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          driver=webdriver.Chrome(options=options)

          def open_case(name, question, date=None):
            params={'lang':'en','q':question}
            if date is not None: params['d']=date
            driver.get(base+'?'+urlencode(params))
            WebDriverWait(driver,40).until(lambda d:d.find_element(By.CSS_SELECTOR,'.liveDialogueShell'))
            time.sleep(.12)
            body=driver.find_element(By.TAG_NAME,'body').text
            answer=driver.find_elements(By.CSS_SELECTOR,'.cosmographerTurn')
            failure=driver.find_elements(By.CSS_SELECTOR,'.dialogueFailure')
            source=driver.find_elements(By.CSS_SELECTOR,'.answerSource')
            result={'question':question,'date':date,'body':body,'answer_visible':len(answer)==1,'failure_visible':len(failure)==1,'source':source[0].text if source else ''}
            report['scenarios'][name]={k:v for k,v in result.items() if k!='body'}
            return result

          try:
            temporal='How does the selected date change temporal pressure?'
            current=open_case('current_date',temporal,today)
            future=open_case('future_date',temporal,tomorrow)
            fixed=open_case('fixed_future_date',temporal,'2030-01-01')
            invalid=open_case('invalid_calendar_date',temporal,'2026-02-30')
            memory=open_case('memory_control','What changed since the previous accepted snapshot?')
            trading=open_case('trading_control','Should I buy or sell BTC right now?')

            report['checks']['current_answer_visible']=current['answer_visible'] and not current['failure_visible']
            report['checks']['future_date_accepted']=future['answer_visible'] and not future['failure_visible']
            report['checks']['future_date_is_observation']=datetime.fromisoformat(tomorrow).strftime('%d %b %Y') in future['source']
            report['checks']['fixed_2030_accepted']=fixed['answer_visible'] and not fixed['failure_visible']
            report['checks']['fixed_2030_is_observation']='01 Jan 2030' in fixed['source']
            report['checks']['invalid_calendar_date_rejected']=invalid['failure_visible']
            report['checks']['invalid_calendar_date_message']='real UTC date in YYYY-MM-DD format' in invalid['body']
            report['checks']['memory_answer_visible']=memory['answer_visible'] and not memory['failure_visible']
            report['checks']['trading_reframe_preserved']='Direct trading guidance was removed.' in trading['body']
            report['checks']['one_composer_only']=len(driver.find_elements(By.CSS_SELECTOR,'textarea[name="q"]'))==1
            report['checks']['analytics_dashboard_absent']=sum(len(driver.find_elements(By.CSS_SELECTOR,s)) for s in ('.phiPlane','.metricRibbon','.readingZone','.memoryAxis'))==0
            report['checks']['freshness_language_24h']='72-hour' not in '\n'.join(Path(p).read_text() for p in ('lib/btc-public-snapshot-composer.ts','lib/btc-market-envelope.ts','lib/btc-public-language-contract.ts'))
            severe=[entry for entry in driver.get_log('browser') if entry.get('level')=='SEVERE' and 'favicon' not in entry.get('message','').lower()]
            report['checks']['browser_severe_none']=not severe
            report['browser_severe']=severe
            driver.save_screenshot('artifacts/btc-live-temporal-boundary.png')
            report['failures']=[k for k,v in report['checks'].items() if not v]
            assert not report['failures'], report['failures']
          finally:
            driver.quit()
            Path('artifacts/btc-temporal-boundary-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Upload temporal boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-temporal-boundary-pr-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
