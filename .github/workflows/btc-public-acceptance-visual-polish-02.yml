name: BTC Public Acceptance Visual Polish 02

on:
  pull_request:
    types: [reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.pull_request.head.ref == 'repair/btc-cosmographer-public-acceptance-01-v0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply founder screenshot visual polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Entry screen: remove duplicate corridor label and human-facing SHA debug.
          p = Path('pages/crypto-astro/btc.tsx')
          s = p.read_text()
          old = '{ru ? "Market Cosmographer · первый живой коридор" : "Market Cosmographer · first live corridor"}'
          new = '{ru ? "Market Cosmographer · проверенная рыночная разведка" : "Market Cosmographer · verified market intelligence"}'
          if old not in s: raise SystemExit('entry eyebrow anchor missing')
          s = s.replace(old, new, 1)
          old = '''      <section
        className="snapshotTruthStrip"
        data-freshness-state={p.sourceContext.state}
        data-source-generated-at={p.sourceContext.generated_at_utc ?? ""}
        aria-label={truth.stateLabel}
      >
        <strong>{truth.stateLabel}</strong>
        <p>{truth.snapshotLine}</p>
        {truth.ageLine && <p>{truth.ageLine}</p>}
        <p>{truth.proofLine}</p>
        {p.deploymentSourceSha && <p>{ru ? "Источник публикации" : "Deployment source"} · <code>{p.deploymentSourceSha.slice(0, 12)}</code></p>}
      </section>'''
          new = '''      <section
        className="snapshotTruthStrip"
        data-freshness-state={p.sourceContext.state}
        data-source-generated-at={p.sourceContext.generated_at_utc ?? ""}
        aria-label={truth.stateLabel}
      >
        <div className="snapshotTruthStatus">
          <span className="snapshotTruthDot" aria-hidden="true"/>
          <strong>{truth.stateLabel}</strong>
        </div>
        <div className="snapshotTruthMeta">
          <p>{truth.snapshotLine}</p>
          {truth.ageLine && <p>{truth.ageLine}</p>}
          <p>{truth.proofLine}</p>
        </div>
      </section>'''
          if old not in s: raise SystemExit('snapshot strip anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Entry screen visual density and semantic snapshot strip.
          p = Path('lib/btc-product-rebalance-style.ts')
          s = p.read_text()
          replacements = [
            (
              '.heroProductEntry{display:grid;grid-template-columns:minmax(0,38.196601125fr) minmax(420px,61.803398875fr);gap:clamp(34px,5vw,78px);align-items:center;min-height:min(720px,calc(100svh - 110px));padding:clamp(34px,5vw,68px) 0;border-bottom:1px solid var(--bl)}',
              '.heroProductEntry{display:grid;grid-template-columns:minmax(0,38.196601125fr) minmax(420px,61.803398875fr);gap:clamp(32px,4.6vw,68px);align-items:center;min-height:min(650px,calc(100svh - 96px));padding:clamp(30px,4vw,54px) 0;border-bottom:1px solid var(--bl)}'
            ),
            (
              '.heroQuestionCard{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(430px,55svh,560px);display:grid;align-content:center;gap:17px;padding:clamp(26px,3.4vw,46px);border:1px solid rgba(106,168,255,.36);border-radius:24px 38px;background:linear-gradient(90deg,transparent calc(var(--phi-major) - .08%),rgba(210,164,95,.28) var(--phi-major),transparent calc(var(--phi-major) + .08%)),linear-gradient(180deg,transparent calc(var(--phi-minor) - .08%),rgba(106,168,255,.28) var(--phi-minor),transparent calc(var(--phi-minor) + .08%)),radial-gradient(circle at var(--phi-major) var(--phi-minor),rgba(106,168,255,.14),transparent 24%),linear-gradient(145deg,rgba(12,25,44,.98),rgba(5,10,18,.98));box-shadow:0 30px 90px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04)}',
              '.heroQuestionCard{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(390px,49svh,500px);display:grid;align-content:center;gap:17px;padding:clamp(26px,3.4vw,44px);border:1px solid rgba(106,168,255,.36);border-radius:24px 38px;background:radial-gradient(circle at var(--phi-major) var(--phi-minor),rgba(106,168,255,.13),transparent 25%),linear-gradient(145deg,rgba(12,25,44,.98),rgba(5,10,18,.98));box-shadow:0 30px 90px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04)}'
            ),
            (
              '.snapshotTruthStrip{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}',
              '.snapshotTruthStrip{display:grid;grid-template-columns:minmax(190px,.38fr) minmax(0,.62fr);gap:18px;align-items:center;margin:0;padding:19px 0 22px;border-bottom:1px solid var(--bl);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.snapshotTruthStatus{display:flex;align-items:center;gap:10px}.snapshotTruthStatus strong{font-size:14px;line-height:1.35}.snapshotTruthDot{width:8px;height:8px;border-radius:50%;background:var(--m);box-shadow:0 0 0 5px rgba(127,143,162,.08)}.snapshotTruthStrip[data-freshness-state="FRESH"] .snapshotTruthDot{background:var(--blue);box-shadow:0 0 0 5px rgba(106,168,255,.1)}.snapshotTruthStrip[data-freshness-state="STALE_LIMITED"] .snapshotTruthDot{background:var(--b);box-shadow:0 0 0 5px rgba(210,164,95,.1)}.snapshotTruthStrip[data-freshness-state="UNAVAILABLE"] .snapshotTruthDot{background:var(--red);box-shadow:0 0 0 5px rgba(215,134,127,.1)}.snapshotTruthMeta{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px 18px}.snapshotTruthMeta p{margin:0;color:var(--t2);font-size:13px;line-height:1.45}.snapshotTruthMeta p+p:before{content:"·";margin-right:18px;color:var(--blue)}'
            ),
            (
              '.productOutcomeHeader{display:grid;gap:10px;max-width:760px;padding:clamp(58px,8vw,100px) 0 26px}',
              '.productOutcomeHeader{display:grid;gap:10px;max-width:760px;padding:clamp(40px,5.6vw,70px) 0 22px}'
            ),
            (
              '.productOutcomeGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:clamp(54px,8vw,100px)}',
              '.productOutcomeGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:clamp(46px,6vw,78px)}'
            ),
            (
              '.productOutcomeHeader{padding-top:48px}',
              '.productOutcomeHeader{padding-top:38px}'
            ),
          ]
          for old, new in replacements:
              if old not in s: raise SystemExit(f'entry CSS anchor missing: {old[:70]}')
              s = s.replace(old, new, 1)
          mobile_anchor = 'main{padding-inline:16px}.heroProductEntry{gap:22px;padding:26px 0 30px}'
          mobile_new = 'main{padding-inline:16px}.heroProductEntry{gap:22px;padding:26px 0 30px}.snapshotTruthStrip{grid-template-columns:1fr;gap:9px;padding:15px 0 18px}.snapshotTruthMeta{justify-content:flex-start;gap:5px 12px}.snapshotTruthMeta p+p:before{margin-right:12px}'
          if mobile_anchor not in s: raise SystemExit('entry mobile CSS anchor missing')
          p.write_text(s.replace(mobile_anchor, mobile_new, 1))

          # Live screen: deterministic date format independent of browser locale.
          p = Path('components/btc/BtcCosmographerDialogue.tsx')
          s = p.read_text()
          old = '<input name="d" type="date" defaultValue={initialDate}/>'
          new = '''<input
              name="d"
              type="text"
              inputMode="numeric"
              autoComplete="off"
              placeholder="YYYY-MM-DD"
              pattern="\\d{4}-\\d{2}-\\d{2}"
              defaultValue={initialDate}
              aria-describedby="btc-observation-date-format"
            />
            <small id="btc-observation-date-format" className="dateFormatHint">{ru ? "Формат UTC: YYYY-MM-DD" : "UTC format: YYYY-MM-DD"}</small>'''
          if old not in s: raise SystemExit('date input anchor missing')
          p.write_text(s.replace(old, new, 1))

          # Live screen: reduce empty-state drift and improve proof readability.
          p = Path('lib/btc-live-dialogue-style.ts')
          s = p.read_text()
          replacements = [
            (
              '.liveDialogueShell{width:min(920px,100%);margin:0 auto;padding:clamp(42px,7vw,82px) 0 0}',
              '.liveDialogueShell{width:min(920px,100%);margin:0 auto;padding:clamp(32px,5vw,58px) 0 0}.liveDialogueShell:not(:has(.liveThread)){padding-top:clamp(28px,4vw,44px)}'
            ),
            (
              '.liveDialogueIntro{display:grid;gap:12px;margin-bottom:clamp(30px,5vw,48px)}',
              '.liveDialogueIntro{display:grid;gap:12px;margin-bottom:clamp(24px,3.6vw,34px)}.liveDialogueShell:not(:has(.liveThread)) .liveDialogueIntro{margin-bottom:22px}'
            ),
            (
              '.answerSource,.answerSourceHistory{margin-top:18px;padding-top:13px;border-top:1px solid var(--bl);color:var(--m);font-size:11px}',
              '.answerSource,.answerSourceHistory{margin-top:18px;padding-top:14px;border-top:1px solid var(--bl);color:var(--t2);font-size:12px}'
            ),
            (
              '.answerSource summary,.answerSourceHistory summary{cursor:pointer;color:var(--m);letter-spacing:.04em;text-transform:uppercase}.answerSource>div,.answerSourceHistory>div{display:grid;gap:6px;margin-top:10px}',
              '.answerSource summary,.answerSourceHistory summary{cursor:pointer;color:var(--t2);letter-spacing:.035em;text-transform:uppercase}.answerSource>div,.answerSourceHistory>div{display:grid;gap:8px;margin-top:11px}'
            ),
            (
              '.liveComposer label{display:grid;gap:8px;color:var(--t2);font-size:12px}.liveComposer textarea{min-height:92px;resize:vertical;background:rgba(2,7,14,.66);font-family:inherit;font-size:16px;line-height:1.5}',
              '.liveComposer label{display:grid;gap:8px;color:var(--t2);font-size:12px}.liveComposer textarea{min-height:84px;resize:vertical;background:rgba(2,7,14,.66);font-family:inherit;font-size:16px;line-height:1.5}.dateFormatHint{margin-top:-2px;color:var(--m);font-size:10px;letter-spacing:.025em}'
            ),
            (
              '.liveComposerAfterAnswer{margin-top:4px}.liveBoundary{max-width:760px;margin:14px auto 0;color:var(--m);font-size:10px;line-height:1.55;letter-spacing:.035em;text-align:center}',
              '.liveComposerAfterAnswer{margin-top:4px}.liveComposerPrimary{margin-top:0}.liveBoundary{max-width:720px;margin:12px auto 0;color:var(--m);font-size:10px;line-height:1.55;letter-spacing:.03em;text-align:center}'
            ),
          ]
          for old, new in replacements:
              if old not in s: raise SystemExit(f'live CSS anchor missing: {old[:70]}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Extend visual acceptance with the screenshot-derived defects.
          p = Path('scripts/verify-btc-public-acceptance-two-screen.py')
          s = p.read_text()
          old = '    check(f"entry_non_mono_voice_{suffix}", "mono" not in family and "consolas" not in family, family)\n    driver.save_screenshot(str(OUT / f"entry-{suffix}.png"))'
          new = '''    check(f"entry_non_mono_voice_{suffix}", "mono" not in family and "consolas" not in family, family)
    body = driver.find_element(By.TAG_NAME, "body").text
    check(f"entry_no_public_deployment_debug_{suffix}", "Deployment source" not in body and "Источник публикации" not in body)
    snapshot_height = driver.find_element(By.CSS_SELECTOR, ".snapshotTruthStrip").rect["height"]
    check(f"entry_compact_snapshot_{suffix}", snapshot_height < 150, snapshot_height)
    driver.save_screenshot(str(OUT / f"entry-{suffix}.png"))'''
          if old not in s: raise SystemExit('entry acceptance anchor missing')
          s = s.replace(old, new, 1)
          old = '    check(f"live_non_mono_voice_{suffix}", "mono" not in family and "consolas" not in family, family)\n    driver.save_screenshot(str(OUT / f"live-{suffix}.png"))'
          new = '''    check(f"live_non_mono_voice_{suffix}", "mono" not in family and "consolas" not in family, family)
    date_input = driver.find_element(By.CSS_SELECTOR, 'input[name="d"]')
    check(f"live_stable_date_format_{suffix}", date_input.get_attribute("placeholder") == "YYYY-MM-DD", date_input.get_attribute("placeholder"))
    driver.save_screenshot(str(OUT / f"live-{suffix}.png"))'''
          if old not in s: raise SystemExit('live acceptance anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit screenshot-derived polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/crypto-astro/btc.tsx lib/btc-product-rebalance-style.ts components/btc/BtcCosmographerDialogue.tsx lib/btc-live-dialogue-style.ts scripts/verify-btc-public-acceptance-two-screen.py
          git diff --cached --quiet && { echo 'No visual polish change' >&2; exit 1; }
          git commit -m "BTC: polish founder-reviewed entry and live screens"
          git push origin HEAD:repair/btc-cosmographer-public-acceptance-01-v0-1
