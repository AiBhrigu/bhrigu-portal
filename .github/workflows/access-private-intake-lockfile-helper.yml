name: Access Private Intake Lockfile Helper

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: access-private-intake-lockfile-helper
  cancel-in-progress: false

jobs:
  materialize-lockfile:
    if: >-
      github.event.issue.title == 'Access private intake lockfile request' &&
      github.event.issue.user.login == 'AiBhrigu' &&
      github.event.issue.author_association == 'OWNER' &&
      github.actor == 'AiBhrigu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bhrigu-first-external-request-durable-private-intake-v0-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare diagnostics
        run: mkdir -p artifacts

      - name: Validate exact owner request, source ancestry, and target head
        id: source
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          SOURCE_BASE_SHA=88a7c2b27652704cc089afb87bafae8b0a9dc4f1
          mapfile -t REQUEST_LINES <<< "$ISSUE_BODY"
          test "${#REQUEST_LINES[@]}" = "4"
          test "${REQUEST_LINES[0]}" = "SCHEMA=access_private_intake_lockfile_request_v0_1"
          test "${REQUEST_LINES[1]}" = "SOURCE_BASE_SHA=$SOURCE_BASE_SHA"
          TARGET_HEAD_SHA="${REQUEST_LINES[2]#EXPECTED_TARGET_HEAD_SHA=}"
          test "${REQUEST_LINES[2]}" = "EXPECTED_TARGET_HEAD_SHA=$TARGET_HEAD_SHA"
          [[ "$TARGET_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${REQUEST_LINES[3]}" = "TARGET_BRANCH=agent/bhrigu-first-external-request-durable-private-intake-v0-1"
          git fetch --no-tags origin master agent/bhrigu-first-external-request-durable-private-intake-v0-1
          CURRENT_MASTER_SHA=$(git rev-parse origin/master)
          git merge-base --is-ancestor "$SOURCE_BASE_SHA" "$CURRENT_MASTER_SHA"
          git diff --name-only "$SOURCE_BASE_SHA" "$CURRENT_MASTER_SHA" | sort > /tmp/master-delta.txt
          printf '%s\n' '.github/workflows/access-private-intake-lockfile-helper.yml' > /tmp/expected-master-delta.txt
          diff -u /tmp/expected-master-delta.txt /tmp/master-delta.txt
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test "$(git rev-parse origin/agent/bhrigu-first-external-request-durable-private-intake-v0-1)" = "$TARGET_HEAD_SHA"
          echo "current_master_sha=$CURRENT_MASTER_SHA" >> "$GITHUB_OUTPUT"
          echo "target_head_sha=$TARGET_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo LOCKFILE_HELPER_REQUEST=PASS
          echo HELPER_ONLY_MASTER_DELTA=PASS

      - name: Materialize exact package lock
        id: lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee artifacts/lockfile.log
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' 'package-lock.json' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          node - <<'NODE' 2>&1 | tee -a artifacts/lockfile.log
          const lock = require('./package-lock.json');
          if (lock.lockfileVersion !== 3) throw new Error('lockfileVersion must remain 3');
          if (lock.packages?.['']?.dependencies?.['@vercel/blob'] !== '2.6.1') {
            throw new Error('root @vercel/blob lock is not exact 2.6.1');
          }
          const pkg = lock.packages?.['node_modules/@vercel/blob'];
          if (pkg?.version !== '2.6.1') throw new Error('resolved @vercel/blob is not 2.6.1');
          console.log('ACCESS_PRIVATE_INTAKE_LOCKFILE_CONTRACT=PASS');
          NODE

      - name: Verify exact clean install
        id: npm_ci
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee artifacts/npm-ci.log

      - name: Verify typed private intake fixture
        id: fixture
        run: |
          set -euo pipefail
          npm run verify:access-private-intake 2>&1 | tee artifacts/fixture.log

      - name: Verify production build
        id: build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee artifacts/build.log

      - name: Commit only generated lockfile
        id: commit
        run: |
          set -euo pipefail
          git status --short | tee artifacts/git-status.log
          git diff --name-only | sort > /tmp/tracked-changed.txt
          printf '%s\n' 'package-lock.json' > /tmp/expected-tracked.txt
          diff -u /tmp/expected-tracked.txt /tmp/tracked-changed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --name-only | sort > /tmp/staged.txt
          diff -u /tmp/expected-tracked.txt /tmp/staged.txt
          git commit -m 'Access: lock private Blob dependency graph'
          git push origin HEAD:agent/bhrigu-first-external-request-durable-private-intake-v0-1

      - name: Record accepted materialization
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_HEAD=$(git rev-parse HEAD)
          LOCK_SHA256=$(sha256sum package-lock.json | awk '{print $1}')
          gh issue comment "${{ github.event.issue.number }}" --body "STATUS=PASS
          SOURCE_BASE_SHA=88a7c2b27652704cc089afb87bafae8b0a9dc4f1
          CURRENT_MASTER_SHA=${{ steps.source.outputs.current_master_sha }}
          TARGET_BRANCH=agent/bhrigu-first-external-request-durable-private-intake-v0-1
          PREVIOUS_HEAD_SHA=${{ steps.source.outputs.target_head_sha }}
          NEW_HEAD_SHA=$NEW_HEAD
          CHANGED_FILE=package-lock.json
          PACKAGE_LOCK_SHA256=$LOCK_SHA256
          NPM_CI=PASS
          ACCESS_PRIVATE_INTAKE_FIXTURE=PASS
          PRODUCTION_BUILD=PASS"
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-private-intake-lockfile-helper-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Record fail-closed phase diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          LOCKFILE_OUTCOME: ${{ steps.lockfile.outcome }}
          NPM_CI_OUTCOME: ${{ steps.npm_ci.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          {
            echo 'STATUS=FAIL_CLOSED'
            echo 'TARGET_BRANCH=agent/bhrigu-first-external-request-durable-private-intake-v0-1'
            echo 'TARGET_WRITE_PERFORMED=NO_OR_UNVERIFIED'
            echo "SOURCE_OUTCOME=$SOURCE_OUTCOME"
            echo "LOCKFILE_OUTCOME=$LOCKFILE_OUTCOME"
            echo "NPM_CI_OUTCOME=$NPM_CI_OUTCOME"
            echo "FIXTURE_OUTCOME=$FIXTURE_OUTCOME"
            echo "BUILD_OUTCOME=$BUILD_OUTCOME"
            echo "COMMIT_OUTCOME=$COMMIT_OUTCOME"
            for file in artifacts/lockfile.log artifacts/npm-ci.log artifacts/fixture.log artifacts/build.log artifacts/git-status.log; do
              if [ -f "$file" ]; then
                echo
                echo "DIAGNOSTIC_FILE=$(basename "$file")"
                tail -n 35 "$file" | sed -E 's/(TOKEN|API_KEY|AUTHORIZATION|SECRET)=[^[:space:]]+/\1=[REDACTED]/Ig'
              fi
            done
          } > artifacts/issue-diagnostic.txt
          gh issue comment "${{ github.event.issue.number }}" --body-file artifacts/issue-diagnostic.txt
