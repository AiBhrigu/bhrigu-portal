name: BTC Public Live Multi-Body Projection Apply

on:
  push:
    branches:
      - repair/btc-cosmographer-public-live-multi-body-usability-projection-v0-1
    paths:
      - .github/workflows/btc-public-live-multi-body-projection-apply.yml
      - scripts/apply-btc-public-live-multi-body-projection.py
      - scripts/verify-btc-public-live-copy-canon.mjs
  pull_request:
    paths:
      - .github/workflows/btc-public-live-multi-body-projection-apply.yml
      - scripts/apply-btc-public-live-multi-body-projection.py
      - scripts/verify-btc-public-live-copy-canon.mjs

permissions:
  contents: write

concurrency:
  group: btc-public-live-multi-body-projection-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-exact-projection:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: repair/btc-cosmographer-public-live-multi-body-usability-projection-v0-1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce accepted ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 75bd42151c02931260e7c9b30fc93a02d54ab763 HEAD

      - name: Detect complete copy-canon atom
        id: marker
        run: |
          if grep -q 'COPY_CANON_TARGETED_REPAIR_v0_1' scripts/apply-btc-public-live-multi-body-projection.py; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Copy-canon patch script not published yet; no repository mutation.'
          fi

      - name: Normalize exact patch helper
        if: steps.marker.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-btc-public-live-multi-body-projection.py')
          text = path.read_text(encoding='utf-8')
          old = '''def insert_after(path: str, anchor: str, addition: str) -> None:
              replace_once(path, anchor, anchor + addition)
          '''
          new = '''def insert_after(path: str, anchor: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(anchor)
              if count not in (1, 2):
                  raise SystemExit(f"{path}: expected one or two anchors, found {count}: {anchor[:120]!r}")
              file.write_text(text.replace(anchor, anchor + addition), encoding="utf-8")
          '''
          if text.count(old) != 1:
              raise SystemExit('apply helper source did not match exactly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply deterministic canonical copy patch
        if: steps.marker.outputs.ready == 'true'
        id: apply
        shell: bash
        run: |
          set +e
          python3 scripts/apply-btc-public-live-multi-body-projection.py > /tmp/copy-canon-apply.log 2>&1
          status=$?
          cat /tmp/copy-canon-apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit fail-closed apply diagnostic
        if: steps.marker.outputs.ready == 'true' && steps.apply.outputs.status != '0'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          {
            echo
            echo '## COPY_CANON_APPLY_DIAGNOSTIC'
            echo
            echo '```text'
            cat /tmp/copy-canon-apply.log
            echo '```'
          } >> docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_PR101_PUBLIC_LIVE_VISUAL_AND_INFORMATION_DESIGN_ACCEPTANCE_v0_1.md
          git add docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_PR101_PUBLIC_LIVE_VISUAL_AND_INFORMATION_DESIGN_ACCEPTANCE_v0_1.md
          git commit -m "CI: record exact copy-canon apply diagnostic"
          git push origin HEAD:repair/btc-cosmographer-public-live-multi-body-usability-projection-v0-1
          exit 1

      - name: Verify canonical copy before commit
        if: steps.marker.outputs.ready == 'true' && steps.apply.outputs.status == '0'
        run: node scripts/verify-btc-public-live-copy-canon.mjs

      - name: Commit exact canonical product copy repair
        if: steps.marker.outputs.ready == 'true' && steps.apply.outputs.status == '0'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/btc-public-live-multi-body-projection-pr.yml \
            .github/workflows/btc-public-live-visual-information-acceptance-pr.yml \
            components/btc/BtcCosmographerDialogue.tsx \
            pages/crypto-astro/btc/live.tsx \
            scripts/apply-btc-public-live-multi-body-projection.py \
            scripts/verify-btc-public-live-visual-information-acceptance.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No canonical copy changes to commit.'
            exit 0
          fi
          git commit -m "BTC: align public copy with product canon"
          git push origin HEAD:repair/btc-cosmographer-public-live-multi-body-usability-projection-v0-1
