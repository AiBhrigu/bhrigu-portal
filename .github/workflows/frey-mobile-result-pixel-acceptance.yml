name: Frey Mobile Result Pixel Acceptance

on:
  push:
    branches:
      - agent/frey-mobile-result-occlusion-repair-v0-1

permissions:
  contents: read

jobs:
  pixel-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove bounded product scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          mapfile -t changed < <(git diff --name-only origin/master...HEAD | grep -v '^.github/workflows/frey-mobile-result-pixel-acceptance.yml$')
          printf 'PRODUCT_CHANGED=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "pages/frey.js"
          grep -q '__FREY_MOBILE_RESULT_CONTAINMENT_AND_ACTION_ANCHOR_V0_1__' pages/frey.js

      - name: Build exact source
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install ephemeral Chromium acceptance runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Start exact production server
        shell: bash
        run: |
          set -euo pipefail
          (npx next start -p 4319 > /tmp/frey-next.log 2>&1 & echo $! > /tmp/frey-next.pid)
          for i in $(seq 1 45); do
            if curl -fsS 'http://127.0.0.1:4319/frey?lang=ru&q=Temporal%20Snapshot%20%C2%B7%202026-08-29&d=2026-08-29' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/frey-next.log
          exit 1

      - name: Measure RU EN narrow result geometry
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const widths = [390, 412, 628, 760, 1440];
          const locales = ['ru', 'en'];
          const failures = [];
          const report = [];
          const tolerance = 2;

          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const locale of locales) {
              for (const width of widths) {
                const height = width === 390 ? 844 : width === 412 ? 915 : width === 628 ? 1015 : width === 760 ? 1100 : 1200;
                const page = await browser.newPage({ viewport: { width, height } });
                const url = `http://127.0.0.1:4319/frey?lang=${locale}&q=Temporal%20Snapshot%20%C2%B7%202026-08-29&d=2026-08-29`;
                await page.goto(url, {waitUntil:'networkidle'});
                await page.waitForSelector('[data-frey-response-state="success"]');
                const m = await page.evaluate((tolerance) => {
                  const rect = (el) => el ? el.getBoundingClientRect() : null;
                  const within = (r) => !!r && r.left >= -tolerance && r.right <= window.innerWidth + tolerance;
                  const selectors = [
                    '.freyMembrane.isResult', '.freyConversationBlock', '.freyVoiceMinimal',
                    '.freyVoiceMinimalState', '.freyVoiceMinimalBridge', '.freyVoiceMinimalValue',
                    '.freyResultControls', '.freyGuideRoute'
                  ];
                  const elements = Object.fromEntries(selectors.map(sel => {
                    const nodes = [...document.querySelectorAll(sel)];
                    return [sel, nodes.map(el => ({
                      rect: rect(el),
                      clientWidth: el.clientWidth,
                      scrollWidth: el.scrollWidth,
                      withinViewport: within(rect(el)),
                      intrinsicOverflow: el.scrollWidth - el.clientWidth,
                      overflowWrap: getComputedStyle(el).overflowWrap,
                      wordBreak: getComputedStyle(el).wordBreak,
                    }))];
                  }));
                  const nav = document.querySelector('nav[data-prevnext="FREY_NAV_SINGLE_V0_4"]');
                  const action = document.querySelector('.freyResultControls');
                  const support = document.querySelector('[data-public-support-route="frey"]');
                  const navStyle = nav ? getComputedStyle(nav) : null;
                  const nr = rect(nav), ar = rect(action), sr = rect(support);
                  const intersects = (a,b) => !!a && !!b && Math.max(0, Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)) > 0 && Math.max(0, Math.min(a.right,b.right)-Math.max(a.left,b.left)) > 0;
                  return {
                    viewport: window.innerWidth,
                    htmlScrollWidth: document.documentElement.scrollWidth,
                    bodyScrollWidth: document.body.scrollWidth,
                    marker: document.querySelector('[data-frey-mobile-repair]')?.getAttribute('data-frey-mobile-repair') || null,
                    actionAnchor: getComputedStyle(action, '::before').content,
                    nav: nav ? { position: navStyle.position, width: nr.width, rect: nr, withinViewport: within(nr) } : null,
                    navIntersectsAction: intersects(nr, ar),
                    navIntersectsSupport: intersects(nr, sr),
                    elements,
                  };
                }, tolerance);

                const expectedStatic = width <= 760;
                const rowFails = [];
                if (m.marker !== '__FREY_MOBILE_RESULT_CONTAINMENT_AND_ACTION_ANCHOR_V0_1__') rowFails.push('marker');
                if (m.htmlScrollWidth > width + tolerance) rowFails.push(`htmlOverflow:${m.htmlScrollWidth-width}`);
                if (m.bodyScrollWidth > width + tolerance) rowFails.push(`bodyOverflow:${m.bodyScrollWidth-width}`);
                if (!m.nav || !m.nav.withinViewport) rowFails.push('navViewport');
                if (expectedStatic && m.nav.position !== 'static') rowFails.push(`navPosition:${m.nav.position}`);
                if (!expectedStatic && m.nav.position !== 'fixed') rowFails.push(`desktopNavPosition:${m.nav.position}`);
                if (expectedStatic && (m.navIntersectsAction || m.navIntersectsSupport)) rowFails.push('navIntersection');
                if (!String(m.actionAnchor).includes('Φ')) rowFails.push(`actionAnchor:${m.actionAnchor}`);
                for (const [sel, nodes] of Object.entries(m.elements)) {
                  for (const [i,node] of nodes.entries()) {
                    if (!node.withinViewport) rowFails.push(`${sel}[${i}]:viewport`);
                    if (['.freyVoiceMinimalState','.freyVoiceMinimalBridge','.freyVoiceMinimalValue'].includes(sel) && node.intrinsicOverflow > tolerance) {
                      rowFails.push(`${sel}[${i}]:intrinsicOverflow:${node.intrinsicOverflow}`);
                    }
                  }
                }
                report.push({locale,width,height,...m,failures:rowFails});
                if (rowFails.length) failures.push(`${locale}@${width}: ${rowFails.join(', ')}`);
                await page.screenshot({path:`/tmp/frey-${locale}-${width}.png`, fullPage:true});
                await page.close();
              }
            }
            await browser.close();
            fs.writeFileSync('/tmp/frey-pixel-report.json', JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.map(r=>({locale:r.locale,width:r.width,htmlScrollWidth:r.htmlScrollWidth,bodyScrollWidth:r.bodyScrollWidth,navPosition:r.nav?.position,navIntersectsAction:r.navIntersectsAction,navIntersectsSupport:r.navIntersectsSupport,failures:r.failures})),null,2));
            if (failures.length) {
              console.error('PIXEL_ACCEPTANCE=FAIL');
              console.error(failures.join('\n'));
              process.exit(1);
            }
            console.log('PIXEL_ACCEPTANCE=PASS');
            console.log('ZERO_HORIZONTAL_OVERFLOW=PASS');
            console.log('ZERO_MOBILE_NAV_OCCLUSION=PASS');
            console.log('ACTION_PHI_ANCHOR=PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frey-mobile-result-pixel-acceptance-${{ github.run_id }}
          path: |
            /tmp/frey-pixel-report.json
            /tmp/frey-*.png
            /tmp/frey-next.log
          if-no-files-found: warn
          retention-days: 7
