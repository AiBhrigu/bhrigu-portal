name: BHRIGU Home Canonical Visual Geometry Gate

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/bhrigu-home-canonical-visual-geometry-pr.yml"
      - "pages/_app.js"
      - "pages/_document.js"
      - "pages/index.js"
      - "pages/index.module.css"
      - "public/market-cosmographer-btc-field-hero-v0-2.svg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: http://127.0.0.1:3100

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Detect Home cosmographic scene authority
        shell: bash
        run: |
          if grep -Fq 'Φ COSMOGRAPHIC SCENE RESTORATION · DESKTOP PASS v0.1' pages/index.module.css; then
            echo 'BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE=true' >> "$GITHUB_ENV"
            echo 'HOME_GEOMETRY_AUTHORITY=COSMOGRAPHIC_SCENE'
          else
            echo 'BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE=false' >> "$GITHUB_ENV"
            echo 'HOME_GEOMETRY_AUTHORITY=LEGACY_MARKET'
          fi
      - name: Verify Home first-screen copy de-duplication
        if: env.BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '<p className={styles.product}>BHRIGU</p>' pages/index.js
          ! grep -Fq 'relationEquation:' pages/index.js
          ! grep -Fq '{copy.relationEquation}' pages/index.js
          ! grep -Fq '.relationEquation' pages/index.module.css
          echo 'HOME_FIRST_SCREEN_COPY_DEDUP=PASS'

      - name: Start exact-head preview
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run start -- -p 3100 > artifacts/home-visual-geometry-preview.log 2>&1 &
          echo $! > /tmp/home-visual-geometry.pid
          for attempt in {1..45}; do
            curl --fail --silent "$BASE/?lang=en" >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/home-visual-geometry-preview.log
          exit 1
      - name: Install visual driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2
      - name: Verify canonical geometry and first fold
        if: env.BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE != 'true'
        run: |
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base = os.environ["BASE"].rstrip("/")
          artifacts = Path("artifacts")
          report = {"checks": {}, "views": {}, "failures": []}
          def check(name, value, detail=None):
              ok = bool(value); report["checks"][name] = ok
              if not ok:
                  report["failures"].append(name)
                  if detail is not None: report.setdefault("detail", {})[name] = detail

          svg_path = Path("public/market-cosmographer-btc-field-hero-v0-2.svg")
          root = ET.parse(svg_path).getroot()
          viewbox = [float(v) for v in root.attrib["viewBox"].split()]
          expected_x = viewbox[0] + viewbox[2] / 2
          ns = {"svg": "http://www.w3.org/2000/svg"}
          btc_text = next(n for n in root.findall(".//svg:text", ns) if "".join(n.itertext()).strip() == "₿")
          svg_text = svg_path.read_text(encoding="utf-8")
          check("svg_core_true_50_axis", abs(float(btc_text.attrib["x"]) - expected_x) < 0.001)
          check("svg_no_embedded_phi", "Φ" not in svg_text)
          check("svg_future_agent_path_present", "FUTURE · AI AGENT ACCESS" in svg_text)
          check("svg_current_semantics_present", all(t in svg_text for t in ["EVIDENCE", "CHANGE", "CONDITIONS"]))

          options = Options(); options.add_argument("--headless=new"); options.add_argument("--no-sandbox"); options.add_argument("--disable-dev-shm-usage"); options.add_argument("--disable-gpu"); options.add_argument("--hide-scrollbars")
          driver = webdriver.Chrome(options=options)
          def rect(selector):
              return driver.execute_script("const e=document.querySelector(arguments[0]);if(!e)return null;const r=e.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};", selector)
          def font_sizes(selector):
              return driver.execute_script("return Array.from(document.querySelectorAll(arguments[0])).map(e=>({text:e.textContent.trim(),px:parseFloat(getComputedStyle(e).fontSize)}));", selector)
          def run_view(name, width, height):
              driver.set_window_size(width, height); driver.get(f"{base}/?lang=en")
              WebDriverWait(driver, 30).until(lambda d: d.find_element(By.ID, "home-title").is_displayed())
              viewport = driver.execute_script("return {width:innerWidth,height:innerHeight}")
              cta=rect("[data-primary-cta='btc-current-change-question']"); visual=rect("section[aria-labelledby='home-title'] > div:last-child"); canvas=rect("[data-btc-field-canvas]"); band=rect("[data-btc-accepted-state]"); phi=rect("section[aria-labelledby='home-title'] > div:last-child span")
              page_bg=driver.execute_script("return getComputedStyle(document.querySelector('main[data-primary-product=\"market-cosmographer\"]')).backgroundImage")
              sizes=font_sizes("[data-btc-accepted-state] span,[data-btc-accepted-state] strong")
              kicker=font_sizes("[data-btc-state-kicker]")
              labels=font_sizes("[data-btc-accepted-state] small")
              values=font_sizes("[data-btc-accepted-state] strong")
              footer=driver.execute_script("const f=document.getElementById('open-btc-field');return f?{tag:f.tagName,visible:!!(f.offsetWidth||f.offsetHeight||f.getClientRects().length),childText:Array.from(f.children).map(e=>e.textContent.trim())}:null;")
              no_overflow=driver.execute_script("return document.documentElement.scrollWidth <= window.innerWidth + 1")
              phi_count=driver.find_element(By.TAG_NAME,"body").text.count("Φ")
              driver.save_screenshot(str(artifacts/f"home-canonical-geometry-{name}.png"))
              report["views"][name]={"viewport":viewport,"cta":cta,"visual":visual,"canvas":canvas,"band":band,"phi":phi,"state_font_sizes":sizes,"kicker_font_sizes":kicker,"label_font_sizes":labels,"value_font_sizes":values,"footer":footer}
              check(f"{name}_no_horizontal_overflow", no_overflow, report["views"][name])
              check(f"{name}_one_visible_phi", phi_count==1, phi_count)
              check(f"{name}_state_band_outside_canvas", canvas and band and band["top"] >= canvas["bottom"]-1, {"canvas":canvas,"band":band})
              check(f"{name}_phi_centered_on_canvas", canvas and phi and abs((phi["left"]+phi["right"])/2-(canvas["left"]+canvas["right"])/2)<=1.5, {"canvas":canvas,"phi":phi})
              check(f"{name}_deep_grid_present", page_bg.count("linear-gradient")>=4, page_bg)
              check(f"{name}_semantic_footer_real_dom", footer and footer["tag"]=="FOOTER" and footer["visible"] and footer["childText"]==["BTC FIELD · MARKET COSMOGRAPHER","www.bhrigu.io"], footer)
              check(f"{name}_state_text_readable", all(x["px"]>=6.5 for x in sizes), sizes)
              if name=="desktop":
                  check("desktop_primary_cta_first_fold_900", cta and cta["top"]>=0 and cta["bottom"]<=viewport["height"], {"cta":cta,"viewport":viewport})
                  check("desktop_visual_not_clipped_by_fold", visual and visual["top"]>=0 and visual["bottom"]<=viewport["height"]+8, {"visual":visual,"viewport":viewport})
              if name=="mobile":
                  check("mobile_state_kicker_phi_floor", kicker and min(x["px"] for x in kicker)>=10.5, kicker)
                  check("mobile_state_labels_phi_floor", labels and min(x["px"] for x in labels)>=10.5, labels)
                  check("mobile_state_values_phi_floor", values and min(x["px"] for x in values)>=12.0, values)
          try:
              run_view("desktop",1440,900); run_view("mobile",390,844)
          finally: driver.quit()
          report["status"]="PASS" if not report["failures"] else "FAIL"
          (artifacts/"home-canonical-visual-geometry-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report["failures"]: raise SystemExit(f"HOME_CANONICAL_VISUAL_GEOMETRY=FAIL {report['failures']}")
          print("HOME_CANONICAL_VISUAL_GEOMETRY=PASS")
          PY
      - name: Verify cosmographic scene geometry and first fold
        if: env.BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base=os.environ["BASE"].rstrip("/")
          artifacts=Path("artifacts")
          report={"schema_version":"bhrigu_home_cosmographic_scene_geometry_v0_1","checks":{},"failures":[]}
          def check(name,value,detail=None):
              ok=bool(value); report["checks"][name]=ok
              if not ok:
                  report["failures"].append(name)
                  if detail is not None: report.setdefault("detail",{})[name]=detail

          options=Options()
          for arg in ("--headless=new","--no-sandbox","--disable-dev-shm-usage","--disable-gpu","--hide-scrollbars","--window-size=1440,1100"):
              options.add_argument(arg)
          driver=webdriver.Chrome(options=options)
          try:
              driver.set_window_size(1440,1100); driver.get(f"{base}/?lang=en")
              WebDriverWait(driver,30).until(lambda d:d.find_element(By.ID,"home-title").is_displayed())
              result=driver.execute_script("""
                const q=s=>document.querySelector(s);
                const rect=e=>{const r=e.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};};
                const relation=q('[data-home-relation]');
                const human=q('[data-relation-role="human-entry"]');
                const bridge=q('[data-relation-role="intelligence-bridge"]');
                const phi=q('[data-relation-role="phi-field"]');
                const ret=q('[data-relation-role="human-return"]');
                const stage=human.parentElement;
                return {
                  relation:rect(relation),human:rect(human),bridge:rect(bridge),phi:rect(phi),ret:rect(ret),
                  stageDisplay:getComputedStyle(stage).display,
                  humanPosition:getComputedStyle(human).position,
                  bridgePosition:getComputedStyle(bridge).position,
                  phiPosition:getComputedStyle(phi).position,
                  phiRadius:getComputedStyle(phi).borderRadius,
                  phiBorder:getComputedStyle(phi).borderTopWidth,
                  fieldBefore:getComputedStyle(relation,'::before').backgroundImage,
                  overflow:document.documentElement.scrollWidth-window.innerWidth,
                  viewport:{width:innerWidth,height:innerHeight},
                };
              """)
              check("one_continuous_field",len(driver.find_elements(By.CSS_SELECTOR,"[data-home-relation]"))==1)
              check("stage_is_spatial_not_grid",result["stageDisplay"]=="block",result)
              check("human_spatial_locus",result["humanPosition"]=="absolute",result)
              check("bridge_spatial_locus",result["bridgePosition"]=="absolute",result)
              check("phi_spatial_field",result["phiPosition"]=="absolute" and result["phiBorder"]=="0px",result)
              check("phi_field_not_rectangular","50%" in result["phiRadius"],result)
              check("field_depth_present",result["fieldBefore"]!="none",result)
              check("human_return_first_fold",result["ret"]["top"]>=0 and result["ret"]["bottom"]<=result["viewport"]["height"],result)
              check("relation_first_fold",result["relation"]["top"]>=0 and result["relation"]["bottom"]<=result["viewport"]["height"]+8,result)
              check("no_horizontal_overflow",result["overflow"]<=1,result)
              driver.save_screenshot(str(artifacts/"home-cosmographic-scene-geometry-desktop.png"))
          finally:
              driver.quit()
          report["status"]="PASS" if not report["failures"] else "FAIL"
          (artifacts/"home-cosmographic-scene-geometry-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report["failures"]:
              raise SystemExit("HOME_COSMOGRAPHIC_SCENE_GEOMETRY=FAIL "+repr(report["failures"]))
          print("HOME_COSMOGRAPHIC_SCENE_GEOMETRY=PASS")
          PY
      - name: Verify decoupled Home modules in four viewports
        if: env.BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base = os.environ["BASE"].rstrip("/")
          artifacts = Path("artifacts")
          report = {
              "schema_version": "bhrigu_home_decoupled_market_modules_v0_1",
              "checks": {},
              "views": {},
              "failures": [],
          }

          def check(name, value, detail=None):
              ok = bool(value)
              report["checks"][name] = ok
              if not ok:
                  report["failures"].append(name)
                  if detail is not None:
                      report.setdefault("detail", {})[name] = detail

          options = Options()
          for arg in ("--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--hide-scrollbars"):
              options.add_argument(arg)
          options.set_capability("goog:loggingPrefs", {"browser": "ALL"})
          driver = webdriver.Chrome(options=options)

          def run_view(name, width, height, locale):
              driver.set_window_size(width, height)
              driver.get(f"{base}/?lang={locale}")
              WebDriverWait(driver, 30).until(
                  lambda current: current.find_element(By.CSS_SELECTOR, "[data-home-bitcoin-module]").is_displayed()
              )
              result = driver.execute_script(r"""
                const q = (s, root=document) => root.querySelector(s);
                const qa = (s, root=document) => Array.from(root.querySelectorAll(s));
                const rect = (e) => { const r=e.getBoundingClientRect(); return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}; };
                const hero = q('section[aria-labelledby="home-title"]');
                const architecture = q('[data-home-application-architecture]');
                const bitcoin = q('[data-home-bitcoin-module]');
                const roles = q('[data-home-system-role-module]');
                const map = q('[data-home-system-map]');
                const proof = q('[data-home-btc-proof-object]');
                const proofGrid = q('[data-home-btc-proof-object] > div:last-child');
                const plate = q('[data-home-locked-scene-plate]');
                const roleNodes = qa('[data-system-node]', roles).map((e) => e.dataset.systemNode);
                const bitcoinNodes = qa('[data-system-node]', bitcoin).map((e) => e.dataset.systemNode);
                const audited = [architecture,bitcoin,roles,map,proof,...qa('[data-system-node]',architecture)].filter(Boolean);
                const clipping = audited.map((e) => ({
                  key:e.dataset.homeBitcoinModule!==undefined?'bitcoin':e.dataset.homeSystemRoleModule!==undefined?'roles':e.dataset.homeSystemMap!==undefined?'map':e.dataset.homeBtcProofObject!==undefined?'proof':e.dataset.systemNode||e.tagName,
                  horizontal:e.scrollWidth-e.clientWidth,
                  vertical:e.scrollHeight-e.clientHeight,
                  overflowX:getComputedStyle(e).overflowX,
                  overflowY:getComputedStyle(e).overflowY,
                }));
                const br=rect(bitcoin), rr=rect(roles), mr=rect(map), pr=rect(proof), ar=rect(architecture);
                const overlapWidth=Math.max(0,Math.min(br.right,rr.right)-Math.max(br.left,rr.left));
                const overlapHeight=Math.max(0,Math.min(br.bottom,rr.bottom)-Math.max(br.top,rr.top));
                return {
                  locale:document.documentElement.lang,
                  heroModules:qa('[data-home-bitcoin-module],[data-home-system-role-module],[data-home-system-map],[data-home-btc-proof-object]',hero).length,
                  architectureCount:qa('[data-home-application-architecture]').length,
                  bitcoinCount:qa('[data-home-bitcoin-module]').length,
                  rolesCount:qa('[data-home-system-role-module]').length,
                  plateCount:qa('[data-home-locked-scene-plate]').length,
                  plateSha:plate?.dataset.scenePlateSha256||null,
                  bitcoinContainsMap:bitcoin.contains(map),
                  bitcoinContainsProof:bitcoin.contains(proof),
                  rolesContainsProof:roles.contains(proof),
                  bitcoinNodes, roleNodes,
                  proofCells:proofGrid?proofGrid.children.length:0,
                  mapBeforeProof:mr.bottom<=pr.top+1,
                  proofInsideBitcoin:pr.left>=br.left-1&&pr.right<=br.right+1&&pr.bottom<=br.bottom+1,
                  architectureContainsBoth:architecture.contains(bitcoin)&&architecture.contains(roles),
                  modulesOverlap:overlapWidth*overlapHeight,
                  mobileStacked:rr.top>=br.bottom-1,
                  noHorizontalOverflow:document.documentElement.scrollWidth<=innerWidth+1,
                  clipping,
                  rects:{architecture:ar,bitcoin:br,roles:rr,map:mr,proof:pr},
                  routes:qa('[data-system-node]',architecture).map((e)=>({node:e.dataset.systemNode,href:e.getAttribute('href')})),
                  errorOverlay:!!q('nextjs-portal,[data-nextjs-dialog-overlay]'),
                };
              """)
              severe = [
                  entry for entry in driver.get_log("browser")
                  if entry.get("level") == "SEVERE"
                  and "favicon.ico" not in entry.get("message", "").lower()
                  and "/api/btc/observability/v1/event" not in entry.get("message", "")
              ]
              result["severeErrors"] = severe
              report["views"][name] = result

              prefix = name
              check(f"{prefix}_language", result["locale"] == locale, result)
              check(f"{prefix}_hero_is_pure", result["heroModules"] == 0, result)
              check(f"{prefix}_one_architecture", result["architectureCount"] == 1, result)
              check(f"{prefix}_one_bitcoin_module", result["bitcoinCount"] == 1, result)
              check(f"{prefix}_one_role_module", result["rolesCount"] == 1, result)
              check(f"{prefix}_locked_plate_single", result["plateCount"] == 1 and result["plateSha"] == "e5759306a81435f6646d1a9aa99bd693a28d76472107117049e2e5c33a89b3c2", result)
              check(f"{prefix}_bitcoin_coherent", result["bitcoinContainsMap"] and result["bitcoinContainsProof"] and result["bitcoinNodes"] == ["btc"], result)
              check(f"{prefix}_accepted_state_at_bottom", result["mapBeforeProof"] and result["proofInsideBitcoin"] and result["proofCells"] == 3, result)
              check(f"{prefix}_roles_separate", not result["rolesContainsProof"] and result["roleNodes"] == ["frey", "cosmographer", "orion"], result)
              check(f"{prefix}_modules_independent", result["architectureContainsBoth"] and result["modulesOverlap"] == 0, result)
              check(f"{prefix}_responsive_order", width > 840 or result["mobileStacked"], result)
              check(f"{prefix}_no_horizontal_overflow", result["noHorizontalOverflow"], result)
              check(f"{prefix}_no_clipping", all(item["horizontal"] <= 1 and item["vertical"] <= 1 for item in result["clipping"]), result["clipping"])
              check(f"{prefix}_routes_preserved", result["routes"] == [
                  {"node":"btc","href":f"/crypto-astro/btc?lang={locale}"},
                  {"node":"frey","href":f"/frey?lang={locale}"},
                  {"node":"cosmographer","href":f"/cosmographer?lang={locale}"},
                  {"node":"orion","href":f"/orion?lang={locale}"},
              ], result["routes"])
              check(f"{prefix}_no_error_overlay", not result["errorOverlay"], result)
              check(f"{prefix}_console_clean", not severe, severe)

              driver.execute_script("window.scrollTo(0,0)")
              driver.save_screenshot(str(artifacts / f"home-decoupled-{name}-hero.png"))
              driver.execute_script("document.querySelector('[data-home-application-architecture]').scrollIntoView({block:'start'})")
              driver.save_screenshot(str(artifacts / f"home-decoupled-{name}-modules.png"))

          try:
              run_view("desktop-en", 1440, 1100, "en")
              run_view("desktop-ru", 1440, 1100, "ru")
              run_view("mobile-en", 390, 844, "en")
              run_view("mobile-ru", 390, 844, "ru")
          finally:
              driver.quit()

          report["status"] = "PASS" if not report["failures"] else "FAIL"
          (artifacts / "home-decoupled-market-modules-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["failures"]:
              raise SystemExit("HOME_DECOUPLED_MARKET_MODULES=FAIL " + repr(report["failures"]))
          print("HOME_DECOUPLED_MARKET_MODULES=PASS")
          PY
      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/home-visual-geometry.pid; then kill "$(cat /tmp/home-visual-geometry.pid)" || true; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhrigu-home-canonical-visual-geometry-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
