name: BTC Clean Chat V1 PR

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/verify-btc-public-acceptance-scope.py'
      - '.github/workflows/btc-clean-chat-v1-pr.yml'
      - 'ui/btc/BtcCleanChatV1.tsx'
      - 'lib/btc-clean-chat-v1.ts'
      - 'lib/btc-clean-chat-model-runtime.ts'
      - 'lib/btc-astro-field-client.ts'
      - 'lib/btc-polymarket-expectation.ts'
      - 'lib/btc-protocol-evidence.ts'
      - 'pages/api/btc/clean-chat-v1.ts'
      - 'pages/api/btc/observability/v1/event.ts'
      - 'pages/api/btc/observability/v1/summary.ts'
      - 'pages/api/donation/session/index.ts'
      - 'lib/btc-observability-client.ts'
      - 'lib/btc-observability-contract.ts'
      - 'lib/btc-observability-neon.ts'
      - 'lib/btc-observability-server.ts'
      - 'migrations/20260822_btc_observability_v1.sql'
      - 'tests/btc-observability-v1-acceptance.ts'
      - 'scripts/btc-direct-payment-fresh-db-migration.ts'
      - 'components/btc/BtcDonationSessionPreview.jsx'
      - 'pages/support.js'
      - 'pages/crypto-astro/btc/clean-chat.tsx'
      - 'tests/btc-clean-chat-v1-acceptance.ts'
      - 'tests/btc-clean-chat-pending-state-acceptance.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-chat-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BTC_CLEAN_CHAT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BTC_CLEAN_CHAT_PREVIEW_BASE: http://127.0.0.1:3000
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Exact implementation boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${GITHUB_BASE_REF}"
          mapfile -t actual < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | sort)
          expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "ui/btc/BtcCleanChatV1.tsx"
            "lib/btc-clean-chat-v1.ts"
            "lib/btc-clean-chat-model-runtime.ts"
            "lib/btc-astro-field-client.ts"
            "lib/btc-polymarket-expectation.ts"
            "lib/btc-protocol-evidence.ts"
            "pages/api/btc/clean-chat-v1.ts"
            "pages/crypto-astro/btc/clean-chat.tsx"
            "tests/btc-clean-chat-v1-acceptance.ts"
          )
          link_expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            ".github/workflows/bhrigu-home-market-cosmographer-pr.yml"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "components/btc/BtcBinanceCurrentVenue.tsx"
            "components/btc/BtcHeroQuestionLaunch.tsx"
            "components/btc/BtcQuestionMembrane.tsx"
            "pages/crypto-astro/btc.tsx"
            "pages/crypto-astro/btc/clean-chat.tsx"
            "pages/index.js"
            "scripts/verify-btc-public-acceptance-two-screen.py"
            "tests/btc-clean-chat-link-canonicalization-acceptance.ts"
          )
          pending_expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "tests/btc-clean-chat-pending-state-acceptance.ts"
            "ui/btc/BtcCleanChatV1.tsx"
          )
          traffic_expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "ui/btc/BtcCleanChatV1.tsx"
          )
          support_expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            "components/btc/BtcDonationSessionPreview.jsx"
            "pages/support.js"
            "tests/btc-donation-session-acceptance.ts"
          )
          support_ci_authority_repair_expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "components/btc/BtcDonationSessionPreview.jsx"
            "pages/support.js"
            "tests/btc-donation-session-acceptance.ts"
          )
          polymarket_recertification_expected=(
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "lib/btc-clean-chat-model-runtime.ts"
            "lib/btc-polymarket-expectation.ts"
            "tests/btc-clean-chat-v1-acceptance.ts"
          )
          polymarket_query_binding_expected=(
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "lib/btc-clean-chat-model-runtime.ts"
            "tests/btc-clean-chat-v1-acceptance.ts"
          )
          research_field_preview_expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            ".github/workflows/btc-research-field-v1-preview-pr.yml"
            "lib/btc-clean-chat-model-runtime.ts"
            "lib/btc-research-field-config.ts"
            "lib/btc-research-field-neon.ts"
            "lib/btc-research-field-v1.ts"
            "tests/fixtures/btc-research-field-v1-preview-schema.sql"
            "package.json"
            "pages/api/btc/research-field/v1/_auth.ts"
            "pages/api/btc/research-field/v1/activate-preview.ts"
            "pages/api/btc/research-field/v1/chat.ts"
            "pages/api/btc/research-field/v1/checkpoint.ts"
            "pages/api/btc/research-field/v1/create.ts"
            "pages/api/btc/research-field/v1/session.ts"
            "pages/api/btc/research-field/v1/state.ts"
            "pages/crypto-astro/btc/field/[fieldId].tsx"
            "scripts/btc-research-field-preview-seed.ts"
            "tests/btc-research-field-v1-acceptance.ts"
          )
          observability_expected=(
            ".github/scripts/verify-btc-public-acceptance-scope.py"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "components/btc/BtcDonationSessionPreview.jsx"
            "lib/btc-observability-client.ts"
            "lib/btc-observability-contract.ts"
            "lib/btc-observability-neon.ts"
            "lib/btc-observability-server.ts"
            "migrations/20260822_btc_observability_v1.sql"
            "pages/api/btc/clean-chat-v1.ts"
            "pages/api/btc/observability/v1/event.ts"
            "pages/api/btc/observability/v1/summary.ts"
            "pages/api/donation/session/index.ts"
            "pages/support.js"
            "scripts/btc-direct-payment-fresh-db-migration.ts"
            "tests/btc-observability-v1-acceptance.ts"
            "ui/btc/BtcCleanChatV1.tsx"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t link_expected_sorted < <(printf '%s\n' "${link_expected[@]}" | sort)
          mapfile -t pending_expected_sorted < <(printf '%s\n' "${pending_expected[@]}" | sort)
          mapfile -t traffic_expected_sorted < <(printf '%s\n' "${traffic_expected[@]}" | sort)
          mapfile -t support_expected_sorted < <(printf '%s\n' "${support_expected[@]}" | sort)
          mapfile -t support_ci_authority_repair_expected_sorted < <(printf '%s\n' "${support_ci_authority_repair_expected[@]}" | sort)
          mapfile -t polymarket_recertification_expected_sorted < <(printf '%s\n' "${polymarket_recertification_expected[@]}" | sort)
          mapfile -t polymarket_query_binding_expected_sorted < <(printf '%s\n' "${polymarket_query_binding_expected[@]}" | sort)
          mapfile -t observability_expected_sorted < <(printf '%s\n' "${observability_expected[@]}" | sort)
          mapfile -t research_field_preview_expected_sorted < <(printf '%s\n' "${research_field_preview_expected[@]}" | sort)
          if diff -q <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_CLEAN_CHAT_V1_RELEASE_REPAIR_EXACT_11_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${link_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_PUBLIC_LINK_CANONICALIZATION_EXACT_11_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${pending_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_CLEAN_CHAT_PENDING_STATE_EXACT_4_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${traffic_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_CLEAN_CHAT_TRAFFIC_RETENTION_EXACT_3_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${support_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_SUPPORT_PHI_STRUCTURED_CYBERPUNK_EXACT_4_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${support_ci_authority_repair_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_SUPPORT_PHI_CI_AUTHORITY_REPAIR_EXACT_5_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${polymarket_recertification_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_POLYMARKET_RECERTIFICATION_EXACT_4_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${polymarket_query_binding_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_POLYMARKET_QUERY_BINDING_EXACT_3_FILE_SCOPE"
            if git diff "origin/${GITHUB_BASE_REF}...HEAD" -- lib/btc-clean-chat-model-runtime.ts | grep -q 'dedupeBtcCleanSourcesFirstRanked'; then
              echo "PASS_BTC_POLYMARKET_SOURCE_ROW_DEDUP_EXACT_3_FILE_SCOPE"
            fi
          elif diff -q <(printf '%s\n' "${observability_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_OBSERVABILITY_V1_EXACT_16_FILE_SCOPE"
          elif diff -q <(printf '%s\n' "${research_field_preview_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_RESEARCH_FIELD_V1_PREVIEW_EXACT_19_FILE_SCOPE"
          else
            diff -u <(printf '%s\n' "${link_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
            exit 1
          fi
      - run: npm ci
      - name: Direct OpenAI architecture acceptance
        run: node --import tsx tests/btc-clean-chat-v1-acceptance.ts
      - name: Pending-state and client-timeout acceptance
        run: node --import tsx tests/btc-clean-chat-pending-state-acceptance.ts
      - name: Privacy-safe observability acceptance
        run: node --import tsx tests/btc-observability-v1-acceptance.ts
      - name: Traffic-retention copy attribution acceptance
        shell: bash
        run: |
          node --import tsx - <<'NODE'
          const module = await import('./ui/btc/BtcCleanChatV1.tsx');
          const { buildCleanChatCopyText } = module.default ?? module;
          const canonical = 'https://www.bhrigu.io/crypto-astro/btc/clean-chat';
          const answer = 'Synthetic Cosmographer answer.';
          const en = buildCleanChatCopyText('en', answer, 'assistant');
          const ru = buildCleanChatCopyText('ru', answer, 'assistant');
          if (en !== `${answer}\n\nSource: BHRIGU BTC Cosmographer\n${canonical}`) throw new Error(`EN attribution mismatch: ${en}`);
          if (ru !== `${answer}\n\nИсточник: BHRIGU BTC Cosmographer\n${canonical}`) throw new Error(`RU attribution mismatch: ${ru}`);
          if (buildCleanChatCopyText('en', 'user text', 'user') !== 'user text') throw new Error('User copy must remain unmodified');
          console.log('PASS_BTC_CLEAN_CHAT_COPY_ATTRIBUTION');
          NODE
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          BHRIGU_BINANCE_PUBLIC_PRODUCTION_ENABLE: '0'
          BHRIGU_BINANCE_PUBLIC_BINDING_DISABLE: '0'
        run: npx next build
      - name: Start exact-head local Preview shell
        shell: bash
        run: |
          npm run start -- -p 3000 >/tmp/btc-clean-chat-v1.log 2>&1 &
          echo $! >/tmp/btc-clean-chat-v1.pid
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --max-time 10 "${BTC_CLEAN_CHAT_PREVIEW_BASE}/crypto-astro/btc/clean-chat?lang=en" || true)"
            if printf '%s' "$html" | grep -q "name=\"btc-deployment-source-sha\" content=\"${BTC_CLEAN_CHAT_HEAD_SHA}\""; then
              echo "EXACT_HEAD_LOCAL_PREVIEW=PASS ${BTC_CLEAN_CHAT_HEAD_SHA}"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/btc-clean-chat-v1.log
          exit 1
      - name: Install browser driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2
      - name: RU EN desktop mobile clean-shell acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base = os.environ["BTC_CLEAN_CHAT_PREVIEW_BASE"].rstrip("/")
          opts = webdriver.ChromeOptions()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 60)

          try:
              cases = [("en", 1440, 1000), ("ru", 1440, 1000), ("en", 390, 844), ("ru", 390, 844)]
              for lang, width, height in cases:
                  driver.set_window_size(width, height)
                  driver.get(f"{base}/crypto-astro/btc/clean-chat?lang={lang}")
                  wait.until(EC.presence_of_element_located((By.ID, "btc-clean-question")))
                  assert driver.execute_script("return document.documentElement.scrollWidth <= window.innerWidth + 2"), "horizontal overflow"
                  assert driver.find_element(By.CSS_SELECTOR, ".cleanComposer").is_displayed()
                  assert driver.find_element(By.CSS_SELECTOR, ".cleanWelcome").is_displayed()
                  support = driver.find_element(By.CSS_SELECTOR, '[data-clean-support-glyph="bitcoin"]')
                  assert support.is_displayed(), "quiet Bitcoin support glyph hidden"
                  assert support.text.strip() == "₿", support.text
                  assert support.get_attribute("href").endswith(f"/support?lang={lang}"), support.get_attribute("href")
                  assert support.get_attribute("aria-label"), "support glyph needs an accessible label"
                  assert not driver.find_elements(By.CSS_SELECTOR, 'a[href^="bitcoin:"]'), "raw Bitcoin payment URI exposed in Clean Chat navigation"
                  assert not driver.find_elements(By.CSS_SELECTOR, ".cleanExampleRow button"), "prepared question buttons visible"

                  copy_turn = [{
                      "id": "traffic-copy-probe",
                      "user": "User copy probe",
                      "assistant": "Synthetic Cosmographer answer.",
                      "topic": "probe",
                      "asOf": None,
                      "sources": [],
                  }]
                  storage_key = f"bhrigu:btc-clean-chat-v1:{lang}"
                  driver.execute_script("sessionStorage.setItem(arguments[0], arguments[1])", storage_key, json.dumps(copy_turn))
                  driver.refresh()
                  assistant_copy = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-copy-subject="assistant"]')))
                  clipboard_override = driver.execute_script("""
                    try {
                      window.__btcCopiedText = null;
                      Object.defineProperty(navigator, 'clipboard', { configurable: true, value: { writeText: async (text) => { window.__btcCopiedText = text; } } });
                      return typeof navigator.clipboard.writeText === 'function';
                    } catch (error) { return String(error); }
                  """)
                  assert clipboard_override is True, clipboard_override
                  assert assistant_copy.get_attribute("data-copy-attribution") == "bhrigu-btc-cosmographer"
                  assistant_copy.click()
                  copied = wait.until(lambda current: current.execute_script("return window.__btcCopiedText"))
                  source_label = "Источник" if lang == "ru" else "Source"
                  expected_copy = f"Synthetic Cosmographer answer.\n\n{source_label}: BHRIGU BTC Cosmographer\nhttps://www.bhrigu.io/crypto-astro/btc/clean-chat"
                  assert copied == expected_copy, copied
                  driver.execute_script("window.__btcCopiedText = null")
                  driver.find_element(By.CSS_SELECTOR, '[data-copy-subject="user"]').click()
                  copied_user = wait.until(lambda current: current.execute_script("return window.__btcCopiedText"))
                  assert copied_user == "User copy probe", copied_user
                  driver.execute_script("sessionStorage.clear()")
                  driver.get(f"{base}/crypto-astro/btc/clean-chat?lang={lang}")
                  wait.until(EC.presence_of_element_located((By.ID, "btc-clean-question")))

                  for selector in ['header[data-hdr="BHRIGU_BTC_FIELD_HEADER_V0_1"]', 'nav[data-pn-root="PORTAL_PREVNEXT_V0_2"]']:
                      for node in driver.find_elements(By.CSS_SELECTOR, selector):
                          assert not node.is_displayed(), f"legacy chrome visible: {selector}"
                  driver.save_screenshot(f"/tmp/btc-clean-chat-{lang}-{width}.png")

                  driver.execute_script("window.fetch = () => new Promise(() => {})")
                  question = driver.find_element(By.ID, "btc-clean-question")
                  question.send_keys("pending state probe")
                  driver.find_element(By.CSS_SELECTOR, ".cleanComposer button[type='submit']").click()
                  pending = wait.until(EC.visibility_of_element_located((By.CSS_SELECTOR, '[data-pending-state="evidence"]')))
                  expected_pending = "Собираю evidence…" if lang == "ru" else "Gathering evidence…"
                  assert pending.text.strip().startswith(expected_pending), pending.text
                  assert pending.get_attribute("role") == "status"
                  assert pending.get_attribute("aria-live") == "polite"
                  role = driver.find_element(By.CSS_SELECTOR, ".cleanAssistant .cleanCosmographerRole")
                  role_text = " ".join(role.text.split()).upper()
                  assert role_text.endswith("COSMOGRAPHER"), role_text
                  assert "EVIDENCE" not in role_text and "..." not in role_text and "…" not in role_text, role_text
                  if width > 680:
                      assert driver.execute_script("return arguments[0].scrollWidth <= arguments[0].clientWidth", role), "Cosmographer role overflows its desktop column"
                  assert driver.execute_script("return document.documentElement.scrollWidth <= window.innerWidth + 2"), "pending horizontal overflow"
                  driver.save_screenshot(f"/tmp/btc-clean-chat-pending-{lang}-{width}.png")
                  driver.execute_script("window.sessionStorage.clear()")
              print("CLEAN_SHELL_RU_EN=PASS")
              print("CLEAN_SHELL_DESKTOP_MOBILE=PASS")
              print("PREPARED_QUESTION_UI=ZERO")
          finally:
              driver.quit()
          PY
      - name: Stop exact-head local Preview
        if: always()
        shell: bash
        run: |
          if test -f /tmp/btc-clean-chat-v1.pid; then kill "$(cat /tmp/btc-clean-chat-v1.pid)" || true; fi
      - name: Upload clean-shell visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-clean-chat-v1-shell-${{ env.BTC_CLEAN_CHAT_HEAD_SHA }}
          path: |
            /tmp/btc-clean-chat-*.png
            /tmp/btc-clean-chat-v1.log
          if-no-files-found: warn
          retention-days: 30
