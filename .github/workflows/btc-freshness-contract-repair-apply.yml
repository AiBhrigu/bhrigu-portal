name: BTC Freshness Contract Repair Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/btc-freshness-contract-repair-apply.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btc-freshness-contract-repair-apply
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'repair/btc-freshness-contract-24h-v0-1' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.user.login == 'AiBhrigu' &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/btc-freshness-contract-24h-v0-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify exact immutable base
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "REPLACE_WITH_HELPER_MASTER_SHA"
          test "$(git merge-base HEAD origin/master)" = "REPLACE_WITH_HELPER_MASTER_SHA"
          test "$(git diff --name-only origin/master...HEAD)" = ".github/workflows/btc-freshness-contract-repair-apply.yml"

      - name: Apply exact single-source freshness repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          contract_id = "btc_market_snapshot_freshness_24h_168h_v0_1"

          contract_path = Path("lib/btc-freshness-contract.ts")
          contract_lines = [
              f'export const BTC_MARKET_SNAPSHOT_FRESHNESS_CONTRACT_ID = "{contract_id}" as const;',
              "export const BTC_MARKET_SNAPSHOT_FRESH_HOURS = 24 as const;",
              "export const BTC_MARKET_SNAPSHOT_OPERATIONAL_BREACH_HOURS = 48 as const;",
              "export const BTC_MARKET_SNAPSHOT_LEGACY_72H_PROBE_HOURS = 72 as const;",
              "export const BTC_MARKET_SNAPSHOT_UNAVAILABLE_AFTER_HOURS = 168 as const;",
              "export const BTC_MARKET_SNAPSHOT_FUTURE_TOLERANCE_SECONDS = 300 as const;",
              "",
              'export type BtcMarketSnapshotFreshnessState = "FRESH" | "STALE_LIMITED" | "UNAVAILABLE";',
              'export type BtcMarketSnapshotFreshnessReason = "OK" | "INVALID_TIMESTAMP" | "FUTURE_TIMESTAMP" | "TOO_OLD";',
              "",
              "export type BtcMarketSnapshotFreshnessResult = {",
              "  state: BtcMarketSnapshotFreshnessState;",
              "  ageHours: number;",
              "  reason: BtcMarketSnapshotFreshnessReason;",
              "};",
              "",
              "export function classifyBtcMarketSnapshotFreshness(",
              "  generatedAt: string,",
              "  now = new Date(),",
              "): BtcMarketSnapshotFreshnessResult {",
              "  const generatedMs = new Date(generatedAt).getTime();",
              "  const ageMs = now.getTime() - generatedMs;",
              "  if (!Number.isFinite(generatedMs) || !Number.isFinite(ageMs)) {",
              '    return { state: "UNAVAILABLE", ageHours: Number.NaN, reason: "INVALID_TIMESTAMP" };',
              "  }",
              "  const rawAgeHours = ageMs / 3_600_000;",
              "  if (ageMs < -BTC_MARKET_SNAPSHOT_FUTURE_TOLERANCE_SECONDS * 1000) {",
              '    return { state: "UNAVAILABLE", ageHours: rawAgeHours, reason: "FUTURE_TIMESTAMP" };',
              "  }",
              "  const ageHours = Math.max(0, rawAgeHours);",
              "  if (ageHours <= BTC_MARKET_SNAPSHOT_FRESH_HOURS) {",
              '    return { state: "FRESH", ageHours, reason: "OK" };',
              "  }",
              "  if (ageHours <= BTC_MARKET_SNAPSHOT_UNAVAILABLE_AFTER_HOURS) {",
              '    return { state: "STALE_LIMITED", ageHours, reason: "OK" };',
              "  }",
              '  return { state: "UNAVAILABLE", ageHours, reason: "TOO_OLD" };',
              "}",
          ]
          contract_path.write_text("\n".join(contract_lines) + "\n", encoding="utf-8")

          static_path = Path("lib/btc-public-static-source.ts")
          static = static_path.read_text(encoding="utf-8")
          import_anchor = '} from "./btc-public-output-contract";\n\n'
          assert static.count(import_anchor) == 1
          static = static.replace(
              import_anchor,
              import_anchor + 'import { classifyBtcMarketSnapshotFreshness } from "./btc-freshness-contract";\n\n',
              1,
          )
          constants = "const FUTURE_TOLERANCE_SECONDS = 300;\nconst FRESH_HOURS = 24;\nconst STALE_LIMITED_HOURS = 24 * 7;\n"
          assert static.count(constants) == 1
          static = static.replace(constants, "", 1)
          old_determine = "export function determineFreshness(generatedAt: string, now = new Date()): { state: FreshnessState; ageHours: number } {\n  const generatedMs = new Date(generatedAt).getTime();\n  const ageMs = now.getTime() - generatedMs;\n  if (!Number.isFinite(generatedMs) || !Number.isFinite(ageMs) || ageMs < -FUTURE_TOLERANCE_SECONDS * 1000) {\n    return { state: \"UNAVAILABLE\", ageHours: Number.NaN };\n  }\n  const ageHours = Math.max(0, ageMs / 3600000);\n  if (ageHours <= FRESH_HOURS) return { state: \"FRESH\", ageHours };\n  if (ageHours <= STALE_LIMITED_HOURS) return { state: \"STALE_LIMITED\", ageHours };\n  return { state: \"UNAVAILABLE\", ageHours };\n}\n"
          new_determine = "export function determineFreshness(generatedAt: string, now = new Date()): { state: FreshnessState; ageHours: number } {\n  const freshness = classifyBtcMarketSnapshotFreshness(generatedAt, now);\n  return { state: freshness.state, ageHours: freshness.ageHours };\n}\n"
          assert static.count(old_determine) == 1
          static = static.replace(old_determine, new_determine, 1)
          static_path.write_text(static, encoding="utf-8")

          envelope_path = Path("lib/btc-market-envelope.ts")
          envelope = envelope_path.read_text(encoding="utf-8")
          assert envelope.startswith("export const PHI_CONSTANT")
          envelope = 'import { classifyBtcMarketSnapshotFreshness } from "./btc-freshness-contract";\n\n' + envelope
          old_age = "  const ageHours =\n    (now.getTime() - new Date(generatedAt as string).getTime()) / 3_600_000;\n  if (!Number.isFinite(ageHours) || ageHours < -0.084) {\n    return fail(\n      \"source_incompatible\",\n      \"Accepted timestamp is invalid or in the future.\",\n      generatedAt as string,\n    );\n  }\n  if (ageHours > 168) {\n    return fail(\n      \"snapshot_too_old\",\n      \"Accepted snapshot is outside the seven-day boundary.\",\n      generatedAt as string,\n    );\n  }\n"
          new_age = "  const freshness = classifyBtcMarketSnapshotFreshness(\n    generatedAt as string,\n    now,\n  );\n  if (\n    freshness.reason === \"INVALID_TIMESTAMP\" ||\n    freshness.reason === \"FUTURE_TIMESTAMP\"\n  ) {\n    return fail(\n      \"source_incompatible\",\n      \"Accepted timestamp is invalid or in the future.\",\n      generatedAt as string,\n    );\n  }\n  if (freshness.state === \"UNAVAILABLE\") {\n    return fail(\n      \"snapshot_too_old\",\n      \"Accepted snapshot is outside the seven-day boundary.\",\n      generatedAt as string,\n    );\n  }\n  const ageHours = freshness.ageHours;\n"
          assert envelope.count(old_age) == 1
          envelope = envelope.replace(old_age, new_age, 1)
          old_state = '    source_freshness: ageHours <= 72 ? "FRESH" : "STALE_LIMITED",\n'
          assert envelope.count(old_state) == 1
          envelope = envelope.replace(old_state, '    source_freshness: freshness.state,\n', 1)
          envelope_path.write_text(envelope, encoding="utf-8")

          source_test_path = Path("tests/btc-source-contract-fixture.ts")
          source_test = source_test_path.read_text(encoding="utf-8")
          source_import_anchor = '} from "../lib/btc-public-static-source";\n\n'
          assert source_test.count(source_import_anchor) == 1
          contract_import = 'import {\n  BTC_MARKET_SNAPSHOT_FRESHNESS_CONTRACT_ID,\n  BTC_MARKET_SNAPSHOT_FRESH_HOURS,\n  BTC_MARKET_SNAPSHOT_OPERATIONAL_BREACH_HOURS,\n  BTC_MARKET_SNAPSHOT_LEGACY_72H_PROBE_HOURS,\n  BTC_MARKET_SNAPSHOT_UNAVAILABLE_AFTER_HOURS,\n} from "../lib/btc-freshness-contract";\n\n'
          source_test = source_test.replace(source_import_anchor, source_import_anchor + contract_import, 1)
          run_anchor = "async function run(): Promise<void> {\n"
          assert source_test.count(run_anchor) == 1
          contract_assertions = "async function run(): Promise<void> {\n  assert(BTC_MARKET_SNAPSHOT_FRESHNESS_CONTRACT_ID === \"btc_market_snapshot_freshness_24h_168h_v0_1\", \"Freshness contract ID drifted\");\n  assert(BTC_MARKET_SNAPSHOT_FRESH_HOURS === 24, \"Fresh boundary drifted\");\n  assert(BTC_MARKET_SNAPSHOT_OPERATIONAL_BREACH_HOURS === 48, \"Operational breach boundary drifted\");\n  assert(BTC_MARKET_SNAPSHOT_LEGACY_72H_PROBE_HOURS === 72, \"Legacy 72h regression probe drifted\");\n  assert(BTC_MARKET_SNAPSHOT_UNAVAILABLE_AFTER_HOURS === 168, \"Unavailable boundary drifted\");\n"
          source_test = source_test.replace(run_anchor, contract_assertions, 1)
          source_test_path.write_text(source_test, encoding="utf-8")

          envelope_test_path = Path("tests/btc-market-envelope-fixture.ts")
          envelope_test = envelope_test_path.read_text(encoding="utf-8")
          stale_anchor = "const stale = buildBtcMarketEnvelopeFromDocuments(\"What changed?\", {\n"
          assert envelope_test.count(stale_anchor) == 1
          exact_boundary = "const justOverFresh = buildBtcMarketEnvelopeFromDocuments(\"What changed?\", {\n  snapshot: current, previousSnapshot: previous, proof, marketField, bindings, registry, delta,\n}, { now: new Date(\"2026-07-23T12:00:01Z\") });\nassert(justOverFresh.ok && justOverFresh.value.current.source_freshness === \"STALE_LIMITED\", \"24h plus 1s must be stale limited\");\nassert(justOverFresh.value.synthesis.state === \"INSUFFICIENT_EVIDENCE\", \"24h plus 1s must suppress strong synthesis\");\n\n"
          envelope_test = envelope_test.replace(stale_anchor, exact_boundary + stale_anchor, 1)
          envelope_test_path.write_text(envelope_test, encoding="utf-8")
          PY

      - name: Run exact BHRIGU freshness gates
        run: |
          set -euo pipefail
          npm ci
          npm run verify:btc-routing
          npm run build

      - name: Remove one-shot apply workflow and prove exact scope
        run: |
          set -euo pipefail
          rm .github/workflows/btc-freshness-contract-repair-apply.yml
          EXPECTED=$(printf '%s\n' \
            lib/btc-freshness-contract.ts \
            lib/btc-market-envelope.ts \
            lib/btc-public-static-source.ts \
            tests/btc-market-envelope-fixture.ts \
            tests/btc-source-contract-fixture.ts | sort)
          ACTUAL=$(git status --short | awk '{print $2}' | sort)
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit exact repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/btc-freshness-contract.ts \
            lib/btc-market-envelope.ts \
            lib/btc-public-static-source.ts \
            tests/btc-market-envelope-fixture.ts \
            tests/btc-source-contract-fixture.ts
          git rm .github/workflows/btc-freshness-contract-repair-apply.yml
          git commit -m "BTC: unify snapshot freshness contract at 24h"
          git push origin HEAD:repair/btc-freshness-contract-24h-v0-1

      - name: Record apply closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "STATUS=TARGETED_REPAIR_APPLIED
          CONTRACT=btc_market_snapshot_freshness_24h_168h_v0_1
          FRESH_HOURS=24
          OPERATIONAL_BREACH_HOURS=48
          LEGACY_72H_PROBE=STALE_LIMITED
          UNAVAILABLE_AFTER_HOURS=168
          FINAL_SCOPE=5_FILES
          MERGE=FORBIDDEN"
