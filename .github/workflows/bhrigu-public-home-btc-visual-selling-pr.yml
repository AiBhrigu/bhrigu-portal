name: BHRIGU Public Home BTC Visual Selling

on:
  pull_request:
    branches: [master]
    paths:
      - "pages/index.js"
      - "pages/index.module.css"
      - "pages/crypto-astro/btc.tsx"
      - "lib/btc-product-rebalance-style.ts"
      - ".github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml"

permissions:
  contents: read

jobs:
  exact-head-visual-acceptance:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify bounded scope and zero model-call delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          python3 - <<'PY'
          import os, subprocess
          expected = {
              '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
              '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
              'pages/index.js',
              'pages/index.module.css',
          }
          revenue_discovery = {
              'pages/access.tsx',
              'pages/index.js',
              'pages/start.js',
          }
          revenue_discovery_ci_repair = {
              '.github/workflows/access-intake-containment-pr.yml',
              '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
              '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
          }
          passport_navigation = {
            'pages/index.js',
            'pages/map.js',
            'pages/start.js',
          }
          passport_navigation_ci_authority = {
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
          }
          home_map_link_repair = {
            'pages/index.js',
            'pages/index.module.css',
            'pages/map.js',
          }
          public_surface_redundant_ui_language_cleanup = {
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            'pages/field.js',
            'pages/index.js',
            'pages/index.module.css',
          }
          public_discovery_ci_closure = {
            '.github/workflows/astro-ephemerides-p1-integrity-pr.yml',
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-prevnext-first-http-locale-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            '.github/workflows/btc-field-read-pr-visual.yml',
            '.github/workflows/btc-free-corridor-conversational-surface-pr.yml',
            'pages/_app.js',
            'pages/field.js',
            'pages/index.js',
            'pages/map.js',
            'public/llms.txt',
            'public/sitemap.xml',
          }
          home_phi_visual_truth = {
            '.github/workflows/bhrigu-home-market-cosmographer-pr.yml',
            '.github/workflows/bhrigu-public-home-btc-visual-selling-pr.yml',
            '.github/workflows/bhrigu-public-site-human-copy-pr.yml',
            'pages/index.js',
            'pages/index.module.css',
          }
          actual = set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['BASE_SHA'],os.environ['HEAD_SHA']], text=True
          ).splitlines())
          if actual not in (expected, revenue_discovery, revenue_discovery_ci_repair, passport_navigation, passport_navigation_ci_authority, home_map_link_repair, public_surface_redundant_ui_language_cleanup, public_discovery_ci_closure, home_phi_visual_truth):
              raise SystemExit(f'EXACT_SCOPE_FAIL actual={sorted(actual)}')
          scope_class = 'home_phi_visual_truth' if actual == home_phi_visual_truth else 'public_discovery_ci_closure' if actual == public_discovery_ci_closure else 'public_surface_redundant_ui_language_cleanup' if actual == public_surface_redundant_ui_language_cleanup else 'home_map_link_repair' if actual == home_map_link_repair else 'passport_navigation' if actual == passport_navigation else 'passport_navigation_ci_authority' if actual == passport_navigation_ci_authority else 'revenue_discovery' if actual == revenue_discovery else 'revenue_discovery_ci_repair' if actual == revenue_discovery_ci_repair else 'historical_visual_atom'
          print('EXACT_SCOPE_CLASS=' + scope_class)
          protected = [
              'lib/routeTruth.js','components/PrevNextBlock.jsx',
              'pages/frey.js','pages/reading.js','pages/support.js','pages/api',
              'components/btc/BtcCleanChatV1.tsx','pages/crypto-astro/btc/clean-chat.tsx',
              'pages/sitemap.xml.js',
          ]
          if actual != public_discovery_ci_closure:
              protected.extend(['pages/_app.js','public/sitemap.xml'])
          drift = subprocess.check_output(
              ['git','diff','--name-only',os.environ['BASE_SHA'],os.environ['HEAD_SHA'],'--',*protected], text=True
          ).strip()
          if drift:
              raise SystemExit('PROTECTED_SURFACE_DIFF=' + drift)
          added = subprocess.check_output(
              ['git','diff','-U0',os.environ['BASE_SHA'],os.environ['HEAD_SHA'],'--',
               'pages/index.js','pages/index.module.css','pages/crypto-astro/btc.tsx','lib/btc-product-rebalance-style.ts'], text=True
          )
          new_lines = '\n'.join(line[1:] for line in added.splitlines() if line.startswith('+') and not line.startswith('+++'))
          forbidden = ('openai','anthropic','generateText','streamText','ai-gateway','chat.completions','responses.create')
          hits = [token for token in forbidden if token.lower() in new_lines.lower()]
          if hits:
              raise SystemExit('MODEL_CALL_DELTA_FAIL=' + ','.join(hits))
          print('EXACT_SCOPE=PASS')
          print('PROTECTED_RUNTIME_DIFF=ZERO')
          print('MODEL_CALL_DELTA=0')
          PY

      - name: Verify bound three-object footer authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'data-footer-offer=' pages/index.js | wc -l | tr -d ' ')" = "3"
          grep -Fq 'data-footer-offer="external-systems-recon"' pages/index.js
          grep -Fq 'data-footer-offer="frey-personal"' pages/index.js
          grep -Fq 'data-footer-offer="ai-founding-field"' pages/index.js
          grep -Fq 'data-commercial-cta="footer-external-systems-recon"' pages/index.js
          grep -Fq 'data-commercial-cta="footer-frey-personal"' pages/index.js
          grep -Fq 'data-commercial-cta="footer-ai-founding-field"' pages/index.js
          grep -Fq '/access?lang=${locale}' pages/index.js
          grep -Fq '/access?offer=frey-personal&lang=${locale}' pages/index.js
          grep -Fq '/field?lang=${locale}' pages/index.js
          grep -Fq 'USD 300' pages/index.js
          grep -Fq 'USD 79' pages/index.js
          grep -Fq 'USD 99' pages/index.js
          grep -Fq 'Array.from({ length: 7 }' pages/index.js
          grep -Fq 'Array.from({ length: 32 }' pages/index.js
          grep -Fq '.footerOfferGrid {' pages/index.module.css
          grep -Fq '.reconVisual {' pages/index.module.css
          grep -Fq '.passportVisual {' pages/index.module.css
          grep -Fq '.registryVisual {' pages/index.module.css
          grep -Fq '.footerCommerce {' pages/index.module.css
          grep -Fq '.siteFooter {' pages/index.module.css
          ! grep -Fq '© 2024' pages/index.js
          ! grep -Fq 'WORLD MAP' pages/index.js
          ! grep -Fq 'STARTUP GROWTH' pages/index.js
          echo 'BHRIGU_FOOTER_BOUND_VISUAL_AUTHORITY=PASS'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify existing Cosmographic Glyph Canon compatibility
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx tests/btc-bilingual-glyph-fixture.ts
          python3 - <<'PY'
          import os, subprocess
          diff = subprocess.check_output([
              'git','diff','-U0',os.environ['BASE_SHA'],os.environ['HEAD_SHA'],'--',
              'pages/index.js','pages/index.module.css','pages/crypto-astro/btc.tsx','lib/btc-product-rebalance-style.ts'
          ], text=True)
          added = '\n'.join(line[1:] for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++'))
          forbidden = ('Φ','data-glyph-class','<svg','<path','SealedBoundaryGlyph','systemPhi')
          hits = [token for token in forbidden if token in added]
          if hits:
              raise SystemExit('CONFLICTING_NEW_GLYPH_SEMANTICS=' + ','.join(hits))
          home = open('pages/index.js', encoding='utf-8').read()
          required_import = 'import { FieldAnchorGlyph, RelationGlyph } from "../components/btc/BtcSurfaceGlyphs";'
          required_use = '<FieldAnchorGlyph className={styles.homeFieldAnchorGlyph}/>'
          required_relation = '<RelationGlyph className={styles.homeRelationGlyph}/>'
          if home.count(required_import) != 1 or home.count(required_use) != 1 or home.count('<FieldAnchorGlyph') != 1:
              raise SystemExit('FIELD_ANCHOR_CANON_BIND=FAIL')
          if home.count(required_relation) != 1 or home.count('<RelationGlyph') != 1:
              raise SystemExit('RELATION_GLYPH_CANON_BIND=FAIL')
          print('FIELD_ANCHOR_CANON_BIND=PASS')
          print('RELATION_GLYPH_CANON_BIND=PASS')
          print('GLYPH_CANON_GATE=PASS')
          print('CONFLICTING_NEW_GLYPH_SEMANTICS=ZERO')
          PY

      - name: Verify visual contracts in source
        run: |
          grep -q 'data-home-system-map' pages/index.js
          grep -q 'data-home-btc-proof-object' pages/index.js
          grep -q 'data-btc-visual-hierarchy' pages/crypto-astro/btc.tsx
          grep -q 'data-btc-evidence-flow' pages/crypto-astro/btc.tsx
          grep -q 'btcSystemCompression' lib/btc-product-rebalance-style.ts
          ! grep -q 'systemPhi' pages/index.js
          test "$(grep -o '<FieldAnchorGlyph' pages/index.js | wc -l)" -eq 1
          grep -Fq 'import { FieldAnchorGlyph, RelationGlyph } from "../components/btc/BtcSurfaceGlyphs";' pages/index.js
          grep -Fq '<FieldAnchorGlyph className={styles.homeFieldAnchorGlyph}/>' pages/index.js
          grep -Fq '<RelationGlyph className={styles.homeRelationGlyph}/>' pages/index.js
          grep -Fq 'data-public-channel-rail' pages/index.js
          grep -Fq 'https://x.com/bhrigu_io' pages/index.js

      - name: Verify post-merge result-state presentation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Polymarket · точное условие · срок · правила' pages/crypto-astro/btc.tsx
          grep -Fq 'Независимый слой доказательств · совпадение ≠ причинность' pages/crypto-astro/btc.tsx
          grep -Fq 'ИСТОЧНИКИ / ДОКАЗАТЕЛЬСТВА' pages/crypto-astro/btc.tsx
          grep -Fq 'Только нужные линии доказательств' pages/crypto-astro/btc.tsx
          grep -Fq 'Пять доказательных слоёв показывают, из чего складывается текущее чтение BTC.' pages/crypto-astro/btc.tsx
          grep -Fq '.phiPlane>.supportBand{grid-template-columns:minmax(0,1fr)}' lib/btc-product-rebalance-style.ts
          grep -Fq '.phiPlane>.supportBand>.supportModule,.phiPlane>.supportBand>.supportModule:last-child{grid-column:auto;min-width:0;border-right:0}' lib/btc-product-rebalance-style.ts
          echo 'RU_NEW_VISUAL_COPY_PARITY=PASS'
          echo 'BTC_POPULATED_RESULT_SUPPORT_GRID_CONTRACT=PASS'

      - name: Production build
        run: npm run build
      - name: Start exact-head server
        shell: bash
        run: |
          nohup npm start -- -p 3311 >/tmp/bhrigu-visual-next.log 2>&1 &
          echo $! >/tmp/bhrigu-visual-next.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3311/?lang=en >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bhrigu-visual-next.log
          exit 1

      - name: Replay PR201 locale transport first HTTP
        shell: bash
        run: |
          set -euo pipefail
          check(){ url="$1"; shift; html="$(curl -fsS "http://127.0.0.1:3311${url}")"; for expected in "$@"; do grep -Fq "$expected" <<<"$html" || { echo "MISSING ${url} ${expected}"; exit 1; }; done; }
          check '/frey?lang=ru' '/start?lang=ru' '/reading?lang=ru'
          check '/reading?lang=ru' '/frey?lang=ru' '/start?lang=ru' '/cosmographer?lang=ru'
          check '/support?lang=ru' '/start?lang=ru'
          check '/frey?lang=en' '/start?lang=en' '/reading?lang=en'
          check '/reading?lang=en' '/frey?lang=en' '/start?lang=en' '/cosmographer?lang=en'
          check '/support?lang=en' '/start?lang=en'
          echo 'PR201_LOCALE_TRANSPORT_REPLAY=PASS'

      - name: Stop exact-head server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/bhrigu-visual-next.pid; then kill "$(cat /tmp/bhrigu-visual-next.pid)" || true; fi
          if test -f /tmp/bhrigu-visual-next.log; then tail -n 80 /tmp/bhrigu-visual-next.log; fi
