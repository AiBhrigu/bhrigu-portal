name: BHRIGU Production Branch Drift Guard

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: bhrigu-production-branch-drift-guard
  cancel-in-progress: false

jobs:
  branch-drift-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANONICAL_BRANCH: master
      PRODUCTION_BRANCH: main
      CANONICAL_HOST: www.bhrigu.io
      SECONDARY_HOST: bhrigu.io
      CANONICAL_ORIGIN: https://www.bhrigu.io
      SECONDARY_ORIGIN: https://bhrigu.io

    steps:
      - name: Checkout event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical and production refs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git fetch --no-tags origin \
            "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}" \
            "+refs/heads/${PRODUCTION_BRANCH}:refs/remotes/origin/${PRODUCTION_BRANCH}"

      - name: Validate canonical host configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("vercel.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          canonical_host = os.environ["CANONICAL_HOST"]
          secondary_host = os.environ["SECONDARY_HOST"]
          canonical_origin = os.environ["CANONICAL_ORIGIN"].rstrip("/")
          secondary_origin = os.environ["SECONDARY_ORIGIN"].rstrip("/")

          expected_rule = {
              "source": "/:path*",
              "has": [{"type": "host", "value": secondary_host}],
              "destination": f"{canonical_origin}/:path*",
              "permanent": True,
          }
          redirects = config.get("redirects")
          exact_matches = [
              rule for rule in redirects or []
              if rule == expected_rule
          ]
          conflicting_rules = []
          for rule in redirects or []:
              hosts = {
                  item.get("value")
                  for item in rule.get("has", [])
                  if item.get("type") == "host"
              }
              destination = str(rule.get("destination", ""))
              if canonical_host in hosts and destination.startswith(secondary_origin):
                  conflicting_rules.append(rule)

          checks = {
              "framework_nextjs": config.get("framework") == "nextjs",
              "redirects_array": isinstance(redirects, list),
              "exact_secondary_to_canonical_rule": len(exact_matches) == 1,
              "no_canonical_to_secondary_conflict": not conflicting_rules,
          }
          report = {
              "schema_version": "bhrigu_canonical_host_config_proof_v0_1",
              "status": "PASS" if all(checks.values()) else "FAIL",
              "canonical_host": canonical_host,
              "secondary_host": secondary_host,
              "expected_rule": expected_rule,
              "checks": checks,
              "conflicting_rules": conflicting_rules,
          }
          Path("artifacts/canonical-host-config-proof.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if report["status"] != "PASS":
              raise SystemExit(f"CANONICAL_HOST_CONFIG=FAIL {report}")
          print("CANONICAL_HOST_CONFIG=PASS")
          PY

      - name: Classify branch topology
        id: topology
        run: |
          set -euo pipefail
          MASTER_SHA=$(git rev-parse "refs/remotes/origin/${CANONICAL_BRANCH}")
          MAIN_SHA=$(git rev-parse "refs/remotes/origin/${PRODUCTION_BRANCH}")

          if [ "$MAIN_SHA" = "$MASTER_SHA" ]; then
            STATE=IDENTICAL
          elif git merge-base --is-ancestor "$MAIN_SHA" "$MASTER_SHA"; then
            STATE=MAIN_BEHIND_MASTER
          elif git merge-base --is-ancestor "$MASTER_SHA" "$MAIN_SHA"; then
            STATE=MAIN_AHEAD_OF_MASTER
          else
            STATE=DIVERGED
          fi

          echo "master_sha=$MASTER_SHA" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

          python3 - <<PY
          import json
          from pathlib import Path
          Path("artifacts/topology-before.json").write_text(json.dumps({
              "schema_version": "bhrigu_production_branch_topology_v0_1",
              "canonical_branch": "${CANONICAL_BRANCH}",
              "production_branch": "${PRODUCTION_BRANCH}",
              "canonical_sha": "$MASTER_SHA",
              "production_sha": "$MAIN_SHA",
              "state": "$STATE",
              "event_name": "${GITHUB_EVENT_NAME}",
              "event_ref": "${GITHUB_REF}",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          echo "BRANCH_TOPOLOGY=$STATE canonical=$MASTER_SHA production=$MAIN_SHA"

      - name: Reject direct pull requests to production mirror
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ "${{ github.base_ref }}" != "$CANONICAL_BRANCH" ]; then
            echo "FAIL: pull requests must target ${CANONICAL_BRANCH}; ${PRODUCTION_BRANCH} is deployment-only."
            exit 1
          fi
          if [ "${{ steps.topology.outputs.state }}" != "IDENTICAL" ]; then
            echo "FAIL: production mirror must be aligned before a canonical pull request can pass."
            exit 1
          fi
          echo "PR_TARGET_CANON=PASS"

      - name: Fail closed on production-only or divergent history
        if: steps.topology.outputs.state == 'MAIN_AHEAD_OF_MASTER' || steps.topology.outputs.state == 'DIVERGED'
        run: |
          echo "FAIL: ${PRODUCTION_BRANCH} contains history not safely fast-forwardable from ${CANONICAL_BRANCH}."
          echo "No force update or automatic history rewrite is permitted."
          exit 1

      - name: Fast-forward production mirror
        id: sync
        if: >-
          steps.topology.outputs.state == 'MAIN_BEHIND_MASTER' &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'push' || github.ref == 'refs/heads/master')
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ steps.topology.outputs.master_sha }}"
          git push origin "$EXPECTED_SHA:refs/heads/${PRODUCTION_BRANCH}"
          echo "performed=true" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_MIRROR_FAST_FORWARD=PASS sha=$EXPECTED_SHA"

      - name: Reject unsynchronized production push context
        if: >-
          steps.topology.outputs.state == 'MAIN_BEHIND_MASTER' &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'push' && github.ref != 'refs/heads/master'))
        run: |
          echo "FAIL: this event is not authorized to advance the production mirror."
          exit 1

      - name: Verify final ref identity
        id: final
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}" \
            "+refs/heads/${PRODUCTION_BRANCH}:refs/remotes/origin/${PRODUCTION_BRANCH}"
          MASTER_SHA=$(git rev-parse "refs/remotes/origin/${CANONICAL_BRANCH}")
          MAIN_SHA=$(git rev-parse "refs/remotes/origin/${PRODUCTION_BRANCH}")
          test "$MAIN_SHA" = "$MASTER_SHA"
          echo "sha=$MASTER_SHA" >> "$GITHUB_OUTPUT"
          echo "FINAL_BRANCH_ALIGNMENT=PASS sha=$MASTER_SHA"

      - name: Verify canonical and secondary public edges
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ steps.final.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = os.environ["EXPECTED_SHA"]
          canonical_host = os.environ["CANONICAL_HOST"]
          secondary_host = os.environ["SECONDARY_HOST"]
          canonical_origin = os.environ["CANONICAL_ORIGIN"].rstrip("/")
          secondary_origin = os.environ["SECONDARY_ORIGIN"].rstrip("/")
          run_id = os.environ["RUN_ID"]
          paths = ["/", "/crypto-astro/btc", "/crypto-astro/btc/live"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(url, follow):
              opener = urllib.request.build_opener() if follow else urllib.request.build_opener(NoRedirect)
              req = urllib.request.Request(url, headers={
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "User-Agent": "ORION-BHRIGU-Dual-Edge-Guard/0.1",
              })
              try:
                  response = opener.open(req, timeout=30)
                  return {
                      "status": response.status,
                      "url": response.geturl(),
                      "headers": dict(response.headers.items()),
                      "body": response.read().decode("utf-8", errors="replace"),
                  }
              except urllib.error.HTTPError as exc:
                  return {
                      "status": exc.code,
                      "url": exc.geturl(),
                      "headers": dict(exc.headers.items()),
                      "body": exc.read().decode("utf-8", errors="replace"),
                  }
              except Exception as exc:
                  return {"error": f"{type(exc).__name__}: {exc}"}

          def query_pairs(url):
              return sorted(urllib.parse.parse_qsl(
                  urllib.parse.urlparse(url).query,
                  keep_blank_values=True,
              ))

          last = None
          for attempt in range(48):
              route_results = {}
              failures = []
              for path in paths:
                  query = urllib.parse.urlencode({
                      "lang": "en",
                      "__branch_guard": f"{run_id}-{attempt}",
                      "edge_contract": "preserve",
                  })
                  canonical_url = f"{canonical_origin}{path}?{query}"
                  secondary_url = f"{secondary_origin}{path}?{query}"

                  canonical = request(canonical_url, follow=False)
                  secondary_initial = request(secondary_url, follow=False)
                  secondary_followed = request(secondary_url, follow=True)

                  checks = {}
                  if any("error" in item for item in [canonical, secondary_initial, secondary_followed]):
                      checks["requests_complete"] = False
                  else:
                      canonical_parsed = urllib.parse.urlparse(canonical["url"])
                      location_raw = secondary_initial["headers"].get("Location") or secondary_initial["headers"].get("location")
                      location_url = urllib.parse.urljoin(secondary_url, location_raw or "")
                      location_parsed = urllib.parse.urlparse(location_url)
                      followed_parsed = urllib.parse.urlparse(secondary_followed["url"])

                      checks = {
                          "requests_complete": True,
                          "canonical_http_200": canonical["status"] == 200,
                          "canonical_host_preserved": canonical_parsed.netloc == canonical_host,
                          "canonical_path_preserved": canonical_parsed.path == path,
                          "canonical_query_preserved": query_pairs(canonical["url"]) == query_pairs(canonical_url),
                          "secondary_http_308": secondary_initial["status"] == 308,
                          "redirect_https": location_parsed.scheme == "https",
                          "redirect_to_canonical_host": location_parsed.netloc == canonical_host,
                          "redirect_path_preserved": location_parsed.path == path,
                          "redirect_query_preserved": query_pairs(location_url) == query_pairs(secondary_url),
                          "followed_http_200": secondary_followed["status"] == 200,
                          "followed_canonical_host": followed_parsed.netloc == canonical_host,
                          "followed_path_preserved": followed_parsed.path == path,
                          "followed_query_preserved": query_pairs(secondary_followed["url"]) == query_pairs(secondary_url),
                      }
                      if path != "/":
                          canonical_html = canonical["body"]
                          followed_html = secondary_followed["body"]
                          checks.update({
                              "canonical_main_source_attribute": f'data-deployment-source-sha="{expected}"' in canonical_html,
                              "canonical_head_source_meta": f'name="btc-deployment-source-sha" content="{expected}"' in canonical_html,
                              "canonical_visible_source_prefix": expected[:12] in canonical_html,
                              "followed_main_source_attribute": f'data-deployment-source-sha="{expected}"' in followed_html,
                              "followed_head_source_meta": f'name="btc-deployment-source-sha" content="{expected}"' in followed_html,
                              "followed_visible_source_prefix": expected[:12] in followed_html,
                          })

                  route_failures = [name for name, passed in checks.items() if not passed]
                  if route_failures:
                      failures.append({"path": path, "checks": route_failures})
                  route_results[path] = {
                      "canonical": {
                          "status": canonical.get("status"),
                          "url": canonical.get("url"),
                      },
                      "secondary_initial": {
                          "status": secondary_initial.get("status"),
                          "url": secondary_initial.get("url"),
                          "location": secondary_initial.get("headers", {}).get("Location")
                              or secondary_initial.get("headers", {}).get("location"),
                      },
                      "secondary_followed": {
                          "status": secondary_followed.get("status"),
                          "url": secondary_followed.get("url"),
                      },
                      "checks": checks,
                      "failures": route_failures,
                  }

              last = {
                  "attempt": attempt + 1,
                  "expected_source_sha": expected,
                  "canonical_host": canonical_host,
                  "secondary_host": secondary_host,
                  "route_results": route_results,
                  "failures": failures,
              }
              if not failures:
                  break
              time.sleep(5)

          report = {
              "schema_version": "bhrigu_production_dual_edge_alignment_v0_1",
              "status": "PASS" if last and not last.get("failures") else "FAIL",
              "result": last,
          }
          Path("artifacts/public-dual-edge-proof.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if report["status"] != "PASS":
              raise SystemExit(f"PUBLIC_DUAL_EDGE_ALIGNMENT=FAIL {last}")
          print(
              "PUBLIC_DUAL_EDGE_ALIGNMENT=PASS "
              f"canonical={canonical_host} secondary={secondary_host} source_sha={expected}"
          )
          PY

      - name: Write final guard report
        if: always()
        env:
          INITIAL_STATE: ${{ steps.topology.outputs.state }}
          INITIAL_MASTER_SHA: ${{ steps.topology.outputs.master_sha }}
          INITIAL_MAIN_SHA: ${{ steps.topology.outputs.main_sha }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
          SYNC_PERFORMED: ${{ steps.sync.outputs.performed }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("artifacts/branch-drift-guard-report.json").write_text(json.dumps({
              "schema_version": "bhrigu_production_branch_drift_guard_report_v0_2",
              "canonical_branch": "master",
              "production_branch": "main",
              "canonical_host": os.environ.get("CANONICAL_HOST"),
              "secondary_host": os.environ.get("SECONDARY_HOST"),
              "initial_state": os.environ.get("INITIAL_STATE") or None,
              "initial_master_sha": os.environ.get("INITIAL_MASTER_SHA") or None,
              "initial_main_sha": os.environ.get("INITIAL_MAIN_SHA") or None,
              "final_aligned_sha": os.environ.get("FINAL_SHA") or None,
              "sync_performed": os.environ.get("SYNC_PERFORMED") == "true",
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhrigu-production-branch-drift-guard-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
