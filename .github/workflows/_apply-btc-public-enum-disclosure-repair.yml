name: Apply BTC Public Enum Disclosure Repair

on:
  push:
    branches:
      - agent/btc-public-enum-disclosure-repair-v0-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/btc-public-enum-disclosure-repair-v0-1
          fetch-depth: 0

      - name: Apply closed public projection repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          component_path = Path("components/btc/BtcCosmographerDialogue.tsx")
          component = component_path.read_text(encoding="utf-8")

          component = replace_once(
              component,
              '''    genesis_history: ["История Genesis", "Genesis history"],
            };
            const value = labels[subject];
            if (!value) return subject.replaceAll("_", " ");'''.replace("            ", "  "),
              '''    genesis_history: ["История Genesis", "Genesis history"],
              general_btc_field: ["Текущее состояние BTC", "Current BTC state"],
              temporal_pressure: ["Временной контекст", "Temporal context"],
              unsupported_market_request: ["Граница рыночного запроса", "Market request boundary"],
            };
            const value = labels[subject];
            if (!value) return locale === "ru" ? "Предмет ответа" : "Answer subject";'''.replace("            ", "  "),
              "public subject labels",
          )

          stop_function = '''
          function publicStopReasonLabel(locale: BtcPublicLocale, stopReason: string | null): string {
            const labels: Record<string, [string, string]> = {
              ANSWER_COMPLETE: ["Ответ завершён", "Answer complete"],
              MISSING_EVIDENCE: ["Недостаточно опубликованных доказательств", "Published evidence is insufficient"],
              OUT_OF_SCOPE: ["Запрос вне доступной области", "Request outside the supported scope"],
              REPEATED_ROUTE: ["Повтор не добавляет новой информации", "The repeated request adds no new information"],
              MODE_TRANSITION_NOT_EXPLICIT: ["Уточните, к какому предмету перейти", "Clarify which subject to continue with"],
            };
            const value = stopReason ? labels[stopReason] : null;
            if (!value) return locale === "ru" ? "Ответ ограничен" : "Response limited";
            return locale === "ru" ? value[0] : value[1];
          }
          '''.replace("          ", "")
          component = replace_once(
              component,
              "\nfunction turnPeriodLabel(locale: BtcPublicLocale, turn: BtcDialogueTurn): string {",
              f"\n{stop_function}\nfunction turnPeriodLabel(locale: BtcPublicLocale, turn: BtcDialogueTurn): string {{",
              "public stop label function",
          )

          component = replace_once(
              component,
              '''        {turn.route_disposition === "STOP" && <aside className="answerRouteStop" data-route-surface="valid-stop">
                    <span>{turn.locale === "ru" ? "Маршрут остановлен" : "Route stopped"}</span>
                    <strong>{turn.stop_reason ?? (turn.locale === "ru" ? "Ответ завершён" : "Answer complete")}</strong>
                  </aside>}'''.replace("                  ", "        "),
              '''        {turn.route_disposition === "STOP" && <aside className="answerRouteStop" data-route-surface="valid-stop">
                    <span>{turn.locale === "ru" ? "Ответ ограничен" : "Response limited"}</span>
                    <span className="answerAuthority">{publicSubjectLabel(turn.locale, subject)}</span>
                    <strong>{publicStopReasonLabel(turn.locale, turn.stop_reason)}</strong>
                  </aside>}'''.replace("                  ", "        "),
              "public stop projection",
          )
          component_path.write_text(component, encoding="utf-8")

          static_path = Path("scripts/run-btc-natural-followup-discovery-static-fixture.mjs")
          static = static_path.read_text(encoding="utf-8")
          extra_static = '''
          check("CLOSED_PUBLIC_STOP_REASON_LABELS", [
            "ANSWER_COMPLETE", "MISSING_EVIDENCE", "OUT_OF_SCOPE", "REPEATED_ROUTE", "MODE_TRANSITION_NOT_EXPLICIT",
            "Ответ завершён", "Answer complete",
            "Недостаточно опубликованных доказательств", "Published evidence is insufficient",
            "Запрос вне доступной области", "Request outside the supported scope",
            "Повтор не добавляет новой информации", "The repeated request adds no new information",
            "Уточните, к какому предмету перейти", "Clarify which subject to continue with",
          ].every((value) => component.includes(value)));
          check("RAW_STOP_REASON_INTERPOLATION_ABSENT", !component.includes("turn.stop_reason ??") && !component.includes("{turn.stop_reason}"));
          check("REQUIRED_PUBLIC_SUBJECT_LABELS_PRESENT", [
            "general_btc_field", "Текущее состояние BTC", "Current BTC state",
            "temporal_pressure", "Временной контекст", "Temporal context",
            "unsupported_market_request", "Граница рыночного запроса", "Market request boundary",
          ].every((value) => component.includes(value)));
          check("RAW_SUBJECT_SLUG_FALLBACK_ABSENT", !component.includes('subject.replaceAll("_", " ")'));
          '''.replace("          ", "")
          static = replace_once(
              static,
              'check("working_tree_python_cache_ignored", ignoredPythonCacheProbes);\n',
              'check("working_tree_python_cache_ignored", ignoredPythonCacheProbes);\n' + extra_static,
              "static disclosure checks",
          )
          static = replace_once(
              static,
              'console.log(`BTC_NATURAL_FOLLOWUP_DISCOVERY_STATIC=PASS checks=${checks.length}`);',
              'console.log(`BTC_NATURAL_FOLLOWUP_DISCOVERY_STATIC=${checks.length}/${checks.length}_PASS`);',
              "static result format",
          )
          static_path.write_text(static, encoding="utf-8")

          verifier_path = Path("scripts/verify-btc-natural-followup-conversations.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          verifier = replace_once(
              verifier,
              'SESSION_KEY = "bhrigu:btc-cosmographer:session:v0_3"\n',
              '''SESSION_KEY = "bhrigu:btc-cosmographer:session:v0_3"
          FORBIDDEN_VISIBLE_TOKENS = (
              "OUT_OF_SCOPE",
              "MISSING_EVIDENCE",
              "REPEATED_ROUTE",
              "MODE_TRANSITION_NOT_EXPLICIT",
              "ANSWER_COMPLETE",
              "general_btc_field",
              "general btc field",
              "temporal_pressure",
              "unsupported_market_request",
          )
          PUBLIC_SUBJECT_LABELS = {
              "en": {
                  "current": "Current BTC state",
                  "temporal": "Temporal context",
                  "unsupported": "Market request boundary",
                  "stop_title": "Response limited",
                  "stop_reason": "Request outside the supported scope",
              },
              "ru": {
                  "current": "Текущее состояние BTC",
                  "temporal": "Временной контекст",
                  "unsupported": "Граница рыночного запроса",
                  "stop_title": "Ответ ограничен",
                  "stop_reason": "Запрос вне доступной области",
              },
          }
          '''.replace("          ", ""),
              "verifier constants",
          )

          projection_helpers = '''
          def collect_public_projection(driver):
              root = driver.find_element(By.CSS_SELECTOR, "main.liveDialoguePage")
              visible = root.text
              accessibility = driver.execute_script(
                  """
                  const root = arguments[0];
                  const values = [document.title || ""];
                  for (const element of [root, ...root.querySelectorAll("*")]) {
                    for (const name of ["aria-label", "aria-description", "title", "alt"]) {
                      const value = element.getAttribute && element.getAttribute(name);
                      if (value) values.push(value);
                    }
                    const labelledBy = element.getAttribute && element.getAttribute("aria-labelledby");
                    if (labelledBy) {
                      for (const id of labelledBy.split(/\\s+/)) {
                        const target = document.getElementById(id);
                        if (target && target.textContent) values.push(target.textContent);
                      }
                    }
                  }
                  return values.join("\\n");
                  """,
                  root,
              )
              return visible, accessibility

          def assert_projection_clean(record, driver, prefix):
              visible, accessibility = collect_public_projection(driver)
              combined = f"{visible}\n{accessibility}"
              leaked = [token for token in FORBIDDEN_VISIBLE_TOKENS if token in combined]
              record(f"{prefix}_forbidden_visible_tokens", not leaked, ",".join(leaked))
              return visible

          def run_projection_case(locale, width):
              options = webdriver.ChromeOptions()
              for argument in ("--headless=new", "--no-sandbox", "--disable-dev-shm-usage", f"--window-size={width},1000"):
                  options.add_argument(argument)
              driver = webdriver.Chrome(options=options)
              wait = WebDriverWait(driver, 30)
              checks = []

              def record(name, passed, details=""):
                  checks.append({"name": name, "passed": bool(passed), "details": details})
                  if not passed:
                      raise AssertionError(f"{name}: {details}")

              def open_probe(question, date=""):
                  driver.get(f"{BASE}?lang={locale}")
                  driver.execute_script("window.sessionStorage.clear()")
                  suffix = f"&d={date}" if date else ""
                  driver.get(f"{BASE}?lang={locale}&q={quote(question)}{suffix}")
                  wait.until(lambda _: len(driver.find_elements(By.CSS_SELECTOR, "article[data-route-domain]")) > 0)
                  return driver.find_elements(By.CSS_SELECTOR, "article[data-route-domain]")[-1]

              labels = PUBLIC_SUBJECT_LABELS[locale]
              current_question = "Что происходит с BTC сейчас?" if locale == "ru" else "What is happening with BTC now?"
              temporal_question = (
                  "Как выбранная дата меняет контекст наблюдения BTC и временное давление?"
                  if locale == "ru"
                  else "How does the selected date change temporal pressure?"
              )
              unsupported_question = (
                  "Дай мне гарантированную цель цены BTC на завтра."
                  if locale == "ru"
                  else "Give me a guaranteed BTC price target for tomorrow."
              )

              try:
                  current = open_probe(current_question)
                  wait.until(lambda _: len(driver.find_elements(By.CSS_SELECTOR, ".activeContextLine")) == 1)
                  current_visible = assert_projection_clean(record, driver, "current")
                  record("current_subject_label", labels["current"] in current_visible, current_visible)
                  record("current_route_preserved", attr(current, "data-route-subject") == "general_btc_field", attr(current, "data-route-subject"))

                  temporal = open_probe(temporal_question, "2026-08-07")
                  wait.until(lambda _: len(driver.find_elements(By.CSS_SELECTOR, ".activeContextLine")) == 1)
                  temporal_visible = assert_projection_clean(record, driver, "temporal")
                  record("temporal_subject_label", labels["temporal"] in temporal_visible, temporal_visible)
                  record("temporal_route_preserved", attr(temporal, "data-route-subject") == "temporal_pressure", attr(temporal, "data-route-subject"))
                  record("temporal_date_preserved", "2026" in driver.find_element(By.CSS_SELECTOR, ".activeContextLine").text)

                  unsupported = open_probe(unsupported_question)
                  unsupported_visible = assert_projection_clean(record, driver, "unsupported")
                  record("unsupported_subject_label", labels["unsupported"] in unsupported_visible, unsupported_visible)
                  record("public_stop_title", labels["stop_title"] in unsupported_visible, unsupported_visible)
                  record("public_stop_reason", labels["stop_reason"] in unsupported_visible, unsupported_visible)
                  record("bounded_price_refusal", attr(unsupported, "data-answer-state") == "LIMITED" and attr(unsupported, "data-route-disposition") == "STOP", f"{attr(unsupported, 'data-answer-state')}:{attr(unsupported, 'data-route-disposition')}")
                  record("refusal_copy_preserved", ("гарант" if locale == "ru" else "guaranteed") in unsupported_visible.lower(), unsupported_visible)
              finally:
                  driver.quit()

              return {
                  "locale": locale,
                  "viewport": "mobile" if width == 390 else "desktop",
                  "checks": checks,
                  "status": "PASS" if all(item["passed"] for item in checks) else "FAIL",
              }

          '''.replace("          ", "")
          verifier = replace_once(
              verifier,
              "def run_case(index, case):\n",
              projection_helpers + "def run_case(index, case):\n",
              "projection helpers",
          )

          verifier = replace_once(
              verifier,
              '''        visible = driver.find_element(By.CSS_SELECTOR, "main.liveDialoguePage").text
                  record("no_internal_authority_visible", "ACCEPTED_MARKET_RECORD_AND_VERIFIED" not in visible)
                  record("evidence_disclosure", bool(driver.find_elements(By.CSS_SELECTOR, "details[data-answer-source-boundary]")))'''.replace("                  ", "        "),
              '''        visible = driver.find_element(By.CSS_SELECTOR, "main.liveDialoguePage").text
                  record("no_internal_authority_visible", "ACCEPTED_MARKET_RECORD_AND_VERIFIED" not in visible)
                  _, accessibility = collect_public_projection(driver)
                  combined_projection = f"{visible}\n{accessibility}"
                  leaked = [token for token in FORBIDDEN_VISIBLE_TOKENS if token in combined_projection]
                  record("no_forbidden_public_projection_tokens", not leaked, ",".join(leaked))
                  record("evidence_disclosure", bool(driver.find_elements(By.CSS_SELECTOR, "details[data-answer-source-boundary]")))'''.replace("                  ", "        "),
              "base corpus disclosure assertion",
          )

          old_runner = '''results = []
          error = None
          try:
              for index, case in enumerate(BASE_CASES):
                  results.append(run_case(index, case))
          except Exception as exc:
              error = str(exc)
          '''.replace("          ", "")
          new_runner = '''results = []
          projection_results = []
          error = None
          try:
              for index, case in enumerate(BASE_CASES):
                  results.append(run_case(index, case))
              for locale in ("en", "ru"):
                  for width in (1280, 390):
                      projection_results.append(run_projection_case(locale, width))
          except Exception as exc:
              error = str(exc)
          '''.replace("          ", "")
          verifier = replace_once(verifier, old_runner, new_runner, "projection runner")

          verifier = replace_once(
              verifier,
              '''    "status": "PASS" if error is None and len(results) == 24 and all(row["status"] == "PASS" for row in results) else "FAIL",
                "dialogue_count": len(results),
                "required_dialogue_count": 24,
                "results": results,
                "error": error,'''.replace("                ", "    "),
              '''    "status": "PASS" if error is None and len(results) == 24 and all(row["status"] == "PASS" for row in results) and len(projection_results) == 4 and all(row["status"] == "PASS" for row in projection_results) else "FAIL",
                "dialogue_count": len(results),
                "required_dialogue_count": 24,
                "projection_count": len(projection_results),
                "required_projection_count": 4,
                "results": results,
                "projection_results": projection_results,
                "error": error,'''.replace("                ", "    "),
              "report projection fields",
          )
          verifier_path.write_text(verifier, encoding="utf-8")

          transport = Path(".github/workflows/_apply-btc-public-enum-disclosure-repair.yml")
          transport.unlink()
          PY

      - name: Verify targeted static acceptance
        run: |
          set -euo pipefail
          node scripts/run-btc-natural-followup-discovery-static-fixture.mjs
          python3 -m py_compile scripts/verify-btc-natural-followup-conversations.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "components/btc/BtcCosmographerDialogue.tsx scripts/run-btc-natural-followup-discovery-static-fixture.mjs scripts/verify-btc-natural-followup-conversations.py "

      - name: Commit exact repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/btc/BtcCosmographerDialogue.tsx scripts/run-btc-natural-followup-discovery-static-fixture.mjs scripts/verify-btc-natural-followup-conversations.py .github/workflows/_apply-btc-public-enum-disclosure-repair.yml
          git commit -m "fix: remove internal enums from BTC public dialogue"
          git push origin HEAD:agent/btc-public-enum-disclosure-repair-v0-1
