name: Apply BTC Public Enum Disclosure Repair V4

on:
  push:
    branches:
      - agent/btc-public-enum-disclosure-repair-v0-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/btc-public-enum-disclosure-repair-v0-1
          fetch-depth: 0

      - name: Apply exact public projection repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          component_path = Path("components/btc/BtcCosmographerDialogue.tsx")
          component = component_path.read_text(encoding="utf-8")
          old_subject = (
              '    genesis_history: ["История Genesis", "Genesis history"],\n'
              '  };\n'
              '  const value = labels[subject];\n'
              '  if (!value) return subject.replaceAll("_", " ");'
          )
          new_subject = (
              '    genesis_history: ["История Genesis", "Genesis history"],\n'
              '    general_btc_field: ["Текущее состояние BTC", "Current BTC state"],\n'
              '    temporal_pressure: ["Временной контекст", "Temporal context"],\n'
              '    unsupported_market_request: ["Граница рыночного запроса", "Market request boundary"],\n'
              '  };\n'
              '  const value = labels[subject];\n'
              '  if (!value) return locale === "ru" ? "Предмет ответа" : "Answer subject";'
          )
          component = replace_once(component, old_subject, new_subject, "public subject labels")

          stop_function = dedent('''
          function publicStopReasonLabel(locale: BtcPublicLocale, stopReason: string | null): string {
            const labels: Record<string, [string, string]> = {
              ANSWER_COMPLETE: ["Ответ завершён", "Answer complete"],
              MISSING_EVIDENCE: ["Недостаточно опубликованных доказательств", "Published evidence is insufficient"],
              OUT_OF_SCOPE: ["Запрос вне доступной области", "Request outside the supported scope"],
              REPEATED_ROUTE: ["Повтор не добавляет новой информации", "The repeated request adds no new information"],
              MODE_TRANSITION_NOT_EXPLICIT: ["Уточните, к какому предмету перейти", "Clarify which subject to continue with"],
            };
            const value = stopReason ? labels[stopReason] : null;
            if (!value) return locale === "ru" ? "Ответ ограничен" : "Response limited";
            return locale === "ru" ? value[0] : value[1];
          }
          ''').lstrip()
          component = replace_once(
              component,
              "function turnPeriodLabel(locale: BtcPublicLocale, turn: BtcDialogueTurn): string {",
              stop_function + "\nfunction turnPeriodLabel(locale: BtcPublicLocale, turn: BtcDialogueTurn): string {",
              "public stop function",
          )
          stop_pattern = re.compile(
              r'\{turn\.route_disposition === "STOP" && <aside className="answerRouteStop" data-route-surface="valid-stop">\s*'
              r'<span>\{turn\.locale === "ru" \? "Маршрут остановлен" : "Route stopped"\}</span>\s*'
              r'<strong>\{turn\.stop_reason \?\? \(turn\.locale === "ru" \? "Ответ завершён" : "Answer complete"\)\}</strong>\s*'
              r'</aside>\}'
          )
          public_stop = dedent('''
          {turn.route_disposition === "STOP" && <aside className="answerRouteStop" data-route-surface="valid-stop">
            <span>{turn.locale === "ru" ? "Ответ ограничен" : "Response limited"}</span>
            <span className="answerAuthority">{publicSubjectLabel(turn.locale, subject)}</span>
            <strong>{publicStopReasonLabel(turn.locale, turn.stop_reason)}</strong>
          </aside>}
          ''').strip()
          component, count = stop_pattern.subn(public_stop, component, count=1)
          if count != 1:
              raise SystemExit(f"public stop projection: expected one match, found {count}")
          component_path.write_text(component, encoding="utf-8")

          static_path = Path("scripts/run-btc-natural-followup-discovery-static-fixture.mjs")
          static = static_path.read_text(encoding="utf-8")
          extra_checks = dedent('''
          check("CLOSED_PUBLIC_STOP_REASON_LABELS", [
            "ANSWER_COMPLETE", "MISSING_EVIDENCE", "OUT_OF_SCOPE", "REPEATED_ROUTE", "MODE_TRANSITION_NOT_EXPLICIT",
            "Ответ завершён", "Answer complete",
            "Недостаточно опубликованных доказательств", "Published evidence is insufficient",
            "Запрос вне доступной области", "Request outside the supported scope",
            "Повтор не добавляет новой информации", "The repeated request adds no new information",
            "Уточните, к какому предмету перейти", "Clarify which subject to continue with",
          ].every((value) => component.includes(value)));
          check("RAW_STOP_REASON_INTERPOLATION_ABSENT", !component.includes("turn.stop_reason ??") && !component.includes("<strong>{turn.stop_reason"));
          check("REQUIRED_PUBLIC_SUBJECT_LABELS_PRESENT", [
            "general_btc_field", "Текущее состояние BTC", "Current BTC state",
            "temporal_pressure", "Временной контекст", "Temporal context",
            "unsupported_market_request", "Граница рыночного запроса", "Market request boundary",
          ].every((value) => component.includes(value)));
          check("RAW_SUBJECT_SLUG_FALLBACK_ABSENT", !component.includes('subject.replaceAll("_", " ")'));
          ''').lstrip()
          static = replace_once(static, 'check("working_tree_python_cache_ignored", ignoredPythonCacheProbes);\n', 'check("working_tree_python_cache_ignored", ignoredPythonCacheProbes);\n' + extra_checks, "static checks")
          static = replace_once(static, 'console.log(`BTC_NATURAL_FOLLOWUP_DISCOVERY_STATIC=PASS checks=${checks.length}`);', 'console.log(`BTC_NATURAL_FOLLOWUP_DISCOVERY_STATIC=${checks.length}/${checks.length}_PASS`);', "static result")
          static_path.write_text(static, encoding="utf-8")

          verifier_path = Path("scripts/verify-btc-natural-followup-conversations.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          constants = dedent('''
          SESSION_KEY = "bhrigu:btc-cosmographer:session:v0_3"
          FORBIDDEN_VISIBLE_TOKENS = (
              "OUT_OF_SCOPE", "MISSING_EVIDENCE", "REPEATED_ROUTE",
              "MODE_TRANSITION_NOT_EXPLICIT", "ANSWER_COMPLETE",
              "general_btc_field", "general btc field", "temporal_pressure",
              "unsupported_market_request",
          )
          PUBLIC_SUBJECT_LABELS = {
              "en": {"current": "Current BTC state", "temporal": "Temporal context", "unsupported": "Market request boundary", "stop_title": "Response limited", "stop_reason": "Request outside the supported scope"},
              "ru": {"current": "Текущее состояние BTC", "temporal": "Временной контекст", "unsupported": "Граница рыночного запроса", "stop_title": "Ответ ограничен", "stop_reason": "Запрос вне доступной области"},
          }
          ''').lstrip()
          verifier = replace_once(verifier, 'SESSION_KEY = "bhrigu:btc-cosmographer:session:v0_3"\n', constants, "verifier constants")
          helpers = dedent(r'''
          def collect_public_projection(driver):
              root = driver.find_element(By.CSS_SELECTOR, "main.liveDialoguePage")
              visible = root.text
              accessibility = driver.execute_script(
                  """
                  const root = arguments[0];
                  const values = [document.title || ""];
                  for (const element of [root, ...root.querySelectorAll("*")]) {
                    for (const name of ["aria-label", "aria-description", "title", "alt"]) {
                      const value = element.getAttribute && element.getAttribute(name);
                      if (value) values.push(value);
                    }
                    const labelledBy = element.getAttribute && element.getAttribute("aria-labelledby");
                    if (labelledBy) for (const id of labelledBy.split(/\s+/)) {
                      const target = document.getElementById(id);
                      if (target && target.textContent) values.push(target.textContent);
                    }
                  }
                  return values.join("\n");
                  """,
                  root,
              )
              return visible, accessibility

          def assert_projection_clean(record, driver, prefix):
              visible, accessibility = collect_public_projection(driver)
              combined = f"{visible}\n{accessibility}"
              leaked = [token for token in FORBIDDEN_VISIBLE_TOKENS if token in combined]
              record(f"{prefix}_forbidden_visible_tokens", not leaked, ",".join(leaked))
              return visible

          def run_projection_case(locale, width):
              options = webdriver.ChromeOptions()
              for argument in ("--headless=new", "--no-sandbox", "--disable-dev-shm-usage", f"--window-size={width},1000"):
                  options.add_argument(argument)
              driver = webdriver.Chrome(options=options)
              wait = WebDriverWait(driver, 30)
              checks = []
              def record(name, passed, details=""):
                  checks.append({"name": name, "passed": bool(passed), "details": details})
                  if not passed: raise AssertionError(f"{name}: {details}")
              def open_probe(question, date=""):
                  driver.get(f"{BASE}?lang={locale}")
                  driver.execute_script("window.sessionStorage.clear()")
                  suffix = f"&d={date}" if date else ""
                  driver.get(f"{BASE}?lang={locale}&q={quote(question)}{suffix}")
                  wait.until(lambda _: len(driver.find_elements(By.CSS_SELECTOR, "article[data-route-domain]")) > 0)
                  return driver.find_elements(By.CSS_SELECTOR, "article[data-route-domain]")[-1]
              labels = PUBLIC_SUBJECT_LABELS[locale]
              current_question = "Что происходит с BTC сейчас?" if locale == "ru" else "What is happening with BTC now?"
              temporal_question = "Как выбранная дата меняет контекст наблюдения BTC и временное давление?" if locale == "ru" else "How does the selected date change temporal pressure?"
              unsupported_question = "Дай мне гарантированную цель цены BTC на завтра." if locale == "ru" else "Give me a guaranteed BTC price target for tomorrow."
              try:
                  current = open_probe(current_question)
                  wait.until(lambda _: len(driver.find_elements(By.CSS_SELECTOR, ".activeContextLine")) == 1)
                  visible = assert_projection_clean(record, driver, "current")
                  record("current_subject_label", labels["current"] in visible, visible)
                  record("current_route_preserved", attr(current, "data-route-subject") == "general_btc_field", attr(current, "data-route-subject"))
                  temporal = open_probe(temporal_question, "2026-08-07")
                  wait.until(lambda _: len(driver.find_elements(By.CSS_SELECTOR, ".activeContextLine")) == 1)
                  visible = assert_projection_clean(record, driver, "temporal")
                  record("temporal_subject_label", labels["temporal"] in visible, visible)
                  record("temporal_route_preserved", attr(temporal, "data-route-subject") == "temporal_pressure", attr(temporal, "data-route-subject"))
                  record("temporal_date_preserved", "2026" in driver.find_element(By.CSS_SELECTOR, ".activeContextLine").text)
                  unsupported = open_probe(unsupported_question)
                  visible = assert_projection_clean(record, driver, "unsupported")
                  record("unsupported_subject_label", labels["unsupported"] in visible, visible)
                  record("public_stop_title", labels["stop_title"] in visible, visible)
                  record("public_stop_reason", labels["stop_reason"] in visible, visible)
                  record("bounded_price_refusal", attr(unsupported, "data-answer-state") == "LIMITED" and attr(unsupported, "data-route-disposition") == "STOP", f"{attr(unsupported, 'data-answer-state')}:{attr(unsupported, 'data-route-disposition')}")
                  record("refusal_copy_preserved", ("гарант" if locale == "ru" else "guaranteed") in visible.lower(), visible)
              finally:
                  driver.quit()
              return {"locale": locale, "viewport": "mobile" if width == 390 else "desktop", "checks": checks, "status": "PASS" if all(item["passed"] for item in checks) else "FAIL"}

          ''').lstrip()
          verifier = replace_once(verifier, "def run_case(index, case):\n", helpers + "def run_case(index, case):\n", "helpers")
          old_visible = '        visible = driver.find_element(By.CSS_SELECTOR, "main.liveDialoguePage").text\n        record("no_internal_authority_visible", "ACCEPTED_MARKET_RECORD_AND_VERIFIED" not in visible)\n        record("evidence_disclosure", bool(driver.find_elements(By.CSS_SELECTOR, "details[data-answer-source-boundary]")))'
          new_visible = '        visible = driver.find_element(By.CSS_SELECTOR, "main.liveDialoguePage").text\n        record("no_internal_authority_visible", "ACCEPTED_MARKET_RECORD_AND_VERIFIED" not in visible)\n        _, accessibility = collect_public_projection(driver)\n        combined_projection = f"{visible}\\n{accessibility}"\n        leaked = [token for token in FORBIDDEN_VISIBLE_TOKENS if token in combined_projection]\n        record("no_forbidden_public_projection_tokens", not leaked, ",".join(leaked))\n        record("evidence_disclosure", bool(driver.find_elements(By.CSS_SELECTOR, "details[data-answer-source-boundary]")))'
          verifier = replace_once(verifier, old_visible, new_visible, "base assertion")
          old_runner = dedent('''
          results = []
          error = None
          try:
              for index, case in enumerate(BASE_CASES):
                  results.append(run_case(index, case))
          except Exception as exc:
              error = str(exc)
          ''').lstrip()
          new_runner = dedent('''
          results = []
          projection_results = []
          error = None
          try:
              for index, case in enumerate(BASE_CASES):
                  results.append(run_case(index, case))
              for locale in ("en", "ru"):
                  for width in (1280, 390):
                      projection_results.append(run_projection_case(locale, width))
          except Exception as exc:
              error = str(exc)
          ''').lstrip()
          verifier = replace_once(verifier, old_runner, new_runner, "runner")
          old_report = dedent('''
          report = {
              "schema": "btc_natural_followup_conversation_acceptance_v0_1",
              "status": "PASS" if error is None and len(results) == 24 and all(row["status"] == "PASS" for row in results) else "FAIL",
              "dialogue_count": len(results),
              "required_dialogue_count": 24,
              "results": results,
              "error": error,
          }
          ''').strip()
          new_report = dedent('''
          report = {
              "schema": "btc_natural_followup_conversation_acceptance_v0_1",
              "status": "PASS" if error is None and len(results) == 24 and all(row["status"] == "PASS" for row in results) and len(projection_results) == 4 and all(row["status"] == "PASS" for row in projection_results) else "FAIL",
              "dialogue_count": len(results),
              "required_dialogue_count": 24,
              "projection_count": len(projection_results),
              "required_projection_count": 4,
              "results": results,
              "projection_results": projection_results,
              "error": error,
          }
          ''').strip()
          verifier = replace_once(verifier, old_report, new_report, "report")
          verifier_path.write_text(verifier, encoding="utf-8")

          for path in Path(".github/workflows").glob("_apply-btc-public-enum-disclosure-repair*.yml"):
              path.unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-btc-natural-followup-discovery-static-fixture.mjs | tee /tmp/static.log
          grep -q 'BTC_NATURAL_FOLLOWUP_DISCOVERY_STATIC=22/22_PASS' /tmp/static.log
          python3 -m py_compile scripts/verify-btc-natural-followup-conversations.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove internal enums from BTC public dialogue"
          git push origin HEAD:agent/btc-public-enum-disclosure-repair-v0-1
