name: Market Cosmographer Access Identity Patch

on:
  pull_request:
    paths:
      - "pages/access.tsx"
      - ".github/workflows/market-cosmographer-access-identity-patch-pr.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply bounded public identity patch
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("pages/access.tsx")
          text = path.read_text(encoding="utf-8")
          new = '''            <section className="panel stack" aria-labelledby="market-cosmographer-research-surface">
              <p className="sectionTitle" id="market-cosmographer-research-surface">
                Market Cosmographer · BTC Research Surface
              </p>
              <p className="muted">
                Market Cosmographer is the canonical BHRIGU public research surface for the BTC field. It presents a source-bound market observation, visible source proof, accepted Snapshot Memory, explicit freshness truth, and the BTC Field Read corridor.
              </p>
              <p className="muted">
                This is not a live trading product, prediction service, automated crypto system, backend/API service, or financial-advice route.
              </p>
              <div className="actions">
                <a
                  className="btnSecondary"
                  href="https://aibhrigu.github.io/phi-cosmography-open/crypto-astro/index.html"
                  rel="noopener noreferrer"
                  target="_blank"
                >
                  Open source-proof surface
                </a>
                <Link className="btnSecondary" href="/market-cosmographer">
                  Open Market Cosmographer
                </Link>
              </div>

              <div className="accessBridgeNote" data-crypto-astro-intake="snapshot">
                <div className="eyebrow">Request a Market Cosmographer Snapshot</div>
                <div>
                  Submit a manual or synthetic snapshot context: asset / ticker, UTC snapshot time,
                  observation window, research focus, output language.
                </div>
                <div>
                  Research context only: no trading signal, no prediction, no financial advice,
                  no live market feed, no wallet or exchange connection.
                </div>
                <div>
                  Accepted outputs include snapshot context, proof state, boundary note, and evidence / source notes.
                </div>
              </div>

              <div className="accessBridgeNote" data-crypto-astro-proof-base="btc-eth-sol">
                <div className="eyebrow">Market Cosmographer Proof Base</div>
                <div>
                  The canonical BTC corridor is live verified. Deeper delivery remains operator-gated while intake durability, operator retrieval and delivery policy are separately proven.
                </div>
                <div>
                  This is not a live automated client service, trading signal, price target, or financial advice.
                </div>
              </div>
            </section>'''

          if 'id="market-cosmographer-research-surface"' not in text:
              pattern = r'(?ms)^\s{12}<section className="panel stack" aria-labelledby="crypto-astro-research-surface">.*?^\s{12}</section>'
              text, count = re.subn(pattern, new, text, count=1)
              if count != 1:
                  raise SystemExit(f"bounded block replacement count={count}")
              path.write_text(text, encoding="utf-8")

          assert text.count('id="market-cosmographer-research-surface"') == 1
          assert text.count('href="/market-cosmographer"') >= 1
          assert 'Open Market Cosmographer' in text
          assert 'Market Cosmographer · BTC Research Surface' in text
          assert 'accepted Snapshot Memory' in text
          assert 'explicit freshness truth' in text
          assert 'Crypto-Astro Research Surface' not in text
          assert 'Open Crypto-Astro proof route' not in text
          assert 'Request a Crypto-Astro Snapshot' not in text
          assert 'Crypto-Astro Local Proof Base' not in text
          assert 'href="https://aibhrigu.github.io/phi-cosmography-open/crypto-astro/index.html"' in text
          assert 'data-crypto-astro-intake="snapshot"' in text
          assert 'data-crypto-astro-proof-base="btc-eth-sol"' in text
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build accepted portal surface
        run: npm run build
      - name: Commit bounded page patch
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Patch already present"
            exit 0
          fi
          test "$changed" = "pages/access.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/access.tsx
          git commit -m "Access: complete Market Cosmographer public identity"
          git push origin "HEAD:${{ github.head_ref }}"
