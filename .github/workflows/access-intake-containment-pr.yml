name: BHRIGU Access Private Intake Contract

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/access-intake-containment-pr.yml"
      - "lib/access-intake-config.ts"
      - "lib/access-intake-neon.ts"
      - "lib/access-intake-runtime.ts"
      - "lib/access-review-auth0.ts"
      - "lib/access-models.ts"
      - "pages/access-review.tsx"
      - "pages/access.tsx"
      - "pages/api/access/submit.ts"
      - "pages/api/founding/phi-btc-timing-windows/request.ts"
      - "tests/access-private-intake-acceptance.ts"
      - "migrations/20260809_access_private_intake_v1.sql"
  push:
    branches: [master]
    paths:
      - ".github/workflows/access-intake-containment-pr.yml"
      - "lib/access-intake-config.ts"
      - "lib/access-intake-neon.ts"
      - "lib/access-intake-runtime.ts"
      - "lib/access-review-auth0.ts"
      - "lib/access-models.ts"
      - "pages/access-review.tsx"
      - "pages/access.tsx"
      - "pages/api/access/submit.ts"
      - "pages/api/founding/phi-btc-timing-windows/request.ts"
      - "tests/access-private-intake-acceptance.ts"
      - "migrations/20260809_access_private_intake_v1.sql"

permissions:
  contents: read

concurrency:
  group: bhrigu-access-private-intake-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  current-contract-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install exact dependency graph
        run: npm ci
      - name: Verify current private intake contract
        run: npm run verify:access-private-intake

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Build application without postbuild provider actions
        run: npx next build
