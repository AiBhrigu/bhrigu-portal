name: Φ Gate

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: bhrigu-access-repair-transport-v0-1
  cancel-in-progress: true

env:
  LOCKED_BASE_SHA: 99997ade460cd9cb6fd52e5c1896f61613a20fee
  REPAIR_BRANCH: agent/bhrigu-access-scoped-style-mobile-priority-repair-v0-1
  REPAIR_PR: "85"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  access-exact-head-evidence:
    if: github.event.pull_request.head.ref == 'agent/bhrigu-access-repair-transport-v0-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Access repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 0

      - name: Apply measured density repair and clean transport residue
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'pages/access.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const oldBlock = `  .accessPage .formFrame { gap: 20px; }
  .accessPage .formSection { gap: 14px; }
  .accessPage .formHero { gap: 10px; }`;
          const newBlock = `  .accessPage .accessWorkflowPanel { padding: 14px; }
  .accessPage .formFrame { gap: 12px; }
  .accessPage .formSection { gap: 10px; }
  .accessPage .formSectionHeader { gap: 5px; }
  .accessPage .formHero { gap: 8px; padding-bottom: 10px; }
  .accessPage .accessWorkflowPanel .grid2,
  .accessPage .accessWorkflowPanel .grid2Asymmetric { gap: 12px; }
  .accessPage .accessWorkflowPanel .field { gap: 7px; }
  .accessPage .accessWorkflowPanel .checkboxField { padding: 14px 16px; }
  .accessPage .submitRow { padding-top: 0; }`;
          if (!source.includes(oldBlock)) throw new Error('locked mobile density block missing');
          source = source.replace(oldBlock, newBlock).replace(/[ \t]+$/gm, '');
          fs.writeFileSync(path, source);
          NODE
          rm -f .github/workflows/bhrigu-access-mobile-density-evidence-v3.yml
          rm -f .github/workflows/bhrigu-access-mobile-density-apply-v4.yml
          git checkout "$LOCKED_BASE_SHA" -- .github/workflows/phi-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/access.tsx .github/workflows
          git commit -m "Compact Access mobile workflow density"
          git push origin HEAD:"$REPAIR_BRANCH"
          final_head="$(git rev-parse HEAD)"
          echo "FINAL_HEAD=$final_head" >> "$GITHUB_ENV"

      - name: Publish observable run anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/$REPAIR_PR/comments --method POST --field body="## OPS/F transport exact-head run

- final head under review: \`$FINAL_HEAD\`
- workflow run: \`${{ github.run_id }}\`
- state: \`VALIDATION_IN_PROGRESS\`
- transport PR: \`${{ github.event.pull_request.number }}\`"

      - name: Prove exact one-file net scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$LOCKED_BASE_SHA" HEAD
          git diff --name-only "$LOCKED_BASE_SHA...HEAD" | sort > /tmp/actual-scope.txt
          printf '%s\n' 'pages/access.tsx' > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          test "$(git diff --numstat "$LOCKED_BASE_SHA...HEAD" | wc -l)" -eq 1
          git diff --check "$LOCKED_BASE_SHA...HEAD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify inherited contracts
        run: |
          npm run verify:btc-paid-x402-sandbox
          npm run verify:btc-routing
          npm run verify:btc-binance-observation

      - name: Install Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: npx playwright install --with-deps chromium

      - name: Build production portal
        run: npm run build

      - name: Start production localhost
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run start -- --hostname 127.0.0.1 --port 4317 > artifacts/server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4317/access >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/server.log
          exit 1

      - name: Prove Access layout and Request to Dates
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const evidence = { final_head: process.env.FINAL_HEAD, status: 'PASS' };
          try {
            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
            const page = await mobile.newPage();
            const response = await page.goto('http://127.0.0.1:4317/access', { waitUntil: 'networkidle', timeout: 45000 });
            if (!response || response.status() !== 200) throw new Error(`status ${response?.status()}`);
            const m = await page.evaluate(() => {
              const input = document.querySelector('.fieldControl');
              const textarea = document.querySelector('textarea.fieldControl');
              const button = Array.from(document.querySelectorAll('button')).find(n => n.textContent?.trim() === 'Continue');
              const context = document.querySelector('.accessContextPanel');
              if (!input || !textarea || !button || !context) return { missing: true };
              const box = n => { const r=n.getBoundingClientRect(); return { top:r.top+scrollY,width:r.width,height:r.height }; };
              return { missing:false, pageHeight:document.documentElement.scrollHeight, viewportWidth:innerWidth, scrollWidth:document.documentElement.scrollWidth, input:box(input), textarea:box(textarea), button:box(button), context:box(context), notice:Boolean(document.querySelector('.noticeStack')), inputRadius:getComputedStyle(input).borderRadius, buttonRadius:getComputedStyle(button).borderRadius };
            });
            if (m.missing) throw new Error('elements missing');
            if (m.input.top > 1974) throw new Error(`first control y ${m.input.top}`);
            if (m.button.top > 2550) throw new Error(`Continue y ${m.button.top}`);
            if (m.input.height < 53 || m.textarea.height < 145 || m.button.height < 49) throw new Error('control dimensions');
            if (m.button.width < 300) throw new Error(`CTA width ${m.button.width}`);
            if (m.scrollWidth > m.viewportWidth + 1) throw new Error('overflow');
            if (m.input.top >= m.context.top) throw new Error('workflow ordering');
            if (m.notice) throw new Error('empty notice reserve');
            if (m.inputRadius === '0px' || m.buttonRadius === '0px') throw new Error('native styling');
            await page.getByLabel('Name').fill('Access Proof');
            await page.getByLabel('Email').fill('proof@example.com');
            await page.getByLabel('Subject type').selectOption({ label: 'Project' });
            await page.getByLabel('Main question').fill('How should this project be structured?');
            await page.getByLabel('Short description').fill('Deterministic local transition proof.');
            await page.getByLabel('Preferred depth').selectOption({ label: 'Structured Snapshot' });
            await page.locator('input[type="checkbox"]').first().check();
            await page.getByRole('button', { name: 'Continue', exact: true }).click();
            await page.getByText('Relevant dates', { exact: true }).waitFor({ state: 'visible' });
            evidence.mobile = { ...m, request_to_dates: 'PASS' };
            await page.screenshot({ path:'artifacts/access-mobile-repaired.png', fullPage:true });
            await mobile.close();
            const desktop = await browser.newContext({ viewport:{ width:1440,height:1200 }, locale:'en-US' });
            const dp = await desktop.newPage();
            await dp.goto('http://127.0.0.1:4317/access', { waitUntil:'networkidle' });
            const d = await dp.evaluate(() => { const i=document.querySelector('.fieldControl'); const c=document.querySelector('.accessContextPanel'); if(!i||!c)return{missing:true}; const ir=i.getBoundingClientRect(),cr=c.getBoundingClientRect(); return{missing:false,inputTop:ir.top+scrollY,contextTop:cr.top+scrollY,inputHeight:ir.height,overflow:document.documentElement.scrollWidth-innerWidth}; });
            if (d.missing || d.contextTop >= d.inputTop || d.inputHeight < 53 || d.overflow > 1) throw new Error('desktop preservation');
            evidence.desktop = d;
            await dp.screenshot({ path:'artifacts/access-desktop-repaired.png', fullPage:true });
            await desktop.close();
          } finally { await browser.close(); }
          fs.writeFileSync('artifacts/access-layout-audit.json', JSON.stringify(evidence,null,2));
          NODE

      - name: Run full visual harness
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
          BHRIGU_VISUAL_ARTIFACT_ROOT: artifacts/local-visual
        run: |
          export BHRIGU_VISUAL_SOURCE_SHA="$FINAL_HEAD"
          export BHRIGU_VISUAL_HARNESS_SHA="$FINAL_HEAD"
          node scripts/local-visual/capture.mjs

      - name: Prove 50 of 50
        run: |
          manifest="$(find artifacts/local-visual -name manifest.json -type f | sort | tail -n 1)"
          node - "$manifest" <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for (const [k,v] of Object.entries({public_routes_and_scenarios:25,expected_captures:50,completed_captures:50,passing_captures:50,blocking_captures:0,production_writes:0,vercel_writes:0,x402_live_transfers:0})) if(d[k]!==v) throw new Error(`${k} ${d[k]}`);
          if(d.status!=='PASS') throw new Error(d.status);
          NODE

      - name: Publish accepted evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          first="$(node -e "const d=require('./artifacts/access-layout-audit.json');console.log(d.mobile.input.top)")"
          cta="$(node -e "const d=require('./artifacts/access-layout-audit.json');console.log(d.mobile.button.top)")"
          height="$(node -e "const d=require('./artifacts/access-layout-audit.json');console.log(d.mobile.pageHeight)")"
          gh api repos/${{ github.repository }}/issues/$REPAIR_PR/comments --method POST --field body="## OPS/F exact-head evidence accepted

- final repair head: \`$FINAL_HEAD\`
- workflow run: \`${{ github.run_id }}\`
- exact net scope: \`pages/access.tsx\`
- first mobile control Y: \`$first px\`
- first mobile Continue Y: \`$cta px\`
- mobile page height: \`$height px\`
- scoped styles: \`PASS\`
- Request → Dates: \`PASS\`
- production build: \`PASS\`
- visual captures: \`50/50 PASS\`
- artifact: \`bhrigu-access-mobile-conversion-evidence-${{ github.run_id }}\`"

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/$REPAIR_PR/comments --method POST --field body="## OPS/F transport evidence blocked

- workflow run: \`${{ github.run_id }}\`
- state: \`FAIL_CLOSED\`"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhrigu-access-mobile-conversion-evidence-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 7
