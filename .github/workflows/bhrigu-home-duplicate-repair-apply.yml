name: BHRIGU Home Duplicate Repair Apply

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/bhrigu-home-duplicate-repair-apply.yml"

permissions:
  contents: write

concurrency:
  group: bhrigu-home-duplicate-repair-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 113
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 7289aa0fe048c596e0d1b2c260aa7aeecfb3a509
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact repair transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Prove exact input ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse --abbrev-ref HEAD)" = "HEAD"

      - name: Apply duplicate identity repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path("pages/index.js")
          css_path = Path("pages/index.module.css")
          index = index_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    languageLabel: "RU",\n    languageHref: "/?lang=ru",\n    languageAria: "View this page in Russian",\n',
                  '',
              ),
              (
                  '    languageLabel: "EN",\n    languageHref: "/?lang=en",\n    languageAria: "Открыть страницу на английском",\n',
                  '',
              ),
              (
                  '''function LanguageLink({ copy }) {
  return (
    <Link
      className={styles.languageLink}
      href={copy.languageHref}
      aria-label={copy.languageAria}
    >
      {copy.languageLabel}
    </Link>
  );
}

''',
                  '',
              ),
              (
                  '''            <div className={styles.heroTopline}>
              <p className={styles.brand}>BHRIGU</p>
              <LanguageLink copy={copy} />
            </div>
''',
                  '',
              ),
          ]
          for old, new in replacements:
              if index.count(old) != 1:
                  raise SystemExit(f"INDEX_REPLACEMENT_COUNT_INVALID:{index.count(old)}:{old[:48]!r}")
              index = index.replace(old, new)

          css_replacements = [
              (
                  '''.heroTopline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 44px;
}

''',
                  '',
              ),
              (
                  '''.brand,
.product,
.category,
.eyebrow {''',
                  '''.product,
.category,
.eyebrow {''',
              ),
              (
                  '''.brand {
  color: var(--home-gold-bright);
  font-size: 13px !important;
  font-weight: 700;
  letter-spacing: 0.34em;
}

''',
                  '',
              ),
              (
                  '''.languageLink {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  min-height: 38px;
  border: 1px solid var(--home-line);
  color: var(--home-muted) !important;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-decoration: none !important;
}

''',
                  '',
              ),
              (
                  '''  .heroTopline {
    margin-bottom: 22px;
  }

''',
                  '',
              ),
          ]
          for old, new in css_replacements:
              if css.count(old) != 1:
                  raise SystemExit(f"CSS_REPLACEMENT_COUNT_INVALID:{css.count(old)}:{old[:48]!r}")
              css = css.replace(old, new)

          forbidden_index = [
              "function LanguageLink",
              "<LanguageLink",
              "styles.languageLink",
              "styles.heroTopline",
              "styles.brand",
              "languageLabel:",
              "languageHref:",
              "languageAria:",
          ]
          for marker in forbidden_index:
              if marker in index:
                  raise SystemExit(f"INDEX_FORBIDDEN_MARKER:{marker}")

          for marker in (".heroTopline", ".languageLink", ".brand"):
              if marker in css:
                  raise SystemExit(f"CSS_FORBIDDEN_MARKER:{marker}")

          expected_start = '''          <div className={styles.heroCopy}>
            <p className={styles.product}>MARKET COSMOGRAPHER</p>
            <p className={styles.category}>{copy.category}</p>'''
          if expected_start not in index:
              raise SystemExit("HERO_START_CONTRACT_MISSING")

          index_path.write_text(index, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          print("BHRIGU_HOME_DUPLICATE_REPAIR=PASS")
          PY

      - name: Verify exact product delta
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | paste -sd, -)" = "pages/index.js,pages/index.module.css"
          git diff --check

      - name: Commit product repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js pages/index.module.css
          git commit -m "Repair duplicate Home identity and language control"
          git push origin "HEAD:${HEAD_BRANCH}"
