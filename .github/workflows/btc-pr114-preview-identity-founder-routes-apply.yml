name: BTC PR114 Preview Identity Founder Routes Apply

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/btc-pr114-preview-identity-founder-routes-apply.yml
      - scripts/apply-btc-pr114-preview-identity-founder-routes-v0-2.py

concurrency:
  group: btc-pr114-preview-identity-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/btc-cosmographer-evidence-navigation-runtime-v0-1
          fetch-depth: 0

      - name: Verify bounded source contour
        run: |
          test "$(git branch --show-current)" = "agent/btc-cosmographer-evidence-navigation-runtime-v0-1"
          test -f scripts/apply-btc-pr114-preview-identity-founder-routes-v0-2.py
          test -f .github/workflows/btc-pr114-preview-identity-founder-routes-apply.yml
          git merge-base --is-ancestor edf9eaae049aeb7b93d7885818ab6880fe17a0a0 HEAD

      - name: Normalize regex target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-btc-pr114-preview-identity-founder-routes-v0-2.py")
          value = path.read_text(encoding="utf-8")
          count = value.count("*/iu;")
          if count != 2:
              raise SystemExit(f"expected two unicode regex flags, found {count}")
          path.write_text(value.replace("*/iu;", "*/i;"), encoding="utf-8")
          print({"status": "PASS_REGEX_TARGET_NORMALIZATION", "replacements": count})
          PY

      - name: Apply exact runtime and acceptance repair
        run: python3 scripts/apply-btc-pr114-preview-identity-founder-routes-v0-2.py

      - name: Remove one-shot helpers
        run: |
          rm scripts/apply-btc-pr114-preview-identity-founder-routes-v0-2.py
          rm .github/workflows/btc-pr114-preview-identity-founder-routes-apply.yml

      - name: Verify retained exact nine-file boundary
        shell: bash
        run: |
          mapfile -t actual < <(git diff --name-only e07da6f6d216d28621b8592ecf8c066b05897ba9 | sort)
          mapfile -t expected < <(printf '%s\n' \
            .github/scripts/verify-btc-public-acceptance-scope.py \
            .github/workflows/btc-evidence-navigation-runtime-pr.yml \
            components/btc/BtcCosmographerDialogue.tsx \
            lib/btc-cosmographer-answer.ts \
            lib/btc-cosmographer-evidence-navigation-runtime.ts \
            lib/btc-live-dialogue-session.ts \
            lib/btc-live-dialogue-style.ts \
            pages/crypto-astro/btc/live.tsx \
            scripts/run-btc-evidence-navigation-runtime-fixture.mjs | sort)
          printf 'actual=%s\n' "${actual[*]}"
          test "${actual[*]}" = "${expected[*]}"
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify runtime fixture and inherited routing
        run: |
          node scripts/run-btc-evidence-navigation-runtime-fixture.mjs
          npm run verify:btc-routing

      - name: Verify production build
        run: npm run build

      - name: Commit exact candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair PR114 exact Preview identity and founder routes"

      - name: Verify permanent exact scope gate
        env:
          BTC_ACCEPTANCE_BASE_SHA: e07da6f6d216d28621b8592ecf8c066b05897ba9
        run: |
          export BTC_ACCEPTANCE_HEAD_SHA="$(git rev-parse HEAD)"
          export GITHUB_EVENT_NAME=pull_request
          python3 .github/scripts/verify-btc-public-acceptance-scope.py

      - name: Push exact candidate
        run: git push origin HEAD:agent/btc-cosmographer-evidence-navigation-runtime-v0-1

      - name: Bind exact-head implementation status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/statuses/{sha}",
              data=json.dumps({
                  "state": "success",
                  "context": "BTC PR114 Preview Identity Runtime Repair Exact Head",
                  "description": "9-file scope, 61-check runtime fixture, inherited routing and production build passed",
              }).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              assert response.status == 201, response.status
          PY
