name: OPS BTC Visual Session v0.3 Repair

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/_ops-btc-visual-session-v03-fix.yml

permissions:
  contents: write

jobs:
  patch-verifier:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch stale visual session key
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-btc-public-live-visual-information-acceptance.py")
          text = path.read_text(encoding="utf-8")
          old = '''def session_turn_count(driver):
    return int(driver.execute_script(
        """
        const raw=sessionStorage.getItem('bhrigu:btc-free-dialogue:session:v0_1');
        if(!raw) return 0;
        try {
          const value=JSON.parse(raw);
          return Array.isArray(value.turns) ? value.turns.length : 0;
        } catch (_) {
          return -1;
        }
        """
    ))
'''
          new = '''def session_turn_count(driver):
    return int(driver.execute_script(
        """
        const root=document.querySelector('main[data-session-schema]');
        const meta=document.querySelector('meta[name="btc-dialogue-session-schema"]');
        const schema=(root && root.dataset.sessionSchema) || (meta && meta.content) || '';
        const keys=schema === 'btc_cosmographer_dialogue_session_v0_3'
          ? ['bhrigu:btc-cosmographer:session:v0_3']
          : ['bhrigu:btc-free-dialogue:session:v0_1','bhrigu:btc-cosmographer:session:v0_3'];
        for (const key of keys) {
          const raw=sessionStorage.getItem(key);
          if(!raw) continue;
          try {
            const value=JSON.parse(raw);
            return Array.isArray(value.turns) ? value.turns.length : 0;
          } catch (_) {
            return -1;
          }
        }
        return 0;
        """
    ))
'''
          if text.count(old) != 1:
              raise SystemExit(f"stale session function match count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit verifier-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-btc-public-live-visual-information-acceptance.py
          test "$(git diff --cached --name-only)" = "scripts/verify-btc-public-live-visual-information-acceptance.py"
          git commit -m "Bind visual acceptance to dialogue session v0.3"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
