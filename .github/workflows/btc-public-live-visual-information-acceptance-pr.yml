name: BTC Public Live Visual Information Acceptance

on:
  pull_request:
    paths:
      - .github/scripts/verify-btc-public-acceptance-scope.py
      - .github/workflows/btc-public-live-visual-information-acceptance-pr.yml
      - components/btc/BtcCosmographerDialogue.tsx
      - lib/btc-cosmographer-public-multi-body-projection.ts
      - lib/btc-live-dialogue-style.ts
      - pages/crypto-astro/btc/live.tsx
      - scripts/verify-btc-public-live-copy-canon.mjs
      - scripts/verify-btc-public-live-visual-information-acceptance.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-public-live-visual-information-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-information-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BTC_ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BTC_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact public acceptance scope
        run: python3 .github/scripts/verify-btc-public-acceptance-scope.py

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install portal dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install visual driver
        run: python -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Bind visual verifier to current session contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-btc-public-live-visual-information-acceptance.py")
          text = path.read_text(encoding="utf-8")
          old = "const raw=sessionStorage.getItem('bhrigu:btc-free-dialogue:session:v0_1');"
          new = "const raw=sessionStorage.getItem('bhrigu:btc-cosmographer:session:v0_3') || sessionStorage.getItem('bhrigu:btc-free-dialogue:session:v0_1');"
          if text.count(old) != 1:
              raise SystemExit(f"visual session key binding count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Start exact-head production preview
        run: |
          set -euo pipefail
          npm run start -- -p 3112 > /tmp/btc-public-live-visual.log 2>&1 &
          echo $! > /tmp/btc-public-live-visual.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:3112/crypto-astro/btc/live?lang=ru" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/btc-public-live-visual.log
          exit 1

      - name: Render and verify public visual information design
        env:
          BTC_COSMOGRAPHER_PREVIEW_BASE: http://127.0.0.1:3112
        run: python scripts/verify-btc-public-live-visual-information-acceptance.py

      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/btc-public-live-visual.pid; then kill "$(cat /tmp/btc-public-live-visual.pid)" || true; fi

      - name: Upload screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-public-live-visual-information-${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          path: artifacts/btc-public-live-visual-acceptance/
          if-no-files-found: error
          retention-days: 30
