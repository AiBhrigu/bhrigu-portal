name: BTC Public Live Visual Information Acceptance

on:
  pull_request:
    paths:
      - .github/workflows/btc-public-live-multi-body-projection-apply.yml
      - .github/workflows/btc-public-live-multi-body-projection-pr.yml
      - .github/workflows/btc-public-live-visual-information-acceptance-pr.yml
      - components/btc/BtcCosmographerDialogue.tsx
      - docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_PR101_PUBLIC_LIVE_VISUAL_AND_INFORMATION_DESIGN_ACCEPTANCE_v0_1.md
      - lib/btc-cosmographer-public-multi-body-projection.ts
      - lib/btc-live-dialogue-session.ts
      - lib/btc-live-dialogue-style.ts
      - pages/crypto-astro/btc/live.tsx
      - scripts/apply-btc-public-live-multi-body-projection.py
      - scripts/verify-btc-public-live-copy-canon.mjs
      - scripts/verify-btc-public-live-multi-body-projection.mjs
      - scripts/verify-btc-public-live-visual-information-acceptance.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-public-live-visual-information-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-information-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify isolated, combined, or integrated exact scope
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", base, head],
                  text=True,
              ).splitlines()
          )
          semantic_scope = {
              ".github/workflows/btc-free-question-live-dialogue-pr.yml",
              "components/btc/BtcCosmographerDialogue.tsx",
              "data/btc_public_astro_evidence_v0_1.json",
              "lib/btc-cosmographer-answer.ts",
              "lib/btc-cosmographer-route-graph.ts",
              "lib/btc-live-dialogue-session.ts",
              "lib/btc-protocol-evidence.ts",
              "lib/btc-public-astro-evidence.ts",
              "pages/crypto-astro/btc/live.tsx",
              "scripts/run-btc-cosmographer-semantic-route-fixture.mjs",
              "scripts/verify-btc-cosmographer-route-surface.py",
          }
          local_scope = {
              ".github/workflows/btc-cosmographer-multi-body-local-rc-pr.yml",
              ".github/workflows/btc-cosmographer-multi-body-local-linux-pinned-v0-5.yml",
              "lib/btc-cosmographer-multi-body-astro-rc.ts",
              "components/btc/BtcCosmographerMultiBodyAstroRc.tsx",
              "pages/crypto-astro/btc/local-rc.tsx",
              "scripts/run-btc-cosmographer-multi-body-local-rc-fixture.mjs",
              "scripts/run-btc-cosmographer-multi-body-local-linux-pinned-v0-5.sh",
              "scripts/run-btc-cosmographer-multi-body-pinned-v0-5-semantic-acceptance.mjs",
              "scripts/verify-btc-cosmographer-local-rc-usability.py",
              "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_LINUX_RELEASE_CANDIDATE_v0_1.md",
              "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_LINUX_PINNED_V0_5_ACCEPTANCE_v0_1.md",
              "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_LOCAL_RC_USABILITY_AND_INFORMATION_DESIGN_TARGETED_REPAIR_v0_1.md",
          }
          projection_scope = {
              ".github/workflows/btc-public-live-multi-body-projection-apply.yml",
              ".github/workflows/btc-public-live-multi-body-projection-pr.yml",
              ".github/workflows/btc-public-live-visual-information-acceptance-pr.yml",
              "components/btc/BtcCosmographerDialogue.tsx",
              "docs/research/BTC_COSMOGRAPHER_MULTI_BODY_ASTRO_CORRIDOR_PR101_PUBLIC_LIVE_VISUAL_AND_INFORMATION_DESIGN_ACCEPTANCE_v0_1.md",
              "lib/btc-cosmographer-public-multi-body-projection.ts",
              "lib/btc-live-dialogue-session.ts",
              "lib/btc-live-dialogue-style.ts",
              "pages/crypto-astro/btc/live.tsx",
              "scripts/apply-btc-public-live-multi-body-projection.py",
              "scripts/verify-btc-public-live-copy-canon.mjs",
              "scripts/verify-btc-public-live-multi-body-projection.mjs",
              "scripts/verify-btc-public-live-visual-information-acceptance.py",
          }
          combined_scope = projection_scope | local_scope
          integrated_scope = semantic_scope | combined_scope
          if changed == projection_scope:
              status = "PASS_PUBLIC_VISUAL_ISOLATED_13_FILE_SCOPE"
          elif changed == combined_scope:
              status = "PASS_PUBLIC_VISUAL_COMBINED_25_FILE_SCOPE"
          elif changed == integrated_scope:
              status = "PASS_PUBLIC_VISUAL_INTEGRATED_33_FILE_SCOPE"
          else:
              if semantic_scope & changed:
                  expected = integrated_scope
              elif local_scope & changed:
                  expected = combined_scope
              else:
                  expected = projection_scope
              raise SystemExit(
                  "scope mismatch: "
                  f"unexpected={sorted(changed - expected)}, "
                  f"missing={sorted(expected - changed)}, "
                  f"actual_count={len(changed)}"
              )
          print({"status": status, "changed": sorted(changed)})
          PY

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install portal dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install visual driver
        run: python -m pip install --disable-pip-version-check selenium==4.29.0

      - name: Start exact-head production preview
        run: |
          set -euo pipefail
          npm run start -- -p 3112 > /tmp/btc-public-live-visual.log 2>&1 &
          echo $! > /tmp/btc-public-live-visual.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:3112/crypto-astro/btc/live?lang=ru" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/btc-public-live-visual.log
          exit 1

      - name: Render and verify public visual information design
        env:
          BTC_COSMOGRAPHER_PREVIEW_BASE: http://127.0.0.1:3112
        run: python scripts/verify-btc-public-live-visual-information-acceptance.py

      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/btc-public-live-visual.pid; then kill "$(cat /tmp/btc-public-live-visual.pid)" || true; fi

      - name: Upload screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-public-live-visual-information-${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          path: artifacts/btc-public-live-visual-acceptance/
          if-no-files-found: error
          retention-days: 30
