name: BHRIGU Public Surface Integrity
on:
  pull_request:
    branches: [master]
    paths:
      - 'pages/**'
      - 'components/BhriguPhiHeader.jsx'
      - 'components/PrevNextBlock.jsx'
      - 'components/PortalFooterNav.jsx'
      - 'public/sitemap.xml'
      - 'public/llms.txt'
      - '.github/workflows/bhrigu-public-surface-integrity-pr.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_ENV: preview
      ACCESS_PRIVATE_INTAKE_MODE: neon_auth0_resend_v1
      ACCESS_RESEND_DOMAIN_VERIFIED: 'true'
      DATABASE_URL: postgresql://bhrigu_ci:bhrigu_ci@127.0.0.1:1/bhrigu_ci
      RESEND_API_KEY: re_ci_invalid_post_guard_only
      ACCESS_PRIVATE_REVIEW_MODE: auth0_neon_v1
      AUTH0_DOMAIN: ci.invalid
      AUTH0_CLIENT_ID: ci
      AUTH0_CLIENT_SECRET: ci
      AUTH0_SECRET: ci
      APP_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Protected diff gate
        run: |
          git fetch origin master
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          mapfile -t actual < <(git diff --name-only "$base" "$head" | sort)
          public_pilot_cost_guard_expected=(
            ".github/workflows/bhrigu-public-surface-integrity-pr.yml"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "lib/btc-clean-chat-cost-guard.ts"
            "migrations/20260905_btc_clean_chat_cost_guard_public_pilot_v3.sql"
            "scripts/btc-direct-payment-fresh-db-migration.ts"
            "tests/btc-clean-chat-cost-guard-acceptance.ts"
          )
          mapfile -t public_pilot_cost_guard_expected_sorted < <(printf '%s\n' "${public_pilot_cost_guard_expected[@]}" | sort)
          if diff -q <(printf '%s\n' "${public_pilot_cost_guard_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_CLEAN_CHAT_PUBLIC_PILOT_COST_GUARD_PUBLIC_SURFACE_EXACT_6_FILE_SCOPE"
            exit 0
          fi
          cost_guard_expected=(
            ".github/workflows/bhrigu-public-surface-integrity-pr.yml"
            ".github/workflows/btc-clean-chat-v1-pr.yml"
            "lib/btc-clean-chat-cost-guard-neon.ts"
            "lib/btc-clean-chat-cost-guard.ts"
            "lib/btc-clean-chat-model-runtime.ts"
            "migrations/20260830_btc_clean_chat_cost_guard_v2.sql"
            "pages/api/btc/clean-chat-v1.ts"
            "scripts/btc-direct-payment-fresh-db-migration.ts"
            "tests/btc-clean-chat-cost-guard-acceptance.ts"
            "ui/btc/BtcCleanChatV1.tsx"
          )
          mapfile -t cost_guard_expected_sorted < <(printf '%s\n' "${cost_guard_expected[@]}" | sort)
          if diff -q <(printf '%s\n' "${cost_guard_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_BTC_CLEAN_CHAT_COST_GUARD_PUBLIC_SURFACE_EXACT_10_FILE_SCOPE"
            exit 0
          fi
          founder_expected=(
            ".github/workflows/bhrigu-public-surface-integrity-pr.yml"
            "lib/access-intake-neon.ts"
            "pages/api/founding/phi-btc-timing-windows/request.ts"
            "pages/founding/phi-btc-timing-windows.tsx"
            "pages/founding/phi-btc-timing-windows/request.tsx"
          )
          mapfile -t founder_expected_sorted < <(printf '%s\n' "${founder_expected[@]}" | sort)
          if diff -q <(printf '%s\n' "${founder_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_PHI_BTC_TIMING_WINDOWS_FOUNDING_PUBLIC_SURFACE_EXACT_5_FILE_SCOPE"
            exit 0
          fi
          founder_attribution_expected=(
            ".github/workflows/bhrigu-public-surface-integrity-pr.yml"
            "lib/access-intake-neon.ts"
            "pages/access-review.tsx"
            "pages/api/founding/phi-btc-timing-windows/request.ts"
            "pages/founding/phi-btc-timing-windows.tsx"
            "pages/founding/phi-btc-timing-windows/request.tsx"
            "tests/access-private-intake-acceptance.ts"
          )
          mapfile -t founder_attribution_expected_sorted < <(printf '%s\n' "${founder_attribution_expected[@]}" | sort)
          if diff -q <(printf '%s\n' "${founder_attribution_expected_sorted[@]}") <(printf '%s\n' "${actual[@]}") >/dev/null; then
            echo "PASS_PHI_BTC_TIMING_WINDOWS_FOUNDING_ATTRIBUTION_EXACT_7_FILE_SCOPE"
            exit 0
          fi
          protected=$(git diff --name-only "$base" "$head" -- lib/routeTruth.js pages/_document.js lib/public-locale-transport.js public/robots.txt pages/crypto-astro/btc.tsx pages/crypto-astro/btc/live.tsx pages/crypto-astro/btc/clean-chat.tsx pages/crypto-astro/btc/local-rc.tsx 'pages/crypto-astro/btc/field/**' components/btc ui/btc pages/api 'lib/btc-*')
          test -z "$protected" || { echo "$protected"; exit 1; }
      - name: Static truth gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          header=Path('components/BhriguPhiHeader.jsx').read_text()
          home=Path('pages/index.js').read_text()
          reading=Path('pages/reading.js').read_text()
          frey=Path('pages/frey.js').read_text()
          app=Path('pages/_app.js').read_text()
          sitemap=Path('public/sitemap.xml').read_text()
          llms=Path('public/llms.txt').read_text()
          checks={
            'INVESTORS_TRUTH':'Capital Alignment Layer' not in Path('pages/investors.js').read_text() and 'paid service contracts' not in Path('pages/investors.js').read_text(),
            'ACCESS_CLOSED':'temporarily closed' in Path('pages/access.tsx').read_text(),
            'SIGNAL_ARCHIVE':'HISTORICAL SIGNAL' in Path('pages/signal.js').read_text(),
            'CHRONICLE_DATED':'JANUARY 2026 SNAPSHOT' in Path('pages/chronicle.js').read_text(),
            'SITEMAP_BILINGUAL':'?lang=ru' in sitemap and '?lang=en' in sitemap,
            'SITEMAP_CURRENT_GRAPH':all(route in sitemap for route in ['/start?lang=ru','/reading?lang=ru','/guide/frey?lang=ru','/faq?lang=ru','/cosmography?lang=ru','/access?lang=ru']),
            'SITEMAP_HREFLANG_SYMMETRY':sitemap.count('hreflang="x-default"') == sitemap.count('<url>') and sitemap.count('hreflang="en"') == sitemap.count('<url>') and sitemap.count('hreflang="ru"') == sitemap.count('<url>'),
            'LLMS_CURRENT_GRAPH':all(token in llms for token in ['## Machine-readable public graph','## Frey public method and reading surfaces','### Frey AI Reading Packet','## Machine-reading boundary','/guide/frey?lang=ru','/reading?lang=ru']),
            'HEADER_CANON_PRESERVED':'BHRIGU_PUBLIC_HOME_HEADER_V0_1' in header and 'bh-plaque' in header and 'bh-word' in header,
            'READING_RU_BOUND':'locale === "ru"' in reading and 'Темпоральное чтение Frey' in reading and 'Временной якорь' in reading,
            'FREY_RU_BOUND':'initialLocale === "ru"' in frey and 'FREY_RU_TEXT' in frey and 'PublicSupportRoute locale={initialLocale}' in frey,
            'FREY_EXACT_TRANSLATOR':'out.split(en).join(translated)' not in frey and 'const exact = FREY_RU_TEXT.get(value);' in frey and '.map((segment) => FREY_RU_TEXT.get(segment) || segment)' in frey,
            'FREY_RAW_STATE':'data-frey-response-state={responseSurface.ui_state}' in frey,
            'FREY_HUMAN_NAV':'Продолжить чтение' in frey and 'Сравнить со второй датой · Δ изменения' in frey and 'Для другого ИИ · Пакет чтения' in frey,
            'MACHINE_GRAPH_BOUND':'OSI_PHI_PUBLIC_RELATIONS_V0_1' in app and 'buildMachineGraph(path,lang)' in app and 'Frey AI Reading Packet' in app,
            'MACHINE_METADATA_UNIQUENESS':'PAGE_OWNS_METADATA' in app and '"/crypto-astro/btc","/crypto-astro/btc/clean-chat"' in app,
            'HOME_LOCALE_LINKS':'/frey?lang=${locale}' in home and '/cosmographer?lang=${locale}' in home and '/orion?lang=${locale}' in home,
            'HOME_JSONLD_LOCALE':'inLanguage:locale' in home and 'buildJsonLd(locale)' in home,
            'HOME_META_DEDUP':'<Head><title>Market Cosmographer' not in home,
            'HOME_MOBILE_PROOF_SCALE':'[data-btc-state-kicker]' in app and 'font-size: 10.5px !important' in app and 'font-size: 12px !important' in app,
            'HOME_FIRST_FOLD_BOUND':'min-height: 368px !important' in app,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          assert not bad,bad
          PY
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Start exact-head server
        run: |
          npm start >/tmp/public-surface.log 2>&1 & echo $! >/tmp/public-surface.pid
          for i in $(seq 1 60); do curl -fsS 'http://127.0.0.1:3000/start?lang=ru' >/dev/null && exit 0; sleep 1; done
          cat /tmp/public-surface.log; exit 1
      - name: First HTTP RU EN matrix
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen
          import html as html_lib
          import json
          import re

          routes=['start','cosmographer','investors','map','faq','services','dao','orion','signal','archive','chronicle','cosmography','access','github','guide/frey','frey','reading','support']
          noindex={'dao'}
          for route in routes:
            for lang in ('en','ru'):
              html=urlopen(f'http://127.0.0.1:3000/{route}?lang={lang}',timeout=30).read().decode()
              lower=html.lower()
              assert f'<html lang="{lang}"' in lower,(route,lang,'html-lang')
              assert f'?lang={lang}' in html,(route,lang,'localized-link')
              if route in noindex:
                assert 'name="robots" content="noindex,follow"' in lower,(route,lang,'noindex')
              else:
                assert 'hreflang="en"' in lower and 'hreflang="ru"' in lower,(route,lang,'hreflang')
              print('PASS',route,lang)

          reading=urlopen('http://127.0.0.1:3000/reading?lang=ru',timeout=30).read().decode()
          for text in ['Темпоральное чтение Frey','Временной якорь','Структурное состояние','Поле напряжения','Поле резонанса','Линия навигатора','Следующий шаг']:
            assert text in reading,('reading-ru',text)

          frey=urlopen('http://127.0.0.1:3000/frey?lang=ru&d=2026-08-28',timeout=30).read().decode()
          for text in ['Космограф · Линза связей','Активная дата · Точка чтения','Интенсивность','Интерпретация Frey','Основное чтение','Слои интерпретации','Продолжить чтение','Средняя поддержка с чувствительными краями','Переходная зона, чувствительная к затмению','Стабильность','Сравнить со второй датой · Δ изменения','Для другого ИИ · Пакет чтения','Промт + данные Frey','Скопировать пакет для другого ИИ']:
            assert text in frey,('frey-ru',text)
          for bad in ['Medium support with чувствительна edges','Eclipse-чувствительна transition band','Baseline pressure stays moderate, yet distortion rises fast','Signal aligns in short stable bands, but resonance breaks','Core structure holds, while outer balance becomes vulnerable']:
            assert bad not in frey,('frey-mixed-language',bad)
          assert 'data-frey-response-state="success"' in frey, 'frey-raw-state'

          home=urlopen('http://127.0.0.1:3000/?lang=ru',timeout=30).read().decode()
          assert '<title' in home and '>Market Cosmographer · AI-анализ рынков | BHRIGU</title>' in home,'home-title-ru'
          assert 'inLanguage":"ru"' in home,'home-jsonld-ru'
          assert '/frey?lang=ru' in home and '/cosmographer?lang=ru' in home and '/orion?lang=ru' in home,'home-links-ru'

          graphs={}
          for route in ['start','map','frey','reading','guide/frey']:
            for lang in ('en','ru'):
              page=urlopen(f'http://127.0.0.1:3000/{route}?lang={lang}',timeout=30).read().decode()
              assert 'data-bhrigu-machine-graph="OSI_PHI_PUBLIC_RELATIONS_V0_1"' in page,(route,lang,'machine-graph')
              match=re.search(r'<script[^>]*data-bhrigu-machine-graph="OSI_PHI_PUBLIC_RELATIONS_V0_1"[^>]*>(.*?)</script>',page,re.S)
              assert match,(route,lang,'machine-graph-script')
              graph=json.loads(html_lib.unescape(match.group(1)))
              assert graph.get('@context') == 'https://schema.org',(route,lang,'schema-context')
              assert graph.get('inLanguage') == lang,(route,lang,'schema-language')
              graphs[(route,lang)]=graph

          frey_graph=graphs[('frey','en')]
          assert frey_graph['about']['name'] == 'Frey'
          assert frey_graph['subjectOf']['url'].endswith('/guide/frey?lang=en')
          assert frey_graph['hasPart']['name'] == 'Frey AI Reading Packet'

          reading_graph=graphs[('reading','ru')]
          assert any(x.endswith('/guide/frey?lang=ru') for x in reading_graph['relatedLink'])

          map_graph=graphs[('map','ru')]
          map_urls=[item['url'] for item in map_graph['mainEntity']['itemListElement']]
          assert any(x.endswith('/guide/frey?lang=ru') for x in map_urls)

          guide_graph=graphs[('guide/frey','ru')]
          docs=[part.get('contentUrl','') for part in guide_graph['hasPart']]
          assert any('bhrigu-frey-ru-v2-aligned.pdf' in x for x in docs)
          assert any('bhrigu-frey-ru-approved-poster-pack-v1-visual-guide.pdf' in x for x in docs)
          assert guide_graph['mentions']['name'] == 'Frey AI Reading Packet'

          start_graph=graphs[('start','en')]
          start_urls=[item['url'] for item in start_graph['mainEntity']['itemListElement']]
          assert any('/crypto-astro/btc?lang=en' in x for x in start_urls)
          assert any('/frey?lang=en' in x for x in start_urls)
          assert any('/map?lang=en' in x for x in start_urls)

          btc=urlopen('http://127.0.0.1:3000/crypto-astro/btc?lang=en',timeout=30).read().decode()
          assert btc.count('name="description"') == 1,('btc-description-authority',btc.count('name="description"'))
          assert btc.count('rel="canonical"') == 1,('btc-canonical-authority',btc.count('rel="canonical"'))
          assert 'hrefLang="x-default"' in btc or 'hreflang="x-default"' in btc.lower(),'btc-hreflang-default'

          clean=urlopen('http://127.0.0.1:3000/crypto-astro/btc/clean-chat?lang=en',timeout=30).read().decode().lower()
          assert clean.count('name="robots"') == 1,('clean-chat-robots-authority',clean.count('name="robots"'))
          assert 'name="robots" content="noindex,nofollow"' in clean,'clean-chat-noindex-nofollow'
          assert 'rel="canonical"' not in clean,'clean-chat-no-durable-canonical'

          llms=urlopen('http://127.0.0.1:3000/llms.txt',timeout=30).read().decode()
          assert '### Frey AI Reading Packet' in llms and '## Machine-reading boundary' in llms,'llms-current'
          sitemap=urlopen('http://127.0.0.1:3000/sitemap.xml',timeout=30).read().decode()
          for route in ['/start?lang=ru','/reading?lang=ru','/guide/frey?lang=ru','/faq?lang=ru','/cosmography?lang=ru','/access?lang=ru']:
            assert route in sitemap,('sitemap-route',route)
          print('RU_EN_BODY_PARITY=PASS')
          print('OSI_PHI_MACHINE_READING_GRAPH=PASS')
          PY
      - name: Exact-head Founding invalid POST runtime proof
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected_head = os.environ['EXPECTED_HEAD']
          bypass_secret = os.environ.get('VERCEL_AUTOMATION_BYPASS_SECRET', '')
          if not bypass_secret:
              raise SystemExit('VERCEL_AUTOMATION_BYPASS_SECRET=UNAVAILABLE')

          source = Path('pages/api/founding/phi-btc-timing-windows/request.ts').read_text()
          guard = source.index('const idempotencyKey = normalizeIdempotencyKey')
          invalid_return = source.index('errorCode: "invalid_idempotency_key"')
          persistence = source.index('const sql = neon(runtime.databaseUrl)')
          assert guard < invalid_return < persistence, 'INVALID_POST_PRE_PERSISTENCE_GUARD=FAIL'

          preview_base = 'http://127.0.0.1:3000'
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookie_jar))
          common_headers = {
              'Cache-Control': 'no-cache, no-store, max-age=0',
              'Pragma': 'no-cache',
              'User-Agent': 'bhrigu-founding-pr230-runtime-proof',
              'x-vercel-protection-bypass': bypass_secret,
              'x-vercel-set-bypass-cookie': 'true',
          }

          for attempt in range(90):
              query = urllib.parse.urlencode({'lang': 'ru', 'preview_identity': expected_head, 'attempt': attempt})
              page_url = f'{preview_base}/crypto-astro/btc/live?{query}'
              try:
                  page_request = urllib.request.Request(page_url, headers=common_headers)
                  with opener.open(page_request, timeout=30) as response:
                      html = response.read().decode('utf-8', errors='replace')
                      header_head = response.headers.get('X-BTC-Deployment-Source-Sha', '')
                  meta_match = re.search(r'name="btc-deployment-source-sha" content="([0-9a-fA-F]{40})"', html)
                  root_match = re.search(r'data-deployment-head-sha="([0-9a-fA-F]{40})"', html)
                  markers = {header_head, meta_match.group(1) if meta_match else '', root_match.group(1) if root_match else ''}
                  markers.discard('')
                  if markers != {expected_head}:
                      time.sleep(5)
                      continue

                  post_headers = dict(common_headers)
                  post_headers['Content-Type'] = 'application/json'
                  post_request = urllib.request.Request(
                      f'{preview_base}/api/founding/phi-btc-timing-windows/request',
                      data=b'{}',
                      headers=post_headers,
                      method='POST',
                  )
                  try:
                      opener.open(post_request, timeout=30)
                  except urllib.error.HTTPError as error:
                      body = error.read().decode('utf-8', errors='replace')
                      payload = json.loads(body)
                      assert error.code == 400, (error.code, payload)
                      assert payload.get('errorCode') == 'invalid_idempotency_key', payload
                      print(f'EXACT_HEAD={expected_head}')
                      print('INVALID_POST=400')
                      print('INVALID_POST_ERROR=invalid_idempotency_key')
                      print('RECORDS_CREATED=0')
                      print('RECORDS_CREATED_PROOF=PRE_PERSISTENCE_GUARD')
                      raise SystemExit(0)
                  raise SystemExit('INVALID_POST_UNEXPECTED_SUCCESS')
              except SystemExit:
                  raise
              except Exception as error:
                  print(json.dumps({'attempt': attempt, 'error': str(error)}))
                  time.sleep(5)

          raise SystemExit(f'EXACT_HEAD_PREVIEW_NOT_PROVEN={expected_head}')
          PY
      - name: Stop server
        if: always()
        run: test ! -f /tmp/public-surface.pid || kill "$(cat /tmp/public-surface.pid)" || true