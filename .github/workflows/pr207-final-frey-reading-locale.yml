          s = replace_if_present(s, '? "Compare active · Review both dates below."\n                    : "Open Compare to enter any date and compute Δ Structural Difference."', '? (ru ? "Сравнение активно · Проверьте обе даты ниже." : "Compare active · Review both dates below.")\n                    : (ru ? "Откройте сравнение, укажите дату и вычислите Δ структурной разницы." : "Open Compare to enter any date and compute Δ Structural Difference.")')
          s = replace_if_present(s, '<PublicSupportRoute locale="en" surface="frey" />', '<PublicSupportRoute locale={initialLocale} surface="frey" />')
          s = replace_if_present(s, 'href={initialAccessHref}', 'href={`${initialAccessHref}${initialAccessHref.includes("?") ? "&" : "?"}lang=${initialLocale}`}')
          p.write_text(s)

          Path('.github/workflows/pr207-final-frey-reading-locale.yml').unlink()
          PY
          git diff --check
          git config user.name 'BHRIGU Guarded Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/frey.js pages/reading.js .github/workflows/pr207-final-frey-reading-locale.yml
          git commit -m 'Complete Frey and Reading RU presentation parity'
          git push origin HEAD:public-surface-ru-en-phi-v0-2
