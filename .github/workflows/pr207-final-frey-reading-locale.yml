name: PR207 Final Frey Reading Locale
on:
  push:
    branches: [public-surface-ru-en-phi-v0-2]
    paths: ['.github/workflows/pr207-final-frey-reading-locale.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-surface-ru-en-phi-v0-2
          fetch-depth: 0
      - name: Localize presentation only
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_if_present(text, old, new):
              return text.replace(old, new) if old in text else text

          # Reading: remaining view-only literals.
          p = Path('pages/reading.js')
          s = p.read_text()
          for old, new in {
              '            Guide\n': '            {ru ? "Гид" : "Guide"}\n',
              '            Learn how to read a Frey response.\n': '            {ru ? "Как читать ответ Frey" : "Learn how to read a Frey response."}\n',
              '        Frey Temporal Reading\n': '        {ru ? "Темпоральное чтение Frey" : "Frey Temporal Reading"}\n',
              '            Continuity linked\n': '            {ru ? "Непрерывность связана" : "Continuity linked"}\n',
              '            Unfold\n': '            {ru ? "Раскрыть" : "Unfold"}\n',
              '                Structural condition\n': '                {ru ? "Структурное условие" : "Structural condition"}\n',
              '                Tension pattern\n': '                {ru ? "Паттерн напряжения" : "Tension pattern"}\n',
              '                Resonance quality\n': '                {ru ? "Качество резонанса" : "Resonance quality"}\n',
              '                Direction vector\n': '                {ru ? "Вектор направления" : "Direction vector"}\n',
          }.items():
              s = replace_if_present(s, old, new)
          p.write_text(s)

          # Frey: presentation dictionary only; formulas/API/raw schemas remain unchanged.
          p = Path('pages/frey.js')
          s = p.read_text()
          mapping = {
              'Cosmographer · Relation Lens':'Космограф · Линза связей',
              'Compare reads structural difference; anchor stays quiet.':'Сравнение читает структурную разницу; якорь остаётся неизменным.',
              'Loading personal axis':'Загрузка личной оси',
              'Anchor mirrors Active Date':'Якорь повторяет активную дату',
              'Active Date matches Anchor':'Активная дата совпадает с якорем',
              'Quiet personal axis':'Тихая личная ось',
              'success':'готово','error':'ошибка','loading':'выполняется','idle':'ожидание',
              'high':'высокая','medium':'средняя','mid':'средняя','low':'низкая','supported':'поддержана','sensitive':'чувствительна','fragile':'хрупкая',
              'Outer stability is weakening faster than the core can compensate.':'Внешняя стабильность ослабевает быстрее, чем ядро успевает компенсировать.',
              'Pressure is accumulating faster than release inside the active frame.':'Давление накапливается внутри активной рамки быстрее, чем происходит разрядка.',
              'Signal alignment still holds, but only inside a narrower stable corridor.':'Согласование сигнала сохраняется, но только внутри более узкого устойчивого коридора.',
              'The field keeps its core line, but edge behavior now needs tighter pacing.':'Поле сохраняет основную линию, но поведение на краях требует более точного темпа.',
              'Stabilized dense core':'Стабилизированное плотное ядро',
              'The dense regime stays internally settled, with strong formation continuity and very low structural agitation.':'Плотный режим остаётся внутренне устойчивым: непрерывность формы высока, структурное возмущение очень низкое.',
              'Compressed dense regime':'Сжатый плотный режим',
              'The dense regime stays structurally compact, while internal compression rises and reduces the ease of structural pacing.':'Плотный режим остаётся структурно компактным, но внутреннее сжатие растёт и усложняет структурный темп.',
              'Structured dense formation':'Структурированная плотная форма',
              'The dense regime remains well-formed, while internal movement stays contained within a stable structural arrangement.':'Плотный режим сохраняет форму, а внутреннее движение остаётся в пределах устойчивой структуры.',
              'Eclipse-sensitive transition band':'Переходная зона, чувствительная к затмению',
              'The field remains transitional, with enough structural density to retain a defined but shifting regime contour.':'Поле остаётся переходным; плотности достаточно, чтобы сохранять определённый, но меняющийся контур режима.',
              'The regime moves through a looser transition layer, where structural definition shifts more readily across nearby dates.':'Режим проходит через более свободный переходный слой, где структурная определённость быстрее меняется между соседними датами.',
              'Open structural dispersion':'Открытая структурная дисперсия',
              'The field stays open and diffuse, with weaker formation density and low structural containment.':'Поле остаётся открытым и рассеянным, с меньшей плотностью формы и слабым структурным удержанием.',
              'Elevated internal load':'Повышенная внутренняя нагрузка',
              'Pressure accumulates faster than release, raising distortion risk under acceleration.':'Давление накапливается быстрее разрядки, повышая риск искажения при ускорении.',
              'Medium load with acceleration risk':'Средняя нагрузка с риском ускорения',
              'Baseline pressure stays moderate, yet distortion rises fast when motion exceeds structural pacing.':'Базовое давление остаётся умеренным, но искажение быстро растёт, когда движение опережает структурный темп.',
              'Low pressure band':'Зона низкого давления',
              'Friction stays reduced, allowing motion without heavy internal compression.':'Трение остаётся сниженным, позволяя двигаться без сильного внутреннего сжатия.',
              'High internal coherence':'Высокая внутренняя согласованность',
              'Signal coupling holds across the field and supports sustained harmonic continuity.':'Связность сигнала удерживается по всему полю и поддерживает устойчивую гармоническую непрерывность.',
              'Moderate coherence under fluctuation':'Умеренная согласованность при колебаниях',
              'Signal aligns in short stable bands, but resonance breaks when the field is forced beyond its internal rhythm.':'Сигнал согласуется в коротких устойчивых зонах, но резонанс нарушается, если поле принуждают выйти за внутренний ритм.',
              'Weak harmonic lock':'Слабая гармоническая фиксация',
              'Coupling remains partial and coherence fragments under unstable movement.':'Связность остаётся частичной, а согласованность фрагментируется при нестабильном движении.',
              'Supported core frame':'Поддержанная рамка ядра',
              'Structure remains well-supported and can hold motion without immediate edge-loss.':'Структура хорошо поддержана и может удерживать движение без немедленной потери краёв.',
              'Medium support with sensitive edges':'Средняя поддержка с чувствительными краями',
              'Core structure holds, while outer balance becomes vulnerable during amplified or fast-turning phases.':'Структура ядра удерживается, но внешний баланс становится уязвимым в усиленных или быстро меняющихся фазах.',
              'Fragile outer balance':'Хрупкий внешний баланс',
              'Support remains limited and weak edges lose alignment under excess push.':'Поддержка ограничена, а слабые края теряют согласование при избыточном давлении.',
              'Mode: Hold structure':'Режим: удерживать структуру',
              'Mode: Advance through the stable line':'Режим: двигаться по устойчивой линии',
              'Mode: Reduce expansion at unstable edges':'Режим: уменьшить расширение на нестабильных краях',
              'Mode: Controlled advance':'Режим: контролируемое продвижение',
              'Structural State':'Структурное состояние','Tension Profile':'Профиль напряжения','Resonance Profile':'Профиль резонанса',
              'Deterministic reading becomes visible after the run.':'Детерминированное чтение становится видимым после запуска.',
              'Stabilized density':'Стабилизированная плотность','The pattern is concentrated and held in a stable frame.':'Паттерн сконцентрирован и удерживается в устойчивой рамке.','Advance through one clean step without adding noise.':'Продвигайтесь одним чистым шагом, не добавляя шума.',
              'Structured density':'Структурированная плотность','Pressure is organized enough to support deliberate movement.':'Давление достаточно организовано для осознанного движения.','Keep the sequence ordered and move through the next defined node.':'Сохраняйте порядок последовательности и переходите к следующему определённому узлу.',
              'Compressed density':'Сжатая плотность','The field is concentrated but carrying compression and drag.':'Поле сконцентрировано, но несёт сжатие и сопротивление.','Reduce parallel motion and release one bottleneck first.':'Сократите параллельное движение и сначала освободите одно узкое место.',
              'Open regime':'Открытый режим','The pattern is loose and less materially bound.':'Паттерн свободный и менее материально связан.','Anchor the next move in one concrete signal before scaling.':'Привяжите следующий ход к одному конкретному сигналу до масштабирования.',
              'Edge instability':'Нестабильность края','The current pattern is vulnerable to rupture or misfire.':'Текущий паттерн уязвим к разрыву или ошибочному срабатыванию.','Do not escalate. Stabilize structure before any expansion.':'Не усиливайте. Стабилизируйте структуру до любого расширения.',
              'Transitional structure':'Переходная структура','The field is holding form but still reorganizing under load.':'Поле удерживает форму, но продолжает перестраиваться под нагрузкой.','Stay precise and let the next step confirm direction.':'Сохраняйте точность и дайте следующему шагу подтвердить направление.',
              'Balanced temporal shift':'Сбалансированный временной сдвиг','The compared dates remain within a moderate structural reconfiguration band.':'Сравниваемые даты остаются в умеренной зоне структурной перенастройки.',
              'Acceleration of structural resonance':'Ускорение структурного резонанса','The field moves from a more constrained configuration toward a clearer expansion window.':'Поле движется от более ограниченной конфигурации к более ясному окну расширения.',
              'Collapse of harmonic tension':'Снижение гармонического напряжения','The field descends toward a more stable basin with lower internal strain.':'Поле смещается к более устойчивому бассейну с меньшим внутренним напряжением.',
              'Escalation into unstable load':'Рост нестабильной нагрузки','The compared dates show rising pressure with weaker structural support.':'Сравниваемые даты показывают рост давления при более слабой структурной поддержке.',
              'Hold structure':'Удерживать структуру','Stable line':'Устойчивая линия','Dense phase':'Плотная фаза','Controlled advance':'Контролируемое продвижение',
              'Phase Density':'Плотность фазы','Harmonic Tension':'Гармоническое напряжение','Resonance Level':'Уровень резонанса','Structural Stability':'Структурная стабильность',
              'phase_density = concentration of temporal pattern':'phase_density = концентрация временного паттерна',
              'harmonic_tension = pressure / friction in the field':'harmonic_tension = давление / трение в поле',
              'resonance_level = alignment with the dominant pattern':'resonance_level = согласование с доминирующим паттерном',
              'eclipse_proximity = closeness to eclipse-driven amplification':'eclipse_proximity = близость к усилению, связанному с затмением',
              'structural_stability = capacity to hold form under pressure':'structural_stability = способность удерживать форму под давлением',
              'Use Meaning/Direction as interpretive layer, not as raw engine data.':'Используйте Значение/Направление как интерпретационный слой, а не как сырые данные движка.',
              'UP':'ВВЕРХ','DOWN':'ВНИЗ','FLAT':'БЕЗ ИЗМЕНЕНИЙ',
          }
          if 'const FREY_RU_TEXT' not in s:
              anchor = 'const ANCHOR_STORAGE_SCHEMA_VERSION = "v1";\n'
              if anchor not in s: raise SystemExit('MISSING_FREY_DICT_ANCHOR')
              js = '\nconst FREY_RU_TEXT = new Map(' + json.dumps(list(mapping.items()), ensure_ascii=False) + ');\nfunction freyText(value, ru) {\n  if (!ru || typeof value !== "string") return value;\n  let out = value;\n  for (const [en, translated] of FREY_RU_TEXT) out = out.split(en).join(translated);\n  return out;\n}\n'
              s = s.replace(anchor, anchor + js)

          # Dynamic prose and classifications.
          for old, new in {
              '{conversationalResponse.title}':'{freyText(conversationalResponse.title, ru)}',
              '{responseSurface.ui_state}':'{freyText(responseSurface.ui_state, ru)}',
              '{conversationalResponse.lead}':'{freyText(conversationalResponse.lead, ru)}',
              '{anchorStatusLine}':'{freyText(anchorStatusLine, ru)}',
              '{conversationalResponse.summary}':'{freyText(conversationalResponse.summary, ru)}',
              '{responseSurface.compact_summary?.intensity_band || "n/a"}':'{freyText(responseSurface.compact_summary?.intensity_band || "n/a", ru)}',
              '{responseSurface.compact_summary?.stability_band || "n/a"}':'{freyText(responseSurface.compact_summary?.stability_band || "n/a", ru)}',
              '{responseSurface.compact_summary?.resonance_band || "n/a"}':'{freyText(responseSurface.compact_summary?.resonance_band || "n/a", ru)}',
              '{minimalVoice.state}':'{freyText(minimalVoice.state, ru)}','{minimalVoiceBridge}':'{freyText(minimalVoiceBridge, ru)}','{minimalVoice.meaning}':'{freyText(minimalVoice.meaning, ru)}','{minimalVoice.direction}':'{freyText(minimalVoice.direction, ru)}',
              '{conversationalResponse.operator_note}':'{freyText(conversationalResponse.operator_note, ru)}',
              '{zone.label}':'{freyText(zone.label, ru)}','{zone.state}':'{freyText(zone.state, ru)}','{zone.effect}':'{freyText(zone.effect, ru)}',
              '{interpretation.vector}':'{freyText(interpretation.vector, ru)}','{compareInterpretation.vector}':'{freyText(compareInterpretation.vector, ru)}',
              '{formatMetricLabel(row.label)}':'{freyText(formatMetricLabel(row.label), ru)}','{row.arrow} {row.value}':'{freyText(row.arrow, ru)} {row.value}',
              '{deltaBlock.mode}':'{freyText(deltaBlock.mode, ru)}','{deltaBlock.description}':'{freyText(deltaBlock.description, ru)}','{entry.vector}':'{freyText(entry.vector, ru)}',
              '{copyFeedbackLabel}':'{freyText(copyFeedbackLabel, ru)}','{exportHelpText}':'{freyText(exportHelpText, ru)}',
              '<div key={line} className="freyExportGuideLine">{line}</div>':'<div key={line} className="freyExportGuideLine">{freyText(line, ru)}</div>',
          }.items():
              s = replace_if_present(s, old, new)

          # Static user-facing labels.
          for old, new in {
              '<div className="freyConversationEyebrow">⌬ Cosmographer · Relation Lens</div>':'<div className="freyConversationEyebrow">⌬ {ru ? "Космограф · Линза связей" : "Cosmographer · Relation Lens"}</div>',
              '<div className="freyConversationMetaLabel">◉ Active Date · Reading Point</div>':'<div className="freyConversationMetaLabel">◉ {ru ? "Активная дата · Точка чтения" : "Active Date · Reading Point"}</div>',
              '<span className="freyConversationMetaHint">Click to edit</span>':'<span className="freyConversationMetaHint">{ru ? "Нажмите, чтобы изменить" : "Click to edit"}</span>',
              '<div className="freyConversationMetaHint">Edit the date, then apply to reload the deterministic result.</div>':'<div className="freyConversationMetaHint">{ru ? "Измените дату и примените её, чтобы перезагрузить детерминированный результат." : "Edit the date, then apply to reload the deterministic result."}</div>',
              '                              Cancel\n':'                              {ru ? "Отмена" : "Cancel"}\n','                              Apply\n':'                              {ru ? "Применить" : "Apply"}\n',
              '<div className="freyConversationMetaLabel">⌖ Anchor · Personal Axis</div>':'<div className="freyConversationMetaLabel">⌖ {ru ? "Якорь · Личная ось" : "Anchor · Personal Axis"}</div>',
              '                              Set current\n':'                              {ru ? "Установить текущую" : "Set current"}\n','                              Reset\n':'                              {ru ? "Сбросить" : "Reset"}\n',
              '<div className="freyConversationMetricLabel">Intensity</div>':'<div className="freyConversationMetricLabel">{ru ? "Интенсивность" : "Intensity"}</div>',
              '<div className="freyConversationMetricLabel">Stability</div>':'<div className="freyConversationMetricLabel">{ru ? "Стабильность" : "Stability"}</div>',
              '<div className="freyConversationMetricLabel">Resonance</div>':'<div className="freyConversationMetricLabel">{ru ? "Резонанс" : "Resonance"}</div>',
              '<div className="freyVoiceMinimalEyebrow">Frey Interpretation</div>':'<div className="freyVoiceMinimalEyebrow">{ru ? "Интерпретация Frey" : "Frey Interpretation"}</div>',
              '<div className="freyVoiceMinimalLabel">Meaning</div>':'<div className="freyVoiceMinimalLabel">{ru ? "Значение" : "Meaning"}</div>','<div className="freyVoiceMinimalLabel">Direction</div>':'<div className="freyVoiceMinimalLabel">{ru ? "Направление" : "Direction"}</div>',
              '<summary className="freyInlineExpandSummary">Primary reading</summary>':'<summary className="freyInlineExpandSummary">{ru ? "Основное чтение" : "Primary reading"}</summary>',
              '<summary className="freyInlineExpandSummary">Interpretation layers</summary>':'<summary className="freyInlineExpandSummary">{ru ? "Слои интерпретации" : "Interpretation layers"}</summary>',
              '<div className="freyOperationalVectorTag">Operational Vector</div>':'<div className="freyOperationalVectorTag">{ru ? "Операционный вектор" : "Operational Vector"}</div>',
              '<summary className="freyInlineExpandSummary">Raw metrics</summary>':'<summary className="freyInlineExpandSummary">{ru ? "Исходные метрики" : "Raw metrics"}</summary>',
              '<div className="freyResultControlsLabel">Navigation Layer</div>':'<div className="freyResultControlsLabel">{ru ? "Навигационный слой" : "Navigation Layer"}</div>',
              '<summary className="freyExpandSummary">Δ Compare · Structural Difference</summary>':'<summary className="freyExpandSummary">{ru ? "Δ Сравнение · Структурная разница" : "Δ Compare · Structural Difference"}</summary>',
              '                          Compare\n':'                          {ru ? "Сравнить" : "Compare"}\n',
              '<div className="freyCompareLabel">◉ Active Date · {initialDate}</div>':'<div className="freyCompareLabel">◉ {ru ? "Активная дата" : "Active Date"} · {initialDate}</div>',
              '<div className="freyCompareLabel">Δ Compare Date · {initialCompareDate}</div>':'<div className="freyCompareLabel">Δ {ru ? "Дата сравнения" : "Compare Date"} · {initialCompareDate}</div>',
              '<div className="freyDeltaTitle" data-frey-demo-flow="__FREY_DEMO_FLOW_POLISH_V0_1__">Δ Structural Difference</div>':'<div className="freyDeltaTitle" data-frey-demo-flow="__FREY_DEMO_FLOW_POLISH_V0_1__">{ru ? "Δ Структурная разница" : "Δ Structural Difference"}</div>',
              '<div className="freyDeltaRelationTag">⌬ Relation mode</div>':'<div className="freyDeltaRelationTag">⌬ {ru ? "Режим связи" : "Relation mode"}</div>',
              '<summary className="freyExpandSummary">↔ Timeline · Nearby Movement</summary>':'<summary className="freyExpandSummary">↔ {ru ? "Таймлайн · Ближайшее движение" : "Timeline · Nearby Movement"}</summary>',
              '<div className="freyExpandEmpty" data-frey-timeline-state="pending">Nearby movement appears after date-based runs.</div>':'<div className="freyExpandEmpty" data-frey-timeline-state="pending">{ru ? "Ближайшее движение появится после запусков по датам." : "Nearby movement appears after date-based runs."}</div>',
              '<summary className="freyExportSummary">AI Export</summary>':'<summary className="freyExportSummary">{ru ? "AI-экспорт" : "AI Export"}</summary>',
              '<div className="freyExportEyebrow" data-frey-export-help="__FREY_EXPORT_HELP_V0_1__">Portable snapshot</div>':'<div className="freyExportEyebrow" data-frey-export-help="__FREY_EXPORT_HELP_V0_1__">{ru ? "Переносимый snapshot" : "Portable snapshot"}</div>',
              '<div className="freyEscalationLabel">Escalation</div>':'<div className="freyEscalationLabel">{ru ? "Углубление" : "Escalation"}</div>',
              '                    Request deep analysis when the current result needs operator review.\n':'                    {ru ? "Запросите глубокий анализ, когда текущему результату нужен операторский разбор." : "Request deep analysis when the current result needs operator review."}\n',
              '                    Request deep analysis\n':'                    {ru ? "Запросить глубокий анализ" : "Request deep analysis"}\n',
              '{responseSurface.error || "Unable to run Frey."}':'{responseSurface.error || (ru ? "Не удалось запустить Frey." : "Unable to run Frey.")}',
