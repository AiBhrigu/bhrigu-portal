name: BTC PR114 Preview OIDC Diagnostic

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/btc-pr114-preview-oidc-diagnostic.yml

permissions:
  contents: read
  issues: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Acquire GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Probe Vercel Trusted Source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          comments_url = (
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
              f"/issues/{os.environ['PR_NUMBER']}/comments?per_page=100"
          )
          request = urllib.request.Request(
              comments_url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "btc-pr114-preview-oidc-diagnostic",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              comments = json.load(response)

          preview = None
          for comment in comments:
              if comment.get("user", {}).get("login") != "vercel[bot]":
                  continue
              match = re.search(r"\[Preview\]\((https://[^)]+\.vercel\.app)\)", comment.get("body", ""))
              if match:
                  preview = match.group(1).rstrip("/")
                  break
          if not preview:
              raise SystemExit("Vercel Preview URL not found")

          target = f"{preview}/crypto-astro/btc/live?lang=ru&oidc_diagnostic=1"
          page_request = urllib.request.Request(
              target,
              headers={
                  "Cache-Control": "no-cache, no-store, max-age=0",
                  "Pragma": "no-cache",
                  "User-Agent": "btc-pr114-preview-oidc-diagnostic",
                  "x-vercel-trusted-oidc-idp-token": os.environ["GITHUB_OIDC_TOKEN"],
              },
          )
          with urllib.request.urlopen(page_request, timeout=30) as response:
              body = response.read().decode("utf-8", errors="replace")
              final_url = response.geturl()
              status = response.status
              cache_control = response.headers.get("Cache-Control")
              served_head = response.headers.get("X-BTC-Deployment-Source-Sha")

          meta = re.search(r'name="btc-deployment-source-sha" content="([0-9a-f]{40})"', body, re.I)
          marker = served_head or (meta.group(1) if meta else None)
          result = {
              "preview": preview,
              "final_url": final_url,
              "status": status,
              "served_head": marker,
              "expected_head": os.environ["EXPECTED_HEAD"],
              "cache_control": cache_control,
              "trusted_source_pass": (
                  not final_url.startswith("https://vercel.com/login")
                  and marker == os.environ["EXPECTED_HEAD"]
                  and "no-store" in (cache_control or "").casefold()
              ),
          }
          print(json.dumps(result, indent=2))
          if not result["trusted_source_pass"]:
              raise SystemExit("VERCEL_GITHUB_OIDC_TRUSTED_SOURCE=NOT_CONFIGURED_OR_NOT_MATCHED")
          PY
