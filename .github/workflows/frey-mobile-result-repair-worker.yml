name: Frey Mobile Result Repair Worker

on:
  push:
    branches:
      - agent/frey-mobile-result-occlusion-repair-v0-1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded patch
        run: python scripts/frey-mobile-result-repair.py
      - name: Verify markers and exact scope
        run: |
          grep -q '__FREY_MOBILE_RESULT_CONTAINMENT_AND_ACTION_ANCHOR_V0_1__' pages/frey.js
          grep -q 'position: static !important' pages/frey.js
          grep -q 'content: "Φ"' pages/frey.js
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "pages/frey.js"
      - name: Build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit repair and remove temporary worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/frey.js
          git rm .github/workflows/frey-mobile-result-repair-worker.yml scripts/frey-mobile-result-repair.py
          git commit -m "Repair Frey mobile result containment and action anchor"
          git push origin HEAD:agent/frey-mobile-result-occlusion-repair-v0-1
