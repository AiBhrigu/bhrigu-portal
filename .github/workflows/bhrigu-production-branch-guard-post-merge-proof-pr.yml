name: BHRIGU Production Branch Guard Post-Merge Proof

on:
  pull_request:
    paths:
      - ".github/workflows/bhrigu-production-branch-guard-post-merge-proof-pr.yml"

permissions:
  contents: read

jobs:
  post-merge-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 88a7c2b27652704cc089afb87bafae8b0a9dc4f1
      EXPECTED_SNAPSHOT: 2026-07-26T10:51:12Z
      CUSTOM_DOMAIN: https://www.bhrigu.io

    steps:
      - name: Verify branch refs and public deployment source
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = os.environ["EXPECTED_SHA"]
          expected_snapshot = os.environ["EXPECTED_SNAPSHOT"]
          base = os.environ["CUSTOM_DOMAIN"].rstrip("/")
          run_id = os.environ["GITHUB_RUN_ID"]

          def fetch_json(url):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "ORION-BHRIGU-Post-Merge-Guard-Proof/0.1",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          master = fetch_json("https://api.github.com/repos/AiBhrigu/bhrigu-portal/commits/master")["sha"]
          main = fetch_json("https://api.github.com/repos/AiBhrigu/bhrigu-portal/commits/main")["sha"]

          last = None
          for attempt in range(48):
              query = urllib.parse.urlencode({
                  "lang": "en",
                  "__guard_closure": f"{run_id}-{attempt}",
              })
              url = f"{base}/crypto-astro/btc?{query}"
              try:
                  req = urllib.request.Request(url, headers={
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "ORION-BHRIGU-Post-Merge-Guard-Proof/0.1",
                  })
                  with urllib.request.urlopen(req, timeout=30) as response:
                      final_url = response.geturl()
                      status = response.status
                      html = response.read().decode("utf-8")
                  checks = {
                      "master_expected": master == expected,
                      "main_expected": main == expected,
                      "main_master_identical": main == master,
                      "http_200": status == 200,
                      "route_preserved": urllib.parse.urlparse(final_url).path == "/crypto-astro/btc",
                      "main_source_attribute": f'data-deployment-source-sha="{expected}"' in html,
                      "head_source_meta": f'name="btc-deployment-source-sha" content="{expected}"' in html,
                      "visible_source_prefix": expected[:12] in html,
                      "snapshot_preserved": expected_snapshot in html,
                  }
                  last = {
                      "attempt": attempt + 1,
                      "master_sha": master,
                      "main_sha": main,
                      "final_url": final_url,
                      "checks": checks,
                      "failures": [name for name, passed in checks.items() if not passed],
                  }
                  if not last["failures"]:
                      break
              except Exception as exc:
                  last = {
                      "attempt": attempt + 1,
                      "master_sha": master,
                      "main_sha": main,
                      "error": str(exc),
                      "failures": ["request"],
                  }
              time.sleep(5)

          report = {
              "schema_version": "bhrigu_production_branch_guard_post_merge_proof_v0_1",
              "expected_sha": expected,
              "status": "PASS" if last and not last.get("failures") else "FAIL",
              "result": last,
          }
          Path("artifacts/bhrigu-production-branch-guard-post-merge-proof.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if report["status"] != "PASS":
              raise SystemExit(f"POST_MERGE_BRANCH_GUARD_PROOF=FAIL {last}")
          print(f"POST_MERGE_BRANCH_GUARD_PROOF=PASS source_sha={expected}")
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhrigu-production-branch-guard-post-merge-proof-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error