name: TEMP Frey Guide Discoverability Worker
on:
  push:
    branches: [frey-guide-discoverability-phi-v0-1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frey-guide-discoverability-phi-v0-1
          fetch-depth: 0
      - name: Apply bounded Frey/Guide patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Frey: make Guide visible outside collapsed AI Export.
          p=Path('pages/frey.js')
          s=p.read_text()
          marker='__FREY_GUIDE_DISCOVERABILITY_V0_1__'
          if marker not in s:
              anchor='<div className="freyResultControls">'
              assert s.count(anchor)==1, s.count(anchor)
              insert='''<div className="freyResultControls">\n                  <div data-frey-guide-discoverability="__FREY_GUIDE_DISCOVERABILITY_V0_1__" className="freyGuideRoute">\n                    <div className="freyGuideRouteCopy">\n                      <span className="freyGuideRouteEyebrow">{initialLocale === "ru" ? "ГИД FREY" : "FREY GUIDE"}</span>\n                      <span className="freyGuideRouteText">{initialLocale === "ru" ? "Как читать одну дату, сравнивать две даты, понимать Δ и передавать чтение стороннему ИИ." : "How to read one date, compare two dates, understand Δ and carry a Frey reading into another AI."}</span>\n                    </div>\n                    <Link className="freyGuideRouteLink" href={`/guide/frey?lang=${initialLocale}`}>\n                      {initialLocale === "ru" ? "Открыть полный Guide →" : "Open the full Guide →"}\n                    </Link>\n                  </div>'''
              s=s.replace(anchor,insert,1)
              css_anchor='        .freyResultControls {'
              assert s.count(css_anchor)==1, s.count(css_anchor)
              css='''        .freyGuideRoute {\n          display: grid;\n          grid-template-columns: minmax(0, 1fr) auto;\n          gap: 18px;\n          align-items: center;\n          margin-bottom: 14px;\n          padding: 16px 18px;\n          border: 1px solid rgba(154, 137, 209, 0.28);\n          border-radius: 18px;\n          background:\n            radial-gradient(circle at 100% 0%, rgba(154, 137, 209, 0.12), transparent 42%),\n            linear-gradient(90deg, rgba(98, 168, 216, 0.055), rgba(154, 137, 209, 0.045));\n        }\n        .freyGuideRouteCopy { display: grid; gap: 6px; }\n        .freyGuideRouteEyebrow {\n          color: rgba(176, 160, 225, 0.92);\n          font-size: 10px;\n          font-weight: 750;\n          letter-spacing: 0.16em;\n          text-transform: uppercase;\n        }\n        .freyGuideRouteText {\n          max-width: 560px;\n          color: rgba(220, 226, 240, 0.82);\n          font-size: 13px;\n          line-height: 1.55;\n        }\n        :global(.freyGuideRouteLink) {\n          display: inline-flex;\n          align-items: center;\n          justify-content: center;\n          min-height: 40px;\n          padding: 0 14px;\n          border: 1px solid rgba(98, 168, 216, 0.34);\n          border-radius: 999px;\n          color: rgba(161, 204, 232, 0.96) !important;\n          background: rgba(98, 168, 216, 0.045);\n          text-decoration: none !important;\n          white-space: nowrap;\n          font-size: 11px;\n          font-weight: 700;\n          letter-spacing: 0.04em;\n        }\n        :global(.freyGuideRouteLink:hover),\n        :global(.freyGuideRouteLink:focus-visible) {\n          border-color: rgba(154, 137, 209, 0.58);\n          background: rgba(154, 137, 209, 0.08);\n          outline: none;\n        }\n        @media (max-width: 760px) {\n          .freyGuideRoute { grid-template-columns: 1fr; gap: 12px; }\n          :global(.freyGuideRouteLink) { width: fit-content; max-width: 100%; white-space: normal; text-align: center; }\n        }\n\n        .freyResultControls {'''
              s=s.replace(css_anchor,css,1)
              p.write_text(s)

          # 2) Guide: remove duplicate page-level Head; _app is the single metadata authority.
          p=Path('pages/guide/frey.js')
          s=p.read_text()
          if "import Head from 'next/head';" in s:
              s=s.replace("import Head from 'next/head';\n",'',1)
          head_blocks=re.findall(r'\s*<Head>.*?</Head>\s*',s,flags=re.S)
          if head_blocks:
              assert len(head_blocks)==1, len(head_blocks)
              s=s.replace(head_blocks[0],'\n',1)
          assert "<Head>" not in s
          assert "next/head" not in s
          p.write_text(s)

          # 3) _app: richer single metadata authority for the restored Guide.
          p=Path('pages/_app.js')
          s=p.read_text()
          old='  "/guide/frey": { en:["Frey Guide · BHRIGU","Guide to Frey, Reading and the currently closed reviewed-access boundary."], ru:["Гид Frey · BHRIGU","Гид по Frey, Reading и текущей закрытой границе reviewed access."] },'
          new='  "/guide/frey": { en:["Frey Guide · Read, Compare & AI Export | BHRIGU","Complete public guide to Frey: one-date reading, two-date Δ comparison, timeline, AI Reading Packet, approved PDFs and method boundaries."], ru:["Гид Frey · Чтение, сравнение и AI Export | BHRIGU","Полный публичный гид Frey: одна дата, сравнение двух дат и Δ, таймлайн, AI Reading Packet, approved PDF и границы метода."] },'
          if old in s:
              s=s.replace(old,new,1)
          assert new in s
          p.write_text(s)
          PY
          git diff --check
          if git diff --quiet; then
            echo 'NO_PRODUCT_PATCH_REQUIRED'
            exit 0
          fi
          git config user.name 'BHRIGU bounded worker'
          git config user.email '154300034+AiBhrigu@users.noreply.github.com'
          git add pages/frey.js pages/guide/frey.js pages/_app.js
          git commit -m 'Frey: expose restored Guide and unify metadata authority'
          git push origin HEAD:frey-guide-discoverability-phi-v0-1
