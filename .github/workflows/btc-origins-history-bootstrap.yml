name: BTC Origins History Bootstrap

on:
  push:
    branches:
      - agent/btc-origins-satoshi-history-v0-1

permissions:
  contents: write

jobs:
  apply-controlled-preview:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify exact master base
        run: |
          git fetch origin master
          test "$(git merge-base HEAD origin/master)" = "0a0205959ffb3da86568870d597092374c1dd5e3"

      - name: Apply bounded historical knowledge layer
        run: python3 .github/scripts/btc-origins-history-bootstrap.py

      - name: Verify static acceptance before commit
        run: node scripts/verify-btc-origins-history.mjs

      - name: Remove workflow and temporary transport files
        run: |
          rm .github/workflows/btc-origins-history-pr.yml
          rm .github/scripts/btc-origins-history-bootstrap.py
          rm .github/workflows/btc-origins-history-bootstrap.yml

      - name: Commit bounded product implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | sort
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "6"
          git commit -m "BTC: add origins and Satoshi history capsule"
          git push origin HEAD:agent/btc-origins-satoshi-history-v0-1
