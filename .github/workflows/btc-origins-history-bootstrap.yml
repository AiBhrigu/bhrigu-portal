name: BTC Origins History Bootstrap

on:
  push:
    branches:
      - agent/btc-origins-satoshi-history-v0-1

permissions:
  contents: write

jobs:
  apply-controlled-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify exact master base
        run: |
          git fetch origin master
          test "$(git merge-base HEAD origin/master)" = "0a0205959ffb3da86568870d597092374c1dd5e3"

      - name: Apply bounded historical knowledge layer
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ANCHOR_MISMATCH {path}: expected 1, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          route = "lib/btc-cosmographer-route-graph.ts"
          replace_once(
              route,
              '  if (/genesis|генезис|перв(?:ый|ого)\\s+блок/i.test(question)) return "genesis";\n',
              '''  if (/satoshi|накамото|кто\\s+(?:такой|такая)\\s+сатоши|кто\\s+создал\\s+(?:bitcoin|биткоин)|why\\s+did\\s+satoshi|what\\s+is\\s+known\\s+(?:for\\s+certain\\s+)?about\\s+satoshi|what\\s+do\\s+we\\s+know\\s+about\\s+satoshi|что\\s+известно\\s+точно/i.test(question)) return "satoshi_history";\n  if (/origin(?:s)?\\s+of\\s+bitcoin|how\\s+did\\s+bitcoin\\s+(?:begin|start|emerge)|from\\s+the\\s+white\\s+paper|происхождени[ея]\\s+(?:bitcoin|биткоин)|как\\s+(?:появился|возник)\\s+(?:bitcoin|биткоин)|от\\s+(?:white\\s+paper|белой\\s+книг)/i.test(question)) return "bitcoin_origin";\n  if (/genesis[-\\s]?block|genesis[-\\s]?блок|генезис[-\\s]?блок|первые?\\s+дн[яей]\\s+(?:bitcoin|биткоин)|first\\s+days?.*(?:bitcoin|genesis)|times\\s+message|the\\s+times|сообщени[ея].*times/i.test(question)) return "genesis_history";\n  if (/genesis|генезис|перв(?:ый|ого)\\s+блок/i.test(question)) return "genesis";\n''',
          )

          protocol = "lib/btc-protocol-evidence.ts"
          capsule = r'''
export type BtcOriginsHistorySubject =
  | "satoshi_history"
  | "bitcoin_origin"
  | "genesis_history";

export type BtcOriginsPreparedQuestion = {
  id: string;
