name: BTC Polymarket Expectation API Capture

on:
  pull_request:
    paths:
      - .github/workflows/btc-polymarket-expectation-api-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          mapfile -t changed < <(git diff --name-only origin/master...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/btc-polymarket-expectation-api-capture.yml"

      - name: Capture exact public API evidence
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p sanitized
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import math
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path
          from typing import Any

          GAMMA = "https://gamma-api.polymarket.com"
          CLOB = "https://clob.polymarket.com"
          DATA = "https://data-api.polymarket.com"
          COINGECKO = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"
          ACCEPTED_SNAPSHOT = "https://aibhrigu.github.io/phi-cosmography-open/crypto-astro/data/crypto_astro_snapshot.public.json"
          USER_AGENT = "BHRIGU-Polymarket-Evidence-Capture/0.2"
          MAX_EVENTS = 2500
          PAGE_SIZE = 100
          MAX_CAPTURE_MARKETS = 120
          now = dt.datetime.now(dt.timezone.utc)
          observed_at = now.replace(microsecond=0).isoformat().replace("+00:00", "Z")
          raw_hashes: list[dict[str, Any]] = []

          def number(value: Any) -> float | None:
              try:
                  result = float(value)
                  return result if math.isfinite(result) else None
              except (TypeError, ValueError):
                  return None

          def text(value: Any) -> str:
              return value.strip() if isinstance(value, str) else ""

          def parse_list(value: Any) -> list[Any]:
              if isinstance(value, list):
                  return value
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      return parsed if isinstance(parsed, list) else []
                  except json.JSONDecodeError:
                      return []
              return []

          def get_path(value: Any, path: str) -> Any:
              cursor = value
              for key in path.split("."):
                  if not isinstance(cursor, dict):
                      return None
                  cursor = cursor.get(key)
              return cursor

          def parse_iso(value: Any) -> str | None:
              raw = text(value)
              if not raw:
                  return None
              try:
                  parsed = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              except ValueError:
                  return None

          def http_json(url: str, required: bool = True) -> Any:
              error: Exception | None = None
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": USER_AGENT, "Accept": "application/json"},
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          body = response.read()
                      value = json.loads(body.decode("utf-8"))
                      parsed = urllib.parse.urlsplit(url)
                      raw_hashes.append({
                          "endpoint": f"{parsed.scheme}://{parsed.netloc}{parsed.path}",
                          "query_keys": sorted(urllib.parse.parse_qs(parsed.query).keys()),
                          "sha256": hashlib.sha256(body).hexdigest(),
                          "bytes": len(body),
                      })
                      return value
                  except Exception as exc:
                      error = exc
                      time.sleep(1 + attempt)
              if required:
                  raise RuntimeError(f"Public API request failed: {url}: {error}")
              return None

          def parse_price_amounts(value: str) -> list[float]:
              amounts: list[float] = []
              pattern = r"(?:\$|USD\s*)?([0-9][0-9,]*(?:\.[0-9]+)?)\s*([kKmM]?)"
              for match in re.finditer(pattern, value):
                  amount = float(match.group(1).replace(",", ""))
                  suffix = match.group(2).lower()
                  if suffix == "k":
                      amount *= 1_000
                  elif suffix == "m":
                      amount *= 1_000_000
                  if amount >= 10_000:
                      amounts.append(amount)
              return amounts

          def classify(event: dict[str, Any], market: dict[str, Any], spot: float) -> dict[str, Any]:
              question = text(market.get("question"))
              group_title = text(market.get("groupItemTitle"))
              compact = " ".join([question, group_title]).strip()
              lower = compact.lower()
              amounts = parse_price_amounts(compact)

              raw_threshold = number(market.get("groupItemThreshold"))
              threshold = raw_threshold if raw_threshold is not None and raw_threshold >= 10_000 else None
              if threshold is None and amounts:
                  threshold = amounts[0]

              range_low = number(market.get("lowerBound"))
              range_high = number(market.get("upperBound"))
              explicit_range = bool(
                  re.search(r"\bbetween\b|\brange\b", lower)
                  or re.search(r"\$?[0-9][0-9,]*(?:\.[0-9]+)?\s*(?:-|–|—|to)\s*\$?[0-9][0-9,]*(?:\.[0-9]+)?", compact, re.I)
              )
              if explicit_range and (range_low is None or range_high is None) and len(amounts) >= 2:
                  range_low, range_high = amounts[0], amounts[1]
              if explicit_range and range_low is not None and range_high is not None:
                  return {
                      "semantic_family": "RANGE_AT_TIME",
                      "threshold_usd": None,
                      "range_low_usd": min(range_low, range_high),
                      "range_high_usd": max(range_low, range_high),
                  }

              terminal_marker = bool(re.search(r"\bon\b|at .*time|closing|close price|end of", lower))
              if threshold is not None and terminal_marker and re.search(r"\babove\b|\bover\b|higher than", lower):
                  family = "ABOVE_AT_TIME"
              elif threshold is not None and terminal_marker and re.search(r"\bbelow\b|\bunder\b|lower than", lower):
                  family = "BELOW_AT_TIME"
              elif threshold is not None and re.search(r"\bdip\b|fall to|drop to", lower):
                  family = "TOUCH_LOWER"
              elif threshold is not None and re.search(r"\breach\b|rise to|reach", lower):
                  family = "TOUCH_UPPER"
              elif threshold is not None and re.search(r"\bhit\b|\btouch\b", lower):
                  family = "TOUCH_UPPER" if threshold >= spot else "TOUCH_LOWER"
              else:
                  family = "OTHER"
              return {
                  "semantic_family": family,
                  "threshold_usd": threshold,
                  "range_low_usd": None,
                  "range_high_usd": None,
              }

          def horizon(start_at: str | None, end_at: str | None) -> str:
              if not end_at:
                  return "UNKNOWN"
              end = dt.datetime.fromisoformat(end_at.replace("Z", "+00:00"))
              start = dt.datetime.fromisoformat(start_at.replace("Z", "+00:00")) if start_at else now
              hours = max(0.0, (end - start).total_seconds() / 3600)
              if hours <= 48:
                  return "DAILY"
              if hours <= 240:
                  return "WEEKLY"
              if hours <= 1080:
                  return "MONTHLY"
              return "YEARLY"

          def gate_high(value: float | None, passed: float, limited: float) -> str:
              if value is None or value < limited:
                  return "FAIL"
              return "PASS" if value >= passed else "LIMITED"

          def gate_low(value: float | None, passed: float, limited: float) -> str:
              if value is None or value > limited:
                  return "FAIL"
              return "PASS" if value <= passed else "LIMITED"

          def event_volume_gate(value: float | None, bucket: str) -> str:
              limits = {
                  "DAILY": (25_000, 10_000),
                  "WEEKLY": (100_000, 25_000),
                  "MONTHLY": (250_000, 100_000),
                  "YEARLY": (1_000_000, 250_000),
                  "UNKNOWN": (250_000, 100_000),
              }
              return gate_high(value, *limits[bucket])

          def capture_book(token_id: str) -> dict[str, Any]:
              query = urllib.parse.urlencode({"token_id": token_id})
              book = http_json(f"{CLOB}/book?{query}", required=False)
              spread_payload = http_json(f"{CLOB}/spread?{query}", required=False)
              if not isinstance(book, dict):
                  return {"available": False, "reasons": ["EMPTY_ORDER_BOOK"]}
              bids = [row for row in book.get("bids", []) if isinstance(row, dict)]
              asks = [row for row in book.get("asks", []) if isinstance(row, dict)]
              bid_prices = [number(row.get("price")) for row in bids]
              ask_prices = [number(row.get("price")) for row in asks]
              bid_prices = [value for value in bid_prices if value is not None]
              ask_prices = [value for value in ask_prices if value is not None]
              best_bid = max(bid_prices) if bid_prices else None
              best_ask = min(ask_prices) if ask_prices else None
              spread = number(spread_payload.get("spread")) if isinstance(spread_payload, dict) else None
              if spread is None and best_bid is not None and best_ask is not None:
                  spread = best_ask - best_bid
              midpoint = (best_bid + best_ask) / 2 if best_bid is not None and best_ask is not None else None
              timestamp = number(book.get("timestamp"))
              if timestamp is not None and timestamp > 10_000_000_000:
                  timestamp /= 1000
              age = now.timestamp() - timestamp if timestamp is not None else None
              return {
                  "available": bool(bids and asks),
                  "condition_id": text(book.get("market")),
                  "book_hash": text(book.get("hash")),
                  "timestamp_unix": timestamp,
                  "age_seconds": age,
                  "best_bid": best_bid,
                  "best_ask": best_ask,
                  "midpoint": midpoint,
                  "spread": spread,
                  "last_trade_price": number(book.get("last_trade_price")),
                  "bid_levels": len(bids),
                  "ask_levels": len(asks),
                  "bid_depth_shares": sum(number(row.get("size")) or 0 for row in bids),
                  "ask_depth_shares": sum(number(row.get("size")) or 0 for row in asks),
                  "reasons": [] if bids and asks else ["EMPTY_ORDER_BOOK"],
              }

          def capture_history(token_id: str) -> dict[str, Any]:
              query = urllib.parse.urlencode({
                  "market": token_id,
                  "startTs": int(now.timestamp() - 7 * 86400),
                  "endTs": int(now.timestamp()),
                  "interval": "all",
                  "fidelity": 60,
              })
              payload = http_json(f"{CLOB}/prices-history?{query}", required=False)
              rows = payload.get("history", []) if isinstance(payload, dict) else []
              points: list[tuple[float, float]] = []
              for row in rows:
                  if isinstance(row, dict):
                      timestamp, price = number(row.get("t")), number(row.get("p"))
                      if timestamp is not None and price is not None:
                          points.append((timestamp, price))
              points.sort()
              if not points:
                  return {"points": 0, "latest_probability": None, "change_6h": None, "change_24h": None, "change_7d": None}
              latest = points[-1][1]
              def change(hours: int) -> float:
                  target = now.timestamp() - hours * 3600
                  earlier = [item for item in points if item[0] <= target]
                  prior = earlier[-1][1] if earlier else points[0][1]
                  return round(latest - prior, 6)
              return {
                  "points": len(points),
                  "latest_probability": latest,
                  "change_6h": change(6),
                  "change_24h": change(24),
                  "change_7d": change(168),
              }

          def capture_oi(condition_id: str) -> float | None:
              if not re.fullmatch(r"0x[a-fA-F0-9]{64}", condition_id):
                  return None
              query = urllib.parse.urlencode({"market": condition_id})
              payload = http_json(f"{DATA}/oi?{query}", required=False)
              if isinstance(payload, list):
                  for row in payload:
                      if isinstance(row, dict) and text(row.get("market")).lower() == condition_id.lower():
                          return number(row.get("value"))
              return None

          # Current spot is used only to normalize upper/lower distance.
          coingecko = http_json(COINGECKO, required=False)
          current_spot = number(get_path(coingecko, "bitcoin.usd")) if isinstance(coingecko, dict) else None
          accepted = http_json(ACCEPTED_SNAPSHOT, required=False)
          accepted_price = number(get_path(accepted, "public_samples.assets.BTC.price_usd")) if isinstance(accepted, dict) else None
          accepted_at = parse_iso(accepted.get("generated_at_utc")) if isinstance(accepted, dict) else None
          accepted_age = None
          if accepted_at:
              accepted_age = (now - dt.datetime.fromisoformat(accepted_at.replace("Z", "+00:00"))).total_seconds() / 3600
          spot = current_spot if current_spot is not None else accepted_price
          spot_provider = "COINGECKO_SIMPLE_PRICE" if current_spot is not None else "ACCEPTED_BTC_MARKET_SNAPSHOT"
          if spot is None:
              raise RuntimeError("BTC spot reference unavailable")

          # Scan the full bounded Gamma inventory. The legacy endpoint currently caps pages at 100.
          events: list[dict[str, Any]] = []
          offset = 0
          gamma_scan_truncated = False
          while offset < MAX_EVENTS:
              query = urllib.parse.urlencode({
                  "active": "true",
                  "closed": "false",
                  "archived": "false",
                  "limit": PAGE_SIZE,
                  "offset": offset,
                  "order": "volume",
                  "ascending": "false",
              })
              batch = http_json(f"{GAMMA}/events?{query}")
              if not isinstance(batch, list):
                  raise RuntimeError("Gamma events payload is not a list")
              events.extend(row for row in batch if isinstance(row, dict))
              if not batch or len(batch) < PAGE_SIZE:
                  break
              offset += len(batch)
          else:
              gamma_scan_truncated = True

          event_inventory: list[dict[str, Any]] = []
          all_btc_markets: list[dict[str, Any]] = []
          for event in events:
              markets = event.get("markets", []) if isinstance(event.get("markets"), list) else []
              searchable = " ".join([
                  text(event.get("title")),
                  text(event.get("slug")),
                  *[text(market.get("question")) for market in markets if isinstance(market, dict)],
              ]).lower()
              if not re.search(r"\bbitcoin\b|\bbtc\b", searchable):
                  continue
              event_start = parse_iso(event.get("startDate") or event.get("eventStartTime"))
              event_end = parse_iso(event.get("endDate"))
              inventory_row = {
                  "event_id": text(event.get("id")),
                  "slug": text(event.get("slug")),
                  "title": text(event.get("title")),
                  "start_at_utc": event_start,
                  "end_at_utc": event_end,
                  "resolution_source": text(event.get("resolutionSource")),
                  "volume_total_usd": number(event.get("volume")),
                  "volume_24h_usd": number(event.get("volume24hr")),
                  "liquidity_total_usd": number(event.get("liquidity")),
                  "open_interest_usd_gamma": number(event.get("openInterest")),
                  "active_market_count": 0,
                  "recognized_market_count": 0,
              }
              for market in markets:
                  if not isinstance(market, dict):
                      continue
                  if market.get("active") is not True or market.get("closed") is True or market.get("archived") is True:
                      continue
                  outcomes = [str(value) for value in parse_list(market.get("outcomes"))]
                  tokens = [str(value) for value in parse_list(market.get("clobTokenIds"))]
                  prices = [number(value) for value in parse_list(market.get("outcomePrices"))]
                  yes_index = next((i for i, value in enumerate(outcomes) if value.lower() == "yes"), 0)
                  semantics = classify(event, market, spot)
                  condition_id = text(market.get("conditionId") or market.get("condition_id"))
                  row = {
                      "event_id": inventory_row["event_id"],
                      "event_slug": inventory_row["slug"],
                      "event_title": inventory_row["title"],
                      "event_volume_total_usd": inventory_row["volume_total_usd"],
                      "market_id": text(market.get("id")),
                      "condition_id": condition_id,
                      "question_id": text(market.get("questionID")),
                      "market_slug": text(market.get("slug")),
                      "question": text(market.get("question")),
                      **semantics,
                      "yes_token_id": tokens[yes_index] if len(tokens) > yes_index else "",
                      "no_token_id": tokens[1 - yes_index] if len(tokens) == 2 else "",
                      "gamma_probability": prices[yes_index] if len(prices) > yes_index else None,
                      "volume_total_usd": number(market.get("volumeNum") or market.get("volume")),
                      "volume_24h_usd": number(market.get("volume24hr")),
                      "liquidity_usd": number(market.get("liquidityNum") or market.get("liquidity")),
                      "start_at_utc": parse_iso(market.get("startDateIso") or market.get("startDate")) or event_start,
                      "end_at_utc": parse_iso(market.get("endDateIso") or market.get("endDate")) or event_end,
                      "resolution_source": text(market.get("resolutionSource")) or inventory_row["resolution_source"],
                      "resolution_rule_excerpt": text(market.get("description"))[:500],
                  }
                  all_btc_markets.append(row)
                  inventory_row["active_market_count"] += 1
                  if semantics["semantic_family"] != "OTHER":
                      inventory_row["recognized_market_count"] += 1
              event_inventory.append(inventory_row)

          recognized = [row for row in all_btc_markets if row["semantic_family"] != "OTHER"]
          recognized.sort(key=lambda row: (row["volume_total_usd"] or 0, row["liquidity_usd"] or 0), reverse=True)
          selected = recognized[:MAX_CAPTURE_MARKETS]
          market_capture_truncated = len(recognized) > len(selected)

          captured: list[dict[str, Any]] = []
          for index, row in enumerate(selected, 1):
              token = row["yes_token_id"]
              condition = row["condition_id"]
              book = capture_book(token) if token else {"available": False, "reasons": ["MISSING_TOKEN_ID"]}
              history = capture_history(token) if token else {"points": 0, "latest_probability": None, "change_6h": None, "change_24h": None, "change_7d": None}
              oi = capture_oi(condition)
              probability = book.get("midpoint")
              if probability is None:
                  probability = book.get("last_trade_price")
              if probability is None:
                  probability = history.get("latest_probability")
              if probability is None:
                  probability = row["gamma_probability"]

              bucket = horizon(row["start_at_utc"], row["end_at_utc"])
              gates = {
                  "event_volume": event_volume_gate(row["event_volume_total_usd"], bucket),
                  "market_volume": gate_high(row["volume_total_usd"], 5_000, 1_000),
                  "open_interest": gate_high(oi, 5_000, 1_000),
                  "spread": gate_low(book.get("spread"), 0.03, 0.07),
                  "book_age": gate_low(book.get("age_seconds"), 900, 3600),
                  "spot_reference_age": "PASS" if spot_provider == "COINGECKO_SIMPLE_PRICE" else gate_low(accepted_age, 6, 24),
              }
              fatal: list[str] = []
              if not row["resolution_source"] and not row["resolution_rule_excerpt"]:
                  fatal.append("MISSING_RESOLUTION_RULE")
              if not token:
                  fatal.append("MISSING_TOKEN_ID")
              if not condition:
                  fatal.append("MISSING_CONDITION_ID")
              if not book.get("available"):
                  fatal.append("EMPTY_ORDER_BOOK")
              if probability is None:
                  fatal.append("MISSING_PROBABILITY")

              if fatal or gates["spread"] == "FAIL" or gates["book_age"] == "FAIL" or (
                  gates["market_volume"] == "FAIL" and gates["open_interest"] == "FAIL"
              ):
                  quality = "FAIL"
              elif "FAIL" in gates.values() or "LIMITED" in gates.values():
                  quality = "LIMITED"
              else:
                  quality = "PASS"

              captured.append({
                  "capture_rank": index,
                  **{key: value for key, value in row.items() if key not in {"event_volume_total_usd"}},
                  "event_volume_total_usd": row["event_volume_total_usd"],
                  "horizon": bucket,
                  "observed_probability": probability,
                  "best_bid": book.get("best_bid"),
                  "best_ask": book.get("best_ask"),
                  "spread": book.get("spread"),
                  "last_trade_price": book.get("last_trade_price"),
                  "order_book_timestamp_unix": book.get("timestamp_unix"),
                  "order_book_age_seconds": book.get("age_seconds"),
                  "bid_levels": book.get("bid_levels", 0),
                  "ask_levels": book.get("ask_levels", 0),
                  "bid_depth_shares": book.get("bid_depth_shares", 0),
                  "ask_depth_shares": book.get("ask_depth_shares", 0),
                  "open_interest_usd": oi,
                  "price_history_points": history.get("points", 0),
                  "expectation_change_6h": history.get("change_6h"),
                  "expectation_change_24h": history.get("change_24h"),
                  "expectation_change_7d": history.get("change_7d"),
                  "quality": quality,
                  "quality_gates": gates,
                  "quality_reasons": sorted(set(fatal + list(book.get("reasons", [])))),
                  "consistency": "NOT_EVALUATED",
              })
              print(f"captured {index}/{len(selected)} {row['semantic_family']}: {row['question'][:88]}")

          # Evaluate threshold monotonicity and mutually exclusive range sums.
          grouped: dict[tuple[str, str], list[dict[str, Any]]] = defaultdict(list)
          for row in captured:
              grouped[(row["event_id"], row["semantic_family"])].append(row)
          checks: list[dict[str, Any]] = []
          for (event_id, family), rows in grouped.items():
              if family == "RANGE_AT_TIME":
                  values = [number(row["observed_probability"]) for row in rows]
                  values = [value for value in values if value is not None]
                  total = sum(values)
                  status = "PASS" if 0.97 <= total <= 1.03 else "LIMITED" if 0.93 <= total <= 1.07 else "FAIL"
                  check = {"event_id": event_id, "semantic_family": family, "probability_sum": total, "status": status}
              else:
                  ordered = [row for row in rows if row["threshold_usd"] is not None and row["observed_probability"] is not None]
                  ordered.sort(key=lambda row: float(row["threshold_usd"]))
                  max_inversion = 0.0
                  for left, right in zip(ordered, ordered[1:]):
                      left_p, right_p = float(left["observed_probability"]), float(right["observed_probability"])
                      if family in {"TOUCH_UPPER", "ABOVE_AT_TIME"}:
                          inversion = max(0.0, right_p - left_p)
                      elif family in {"TOUCH_LOWER", "BELOW_AT_TIME"}:
                          inversion = max(0.0, left_p - right_p)
                      else:
                          inversion = 0.0
                      max_inversion = max(max_inversion, inversion)
                  status = "PASS" if max_inversion <= 0.02 else "LIMITED" if max_inversion <= 0.05 else "FAIL"
                  check = {
                      "event_id": event_id,
                      "semantic_family": family,
                      "market_count": len(ordered),
                      "max_inversion_probability_points": max_inversion,
                      "status": status,
                  }
              checks.append(check)
              for row in rows:
                  row["consistency"] = status
                  if status == "FAIL":
                      row["quality"] = "FAIL"
                      row["quality_reasons"].append("CONSISTENCY_FAIL")
                  elif status == "LIMITED" and row["quality"] == "PASS":
                      row["quality"] = "LIMITED"
                      row["quality_reasons"].append("CONSISTENCY_LIMITED")

          # Build ladders and compare equally distant touch levels by horizon.
          ladders: list[dict[str, Any]] = []
          for (event_id, family), rows in grouped.items():
              accepted_rows = [row for row in rows if row["quality"] in {"PASS", "LIMITED"}]
              if accepted_rows:
                  ladders.append({
                      "event_id": event_id,
                      "event_slug": accepted_rows[0]["event_slug"],
                      "horizon": accepted_rows[0]["horizon"],
                      "semantic_family": family,
                      "markets": [
                          {
                              "market_id": row["market_id"],
                              "threshold_usd": row["threshold_usd"],
                              "range_low_usd": row["range_low_usd"],
                              "range_high_usd": row["range_high_usd"],
                              "probability": row["observed_probability"],
                              "quality": row["quality"],
                          }
                          for row in sorted(accepted_rows, key=lambda item: item["threshold_usd"] or item["range_low_usd"] or 0)
                      ],
                  })

          skew_by_horizon: list[dict[str, Any]] = []
          for bucket in ["DAILY", "WEEKLY", "MONTHLY", "YEARLY"]:
              upper = [row for row in captured if row["horizon"] == bucket and row["semantic_family"] == "TOUCH_UPPER" and row["quality"] in {"PASS", "LIMITED"}]
              lower = [row for row in captured if row["horizon"] == bucket and row["semantic_family"] == "TOUCH_LOWER" and row["quality"] in {"PASS", "LIMITED"}]
              best = None
              best_delta = None
              for up in upper:
                  for down in lower:
                      up_distance = abs(math.log(float(up["threshold_usd"]) / spot))
                      down_distance = abs(math.log(float(down["threshold_usd"]) / spot))
                      delta = abs(up_distance - down_distance)
                      relative = delta / max(up_distance, down_distance, 1e-9)
                      if delta <= 0.01 or relative <= 0.10:
                          if best_delta is None or delta < best_delta:
                              best_delta = delta
                              best = (up, down, up_distance, down_distance)
              if best:
                  up, down, up_distance, down_distance = best
                  skew = float(up["observed_probability"]) - float(down["observed_probability"])
                  state = "UPPER_TILT" if skew >= 0.10 else "LOWER_TILT" if skew <= -0.10 else "BALANCED"
                  skew_by_horizon.append({
                      "horizon": bucket,
                      "state": state,
                      "skew": skew,
                      "upper_market_id": up["market_id"],
                      "lower_market_id": down["market_id"],
                      "upper_log_distance": up_distance,
                      "lower_log_distance": down_distance,
                  })

          quality_counts = Counter(row["quality"] for row in captured)
          quality_counts = {key: quality_counts.get(key, 0) for key in ["PASS", "LIMITED", "FAIL"]}
          accepted_count = quality_counts["PASS"] + quality_counts["LIMITED"]
          if not accepted_count:
              expectation_state = "INSUFFICIENT_EVIDENCE"
          elif skew_by_horizon:
              states = {row["state"] for row in skew_by_horizon}
              expectation_state = skew_by_horizon[0]["state"] if len(states) == 1 else "DISPERSED"
          else:
              range_rows = [row for row in captured if row["semantic_family"] == "RANGE_AT_TIME" and row["quality"] in {"PASS", "LIMITED"}]
              if len(range_rows) >= 3:
                  values = [max(0.0, float(row["observed_probability"])) for row in range_rows]
                  total = sum(values)
                  distribution = [value / total for value in values] if total else []
                  entropy = -sum(value * math.log(value) for value in distribution if value > 0) / math.log(len(distribution)) if len(distribution) > 1 else 0
                  expectation_state = "DISPERSED" if entropy >= 0.65 else "BALANCED"
              else:
                  expectation_state = "INSUFFICIENT_EVIDENCE"

          snapshot = {
              "schema_version": "btc_prediction_market_expectation_v0_1",
              "generated_at_utc": observed_at,
              "observed_at_utc": observed_at,
              "asset": "BTC",
              "collection_status": "ACCEPTED" if quality_counts["PASS"] else "PARTIAL" if accepted_count else "REJECTED",
              "source": {
                  "primary_provider": "POLYMARKET",
                  "discovery": "GAMMA_API",
                  "pricing": "CLOB_API",
                  "activity": "DATA_API",
                  "coingecko_role": "CURRENT_SPOT_NORMALIZATION_ONLY",
              },
              "spot_reference": {
                  "provider": spot_provider,
                  "price_usd": spot,
                  "observed_at_utc": observed_at if current_spot is not None else accepted_at,
              },
              "accepted_market_snapshot_reference": {
                  "price_usd": accepted_price,
                  "generated_at_utc": accepted_at,
                  "age_hours": accepted_age,
                  "used_for_current_normalization": current_spot is None,
              },
              "inventory": {
                  "gamma_events_scanned": len(events),
                  "gamma_scan_limit": MAX_EVENTS,
                  "gamma_scan_truncated": gamma_scan_truncated,
                  "bitcoin_events_found": len(event_inventory),
                  "active_bitcoin_markets_found": len(all_btc_markets),
                  "recognized_markets_found": len(recognized),
                  "markets_captured": len(captured),
                  "market_capture_limit": MAX_CAPTURE_MARKETS,
                  "market_capture_truncated": market_capture_truncated,
                  "events": event_inventory,
                  "all_market_identifiers": [
                      {
                          "event_id": row["event_id"],
                          "market_id": row["market_id"],
                          "condition_id": row["condition_id"],
                          "question_id": row["question_id"],
                          "yes_token_id": row["yes_token_id"],
                          "semantic_family": row["semantic_family"],
                          "question": row["question"],
                      }
                      for row in all_btc_markets
                  ],
              },
              "markets": captured,
              "derived": {
                  "expectation_ladders": ladders,
                  "expectation_skew_by_horizon": skew_by_horizon,
                  "horizon_divergence": len({row["state"] for row in skew_by_horizon}) > 1,
                  "expectation_state": expectation_state,
                  "expectation_quality": "PASS" if quality_counts["PASS"] and not quality_counts["FAIL"] else "PARTIAL" if accepted_count else "INSUFFICIENT_EVIDENCE",
                  "quality_counts": quality_counts,
                  "consistency_checks": checks,
              },
              "proof": {
                  "raw_response_hashes_file": "btc_polymarket_raw_hashes.json",
                  "normalized_snapshot_sha256": "PENDING_SELF_HASH",
                  "collector_version": "btc_polymarket_expectation_capture_v0_2",
              },
              "boundary": {
                  "static_snapshot_only": True,
                  "no_live_provider_call_during_request": True,
                  "no_forecast": True,
                  "no_price_target": True,
                  "no_trading_signal": True,
                  "no_execution": True,
                  "no_wallet_connection": True,
                  "no_financial_advice": True,
                  "separate_from_probability_continuation": True,
              },
          }

          assert snapshot["schema_version"] == "btc_prediction_market_expectation_v0_1"
          assert snapshot["inventory"]["bitcoin_events_found"] > 0
          assert snapshot["inventory"]["recognized_markets_found"] > 0
          assert snapshot["inventory"]["markets_captured"] > 0
          assert snapshot["derived"]["expectation_state"] in {
              "UPPER_TILT", "LOWER_TILT", "BALANCED", "DISPERSED", "INSUFFICIENT_EVIDENCE"
          }
          assert snapshot["boundary"]["no_forecast"] is True
          assert snapshot["boundary"]["no_trading_signal"] is True
          assert snapshot["boundary"]["separate_from_probability_continuation"] is True
          semantic_counts = Counter(row["semantic_family"] for row in captured)
          assert semantic_counts.get("RANGE_AT_TIME", 0) < len(captured), "Classifier collapsed all contracts into ranges"

          prehash = json.dumps(snapshot, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          snapshot["proof"]["normalized_snapshot_sha256"] = hashlib.sha256(prehash).hexdigest()
          hashes = {
              "schema_version": "btc_polymarket_raw_response_hashes_v0_1",
              "observed_at_utc": observed_at,
              "response_count": len(raw_hashes),
              "responses": raw_hashes,
          }

          report = [
              "# BTC Polymarket Expectation Signal — Exact Public API Capture",
              "",
              f"- Observed at UTC: `{observed_at}`",
              f"- Current spot normalization: `{spot_provider}` · `${spot:,.2f}`",
              f"- Gamma events scanned: `{len(events)}` · truncated `{gamma_scan_truncated}`",
              f"- Bitcoin events found: `{len(event_inventory)}`",
              f"- Active Bitcoin markets found: `{len(all_btc_markets)}`",
              f"- Recognized expectation markets: `{len(recognized)}`",
              f"- Markets with exact CLOB/Data capture: `{len(captured)}` · truncated `{market_capture_truncated}`",
              f"- Quality PASS `{quality_counts['PASS']}` · LIMITED `{quality_counts['LIMITED']}` · FAIL `{quality_counts['FAIL']}`",
              f"- Derived state: `{expectation_state}`",
              f"- Collection status: `{snapshot['collection_status']}`",
              "",
              "## Semantic inventory",
              "",
          ]
          for family, count in sorted(semantic_counts.items()):
              report.append(f"- `{family}`: {count}")
          report += [
              "",
              "## Boundaries",
              "",
              "- Public unauthenticated APIs only.",
              "- No trading, wallet, execution, price-target, or advice output.",
              "- Contract probabilities remain external expectation evidence, not a Cosmographer forecast.",
              "- This artifact is separate from `probability_continuation`.",
              "",
              "## Captured markets",
              "",
          ]
          for row in captured:
              report.append(
                  f"- `{row['quality']}` · `{row['semantic_family']}` · {row['question']} · "
                  f"p={row['observed_probability']} · spread={row['spread']} · OI={row['open_interest_usd']}"
              )

          output = Path("sanitized")
          (output / "btc_polymarket_expectation_capture.json").write_text(
              json.dumps(snapshot, indent=2, sort_keys=True, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          (output / "btc_polymarket_raw_hashes.json").write_text(
              json.dumps(hashes, indent=2, sort_keys=True, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          (output / "btc_polymarket_expectation_report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(report[:24]) + "\n")
          PY

      - name: Verify sanitized artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("sanitized")
          snapshot = json.loads((root / "btc_polymarket_expectation_capture.json").read_text())
          hashes = json.loads((root / "btc_polymarket_raw_hashes.json").read_text())
          assert snapshot["inventory"]["markets_captured"] == len(snapshot["markets"])
          assert hashes["response_count"] == len(hashes["responses"])
          assert all(len(row["sha256"]) == 64 for row in hashes["responses"])
          forbidden = ["api_key", "private_key", "wallet_secret", "authorization"]
          rendered = (json.dumps(snapshot) + json.dumps(hashes)).lower()
          assert not any(value in rendered for value in forbidden)
          print(json.dumps({
              "collection_status": snapshot["collection_status"],
              "expectation_state": snapshot["derived"]["expectation_state"],
              "quality_counts": snapshot["derived"]["quality_counts"],
              "events_scanned": snapshot["inventory"]["gamma_events_scanned"],
              "bitcoin_events": snapshot["inventory"]["bitcoin_events_found"],
              "active_bitcoin_markets": snapshot["inventory"]["active_bitcoin_markets_found"],
              "recognized_markets": snapshot["inventory"]["recognized_markets_found"],
              "markets_captured": snapshot["inventory"]["markets_captured"],
              "gamma_scan_truncated": snapshot["inventory"]["gamma_scan_truncated"],
              "market_capture_truncated": snapshot["inventory"]["market_capture_truncated"],
          }, indent=2))
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-polymarket-expectation-api-capture-${{ github.run_id }}
          path: sanitized/
          if-no-files-found: error
          retention-days: 30
