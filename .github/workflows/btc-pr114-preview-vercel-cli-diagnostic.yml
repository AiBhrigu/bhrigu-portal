name: BTC PR114 Preview Vercel CLI Diagnostic

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/btc-pr114-preview-vercel-cli-diagnostic.yml

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify Vercel token availability
        run: |
          if test -z "$VERCEL_TOKEN"; then
            echo 'VERCEL_TOKEN=UNAVAILABLE'
            exit 1
          fi
          echo 'VERCEL_TOKEN=AVAILABLE'

      - name: Resolve protected Preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
              f"/issues/{os.environ['PR_NUMBER']}/comments?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "btc-pr114-vercel-cli-diagnostic",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              comments = json.load(response)
          preview = None
          for comment in comments:
              if comment.get("user", {}).get("login") != "vercel[bot]":
                  continue
              match = re.search(r"\[Preview\]\((https://[^)]+\.vercel\.app)\)", comment.get("body", ""))
              if match:
                  preview = match.group(1).rstrip("/")
                  break
          if not preview:
              raise SystemExit("Vercel Preview URL not found")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"preview={preview}\n")
          print({"preview": preview})
          PY

      - name: Probe protected Preview with Vercel CLI
        env:
          PREVIEW: ${{ steps.preview.outputs.preview }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          target="$PREVIEW/crypto-astro/btc/live?lang=ru&vercel_cli_diagnostic=1"
          npx --yes vercel@latest curl "$target" \
            --token "$VERCEL_TOKEN" \
            -D /tmp/pr114-vercel-headers.txt \
            -o /tmp/pr114-vercel-body.html \
            --silent --show-error --location
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          headers = Path("/tmp/pr114-vercel-headers.txt").read_text(encoding="utf-8", errors="replace")
          body = Path("/tmp/pr114-vercel-body.html").read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"(?im)^x-btc-deployment-source-sha:\s*([0-9a-f]{40})\s*$", headers)
          if not matches:
              meta = re.search(r'name="btc-deployment-source-sha" content="([0-9a-f]{40})"', body, re.I)
              served = meta.group(1) if meta else None
          else:
              served = matches[-1]
          cache_values = re.findall(r"(?im)^cache-control:\s*(.+?)\s*$", headers)
          cache_control = cache_values[-1] if cache_values else None
          title = re.search(r"<title>(.*?)</title>", body, re.I | re.S)
          result = {
              "served_head": served,
              "expected_head": os.environ["EXPECTED_HEAD"],
              "cache_control": cache_control,
              "title": re.sub(r"\s+", " ", title.group(1)).strip() if title else None,
              "has_runtime_schema": "btc_cosmographer_evidence_navigation_runtime_v0_1" in body,
              "has_session_schema": "btc_cosmographer_dialogue_session_v0_3" in body,
          }
          result["pass"] = (
              served == os.environ["EXPECTED_HEAD"]
              and "no-store" in (cache_control or "").casefold()
              and result["has_runtime_schema"]
              and result["has_session_schema"]
          )
          print(json.dumps(result, indent=2))
          if not result["pass"]:
              raise SystemExit("VERCEL_CLI_PROTECTED_PREVIEW_IDENTITY=FAIL")
          PY
