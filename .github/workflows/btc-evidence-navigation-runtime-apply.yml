name: BTC Evidence Navigation Runtime Apply

on:
  push:
    branches:
      - agent/btc-cosmographer-evidence-navigation-runtime-v0-1
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/btc-evidence-navigation-runtime-apply.yml
      - scripts/apply-btc-evidence-navigation-runtime-v0-1.py
      - scripts/repair-btc-evidence-navigation-relation-operator-v0-1.py
      - lib/btc-cosmographer-evidence-navigation-runtime.ts
      - scripts/run-btc-evidence-navigation-runtime-fixture.mjs

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-verify:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'Implement BTC evidence and navigation runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/btc-cosmographer-evidence-navigation-runtime-v0-1
          fetch-depth: 0

      - name: Verify exact source ancestry
        run: |
          test "$(git branch --show-current)" = "agent/btc-cosmographer-evidence-navigation-runtime-v0-1"
          git merge-base --is-ancestor e07da6f6d216d28621b8592ecf8c066b05897ba9 HEAD

      - name: Apply accepted runtime contract
        run: |
          python3 scripts/apply-btc-evidence-navigation-runtime-v0-1.py
          python3 scripts/repair-btc-evidence-navigation-relation-operator-v0-1.py

      - name: Remove one-shot helpers
        run: |
          rm .github/workflows/btc-evidence-navigation-runtime-apply.yml
          rm scripts/apply-btc-evidence-navigation-runtime-v0-1.py
          rm scripts/repair-btc-evidence-navigation-relation-operator-v0-1.py

      - name: Verify exact nine-file product scope
        shell: bash
        run: |
          mapfile -t actual < <(git diff --name-only e07da6f6d216d28621b8592ecf8c066b05897ba9 | sort)
          mapfile -t expected < <(printf '%s\n' \
            .github/scripts/verify-btc-public-acceptance-scope.py \
            .github/workflows/btc-evidence-navigation-runtime-pr.yml \
            components/btc/BtcCosmographerDialogue.tsx \
            lib/btc-cosmographer-answer.ts \
            lib/btc-cosmographer-evidence-navigation-runtime.ts \
            lib/btc-live-dialogue-session.ts \
            lib/btc-live-dialogue-style.ts \
            pages/crypto-astro/btc/live.tsx \
            scripts/run-btc-evidence-navigation-runtime-fixture.mjs | sort)
          printf 'actual=%s\n' "${actual[*]}"
          test "${actual[*]}" = "${expected[*]}"
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify new runtime contract
        run: node scripts/run-btc-evidence-navigation-runtime-fixture.mjs

      - name: Verify inherited BTC routing
        run: npm run verify:btc-routing

      - name: Verify production build
        run: npm run build

      - name: Commit exact candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement BTC evidence and navigation runtime"

      - name: Verify permanent scope gate on committed head
        env:
          BTC_ACCEPTANCE_BASE_SHA: e07da6f6d216d28621b8592ecf8c066b05897ba9
        run: |
          export BTC_ACCEPTANCE_HEAD_SHA="$(git rev-parse HEAD)"
          export GITHUB_EVENT_NAME=pull_request
          python3 .github/scripts/verify-btc-public-acceptance-scope.py

      - name: Push exact candidate
        run: git push origin HEAD:agent/btc-cosmographer-evidence-navigation-runtime-v0-1

      - name: Bind exact-head success status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/statuses/{sha}",
              data=json.dumps({
                  "state": "success",
                  "context": "BTC Evidence Navigation Runtime Exact Head",
                  "description": "9-file scope, runtime fixture, inherited routing and production build passed",
              }).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              assert response.status == 201, response.status
          PY
