name: Temporary Reading Mobile Overflow Repair

on:
  push:
    branches: [ "agent/bhrigu-reading-mobile-390-overflow-repair-v0-1" ]
    paths:
      - ".github/workflows/tmp-reading-mobile-overflow-repair.yml"

concurrency:
  group: reading-mobile-overflow-repair-v0-1
  cancel-in-progress: true

permissions:
  contents: write

env:
  BASE_HARNESS_SHA: 3fc872ca256dc3d7891c1034cc4b5451ca5f5c4a
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout authorized repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact base and apply one-line repair
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_HARNESS_SHA" HEAD
          python <<'PY'
          from pathlib import Path

          path = Path("pages/reading.js")
          source = path.read_text(encoding="utf-8")
          old = '<h1 style={{ fontSize: 80, lineHeight: 0.96, margin: 0, fontWeight: 700, letterSpacing: "-0.04em" }}>'
          new = '<h1 style={{ fontSize: "clamp(48px, 7vw, 80px)", lineHeight: 0.96, margin: 0, fontWeight: 700, letterSpacing: "-0.04em" }}>'
          if source.count(old) != 1:
              raise SystemExit(f"EXPECTED_EXACT_HEADING_MATCH_ONCE actual={source.count(old)}")
          repaired = source.replace(old, new, 1)
          path.write_text(repaired, encoding="utf-8")
          print("READING_RESPONSIVE_HEADING_REPAIR=APPLIED")
          PY
          git diff --check
          git diff -- pages/reading.js

      - name: Create self-cleaning exact repair commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/reading.js
          git rm .github/workflows/tmp-reading-mobile-overflow-repair.yml
          git commit -m "Reading: make hero heading responsive"
          git push origin HEAD:agent/bhrigu-reading-mobile-390-overflow-repair-v0-1
          echo "REPAIR_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove final one-file product scope
        run: |
          set -euo pipefail
          printf 'pages/reading.js\n' > /tmp/expected-scope.txt
          git diff --name-only "$BASE_HARNESS_SHA...HEAD" | sort > /tmp/actual-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          grep -F 'fontSize: "clamp(48px, 7vw, 80px)"' pages/reading.js
          if grep -Fq 'fontSize: 80, lineHeight: 0.96' pages/reading.js; then
            echo "FIXED_80PX_HEADING_REMAINS=YES" >&2
            exit 1
          fi
          echo "FINAL_EXACT_SCOPE=pages/reading.js"
          echo "FINAL_REPAIR_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify inherited BTC contracts
        run: |
          npm run verify:btc-paid-x402-sandbox
          npm run verify:btc-routing
          npm run verify:btc-binance-observation

      - name: Install pinned Chromium with Linux dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: npx playwright install --with-deps chromium

      - name: Run production build and full 50-capture visual harness
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
          BHRIGU_VISUAL_SOURCE_SHA: ${{ env.REPAIR_HEAD }}
          BHRIGU_VISUAL_HARNESS_SHA: ${{ env.BASE_HARNESS_SHA }}
          BHRIGU_VISUAL_ARTIFACT_ROOT: artifacts/local-visual
        run: npm run verify:local-visual

      - name: Prove 50 of 50 visual acceptance
        run: |
          set -euo pipefail
          manifest="$(find artifacts/local-visual -name manifest.json -type f | sort | tail -n 1)"
          test -n "$manifest"
          node - "$manifest" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.status !== 'PASS') throw new Error(`visual status ${manifest.status}`);
          if (manifest.expected_captures !== 50 || manifest.completed_captures !== 50) {
            throw new Error(`capture count ${manifest.completed_captures}/${manifest.expected_captures}`);
          }
          if (manifest.passing_captures !== 50 || manifest.blocking_captures !== 0) {
            throw new Error(`acceptance ${manifest.passing_captures} pass, ${manifest.blocking_captures} block`);
          }
          const readingMobile = manifest.captures.find((item) => item.path === '/reading' && item.viewport === 'mobile');
          if (!readingMobile) throw new Error('reading mobile capture missing');
          if (readingMobile.overflow_px !== 0 || readingMobile.blockers.length !== 0) {
            throw new Error(`reading mobile overflow=${readingMobile.overflow_px} blockers=${readingMobile.blockers.join(',')}`);
          }
          console.log('FULL_VISUAL_ACCEPTANCE=50/50_PASS');
          console.log('READING_MOBILE_OVERFLOW=0px');
          console.log(`REPAIR_HEAD=${manifest.source_sha}`);
          NODE

      - name: Publish visual summary
        if: always()
        run: |
          summary="$(find artifacts/local-visual -name summary.md -type f | sort | tail -n 1)"
          if [[ -n "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No visual summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exact-head visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhrigu-reading-mobile-overflow-repair-${{ github.run_id }}
          path: artifacts/local-visual/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
