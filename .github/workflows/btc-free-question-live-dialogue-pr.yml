name: BTC Free Question Live Dialogue PR

on:
  pull_request:
    branches: [ master ]
    paths:
      - ".github/workflows/btc-free-question-live-dialogue-pr.yml"
      - "components/btc/BtcLiveDialogue.tsx"
      - "lib/btc-executive-question-language.ts"
      - "lib/btc-live-dialogue-follow-up.ts"
      - "lib/btc-live-dialogue-session.ts"
      - "lib/btc-live-dialogue-style.ts"
      - "pages/crypto-astro/btc/live.tsx"
      - "scripts/run-btc-live-dialogue-session-fixture.mjs"
      - "scripts/verify-btc-live-dialogue-surface.py"
      - "tests/btc-bilingual-glyph-fixture.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporary-humanize-public-module-state:
    if: github.event_name == 'pull_request' && github.head_ref == 'repair/btc-dialogue-context-authority-deep-synthesis-v0-1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/btc-dialogue-context-authority-deep-synthesis-v0-1
          fetch-depth: 0
      - name: Replace internal module IDs with public RU and EN labels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          executive=Path('lib/btc-executive-question-language.ts')
          text=executive.read_text(encoding='utf-8')
          old='''function moduleState(envelope: BtcMarketEnvelope, moduleId: string): BtcSignalDirection {
            return envelope.phi_geometry.nodes.find((node) => node.id === moduleId)?.state ?? "UNAVAILABLE";
          }
          '''
          new=old+'''\nconst PUBLIC_MODULE_LABEL: Record<BtcPublicLocale, Record<string, string>> = {
            en: {
              market_structure: "Market Structure",
              liquidity_membrane: "Liquidity Membrane",
              change_event_memory: "Change / Event Memory",
              temporal_context: "Temporal Context",
              cosmographer_review: "Cosmographer Review",
            },
            ru: {
              market_structure: "Структура рынка",
              liquidity_membrane: "Мембрана ликвидности",
              change_event_memory: "Память изменений",
              temporal_context: "Временной контекст",
              cosmographer_review: "Обзор Космографа",
            },
          };

          const PUBLIC_SIGNAL_LABEL: Record<BtcPublicLocale, Record<BtcSignalDirection, string>> = {
            en: { UP: "strengthening", DOWN: "weakening", UNCHANGED: "unchanged", BOUNDED: "bounded", UNAVAILABLE: "unavailable" },
            ru: { UP: "усиливается", DOWN: "ослабевает", UNCHANGED: "без изменения", BOUNDED: "ограничено", UNAVAILABLE: "недоступно" },
          };

          function moduleProofLabel(locale: BtcPublicLocale, envelope: BtcMarketEnvelope, moduleId: string): string {
            const label = PUBLIC_MODULE_LABEL[locale][moduleId] ?? moduleId.replace(/_/g, " ");
            return `${label} — ${PUBLIC_SIGNAL_LABEL[locale][moduleState(envelope, moduleId)]}`;
          }
          '''
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new,1)
          old_route='''  const primary = envelope.route.primary_modules.map((id) => `${id}:${moduleState(envelope, id)}`).join(" / ");
            const supporting = envelope.route.supporting_modules.map((id) => `${id}:${moduleState(envelope, id)}`).join(" / ") || (ru ? "нет" : "none");'''
          new_route='''  const primary = envelope.route.primary_modules.map((id) => moduleProofLabel(locale, envelope, id)).join(" / ");
            const supporting = envelope.route.supporting_modules.map((id) => moduleProofLabel(locale, envelope, id)).join(" / ") || (ru ? "нет" : "none");'''
          assert text.count(old_route)==1, text.count(old_route)
          executive.write_text(text.replace(old_route,new_route,1),encoding='utf-8')

          fixture=Path('scripts/run-btc-live-dialogue-session-fixture.mjs')
          text=fixture.read_text(encoding='utf-8')
          old_gate='''  if (!deepRu.direct.includes("приоритет") || !deepRu.direct.includes("SPLIT") || !deepRu.limit.includes("SPLIT")) throw new Error("exact RU prior split not preserved");
            if (!deepRu.evidence_lines.every((line) => /важен|важно|важна/.test(line)) || !deepRu.change.includes("следующий принятый Snapshot") || !deepRu.source.includes("компактный контекст")) throw new Error("exact RU deep synthesis failed");'''
          new_gate='''  if (!deepRu.direct.includes("приоритет") || !deepRu.direct.includes("SPLIT") || !deepRu.limit.includes("SPLIT")) throw new Error("exact RU prior split not preserved");
            if (["change_event_memory:", "market_structure:", "liquidity_membrane:", "temporal_context:", "cosmographer_review:"].some((id) => deepRu.limit.includes(id))) throw new Error("raw module ID leaked into RU public answer");
            if (!deepRu.limit.includes("Память изменений") || !deepRu.limit.includes("Структура рынка") || !deepRu.limit.includes("Мембрана ликвидности")) throw new Error("RU public module labels missing");
            if (!deepRu.evidence_lines.every((line) => /важен|важно|важна/.test(line)) || !deepRu.change.includes("следующий принятый Snapshot") || !deepRu.source.includes("компактный контекст")) throw new Error("exact RU deep synthesis failed");'''
          assert text.count(old_gate)==1, text.count(old_gate)
          text=text.replace(old_gate,new_gate,1)
          old_en='''  if (!deepEn.direct.includes("priorities") || !deepEn.direct.includes("SPLIT") || !deepEn.limit.includes("SPLIT")) throw new Error("EN prior split not preserved");
            if (!deepEn.evidence_lines.every((line) => line.includes("it matters because")) || !deepEn.change.includes("next accepted Snapshot") || !deepEn.source.includes("compact prior context")) throw new Error("EN deep synthesis failed");'''
          new_en='''  if (!deepEn.direct.includes("priorities") || !deepEn.direct.includes("SPLIT") || !deepEn.limit.includes("SPLIT")) throw new Error("EN prior split not preserved");
            if (["change_event_memory:", "market_structure:", "liquidity_membrane:", "temporal_context:", "cosmographer_review:"].some((id) => deepEn.limit.includes(id))) throw new Error("raw module ID leaked into EN public answer");
            if (!deepEn.limit.includes("Change / Event Memory") || !deepEn.limit.includes("Market Structure") || !deepEn.limit.includes("Liquidity Membrane")) throw new Error("EN public module labels missing");
            if (!deepEn.evidence_lines.every((line) => line.includes("it matters because")) || !deepEn.change.includes("next accepted Snapshot") || !deepEn.source.includes("compact prior context")) throw new Error("EN deep synthesis failed");'''
          assert text.count(old_en)==1, text.count(old_en)
          fixture.write_text(text.replace(old_en,new_en,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/btc-executive-question-language.ts scripts/run-btc-live-dialogue-session-fixture.mjs
          git diff --cached --check
          git commit -m "BTC dialogue: humanize public module proof"
          git push origin HEAD:repair/btc-dialogue-context-authority-deep-synthesis-v0-1

  live-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prove exact session-dialogue scope
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | sort > /tmp/actual-scope.txt
          if test "${{ github.head_ref }}" = "fix/btc-dialogue-responsive-interaction-polish-v0-1"; then
            cat > /tmp/expected-scope.txt <<'SCOPE'
          .github/workflows/btc-free-question-live-dialogue-pr.yml
          lib/btc-live-dialogue-style.ts
          SCOPE
          elif test "${{ github.head_ref }}" = "repair/btc-dialogue-context-authority-deep-synthesis-v0-1"; then
            cat > /tmp/expected-scope.txt <<'SCOPE'
          .github/workflows/btc-free-question-live-dialogue-pr.yml
          components/btc/BtcLiveDialogue.tsx
          lib/btc-executive-question-language.ts
          lib/btc-live-dialogue-follow-up.ts
          pages/crypto-astro/btc/live.tsx
          scripts/run-btc-live-dialogue-session-fixture.mjs
          tests/btc-bilingual-glyph-fixture.ts
          SCOPE
          else
            cat > /tmp/expected-scope.txt <<'SCOPE'
          .github/workflows/btc-free-question-live-dialogue-pr.yml
          components/btc/BtcLiveDialogue.tsx
          lib/btc-live-dialogue-follow-up.ts
          lib/btc-live-dialogue-session.ts
          lib/btc-live-dialogue-style.ts
          pages/crypto-astro/btc/live.tsx
          scripts/run-btc-live-dialogue-session-fixture.mjs
          scripts/verify-btc-live-dialogue-surface.py
          SCOPE
          fi
          sort -o /tmp/expected-scope.txt /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt

      - name: Verify static session and inherited routing contracts
        env:
          BTC_LIVE_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/run-btc-live-dialogue-session-fixture.mjs | tee artifacts/btc-live-dialogue-session-fixture.log
          npm run verify:btc-routing
          npm run verify:btc-binance-observation

      - name: Build production bundle
        env:
          BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"
        run: npm run build

      - name: Start exact-head preview
        env:
          BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"
        run: |
          set -euo pipefail
          npm run start -- -p 3110 > artifacts/btc-live-dialogue-preview.log 2>&1 &
          echo $! > /tmp/btc-live-dialogue.pid
          for attempt in {1..90}; do
            curl --fail --silent "http://127.0.0.1:3110/crypto-astro/btc?lang=en" >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/btc-live-dialogue-preview.log
          exit 1

      - name: Run semantic and multi-turn runtime gates
        env:
          BTC_LIVE_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BTC_LIVE_PREVIEW_BASE: http://127.0.0.1:3110
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/run-btc-live-dialogue-session-fixture.mjs').read_text(encoding='utf-8')
          needle='for (const [locale, question, expectedClass, expectedFacet] of corpus) {\n    const pageText'
          replacement='for (const [locale, question, expectedClass, expectedFacet] of corpus) {\n    console.log(`SEMANTIC_CASE locale=${locale} question=${question}`);\n    const pageText'
          assert needle in source
          Path('/tmp/btc-live-dialogue-session-diagnostic.mjs').write_text(source.replace(needle,replacement,1),encoding='utf-8')
          PY
          node /tmp/btc-live-dialogue-session-diagnostic.mjs

      - name: Install visual driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Verify session-local desktop and mobile visual proof
        env:
          BTC_LIVE_PREVIEW_BASE: http://127.0.0.1:3110
        run: python3 scripts/verify-btc-live-dialogue-surface.py

      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/btc-live-dialogue.pid; then kill "$(cat /tmp/btc-live-dialogue.pid)" || true; fi

      - name: Enforce session-dialogue acceptance
        env:
          BTC_LIVE_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          contract=json.loads(Path('artifacts/btc-live-dialogue-session-contract.json').read_text())
          semantic=json.loads(Path('artifacts/btc-question-specific-semantic-gate.json').read_text())
          follow=json.loads(Path('artifacts/btc-session-follow-up-gate.json').read_text())
          visual=json.loads(Path('artifacts/btc-live-dialogue-visual-report.json').read_text())

          assert contract['status']=='PASS' and contract['runtime_head_sha']==os.environ['BTC_LIVE_RUNTIME_HEAD_SHA'], contract
          assert contract['storage']=='sessionStorage' and contract['server_transcript'] is False
          assert contract['required_natural_context_cases']==2
          assert semantic['status']=='PASS' and semantic['question_count']==24, semantic
          assert semantic['class_accuracy']=='24/24' and semantic['facet_accuracy']=='24/24', semantic
          assert semantic['exact_repeat_determinism'] is True
          assert semantic['cross_class_exact_answer_duplicates']==0 and semantic['generic_mixed_signals_count']==0
          assert follow['status']=='PASS' and follow['two_turn_count']==12 and follow['three_turn_count']==6 and follow['clarification_count']==8
          assert follow['natural_context_count']==2
          ru_deep, en_deep=follow['natural_context']
          assert ru_deep['question_class']=='change_memory' and ru_deep['relation']=='PRIORITY_WITHIN_PRIOR' and ru_deep['answer_state']=='SPLIT'
          assert en_deep['question_class']=='change_memory' and en_deep['relation']=='PRIORITY_WITHIN_PRIOR' and en_deep['answer_state']=='SPLIT'
          assert len(ru_deep['evidence_lines'])==3 and len(en_deep['evidence_lines'])==3
          assert 'компактный контекст' in ru_deep['source'] and 'compact prior context' in en_deep['source']
          assert not visual['failures'], visual
          required=(
            'landing_single_dialogue_cta','landing_has_no_question_input','landing_portal_nav_hidden','five_static_routes_preserved',
            'mobile_landing_cta_in_first_viewport','mobile_static_portal_nav_hidden','mobile_static_single_column',
            'mobile_static_routes_bounded','mobile_static_routes_do_not_overlap','mobile_static_no_overflow',
            'four_question_classes_visualized','four_distinct_headlines','all_samples_have_direct_answer',
            'all_samples_have_limit_and_change','all_samples_source_bound','all_samples_no_overflow','generic_mixed_signals_absent',
            'one_turn_session_visible','why_follow_up_resolved','why_inherits_gravity','three_turn_session_visible',
            'liquidity_follow_up_resolved','liquidity_follow_up_routed','same_tab_route_persistence',
            'latest_answer_not_covered','three_turn_no_overflow','separate_tab_isolated','eight_turn_thread_visible',
            'eight_turn_mobile_no_overflow','eight_turn_composer_reachable','no_context_clarification_fail_closed',
            'clarification_has_no_market_class','source_changed_disclosed','source_unavailable_history_visible',
            'malformed_storage_recovers','schema_mismatch_recovers','session_compaction_under_64kb',
            'session_compaction_retains_latest_six','session_compaction_flag_visible','new_conversation_clears_local_history',
            'new_conversation_returns_empty_thread','live_has_one_question_input','live_has_no_analytics_cards',
            'live_portal_nav_hidden','live_no_overflow','browser_severe_none',
          )
          for name in required:
            assert visual['checks'][name] is True,(name,visual)
          print('BTC_DIALOGUE_CONTEXT_AUTHORITY_AND_DEEP_SYNTHESIS_ACCEPTANCE=PASS')
          PY

      - name: Upload session, semantic and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-session-local-dialogue-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
