name: BTC Free Question Live Dialogue PR

on:
  pull_request:
    branches: [ master ]
    paths:
      - ".github/workflows/btc-free-question-live-dialogue-pr.yml"
      - "components/btc/BtcLiveDialogue.tsx"
      - "lib/btc-executive-question-language.ts"
      - "scripts/run-btc-live-dialogue-fixture.mjs"
      - "scripts/verify-btc-live-dialogue-surface.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prove exact question-specific repair scope
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | sort > /tmp/actual-scope.txt
          cat > /tmp/expected-scope.txt <<'SCOPE'
          .github/workflows/btc-free-question-live-dialogue-pr.yml
          components/btc/BtcLiveDialogue.tsx
          lib/btc-executive-question-language.ts
          scripts/run-btc-live-dialogue-fixture.mjs
          scripts/verify-btc-live-dialogue-surface.py
          SCOPE
          sort -o /tmp/expected-scope.txt /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt

      - name: Verify product and inherited routing contracts
        env:
          BTC_LIVE_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/run-btc-live-dialogue-fixture.mjs | tee artifacts/btc-live-dialogue-fixture.log
          npm run verify:btc-routing
          npm run verify:btc-binance-observation

      - name: Build production bundle
        env:
          BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"
        run: npm run build

      - name: Start exact-head preview
        env:
          BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"
        run: |
          set -euo pipefail
          npm run start -- -p 3110 > artifacts/btc-live-dialogue-preview.log 2>&1 &
          echo $! > /tmp/btc-live-dialogue.pid
          for attempt in {1..90}; do
            curl --fail --silent "http://127.0.0.1:3110/crypto-astro/btc?lang=en" >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/btc-live-dialogue-preview.log
          exit 1

      - name: Run 24-question bilingual semantic gate
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          base='http://127.0.0.1:3110'
          corpus=[
            ('en','Do BTC dominance and altcoin breadth confirm BTC leadership?','btc_gravity','confirmation'),
            ('en','Why does BTC dominance diverge from wider market breadth?','btc_gravity','reason'),
            ('en','Do stablecoin share, DeFi TVL and DEX volume confirm current BTC liquidity conditions?','liquidity','confirmation'),
            ('en','What changed in stablecoin liquidity and DeFi TVL?','liquidity','change'),
            ('en','Do regime, Market Field Score and market cap confirm the current BTC structure?','market_structure','confirmation'),
            ('en','Why do regime and market cap describe a split market structure?','market_structure','reason'),
            ('en','Are altcoin breadth and ETH rotation broadening market participation?','market_participation_rotation','confirmation'),
            ('en','What should I watch next in altcoin rotation and participation?','market_participation_rotation','watch'),
            ('en','What changed in accepted Snapshot Memory since the previous verified snapshot?','change_memory','change'),
            ('en','Compare the accepted Snapshot Memory with the previous checkpoint.','change_memory','comparison'),
            ('en','How does the selected date change BTC temporal pressure and cycle context?','temporal_pressure','temporal_context'),
            ('en','What is the current BTC field overview and why does it matter?','general_btc_field','reason'),
            ('ru','Подтверждают ли доминирование BTC и ширина альткоинов лидерство BTC?','btc_gravity','confirmation'),
            ('ru','Почему доминирование BTC расходится с шириной рынка?','btc_gravity','reason'),
            ('ru','Подтверждают ли стейблкоины, DeFi TVL и DEX текущую ликвидность BTC?','liquidity','confirmation'),
            ('ru','Что изменилось в ликвидности стейблкоинов и DeFi TVL?','liquidity','change'),
            ('ru','Подтверждают ли режим, Field Score и капитализация структуру BTC?','market_structure','confirmation'),
            ('ru','Почему режим и капитализация дают раздельную структуру рынка?','market_structure','reason'),
            ('ru','Расширяют ли ширина альткоинов и ротация ETH участие рынка?','market_participation_rotation','confirmation'),
            ('ru','За чем наблюдать дальше в ротации альткоинов и участии?','market_participation_rotation','watch'),
            ('ru','Что изменила принятая память BTC по сравнению с предыдущим снимком?','change_memory','change'),
            ('ru','Сравни принятую Snapshot Memory с предыдущей контрольной точкой.','change_memory','comparison'),
            ('ru','Как выбранная дата меняет временное давление и цикл BTC?','temporal_pressure','temporal_context'),
            ('ru','Что показывает общее поле BTC и почему это важно?','general_btc_field','reason'),
          ]

          def text_between(page, pattern):
            match=re.search(pattern,page,re.S)
            assert match, pattern
            return re.sub(r'<[^>]+>',' ',html.unescape(match.group(1))).strip()

          rows=[]
          for locale,question,expected_class,expected_facet in corpus:
            page=urlopen(f'{base}/crypto-astro/btc/live?lang={locale}&q={quote(question)}',timeout=60).read().decode('utf-8')
            klass=re.search(r'data-question-class="([^"]+)"',page)
            facets=re.search(r'data-question-facets="([^"]*)"',page)
            state=re.search(r'data-answer-state="([^"]+)"',page)
            assert klass and facets and state, question
            headline=text_between(page,r'<header class="answerHeader">.*?<h2>(.*?)</h2>')
            direct=text_between(page,r'<p class="answerLead" data-answer-direct="true">(.*?)</p>')
            evidence=text_between(page,r'<section data-answer-section="evidence">(.*?)</section>')
            limit=text_between(page,r'<p data-answer-section="limit">(.*?)</p>')
            change=text_between(page,r'<p data-answer-section="change">(.*?)</p>')
            boundary=text_between(page,r'<footer class="answerSource" data-answer-source-boundary="true">(.*?)</footer>')
            actual_facets=[value for value in html.unescape(facets.group(1)).split(',') if value]
            assert klass.group(1)==expected_class,(question,klass.group(1),expected_class)
            assert expected_facet in actual_facets,(question,actual_facets,expected_facet)
            assert state.group(1) in {'CONFIRMED','SPLIT','LIMITED'}
            assert headline and headline.lower()!='mixed signals'
            assert direct and evidence and limit and change and boundary
            assert ('forecast' in boundary.lower()) or ('прогноз' in boundary.lower())
            assert 'price target' not in direct.lower()
            rows.append({'locale':locale,'question':question,'question_class':klass.group(1),'facets':actual_facets,'state':state.group(1),'headline':headline,'direct':direct,'evidence':evidence})

          assert len(rows)==24
          assert {row['question_class'] for row in rows if row['locale']=='en'}=={'btc_gravity','liquidity','market_structure','market_participation_rotation','change_memory','temporal_pressure','general_btc_field'}
          assert {row['question_class'] for row in rows if row['locale']=='ru'}=={'btc_gravity','liquidity','market_structure','market_participation_rotation','change_memory','temporal_pressure','general_btc_field'}

          cross_class={}
          for row in rows:
            key=(row['locale'],row['question_class'])
            cross_class.setdefault(key,set()).add((row['headline'],row['direct'],row['evidence']))
          for locale in ('en','ru'):
            signatures={next(iter(values)) for (loc,_),values in cross_class.items() if loc==locale}
            assert len(signatures)==7,(locale,len(signatures))

          for locale in ('en','ru'):
            same_class=[row for row in rows if row['locale']==locale and row['question_class'] in {'btc_gravity','liquidity','market_structure','market_participation_rotation','change_memory'}]
            grouped={}
            for row in same_class: grouped.setdefault(row['question_class'],[]).append(row)
            for klass,items in grouped.items():
              assert len(items)==2
              assert items[0]['direct']!=items[1]['direct'] or items[0]['facets']!=items[1]['facets'],(locale,klass)

          repeated=corpus[2]
          locale,question,_,_=repeated
          url=f'{base}/crypto-astro/btc/live?lang={locale}&q={quote(question)}'
          a=urlopen(url,timeout=60).read().decode('utf-8')
          b=urlopen(url,timeout=60).read().decode('utf-8')
          for pattern in (r'<h2>(.*?)</h2>',r'<p class="answerLead" data-answer-direct="true">(.*?)</p>',r'<section data-answer-section="evidence">(.*?)</section>'):
            assert text_between(a,pattern)==text_between(b,pattern)

          required_labels={
            'btc_gravity':['dominance','breadth'],
            'liquidity':['stablecoin','defi tvl','dex'],
            'market_structure':['regime','field score','market cap'],
            'market_participation_rotation':['breadth','eth rotation','concentration'],
            'change_memory':['→'],
            'temporal_pressure':['observation date','temporal state'],
            'general_btc_field':['btc gravity','structure','liquidity'],
          }
          for klass,needles in required_labels.items():
            sample=next(row for row in rows if row['locale']=='en' and row['question_class']==klass)
            value=sample['evidence'].lower()
            assert all(needle.lower() in value for needle in needles),(klass,value)

          report={'schema':'btc_question_specific_semantic_gate_v0_1','status':'PASS','question_count':24,'class_accuracy':'24/24','facet_accuracy':'24/24','exact_repeat_determinism':True,'cross_class_exact_answer_duplicates':0,'generic_mixed_signals_count':0,'rows':rows}
          Path('artifacts/btc-question-specific-semantic-gate.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('BTC_24_QUESTION_SEMANTIC_GATE=PASS')
          PY

      - name: Prove clean live runtime boundary
        run: |
          python3 - <<'PY'
          from urllib.parse import quote
          from urllib.request import urlopen
          base='http://127.0.0.1:3110'
          landing=urlopen(f'{base}/crypto-astro/btc?lang=en',timeout=45).read().decode('utf-8')
          assert 'heroDialogueCta' in landing
          assert landing.count('data-example-route=') == 5
          assert '<textarea' not in landing
          q=quote('What changed in the BTC field, why does it matter, and what should I watch next?')
          live=urlopen(f'{base}/crypto-astro/btc/live?lang=en&q={q}',timeout=60).read().decode('utf-8')
          assert 'data-live-dialogue="btc-free-question"' in live
          assert 'data-answer-direct="true"' in live
          assert 'data-answer-section="evidence"' in live
          assert 'data-answer-section="limit"' in live
          assert 'data-answer-section="change"' in live
          assert live.count('<textarea') == 1
          for rejected in ('liveEvidenceRail','liveMetricField','answerDecisionGrid','liveFullField','Mixed signals'):
              assert rejected not in live
          assert 'Stripe' not in live
          assert 'checkout' not in live.lower()
          print('BTC_QUESTION_SPECIFIC_RUNTIME_BOUNDARY=PASS')
          PY

      - name: Install visual driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Verify multi-class desktop and mobile visual proof
        env:
          BTC_LIVE_PREVIEW_BASE: http://127.0.0.1:3110
        run: python3 scripts/verify-btc-live-dialogue-surface.py

      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/btc-live-dialogue.pid; then kill "$(cat /tmp/btc-live-dialogue.pid)" || true; fi

      - name: Enforce report-only acceptance
        env:
          BTC_LIVE_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -f artifacts/btc-live-dialogue-contract.json
          test -f artifacts/btc-question-specific-semantic-gate.json
          test -f artifacts/btc-live-dialogue-visual-report.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          contract=json.loads(Path('artifacts/btc-live-dialogue-contract.json').read_text())
          semantic=json.loads(Path('artifacts/btc-question-specific-semantic-gate.json').read_text())
          visual=json.loads(Path('artifacts/btc-live-dialogue-visual-report.json').read_text())
          assert contract['status']=='PASS', contract
          assert contract['runtime_head_sha']==os.environ['BTC_LIVE_RUNTIME_HEAD_SHA'], contract
          assert semantic['status']=='PASS' and semantic['question_count']==24, semantic
          assert semantic['class_accuracy']=='24/24' and semantic['facet_accuracy']=='24/24', semantic
          assert semantic['exact_repeat_determinism'] is True
          assert semantic['cross_class_exact_answer_duplicates']==0
          assert semantic['generic_mixed_signals_count']==0
          assert not visual['failures'], visual
          for name in (
            'landing_single_dialogue_cta','landing_has_no_question_input','landing_portal_nav_hidden',
            'five_static_routes_preserved','mobile_landing_cta_in_first_viewport','mobile_static_portal_nav_hidden',
            'mobile_static_single_column','mobile_static_routes_bounded','mobile_static_routes_do_not_overlap',
            'mobile_static_no_overflow','live_has_no_analytics_cards','four_question_classes_visualized',
            'four_distinct_headlines','all_samples_have_direct_answer','all_samples_have_limit_and_change',
            'all_samples_source_bound','all_samples_no_overflow','generic_mixed_signals_absent','browser_severe_none'
          ):
            assert visual['checks'][name] is True,(name,visual)
          print('BTC_QUESTION_SPECIFIC_DIALOGUE_ACCEPTANCE=PASS')
          PY

      - name: Upload semantic, contract and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-question-specific-dialogue-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
