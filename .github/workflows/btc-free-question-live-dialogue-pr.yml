name: BTC Cosmographer Semantic Route PR

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/scripts/verify-btc-public-acceptance-scope.py"
      - ".github/workflows/btc-free-question-live-dialogue-pr.yml"
      - "components/btc/BtcCosmographerDialogue.tsx"
      - "components/btc/BtcHeroQuestionLaunch.tsx"
      - "components/btc/BtcQuestionMembrane.tsx"
      - "docs/research/BTC_COSMOGRAPHER_PUBLIC_USER_ACCEPTANCE_REPORT_01_v0_1.md"
      - "lib/btc-cosmographer-answer.ts"
      - "lib/btc-cosmographer-public-multi-body-projection.ts"
      - "lib/btc-cosmographer-route-graph.ts"
      - "lib/btc-live-dialogue-style.ts"
      - "lib/btc-product-rebalance-style.ts"
      - "lib/btc-public-astro-evidence.ts"
      - "pages/crypto-astro/btc.tsx"
      - "pages/crypto-astro/btc/live.tsx"
      - "scripts/run-btc-cosmographer-semantic-route-fixture.mjs"
      - "scripts/verify-btc-cosmographer-route-surface.py"
      - "scripts/verify-btc-public-acceptance-two-screen.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-public-acceptance-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-route:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BTC_ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BTC_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BTC_BINANCE_FREE_OBSERVATION_ENABLED: "false"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact public acceptance scope
        run: python3 .github/scripts/verify-btc-public-acceptance-scope.py

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install portal dependencies
        run: npm ci

      - name: Static semantic replay
        run: |
          mkdir -p artifacts
          node scripts/run-btc-cosmographer-semantic-route-fixture.mjs 2>&1 | tee artifacts/btc-cosmographer-static.log

      - name: Preserve inherited BTC routing gates
        run: |
          npm run verify:btc-routing
          npm run verify:btc-binance-observation

      - name: Production build
        run: npm run build

      - name: Start exact-head production preview
        run: |
          set -euo pipefail
          npm run start -- -p 3110 > /tmp/btc-public-acceptance.log 2>&1 &
          echo $! > /tmp/btc-public-acceptance.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:3110/crypto-astro/btc/live?lang=ru" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/btc-public-acceptance.log
          exit 1

      - name: Runtime founder-report replay
        env:
          BTC_COSMOGRAPHER_PREVIEW_BASE: http://127.0.0.1:3110
        run: |
          set -o pipefail
          node --experimental-websocket scripts/run-btc-cosmographer-semantic-route-fixture.mjs 2>&1 | tee artifacts/btc-cosmographer-runtime.log

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install visual verifier
        run: python -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Existing route-surface acceptance
        env:
          BTC_COSMOGRAPHER_PREVIEW_BASE: http://127.0.0.1:3110
        run: python scripts/verify-btc-cosmographer-route-surface.py

      - name: Two-screen product acceptance
        env:
          BTC_COSMOGRAPHER_PREVIEW_BASE: http://127.0.0.1:3110
        run: python scripts/verify-btc-public-acceptance-two-screen.py

      - name: Enforce acceptance reports
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const semantic = JSON.parse(fs.readFileSync("artifacts/btc-cosmographer-semantic-route-report.json", "utf8"));
          const twoScreen = JSON.parse(fs.readFileSync("artifacts/btc-public-acceptance-two-screen/report.json", "utf8"));
          if (semantic.status !== "PASS") throw new Error("semantic replay failed");
          if (semantic.runtime_head_sha !== process.env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA) throw new Error("runtime head mismatch");
          if (twoScreen.status !== "PASS") throw new Error("two-screen acceptance failed");
          const required = [
            "btc_today_market_route",
            "bitcoin_typo_bridge",
            "genesis_chart_no_fallback",
            "contextual_volatility",
            "no_public_jupiter_fallback",
            "chronological_timeline",
            "russian_ingress_case",
            "fast_planet_evidence_boundary",
            "forecast_boundary",
            "runtime:BTC today",
            "runtime:Какие самые напряженные дни в 2026 году у планет и их аспектов",
            "runtime:как влияет Юпитер на Битокин?",
            "runtime:Меркурий и его движения в 2026 году",
            "contextual_volatility_keeps_multi_body_subject",
            "genesis_chart_does_not_inherit_mercury_or_jupiter",
            "mercury_monthly_evidence_visible",
            "repeat_determinism",
            "known_domain_generic_fallback_zero",
          ];
          for (const name of required) {
            const row = semantic.checks.find((item) => item.name === name);
            if (!row?.passed) throw new Error(`missing acceptance ${name}`);
          }
          NODE

      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/btc-public-acceptance.pid; then kill "$(cat /tmp/btc-public-acceptance.pid)" || true; fi

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-public-acceptance-${{ env.BTC_COSMOGRAPHER_RUNTIME_HEAD_SHA }}
          path: |
            artifacts/btc-cosmographer-semantic-route-report.json
            artifacts/btc-cosmographer-route-visual-report.json
            artifacts/btc-cosmographer-route-desktop.png
            artifacts/btc-cosmographer-route-mobile.png
            artifacts/btc-public-acceptance-two-screen/
            artifacts/btc-cosmographer-static.log
            artifacts/btc-cosmographer-runtime.log
            /tmp/btc-public-acceptance.log
          if-no-files-found: warn
          retention-days: 30
