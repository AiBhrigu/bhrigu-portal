name: BTC Origins EN Follow-up Patch

on:
  push:
    branches:
      - agent/btc-origins-satoshi-history-v0-1
    paths:
      - .github/workflows/btc-origins-en-followup-patch.yml

permissions:
  contents: write

jobs:
  patch-route:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Patch exact English follow-up phrase
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/btc-cosmographer-route-graph.ts')
          text = path.read_text(encoding='utf-8')
          old = r'what\s+is\s+known\s+(?:for\s+certain\s+)?about\s+satoshi'
          new = r'what\s+is\s+known\s+(?:for\s+certain(?:\s+about\s+satoshi)?|about\s+satoshi)'
          if text.count(old) != 1:
              raise SystemExit(f'EXPECTED_ONE_ROUTE_ANCHOR_FOUND_{text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit route parity repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/btc-cosmographer-route-graph.ts
          git commit -m "BTC: recognize English exact-known follow-up"
          git push origin HEAD:agent/btc-origins-satoshi-history-v0-1
