name: Temporary BTC deep schema contract patch

on:
  push:
    branches:
      - repair/btc-dialogue-context-authority-deep-synthesis-v0-1

permissions:
  contents: write

jobs:
  patch-contract:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/btc-dialogue-context-authority-deep-synthesis-v0-1
          fetch-depth: 0

      - name: Apply deterministic contract patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert text.count(old) == 1, (path, text.count(old), old)
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/btc-bilingual-glyph-fixture.ts',
              '"btc_executive_question_language_v0_1"',
              '"btc_executive_question_language_v0_2"',
          )

          replace_once(
              '.github/workflows/btc-free-question-live-dialogue-pr.yml',
              '      - "scripts/verify-btc-live-dialogue-surface.py"\n',
              '      - "scripts/verify-btc-live-dialogue-surface.py"\n      - "tests/btc-bilingual-glyph-fixture.ts"\n',
          )
          replace_once(
              '.github/workflows/btc-free-question-live-dialogue-pr.yml',
              '          scripts/run-btc-live-dialogue-session-fixture.mjs\n          SCOPE\n',
              '          scripts/run-btc-live-dialogue-session-fixture.mjs\n          tests/btc-bilingual-glyph-fixture.ts\n          SCOPE\n',
          )

          replace_once(
              'scripts/run-btc-live-dialogue-session-fixture.mjs',
              'workflow_deep_six_file_scope',
              'workflow_deep_seven_file_scope',
          )
          replace_once(
              'scripts/run-btc-live-dialogue-session-fixture.mjs',
              '  "scripts/run-btc-live-dialogue-session-fixture.mjs",\n].every((file) => workflow.includes(file)));',
              '  "scripts/run-btc-live-dialogue-session-fixture.mjs",\n  "tests/btc-bilingual-glyph-fixture.ts",\n].every((file) => workflow.includes(file)));',
          )
          PY

          git rm .github/workflows/tmp-btc-deep-schema-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/btc-free-question-live-dialogue-pr.yml scripts/run-btc-live-dialogue-session-fixture.mjs tests/btc-bilingual-glyph-fixture.ts
          git diff --cached --check
          git commit -m "BTC dialogue: bind deep synthesis v0.2 contract"
          git push origin HEAD:repair/btc-dialogue-context-authority-deep-synthesis-v0-1
