name: BHRIGU Home Market Cosmographer Acceptance

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/bhrigu-home-market-cosmographer-pr.yml"
      - "components/BhriguPhiHeader.jsx"
      - "pages/_app.js"
      - "pages/index.js"
      - "pages/index.module.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOME_ACCEPTANCE_BASE: http://127.0.0.1:3100
      HOME_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject invalid BHRIGU spelling
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '\\b[Bb][Gg][Rr][Ii][Gg][Uu]\\b' -- .; then
            echo 'BHRIGU_SPELLING_GUARD=FAIL'
            exit 1
          fi
          echo 'BHRIGU_SPELLING_GUARD=PASS'

      - name: Verify Home first-screen copy de-duplication
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '<p className={styles.product}>BHRIGU</p>' pages/index.js
          ! grep -Fq 'relationEquation:' pages/index.js
          ! grep -Fq '{copy.relationEquation}' pages/index.js
          grep -Fq 'rootIdentity: "Φ RESEARCH SYSTEMS"' pages/index.js
          grep -Fq 'humanEntryLead: "One human."' pages/index.js
          grep -Fq 'humanEntryClose: "One entry."' pages/index.js
          grep -Fq 'humanEntryLead: "Один человек."' pages/index.js
          grep -Fq 'humanEntryClose: "Одна точка входа."' pages/index.js
          echo 'BHRIGU_HOME_COPY_DEDUP=PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build exact source
        run: npm run build

      - name: Verify BTC deterministic routing unchanged
        run: npm run verify:btc-routing

      - name: Start exact-head preview
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run start -- -p 3100 > artifacts/bhrigu-home-preview.log 2>&1 &
          echo $! > /tmp/bhrigu-home-preview.pid
          for attempt in {1..45}; do
            curl --fail --silent "$HOME_ACCEPTANCE_BASE/?lang=en" >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/bhrigu-home-preview.log
          exit 1

      - name: Install visual driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2

      - name: Detect Home cosmographic scene authority
        shell: bash
        run: |
          if grep -Fq 'Φ COSMOGRAPHIC SCENE RESTORATION · DESKTOP PASS v0.1' pages/index.module.css; then
            echo 'BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE=true' >> "$GITHUB_ENV"
            echo 'HOME_SCENE_AUTHORITY=BOUND'
          else
            echo 'BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE=false' >> "$GITHUB_ENV"
            echo 'HOME_SCENE_AUTHORITY=LEGACY'
          fi

      - name: Verify desktop mobile semantics and routes
        if: env.BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE != 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base = os.environ["HOME_ACCEPTANCE_BASE"].rstrip("/")
          head_sha = os.environ["HOME_ACCEPTANCE_HEAD_SHA"]
          artifacts = Path("artifacts")
          ids = [
              "market-cosmographer",
              "public-evidence",
              "product",
              "outcomes",
              "btc-field",
              "question-to-knowledge",
              "proof",
              "method",
              "system-roles",
              "continuity",
              "markets",
              "open-btc-field",
          ]
          proof_url = "https://aibhrigu.github.io/phi-cosmography-open/crypto-astro/index.html#what-changed"
          report = {
              "schema_version": "bhrigu_home_market_cosmographer_acceptance_v0_6",
              "head_sha": head_sha,
              "views": {},
              "identity_counts": {},
              "checks": {},
              "failures": [],
          }

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--hide-scrollbars")
          options.set_capability("goog:loggingPrefs", {"browser": "ALL"})
          driver = webdriver.Chrome(options=options)

          def check(name, value, detail=None):
              passed = bool(value)
              report["checks"][name] = passed
              if not passed:
                  report["failures"].append(name)
                  if detail is not None:
                      report.setdefault("failure_detail", {})[name] = detail

          def rect(selector):
              return driver.execute_script(
                  """
                  const element = document.querySelector(arguments[0]);
                  if (!element) return null;
                  const value = element.getBoundingClientRect();
                  return {
                    x:value.x,y:value.y,width:value.width,height:value.height,
                    top:value.top,bottom:value.bottom,right:value.right,left:value.left
                  };
                  """,
                  selector,
              )

          def cta_contract(element):
              return driver.execute_script(
                  r"""
                  const cta = arguments[0];
                  const clone = cta.cloneNode(true);
                  clone.querySelectorAll('[aria-hidden="true"]').forEach((node) => node.remove());
                  const decorative = Array.from(cta.querySelectorAll('[aria-hidden="true"]'));
                  return {
                    semantic_copy: clone.textContent.replace(/\s+/g, ' ').trim(),
                    decorative_glyph_count: decorative.length,
                    decorative_glyphs: decorative.map((node) => node.textContent.trim()),
                    decorative_all_aria_hidden: decorative.every(
                      (node) => node.getAttribute('aria-hidden') === 'true'
                    ),
                  };
                  """,
                  element,
              )

          def run_view(name, width, height):
              driver.set_window_size(width, height)
              driver.get(f"{base}/?lang=en")
              WebDriverWait(driver, 30).until(
                  lambda current: current.find_element(By.ID, "home-title").is_displayed()
              )
              body = driver.find_element(By.TAG_NAME, "body").text
              h1 = driver.find_element(By.ID, "home-title").text
              category = driver.find_element(By.XPATH, "//*[normalize-space(text())='AI MARKET INTELLIGENCE SYSTEM']").text
              primary = driver.find_element(By.CSS_SELECTOR, "[data-primary-cta='btc-current-change-question']")
              secondary = driver.find_element(By.CSS_SELECTOR, "[data-secondary-cta='public-proof']")
              hero_evidence = driver.find_element(By.CSS_SELECTOR, "[data-hero-public-evidence]")
              evidence_cards = driver.find_elements(By.CSS_SELECTOR, "[data-public-evidence-rail] [data-evidence-object]")
              evidence_ids = [item.get_attribute("data-evidence-object") for item in evidence_cards]
              entropy_links = driver.find_elements(By.CSS_SELECTOR, "[data-evidence-object='entropy32-upstream'] a")
              relation_glyphs = driver.find_elements(By.CSS_SELECTOR, "[data-home-system-map] .relationGlyph")
              public_channel_rail = driver.find_element(By.CSS_SELECTOR, "[data-public-channel-rail]")
              public_channel_links = public_channel_rail.find_elements(By.TAG_NAME, "a")
              public_channel_hrefs = [item.get_attribute("href") for item in public_channel_links]
              all_home_hrefs = [item.get_attribute("href") for item in driver.find_elements(By.CSS_SELECTOR, "main a[href]")]
              primary_url = urlparse(primary.get_attribute("href"))
              primary_query = parse_qs(primary_url.query)
              primary_contract = cta_contract(primary)
              primary_rect = rect("[data-primary-cta='btc-current-change-question']")
              primary_center_clear = driver.execute_script(
                  """
                  const primary = document.querySelector("[data-primary-cta='btc-current-change-question']");
                  const bounds = primary.getBoundingClientRect();
                  const top = document.elementFromPoint(
                    bounds.left + bounds.width / 2,
                    bounds.top + bounds.height / 2
                  );
                  return top === primary || primary.contains(top);
                  """
              )
              copy_rect = rect("section[aria-labelledby='home-title'] > div:first-child")
              glyph_rect = rect("section[aria-labelledby='home-title'] > div:last-child")
              positions = driver.execute_script(
                  """
                  return arguments[0].map((id) => {
                    const element = document.getElementById(id);
                    return element ? element.getBoundingClientRect().top + window.scrollY : null;
                  });
                  """,
                  ids,
              )
              no_overflow = driver.execute_script(
                  "return document.documentElement.scrollWidth <= window.innerWidth + 1"
              )
              viewport = driver.execute_script(
                  "return {width:window.innerWidth,height:window.innerHeight}"
              )
              role_text = [
                  item.text.replace("\n", " ")
                  for item in driver.find_elements(By.CSS_SELECTOR, "#system-roles dl > div")
              ]
              identity_counts = driver.execute_script(
                  """
                  const header = document.querySelector("header[data-hdr='BHRIGU_PUBLIC_HOME_HEADER_V0_1']");
                  const hero = document.querySelector("section[aria-labelledby='home-title']");
                  const systemMap = hero ? hero.querySelector('[data-home-system-map]') : null;
                  const exactTextNodes = (root, expected) => root
                    ? Array.from(root.querySelectorAll('*')).filter(
                        (node) => node.textContent.trim() === expected
                      )
                    : [];
                  const heroBhriguNodes = exactTextNodes(hero, 'BHRIGU');
                  return {
                    global_bhrigu_identity_count: header
                      ? header.querySelectorAll('.bh-word').length
                      : -1,
                    global_language_control_count: header
                      ? header.querySelectorAll('.bh-language').length
                      : -1,
                    system_map_bhrigu_root_count: exactTextNodes(systemMap, 'BHRIGU').length,
                    hero_unbound_bhrigu_duplicate: heroBhriguNodes.filter(
                      (node) => !systemMap || !systemMap.contains(node)
                    ).length,
                    hero_language_control_duplicate: hero
                      ? Array.from(hero.querySelectorAll('a')).filter((link) =>
                          ['RU', 'EN'].includes(link.textContent.trim())
                        ).length
                      : -1,
                    hero_first_children: hero
                      ? Array.from(hero.firstElementChild.children)
                          .slice(0, 2)
                          .map((node) => node.textContent.trim())
                      : [],
                  };
                  """
              )
              severe = [
                  entry
                  for entry in driver.get_log("browser")
                  if entry.get("level") == "SEVERE"
                  and "favicon" not in entry.get("message", "").lower()
              ]
              screenshot = artifacts / f"bhrigu-home-pr113-{name}.png"
              driver.save_screenshot(str(screenshot))

              report["identity_counts"][name] = identity_counts
              report["views"][name] = {
                  "viewport": viewport,
                  "document_width": driver.execute_script(
                      "return document.documentElement.scrollWidth"
                  ),
                  "primary_cta": primary_rect,
                  "copy_rect": copy_rect,
                  "glyph_rect": glyph_rect,
                  "screenshot": str(screenshot),
                  "severe_errors": severe,
              }
              check(f"{name}_h1_exact", " ".join(h1.split()) == "See what changed in Bitcoin — and what would change the current read.", h1)
              check(
                  f"{name}_category_exact",
                  category == "AI MARKET INTELLIGENCE SYSTEM",
                  category,
              )
              check(f"{name}_market_cosmographer_primary", "MARKET COSMOGRAPHER" in body)
              check(f"{name}_primary_cta_target", primary_url.path == "/crypto-astro/btc/clean-chat" and primary_query.get("lang") == ["en"] and primary_query.get("q") == ["What changed in Bitcoin since the previous accepted Snapshot — and why does it matter?"])
              check(
                  f"{name}_primary_cta_copy",
                  primary_contract["semantic_copy"] == "Ask what changed in Bitcoin",
                  primary_contract,
              )
              check(
                  f"{name}_primary_cta_accessible_name",
                  primary.accessible_name == "Ask what changed in Bitcoin",
                  primary.accessible_name,
              )
              check(
                  f"{name}_primary_cta_decorative_glyph_count",
                  primary_contract["decorative_glyph_count"] == 1,
                  primary_contract,
              )
              check(
                  f"{name}_primary_cta_decorative_glyph",
                  primary_contract["decorative_glyphs"] == ["↗"],
                  primary_contract,
              )
              check(
                  f"{name}_primary_cta_decorative_glyph_aria_hidden",
                  primary_contract["decorative_all_aria_hidden"],
                  primary_contract,
              )
              check(f"{name}_primary_audience", "For self-directed Bitcoin investors: verified change, why it matters, and explicit conditions in one evidence-linked read." in body)
              check(f"{name}_no_decision_horizon_promise", "multi-week to multi-month decision horizons" not in body)
              check(f"{name}_no_next_scenario_promise", "what confirms the next scenario" not in body.lower())
              check(f"{name}_no_forecasting_category", "AI MARKET INTELLIGENCE AND FORECASTING SYSTEM" not in body)
              check(f"{name}_secondary_cta_target", urlparse(secondary.get_attribute("href")).fragment == "public-evidence", secondary.get_attribute("href"))
              check(f"{name}_hero_evidence_signal", "PROVEN IN THE OPEN" in hero_evidence.text and "ENTROPY32 UPSTREAM" in hero_evidence.text, hero_evidence.text)
              check(f"{name}_hero_evidence_anchor", urlparse(hero_evidence.get_attribute("href")).fragment == "public-evidence", hero_evidence.get_attribute("href"))
              check(f"{name}_external_evidence_card_count", evidence_ids == ["binance-temporal", "xagent-two-submissions", "entropy32-upstream"], evidence_ids)
              check(f"{name}_xagent_pending_boundary", "OFFICIAL RECEIPTS · JUDGING PENDING" in body)
              check(f"{name}_entropy_collaboration_boundary", "OPEN-SOURCE RESEARCH COLLABORATION · NOT CLIENT WORK" in body)
              check(f"{name}_entropy_upstream_finding", "Finding adopted upstream." in body)
              check(f"{name}_entropy_immutable_links", len(entropy_links) == 2 and all("a69f95c0098d25b762845d3b2b4751ef412b00a0" in item.get_attribute("href") for item in entropy_links), [item.get_attribute("href") for item in entropy_links])
              check(f"{name}_existing_relation_glyph_once", len(relation_glyphs) == 1, len(relation_glyphs))
              if relation_glyphs:
                  glyph_class = relation_glyphs[0].get_attribute("data-glyph-class") or ""
                  check(f"{name}_existing_relation_glyph_semantics", glyph_class == "PRIMARY_ROUTE SUPPORT_ROUTE", glyph_class)
              check(f"{name}_public_channel_link_count", len(public_channel_links) == 2, public_channel_hrefs)
              check(f"{name}_public_channel_x", public_channel_hrefs[0] == "https://x.com/bhrigu_io", public_channel_hrefs)
              expected_square = "https://www.binance.com/en/square/profile/square-creator-634982873"
              check(f"{name}_public_channel_binance", public_channel_hrefs[1] == expected_square, public_channel_hrefs)
              check(f"{name}_x_home_link_once", sum(1 for href in all_home_hrefs if href == "https://x.com/bhrigu_io") == 1, all_home_hrefs)
              check(f"{name}_binance_home_link_once", sum(1 for href in all_home_hrefs if href and "binance.com/en/square/profile/square-creator-634982873" in href) == 1, all_home_hrefs)
              check(f"{name}_bitcointalk_home_link_zero", all(not href or "bitcointalk.org" not in href for href in all_home_hrefs), all_home_hrefs)
              check(f"{name}_primary_cta_first_viewport", primary_rect["top"] >= 0 and primary_rect["bottom"] <= viewport["height"], primary_rect)
              check(f"{name}_primary_cta_not_occluded", primary_center_clear)
              check(f"{name}_no_portal_dock", not driver.find_elements(By.CSS_SELECTOR, "nav[data-pn-root='PORTAL_PREVNEXT_V0_2']"))
              check(f"{name}_one_visible_phi", body.count("Φ") == 1, body.count("Φ"))
              check(f"{name}_primary_ai_identity_once", body.count("AI MARKET INTELLIGENCE SYSTEM") == 1, body.count("AI MARKET INTELLIGENCE SYSTEM"))
              check(f"{name}_founding_field_identity_once", body.count("AI Founding Field") == 1, body.count("AI Founding Field"))
              check(f"{name}_section_order", all(value is not None for value in positions) and positions == sorted(positions), positions)
              check(f"{name}_no_horizontal_overflow", no_overflow, {"viewport": viewport, "document_width": report["views"][name]["document_width"]})
              check(f"{name}_no_competing_frey_header", not driver.find_elements(By.CSS_SELECTOR, "header [data-bh='FREY_CTA_PRIMARY_V0_6']"))
              check(f"{name}_global_bhrigu_identity_count", identity_counts["global_bhrigu_identity_count"] == 1, identity_counts)
              check(f"{name}_global_language_control_count", identity_counts["global_language_control_count"] == 1, identity_counts)
              check(f"{name}_system_map_bhrigu_root_count", identity_counts["system_map_bhrigu_root_count"] == 1, identity_counts)
              check(f"{name}_hero_unbound_bhrigu_duplicate", identity_counts["hero_unbound_bhrigu_duplicate"] == 0, identity_counts)
              check(f"{name}_hero_language_control_duplicate", identity_counts["hero_language_control_duplicate"] == 0, identity_counts)
              check(
                  f"{name}_hero_starts_with_product_identity",
                  identity_counts["hero_first_children"] == [
                      "MARKET COSMOGRAPHER",
                      "AI MARKET INTELLIGENCE SYSTEM",
                  ],
                  identity_counts["hero_first_children"],
              )
              check(f"{name}_role_contract", role_text == [
                  "BHRIGU is the public home for working services, research surfaces, and products",
                  "Frey is an active temporal reading and dialogue service",
                  "Cosmographer handles interpretation and navigation across bounded evidence",
                  "ORION remains protected research depth",
              ], role_text)
              check(f"{name}_no_severe_browser_errors", not severe, severe)
              if name == "desktop":
                  ratio = copy_rect["width"] / glyph_rect["width"]
                  report["views"][name]["semantic_ratio"] = ratio
                  check("desktop_61_8_38_2_composition", 1.55 <= ratio <= 1.68, ratio)
              driver.execute_script("document.getElementById('public-evidence').scrollIntoView({block:'start'})")
              evidence_screenshot = artifacts / f"bhrigu-home-pr113-{name}-public-evidence.png"
              driver.save_screenshot(str(evidence_screenshot))
              report["views"][name]["public_evidence_screenshot"] = str(evidence_screenshot)
              driver.execute_script("window.scrollTo(0,0)")

          try:
              run_view("desktop", 1440, 1100)
              run_view("mobile", 390, 844)

              driver.get(f"{base}/?lang=ru")
              WebDriverWait(driver, 30).until(
                  lambda current: current.find_element(By.ID, "home-title").is_displayed()
              )
              ru_body = driver.find_element(By.TAG_NAME, "body").text
              ru_h1 = " ".join(driver.find_element(By.ID, "home-title").text.split())
              ru_primary = driver.find_element(By.CSS_SELECTOR, "[data-primary-cta='btc-current-change-question']")
              ru_primary_url = urlparse(ru_primary.get_attribute("href"))
              ru_primary_query = parse_qs(ru_primary_url.query)
              ru_primary_contract = cta_contract(ru_primary)
              check(
                  "ru_primary_cta_target",
                  ru_primary_url.path == "/crypto-astro/btc/clean-chat"
                  and ru_primary_query.get("lang") == ["ru"]
                  and ru_primary_query.get("q") == ["Что изменилось в Bitcoin с предыдущего принятого Snapshot — и почему это важно?"],
              )
              check(
                  "ru_primary_cta_copy",
                  ru_primary_contract["semantic_copy"] == "Спросить, что изменилось в Bitcoin",
                  ru_primary_contract,
              )
              check(
                  "ru_primary_cta_accessible_name",
                  ru_primary.accessible_name == "Спросить, что изменилось в Bitcoin",
                  ru_primary.accessible_name,
              )
              check(
                  "ru_primary_cta_decorative_glyph_count",
                  ru_primary_contract["decorative_glyph_count"] == 1,
                  ru_primary_contract,
              )
              check(
                  "ru_primary_cta_decorative_glyph",
                  ru_primary_contract["decorative_glyphs"] == ["↗"],
                  ru_primary_contract,
              )
              check(
                  "ru_primary_cta_decorative_glyph_aria_hidden",
                  ru_primary_contract["decorative_all_aria_hidden"],
                  ru_primary_contract,
              )
              check("ru_product_identity", "MARKET COSMOGRAPHER" in ru_body)
              check("ru_h1_current_capability", ru_h1 == "Что изменилось в Bitcoin — и что изменит текущее чтение.", ru_h1)
              check("ru_category_current_capability", "СИСТЕМА AI-АНАЛИТИКИ РЫНКОВ" in ru_body)
              check("ru_external_evidence_signal", "ДОКАЗАНО В ОТКРЫТОМ ПОЛЕ" in ru_body)
              check("ru_external_evidence_title", "Реальные системы оставляют публичные доказательства." in ru_body)
              ru_channels = driver.find_element(By.CSS_SELECTOR, "[data-public-channel-rail]").text
              check("ru_public_channel_rail", "СЛЕДИТЬ ЗА ПОЛЕМ" in ru_channels and "X · @bhrigu_io" in ru_channels and "Binance Square · живые исследования" in ru_channels, ru_channels)
              check("ru_no_decision_horizon_promise", "горизонтом решений от нескольких недель до нескольких месяцев" not in ru_body)
              check("ru_no_forecast_role", "владеет чтением и прогнозом" not in ru_body)

              driver.get(f"{base}/?lang=en")
              WebDriverWait(driver, 30).until(
                  lambda current: current.find_element(By.ID, "home-title").is_displayed()
              )
              en_primary_href = driver.find_element(
                  By.CSS_SELECTOR,
                  "[data-primary-cta='btc-current-change-question']",
              ).get_attribute("href")
              driver.get(en_primary_href)
              WebDriverWait(driver, 30).until(
                  lambda current: current.find_element(By.CSS_SELECTOR, "main.cleanChatPage")
              )
              check(
                  "primary_cta_destination_200",
                  bool(driver.find_elements(By.CSS_SELECTOR, "main.cleanChatPage")),
              )
              check(
                  "primary_cta_question_loaded",
                  "What changed in Bitcoin since the previous accepted Snapshot"
                  in driver.find_element(By.TAG_NAME, "body").text,
              )

              driver.get(f"{base}/?lang=en")
              WebDriverWait(driver, 30).until(
                  lambda current: current.find_element(By.ID, "home-title").is_displayed()
              )
              scripts = driver.find_elements(By.CSS_SELECTOR, "script[type='application/ld+json']")
              graph = []
              for script in scripts:
                  value = json.loads(script.get_attribute("innerHTML"))
                  graph.extend(value.get("@graph", []))
              graph_types = {item.get("@type") for item in graph}
              check(
                  "jsonld_graph",
                  {"Organization", "WebSite", "WebPage", "SoftwareApplication", "BreadcrumbList"}.issubset(graph_types),
                  sorted(graph_types),
              )
              software = next((item for item in graph if item.get("@type") == "SoftwareApplication" and item.get("name") == "Market Cosmographer"), {})
              organization = next((item for item in graph if item.get("@type") == "Organization" and item.get("name") == "BHRIGU"), {})
              check("jsonld_current_capability_description", software.get("description") == "An AI market intelligence system combining verified market data, field context and explicit conditions in an evidence-linked read.", software.get("description"))
              check("jsonld_public_channels", organization.get("sameAs") == ["https://x.com/bhrigu_io", "https://www.binance.com/en/square/profile/square-creator-634982873"], organization.get("sameAs"))

              driver.get(f"{base}/?lang=en")
              canonical = driver.find_element(By.CSS_SELECTOR, "link[rel='canonical']").get_attribute("href")
              check("canonical_exact", canonical == "https://www.bhrigu.io/?lang=en", canonical)

              try:
                  urllib.request.urlopen(f"{base}/market-cosmographer", timeout=30)
                  no_route_status = 200
              except urllib.error.HTTPError as error:
                  no_route_status = error.code
              check("no_market_cosmographer_route", no_route_status == 404, no_route_status)
          finally:
              driver.quit()

          report["status"] = "PASS" if not report["failures"] else "FAIL"
          (artifacts / "bhrigu-home-pr113-visual-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["failures"]:
              raise SystemExit(f"BHRIGU_HOME_ACCEPTANCE=FAIL {report['failures']}")
          print("GLOBAL_BHRIGU_IDENTITY_COUNT=1")
          print("GLOBAL_LANGUAGE_CONTROL_COUNT=1")
          print("HERO_BHRIGU_DUPLICATE=0")
          print("HERO_LANGUAGE_CONTROL_DUPLICATE=0")
          print("BHRIGU_HOME_ACCEPTANCE=PASS")
          PY

      - name: Verify cosmographic scene desktop semantics
        if: env.BHRIGU_HOME_COSMOGRAPHIC_SCENE_SCOPE == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base = os.environ["HOME_ACCEPTANCE_BASE"].rstrip("/")
          artifacts = Path("artifacts")
          report = {"schema_version":"bhrigu_home_cosmographic_scene_acceptance_v0_1","checks":{},"failures":[]}

          def check(name, value, detail=None):
              ok=bool(value); report["checks"][name]=ok
              if not ok:
                  report["failures"].append(name)
                  if detail is not None: report.setdefault("detail",{})[name]=detail

          options=Options()
          for arg in ("--headless=new","--no-sandbox","--disable-dev-shm-usage","--disable-gpu","--hide-scrollbars","--window-size=1440,1100"):
              options.add_argument(arg)
          driver=webdriver.Chrome(options=options)
          try:
              driver.set_window_size(1440,1100)
              driver.get(f"{base}/?lang=en")
              WebDriverWait(driver,30).until(lambda d:d.find_element(By.ID,"home-title").is_displayed())
              selectors={
                  "relation":"[data-home-relation]",
                  "human":"[data-relation-role='human-entry']",
                  "frey":"[data-human-capability='frey']",
                  "bridge":"[data-relation-role='intelligence-bridge']",
                  "agent":"[data-agent-capability='bhrigu-btc-evidence-answer-v0']",
                  "phi":"[data-relation-role='phi-field']",
                  "return":"[data-relation-role='human-return']",
                  "proof":"[data-home-btc-proof-object]",
              }
              nodes={k:driver.find_element(By.CSS_SELECTOR,v) for k,v in selectors.items()}
              for name,node in nodes.items():
                  check(f"{name}_visible",node.is_displayed())

              nested=driver.execute_script("""
                const r=document.querySelector('[data-home-relation]');
                const h=document.querySelector('[data-relation-role="human-entry"]');
                const f=document.querySelector('[data-human-capability="frey"]');
                const b=document.querySelector('[data-relation-role="intelligence-bridge"]');
                const a=document.querySelector('[data-agent-capability="bhrigu-btc-evidence-answer-v0"]');
                const p=document.querySelector('[data-relation-role="phi-field"]');
                const ret=document.querySelector('[data-relation-role="human-return"]');
                return r.contains(h)&&h.contains(f)&&r.contains(b)&&b.contains(a)&&r.contains(p)&&r.contains(ret);
              """)
              check("single_relation_field",nested)

              styles=driver.execute_script("""
                const keys={
                  human:document.querySelector('[data-relation-role="human-entry"]'),
                  bridge:document.querySelector('[data-relation-role="intelligence-bridge"]'),
                  phi:document.querySelector('[data-relation-role="phi-field"]')
                };
                return Object.fromEntries(Object.entries(keys).map(([k,e])=>[k,{
                  position:getComputedStyle(e).position,
                  borderTopWidth:getComputedStyle(e).borderTopWidth,
                  borderRadius:getComputedStyle(e).borderRadius
                }]));
              """)
              check("scene_nodes_spatial",all(styles[k]["position"]=="absolute" for k in ("human","bridge","phi")),styles)
              check("no_three_card_borders",all(styles[k]["borderTopWidth"]=="0px" for k in ("human","bridge","phi")),styles)

              ret=nodes["return"].rect
              check("human_return_first_screen",ret["y"]>=0 and ret["y"]+ret["height"]<=1100,ret)
              body=driver.find_element(By.TAG_NAME,"body").text
              check("root_identity_present","Φ RESEARCH SYSTEMS" in body.upper())
              check("human_judgment_present","HUMAN JUDGMENT" in body.upper())
              check("btc_corridor_present",nodes["proof"].is_displayed() and bool(nodes["proof"].text.strip()),nodes["proof"].text)
              overflow=driver.execute_script("return document.documentElement.scrollWidth-window.innerWidth")
              check("no_horizontal_overflow",overflow<=1,overflow)
              driver.save_screenshot(str(artifacts/"bhrigu-home-cosmographic-scene-desktop.png"))
          finally:
              driver.quit()

          report["status"]="PASS" if not report["failures"] else "FAIL"
          (artifacts/"bhrigu-home-cosmographic-scene-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report["failures"]:
              raise SystemExit("BHRIGU_HOME_COSMOGRAPHIC_SCENE=FAIL "+repr(report["failures"]))
          print("BHRIGU_HOME_COSMOGRAPHIC_SCENE=PASS")
          PY

