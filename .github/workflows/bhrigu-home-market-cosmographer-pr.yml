name: BHRIGU Home Duplicate Repair Transport

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/bhrigu-home-market-cosmographer-pr.yml"

permissions:
  contents: write

concurrency:
  group: bhrigu-home-duplicate-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 113
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 927690c4fd7a6ba85aab0fa6779cd526f8e0ce92
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Prove exact input head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply duplicate identity repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path("pages/index.js")
          css_path = Path("pages/index.module.css")
          index = index_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          replacements = [
              ('    languageLabel: "RU",\n    languageHref: "/?lang=ru",\n    languageAria: "View this page in Russian",\n', ''),
              ('    languageLabel: "EN",\n    languageHref: "/?lang=en",\n    languageAria: "Открыть страницу на английском",\n', ''),
              ('''function LanguageLink({ copy }) {
  return (
    <Link
      className={styles.languageLink}
      href={copy.languageHref}
      aria-label={copy.languageAria}
    >
      {copy.languageLabel}
    </Link>
  );
}

''', ''),
              ('''            <div className={styles.heroTopline}>
              <p className={styles.brand}>BHRIGU</p>
              <LanguageLink copy={copy} />
            </div>
''', ''),
          ]
          for old, new in replacements:
              count = index.count(old)
              if count != 1:
                  raise SystemExit(f"INDEX_REPLACEMENT_COUNT_INVALID:{count}:{old[:48]!r}")
              index = index.replace(old, new)

          css_replacements = [
              ('''.heroTopline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 44px;
}

''', ''),
              ('''.brand,
.product,
.category,
.eyebrow {''', '''.product,
.category,
.eyebrow {'''),
              ('''.brand {
  color: var(--home-gold-bright);
  font-size: 13px !important;
  font-weight: 700;
  letter-spacing: 0.34em;
}

''', ''),
              ('''.languageLink {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  min-height: 38px;
  border: 1px solid var(--home-line);
  color: var(--home-muted) !important;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-decoration: none !important;
}

''', ''),
              ('''  .heroTopline {
    margin-bottom: 22px;
  }

''', ''),
          ]
          for old, new in css_replacements:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f"CSS_REPLACEMENT_COUNT_INVALID:{count}:{old[:48]!r}")
              css = css.replace(old, new)

          for marker in (
              "function LanguageLink",
              "<LanguageLink",
              "styles.languageLink",
              "styles.heroTopline",
              "styles.brand",
              "languageLabel:",
              "languageHref:",
              "languageAria:",
          ):
              if marker in index:
                  raise SystemExit(f"INDEX_FORBIDDEN_MARKER:{marker}")
          for marker in (".heroTopline", ".languageLink", ".brand"):
              if marker in css:
                  raise SystemExit(f"CSS_FORBIDDEN_MARKER:{marker}")

          expected_start = '''          <div className={styles.heroCopy}>
            <p className={styles.product}>MARKET COSMOGRAPHER</p>
            <p className={styles.category}>{copy.category}</p>'''
          if expected_start not in index:
              raise SystemExit("HERO_START_CONTRACT_MISSING")

          index_path.write_text(index, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          print("BHRIGU_HOME_DUPLICATE_REPAIR=PASS")
          PY

      - name: Verify exact product delta
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | paste -sd, -)" = "pages/index.js,pages/index.module.css"
          git diff --check

      - name: Commit exact product repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js pages/index.module.css
          git commit -m "Repair duplicate Home brand and language controls"
          git push origin "HEAD:${HEAD_BRANCH}"
