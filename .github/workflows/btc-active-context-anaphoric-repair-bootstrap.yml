name: BTC active-context anaphoric repair bootstrap

on:
  push:
    branches:
      - agent/btc-active-context-anaphoric-followup-routing-v0-1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply bounded repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          route = "lib/btc-cosmographer-route-graph.ts"
          replace_once(
              route,
              'function isMethodologyFollowUpLanguage(question: string): boolean {\n',
              '''function isActiveAnswerEvidenceFollowUp(question: string): boolean {\n  const q = question.trim();\n  return /^(?:how\\s+do\\s+you\\s+know(?:\\s+(?:that|this))?|what\\s+data\\s+did\\s+you\\s+use|which\\s+data\\s+did\\s+you\\s+use|how\\s+fresh\\s+(?:is|are)\\s+(?:the\\s+)?(?:data|evidence)|how\\s+current\\s+(?:is|are)\\s+(?:the\\s+)?(?:data|evidence)|откуда\\s+ты\\s+это\\s+знаешь|какие\\s+данн[а-яё]*\\s+(?:ты\\s+)?использовал[а-яё]*|насколько\\s+свеж[а-яё]*\\s+данн[а-яё]*)[?!.]*$/i.test(q);\n}\n\nfunction isMethodologyFollowUpLanguage(question: string): boolean {\n''',
          )
          replace_once(
              route,
              'function isContextContinuationLanguage(question: string): boolean {\n  return isReferential(question) || ',
              '''function isTargetAnaphoricFollowUp(question: string): boolean {\n  const q = question.trim();\n  return /^(?:what\\s+(?:exactly\\s+)?creates\\s+(?:the\\s+)?divergence|which\\s+facts\\s+create\\s+(?:the\\s+)?divergence|what\\s+(?:has\\s+to|needs\\s+to|would\\s+need\\s+to|should)\\s+happen[^?!.]{0,80}(?:read|reading)[^?!.]{0,40}change|что\\s+(?:именно\\s+)?созда[её]т\\s+расхождение|какие\\s+факты\\s+создают\\s+расхождение|что\\s+должно\\s+произойти[^?!.]{0,80}чтени[ея][^?!.]{0,40}измен)/i.test(q);\n}\n\nfunction isContextContinuationLanguage(question: string): boolean {\n  if (isTargetAnaphoricFollowUp(question)) return true;\n  return isReferential(question) || ''',
          )
          replace_once(
              route,
              '  const methodologyFocused = isMethodologyFocused(q);\n',
              '  const activeAnswerEvidenceFollowUp = Boolean(packet && isActiveAnswerEvidenceFollowUp(q));\n  const methodologyFocused = isMethodologyFocused(q) || activeAnswerEvidenceFollowUp;\n',
          )
          replace_once(
              route,
              '  if (/сколько|какое количество|what is|how many|how much|maximum|максимальн/i.test(question)) values.push("fact");\n',
              '  if (/сколько|какое количество|what is|how many|how much|maximum|максимальн|what\\s+data\\s+did\\s+you\\s+use|which\\s+data\\s+did\\s+you\\s+use|how\\s+(?:fresh|current)\\s+(?:is|are)\\s+(?:the\\s+)?(?:data|evidence)|какие\\s+данн[а-яё]*\\s+(?:ты\\s+)?использовал[а-яё]*|насколько\\s+свеж[а-яё]*\\s+данн[а-яё]*/i.test(question)) values.push("fact");\n',
          )
          replace_once(
              route,
              '  if (/why|explain|how does|what should i know|почему|объясни|как устро|что нужно знать|что означает/i.test(question)) values.push("explain");\n',
              '  if (/why|explain|how does|what should i know|how\\s+do\\s+you\\s+know|почему|объясни|как устро|что нужно знать|что означает|откуда\\s+ты\\s+это\\s+знаешь/i.test(question)) values.push("explain");\n',
          )
          replace_once(
              route,
              '  if (/what changed|changed|change since|что измен|изменени/i.test(question)) values.push("change");\n',
              '  if (/what changed|changed|change since|what\\s+(?:has\\s+to|needs\\s+to|would\\s+need\\s+to|should)\\s+happen[^?!.]{0,80}(?:read|reading)[^?!.]{0,40}change|что измен|изменени|что\\s+должно\\s+произойти[^?!.]{0,80}чтени[ея][^?!.]{0,40}измен/i.test(question)) values.push("change");\n',
          )
          replace_once(
              route,
              '  if (/why|matter|reason|important|почему|важно|причин|напряж|volatil|волатиль/i.test(question)) values.push("reason");\n',
              '  if (/why|matter|reason|important|diverg|почему|важно|причин|расхожд|напряж|volatil|волатиль/i.test(question)) values.push("reason");\n',
          )
          replace_once(
              route,
              '  if (/watch|next|condition|наблюд|дальше|услов|today|now|сегодня|сейчас/i.test(question)) values.push("watch");\n',
              '  if (/watch|next|condition|what\\s+(?:has\\s+to|needs\\s+to|would\\s+need\\s+to|should)\\s+happen[^?!.]{0,80}(?:read|reading)[^?!.]{0,40}change|наблюд|дальше|услов|что\\s+должно\\s+произойти[^?!.]{0,80}чтени[ея][^?!.]{0,40}измен|today|now|сегодня|сейчас/i.test(question)) values.push("watch");\n',
          )
          replace_once(
              route,
              '  const entities = explicitEntities(body, protocol, market, multiBody || astroWindow);\n  for (const explicitBody of bodies) entities.push(explicitBody);\n',
              '  const entities = explicitEntities(body, protocol, market, multiBody || astroWindow);\n  if (activeAnswerEvidenceFollowUp) entities.push("active_answer_reference");\n  for (const explicitBody of bodies) entities.push(explicitBody);\n',
          )
          replace_once(
              route,
              '  const methodologyFollowUp = methodologyFocused && isMethodologyFollowUpLanguage(q);\n',
              '  const methodologyFollowUp = methodologyFocused && (isMethodologyFollowUpLanguage(q) || activeAnswerEvidenceFollowUp);\n',
          )

          specialized = "lib/btc-cosmographer-specialized-answer.ts"
          replace_once(
              specialized,
              'import type { BtcCosmographerRoute } from "./btc-cosmographer-route-graph";\n',
              'import type { BtcCosmographerContextPacket, BtcCosmographerRoute } from "./btc-cosmographer-route-graph";\n',
          )
          replace_once(
              specialized,
              'export function buildSpecializedMethodologyAnswer(\n  locale: BtcPublicLocale,\n  route: BtcCosmographerRoute,\n): BtcCosmographerAnswerProjection {\n',
              'export function buildSpecializedMethodologyAnswer(\n  locale: BtcPublicLocale,\n  route: BtcCosmographerRoute,\n  priorContext?: BtcCosmographerContextPacket | null,\n): BtcCosmographerAnswerProjection {\n',
          )
          methodology_marker = '  if (/эфемерид|ephemeris|coordinate|координат/.test(text)) {\n'
          methodology_insert = '''  const activeContext = route.explicit_entities.includes("active_answer_reference")\n    ? priorContext ?? null\n    : null;\n  const activeLane = activeContext\n    ? activeContext.prior_domain === "snapshot_memory"\n      ? (isRu ? "текущий и предыдущий принятые Market Snapshot вместе с Delta" : "the current and previous accepted Market Snapshots plus Delta")\n      : activeContext.prior_domain === "btc_market"\n        ? (isRu ? "принятый Market Snapshot и проверенные рыночные derivations" : "the accepted Market Snapshot and verified market derivations")\n        : activeContext.prior_domain === "bitcoin_protocol"\n          ? (isRu ? "закреплённый Bitcoin Protocol source of truth" : "the pinned Bitcoin Protocol source of truth")\n          : activeContext.prior_domain === "astromodule"\n            ? (isRu ? "эфемеридный источник и проверенные астрономические derivations" : "the ephemeris source and verified astronomical derivations")\n            : activeContext.prior_domain === "astro_btc_bridge"\n              ? (isRu ? "два независимых evidence lane: BTC-side и Astro" : "two independent evidence lanes: BTC-side and Astro")\n              : (isRu ? "активный доказательный контур" : "the active evidence lane")\n    : null;\n\n  if (activeContext && /how\\s+do\\s+you\\s+know|откуда\\s+ты\\s+это\\s+знаешь/.test(text)) {\n    headline = isRu ? "Источник активного ответа" : "Source of the active answer";\n    direct = isRu\n      ? `Этот ответ опирается на ${activeLane}. Контекст вкладки только указывает, какой ответ проверяется, и сам не является доказательством.`\n      : `This answer is grounded in ${activeLane}. Tab context only identifies which answer is being checked; it is not evidence itself.`;\n    bullets = isRu\n      ? ["Источник и наблюдение остаются отдельны от интерпретации.", "Активный subject и период сохраняются только для ссылки на проверяемый ответ.", "Новые факты из памяти диалога не создаются."]\n      : ["Source and observation remain separate from interpretation.", "The active subject and period are retained only to reference the answer being checked.", "Dialogue memory does not create new facts."];\n  } else if (activeContext && /(?:what|which)\\s+data\\s+did\\s+you\\s+use|какие\\s+данн[а-яё]*\\s+(?:ты\\s+)?использовал[а-яё]*/.test(text)) {\n    headline = isRu ? "Данные активного ответа" : "Data used by the active answer";\n    direct = isRu\n      ? `Для активного ответа использован ${activeLane}. Ни один дополнительный источник не подставляется из истории диалога.`\n      : `The active answer uses ${activeLane}. No additional source is substituted from dialogue history.`;\n    bullets = isRu\n      ? ["Наблюдение → принятый источник.", "Derivation → воспроизводимое преобразование.", "Интерпретация → ограниченный вывод поверх этих данных."]\n      : ["Observation → accepted source.", "Derivation → reproducible transformation.", "Interpretation → bounded conclusion on top of those data."];\n  } else if (activeContext && /how\\s+(?:fresh|current)\\s+(?:is|are)\\s+(?:the\\s+)?(?:data|evidence)|насколько\\s+свеж[а-яё]*\\s+данн[а-яё]*/.test(text)) {\n    const boundAt = activeContext.prior_snapshot_generated_at_utc;\n    headline = isRu ? "Свежесть данных активного ответа" : "Freshness of the active answer";\n    direct = boundAt\n      ? (isRu\n          ? `Активный ответ был привязан к принятой evidence-ревизии ${boundAt}. Свежесть оценивается относительно этой отметки; смена источника между ходами должна быть показана отдельно.`\n          : `The active answer was bound to the accepted evidence revision at ${boundAt}. Freshness is evaluated against that timestamp; a source change between turns must be shown separately.`)\n      : (isRu\n          ? "Свежесть определяется metadata активного evidence lane; без временной отметки Космограф не объявляет данные текущими."\n          : "Freshness comes from the active evidence-lane metadata; without a timestamp, Cosmographer does not claim the data are current.");\n    bullets = isRu\n      ? [`Доказательный контур: ${activeLane}.`, "Время покрытия и время ревизии не смешиваются.", "Контекст диалога не повышает свежесть источника."]\n      : [`Evidence lane: ${activeLane}.`, "Coverage time and revision time remain distinct.", "Dialogue context cannot make a source fresher."];\n  } else if (/эфемерид|ephemeris|coordinate|координат/.test(text)) {\n'''
          replace_once(specialized, methodology_marker, methodology_insert)
          replace_once(
              specialized,
              '  if (route.domain === "snapshot_memory" && evidence.length) {\n    const first = evidence.slice(0, 3).join(" ");\n    return { ...answer, direct_answer: isRu ? `Сначала изменения: ${first}` : `Changes first: ${first}` };\n  }\n  if (/what\\s+conditions?\\s+would\\s+weaken|что\\s+изменит.*чтени|услов[а-яё]*.*ослаб/.test(text) && watch) {\n    return { ...answer, direct_answer: isRu ? `Условия изменения чтения: ${watch}` : `Conditions that would change the read: ${watch}` };\n  }\n',
              '''  if (/what\\s+(?:exactly\\s+)?creates\\s+(?:the\\s+)?divergence|which\\s+facts\\s+create\\s+(?:the\\s+)?divergence|что\\s+(?:именно\\s+)?созда[её]т\\s+расхождение|какие\\s+факты\\s+создают\\s+расхождение/.test(text) && evidence.length) {\n    const first = evidence.slice(0, 3).join(" ");\n    return { ...answer, direct_answer: isRu\n      ? `Расхождение создают разнонаправленные принятые изменения: ${first}`\n      : `The divergence comes from accepted indicators moving in different directions: ${first}` };\n  }\n  if (/what\\s+conditions?\\s+would\\s+weaken|what\\s+(?:has\\s+to|needs\\s+to|would\\s+need\\s+to|should)\\s+happen[^?!.]{0,80}(?:read|reading)[^?!.]{0,40}change|что\\s+изменит.*чтени|что\\s+должно\\s+произойти[^?!.]{0,80}чтени[ея][^?!.]{0,40}измен|услов[а-яё]*.*ослаб/.test(text) && watch) {\n    return { ...answer, direct_answer: isRu ? `Условия изменения чтения: ${watch}` : `Conditions that would change the read: ${watch}` };\n  }\n  if (route.domain === "snapshot_memory" && evidence.length) {\n    const first = evidence.slice(0, 3).join(" ");\n    return { ...answer, direct_answer: isRu ? `Сначала изменения: ${first}` : `Changes first: ${first}` };\n  }\n''',
          )

          answer = "lib/btc-cosmographer-answer.ts"
          replace_once(
              answer,
              '    case "methodology":\n      return buildSpecializedMethodologyAnswer(locale, route);\n',
              '    case "methodology":\n      return buildSpecializedMethodologyAnswer(locale, route, inputs.priorContext);\n',
          )

          live = "pages/crypto-astro/btc/live.tsx"
          replace_once(
              live,
              'function buildEvidenceNavigation(\n  route: BtcCosmographerRoute,\n  envelope: BtcMarketEnvelope | null,\n  deploymentSha: string | null,\n  snapshotTimestamp: string | null,\n): { revisionId: string | null; targets: BtcEvidenceArtifactTarget[] } {\n',
              'function buildEvidenceNavigation(\n  route: BtcCosmographerRoute,\n  envelope: BtcMarketEnvelope | null,\n  deploymentSha: string | null,\n  snapshotTimestamp: string | null,\n  priorContext: BtcCosmographerContextPacket | null,\n): { revisionId: string | null; targets: BtcEvidenceArtifactTarget[] } {\n',
          )
          replace_once(
              live,
              '  const protocolSide = route.domain === "astro_btc_bridge" && route.explicit_entities.includes("btc_side:protocol");\n  const astroSide = route.domain === "astromodule" || route.domain === "astro_btc_bridge";\n  const marketSide = route.domain === "btc_market" || route.domain === "snapshot_memory" || (route.domain === "astro_btc_bridge" && !protocolSide);\n\n  if (route.domain === "bitcoin_protocol" || protocolSide) {\n',
              '''  const activeAnswerContext = route.domain === "methodology" && route.explicit_entities.includes("active_answer_reference")\n    ? priorContext\n    : null;\n  const evidenceDomain = activeAnswerContext?.prior_domain ?? route.domain;\n  const effectiveMarketClass = activeAnswerContext?.prior_market_question_class ?? route.market_question_class;\n  const protocolSide = activeAnswerContext\n    ? evidenceDomain === "bitcoin_protocol"\n    : route.domain === "astro_btc_bridge" && route.explicit_entities.includes("btc_side:protocol");\n  const astroSide = evidenceDomain === "astromodule" || evidenceDomain === "astro_btc_bridge";\n  const marketSide = evidenceDomain === "btc_market" || evidenceDomain === "snapshot_memory" ||\n    (evidenceDomain === "astro_btc_bridge" && !protocolSide && Boolean(effectiveMarketClass));\n\n  if (evidenceDomain === "bitcoin_protocol" || protocolSide) {\n''',
          )
          replace_once(
              live,
              '    if (route.domain === "snapshot_memory") {\n',
              '    if (evidenceDomain === "snapshot_memory") {\n',
          )
          replace_once(
              live,
              'function needsMarket(route: BtcCosmographerRoute): boolean {\n  if (route.domain === "astro_btc_bridge" && route.explicit_entities.includes("btc_side:protocol")) return false;\n  return ["btc_market", "snapshot_memory", "astro_btc_bridge"].includes(route.domain);\n}\n',
              '''function needsMarket(\n  route: BtcCosmographerRoute,\n  priorContext: BtcCosmographerContextPacket | null,\n): boolean {\n  if (route.domain === "astro_btc_bridge" && route.explicit_entities.includes("btc_side:protocol")) return false;\n  if (route.domain === "methodology" && route.explicit_entities.includes("active_answer_reference") && priorContext) {\n    if (priorContext.prior_domain === "btc_market" || priorContext.prior_domain === "snapshot_memory") return true;\n    if (priorContext.prior_domain === "astro_btc_bridge" && priorContext.prior_market_question_class) return true;\n  }\n  return ["btc_market", "snapshot_memory", "astro_btc_bridge"].includes(route.domain);\n}\n''',
          )
          replace_once(
              live,
              'function marketEvidenceQuestion(route: BtcCosmographerRoute): string {\n  return route.market_question_class\n    ? MARKET_EVIDENCE_QUESTIONS[route.market_question_class]\n    : canonicalizeBtcQuestionForRouter(route.normalized_question);\n}\n',
              '''function marketEvidenceQuestion(\n  route: BtcCosmographerRoute,\n  priorContext: BtcCosmographerContextPacket | null,\n): string {\n  const activeMarketClass = route.domain === "methodology" && route.explicit_entities.includes("active_answer_reference")\n    ? priorContext?.prior_market_question_class ?? null\n    : null;\n  const marketClass = route.market_question_class ?? activeMarketClass;\n  return marketClass\n    ? MARKET_EVIDENCE_QUESTIONS[marketClass]\n    : canonicalizeBtcQuestionForRouter(route.normalized_question);\n}\n''',
          )
          replace_once(live, '  if (needsMarket(route) && source.ok !== false) {\n    const marketQuestion = marketEvidenceQuestion(route);\n', '  if (needsMarket(route, activePacket) && source.ok !== false) {\n    const marketQuestion = marketEvidenceQuestion(route, activePacket);\n')
          replace_once(live, '  const evidenceNavigation = buildEvidenceNavigation(route, envelope, servedDeploymentSha, sourceTimestamp);\n', '  const evidenceNavigation = buildEvidenceNavigation(route, envelope, servedDeploymentSha, sourceTimestamp, activePacket);\n')

          test = r'''import assert from "node:assert/strict";
import fs from "node:fs";
import {
  routeBtcCosmographerQuestion,
  type BtcCosmographerContextPacket,
} from "../lib/btc-cosmographer-route-graph";
import {
  buildSpecializedMethodologyAnswer,
  specializeMarketAnswer,
} from "../lib/btc-cosmographer-specialized-answer";
import type { BtcCosmographerAnswerProjection } from "../lib/btc-protocol-evidence";

function marketAnswer(locale: "ru" | "en"): BtcCosmographerAnswerProjection {
  const ru = locale === "ru";
  return {
    answer_state: "SPLIT",
    answer_mode: "MARKET_DIAGNOSIS",
    headline: ru ? "Принятая память фиксирует противоположные переходы" : "Accepted memory records opposing transitions",
    direct_answer: ru ? "Базовый ответ." : "Base answer.",
    sections: [
      {
        id: "market_evidence",
        label: ru ? "Что изменилось" : "What changed",
        bullets: ru
          ? [
              "Доминирование BTC: 56.54% → 56.64% (+0.1 pp).",
              "Доля стейблкоинов: 13.5% → 13.41% (−0.1 pp).",
              "Ширина альткоинов · 24ч: 38.7% → 26.5% (−12.2 pp).",
            ]
          : [
              "BTC dominance: 56.54% → 56.64% (+0.1 pp).",
              "Stablecoin share: 13.5% → 13.41% (−0.1 pp).",
              "Altcoin breadth · 24h: 38.7% → 26.5% (−12.2 pp).",
            ],
      },
      {
        id: "market_limit",
        label: ru ? "Согласие и расхождение" : "Agreement and divergence",
        paragraph: ru ? "Принятая память содержит противоположные движения модулей." : "Accepted memory contains opposing module moves.",
      },
      {
        id: "market_watch",
        label: ru ? "Что изменит чтение" : "What would change the read",
        paragraph: ru
          ? "Наблюдайте за следующими принятыми изменениями гравитации BTC, ликвидности и участия."
          : "Watch the next accepted changes in BTC gravity, liquidity, and participation.",
      },
    ],
    source_boundary: ru
      ? "Рыночные значения строятся только из принятого Snapshot и Delta; это не торговый сигнал."
      : "Market values are built only from the accepted Snapshot and Delta; this is not a trading signal.",
    proof_label: ru ? "Рыночные доказательства доступны" : "Market evidence available",
  };
}

const snapshotPacket: BtcCosmographerContextPacket = {
  schema: "btc_cosmographer_context_v0_1",
  prior_domain: "snapshot_memory",
  prior_subject: "change_memory",
  prior_intents: ["change"],
  prior_answer_state: "SPLIT",
  prior_market_question_class: "change_memory",
  prior_time_start: null,
  prior_time_end: null,
  prior_snapshot_generated_at_utc: "2026-08-18T23:35:39Z",
};

const marketPacket: BtcCosmographerContextPacket = {
  schema: "btc_cosmographer_context_v0_1",
  prior_domain: "btc_market",
  prior_subject: "general_btc_field",
  prior_intents: ["watch"],
  prior_answer_state: "SPLIT",
  prior_market_question_class: "general_btc_field",
  prior_time_start: "2026-08-18",
  prior_time_end: "2026-08-18",
  prior_snapshot_generated_at_utc: "2026-08-18T23:35:39Z",
};

for (const [locale, question] of [
  ["ru", "Что именно создаёт расхождение?"],
  ["en", "What exactly creates the divergence?"],
] as const) {
  const route = routeBtcCosmographerQuestion(locale, question, snapshotPacket);
  assert.equal(route.context_relation, "FOLLOW_UP", `${locale} divergence must be a follow-up`);
  assert.equal(route.domain, "snapshot_memory", `${locale} divergence must retain Snapshot Memory`);
  assert.equal(route.subject, "change_memory", `${locale} divergence must retain the active subject`);
  assert.ok(route.intents.includes("reason"), `${locale} divergence must carry reason intent`);
  const answer = specializeMarketAnswer(locale, route, marketAnswer(locale));
  assert.match(answer.direct_answer, locale === "ru" ? /^Расхождение создают/ : /^The divergence comes from/);
  assert.equal(answer.source_boundary, marketAnswer(locale).source_boundary, "boundary must remain unchanged");
}

for (const [locale, question] of [
  ["ru", "Что должно произойти, чтобы чтение изменилось?"],
  ["en", "What has to happen for the read to change?"],
] as const) {
  const route = routeBtcCosmographerQuestion(locale, question, snapshotPacket);
  assert.equal(route.context_relation, "FOLLOW_UP", `${locale} invalidation must be a follow-up`);
  assert.equal(route.domain, "snapshot_memory", `${locale} invalidation must retain Snapshot Memory`);
  assert.equal(route.subject, "change_memory", `${locale} invalidation must retain the active subject`);
  assert.ok(route.intents.includes("change"), `${locale} invalidation must carry change intent`);
  assert.ok(route.intents.includes("watch"), `${locale} invalidation must carry watch intent`);
  const answer = specializeMarketAnswer(locale, route, marketAnswer(locale));
  assert.match(answer.direct_answer, locale === "ru" ? /^Условия изменения чтения:/ : /^Conditions that would change the read:/);
}

const proofCases = [
  ["ru", "Откуда ты это знаешь?", /Источник активного ответа/, /Контекст вкладки/],
  ["en", "How do you know that?", /Source of the active answer/, /Tab context/],
  ["ru", "Какие данные ты использовал?", /Данные активного ответа/, /Market Snapshot/],
  ["en", "What data did you use?", /Data used by the active answer/, /Market Snapshot/],
