name: BHRIGU Frey Preservation Gate
on:
  pull_request:
    branches: [master]
    paths:
      - 'pages/frey.js'
      - 'pages/access.tsx'
      - 'pages/guide/frey.js'
      - 'pages/_app.js'
      - 'pages/start.js'
      - 'pages/map.js'
      - 'lib/frey-export-minimal.js'
      - '.github/workflows/bhrigu-frey-preservation-pr.yml'
      - '.github/workflows/access-intake-containment-pr.yml'
      - '.github/workflows/bhrigu-public-surface-integrity-pr.yml'
permissions:
  contents: read
jobs:
  frey-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Exact Frey personal commercial scope
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          python3 - <<'PY'
          import os, subprocess
          expected = {
            '.github/workflows/access-intake-containment-pr.yml',
            '.github/workflows/bhrigu-frey-preservation-pr.yml',
            '.github/workflows/bhrigu-public-surface-integrity-pr.yml',
            'pages/access.tsx',
            'pages/frey.js',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA'],os.environ['HEAD_SHA']],text=True).splitlines())
          assert actual == expected, f'FREY_PERSONAL_EXACT_SCOPE_FAIL actual={sorted(actual)} expected={sorted(expected)}'
          print('FREY_PERSONAL_EXACT_5_FILE_SCOPE=PASS')
          PY
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Protected runtime diff
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          test -z "$(git diff --name-only "$base" "$head" -- pages/api lib/frey-access-bridge.js components/btc ui/btc 'lib/btc-*')"
      - name: Guide information preservation
        run: |
          grep -q 'FREY_GUIDE_INFORMATION_PRESERVATION_V0_1' pages/guide/frey.js
          grep -q 'bhrigu-frey-en-brief-v4.pdf' pages/guide/frey.js
          grep -q 'bhrigu-frey-en-full-article-v4.pdf' pages/guide/frey.js
          grep -q 'bhrigu-frey-ru-v2-aligned.pdf' pages/guide/frey.js
          grep -q 'bhrigu-frey-en-approved-poster-pack-v5-visual-guide.pdf' pages/guide/frey.js
          grep -q 'bhrigu-frey-ru-approved-poster-pack-v1-visual-guide.pdf' pages/guide/frey.js
          grep -q 'external systems recon is handled separately through /access' pages/guide/frey.js
          grep -q 'Одна дата открывает состояние. Две даты открывают переход.' pages/guide/frey.js
      - name: Single Guide metadata authority
        run: |
          ! grep -q 'next/head' pages/guide/frey.js
          ! grep -q '<Head>' pages/guide/frey.js
          grep -q 'Frey Guide · Read, Compare & AI Export | BHRIGU' pages/_app.js
          grep -q 'Гид Frey · Чтение, сравнение и AI Export | BHRIGU' pages/_app.js
      - name: Guide discoverability and Phi visual contract
        run: |
          grep -q '__FREY_GUIDE_DISCOVERABILITY_V0_1__' pages/frey.js
          grep -q 'Открыть полный Guide →' pages/frey.js
          grep -q 'Open the full Guide →' pages/frey.js
          grep -q '/guide/frey?lang=' pages/frey.js
          grep -q 'Frey Guide' pages/map.js
          grep -q 'Гид Frey' pages/map.js
          grep -q '/guide/frey' pages/map.js
          grep -q '#62a8d8' pages/start.js
          grep -q '#9a89d1' pages/start.js
          grep -q '#62a8d8' pages/map.js
          grep -q '#9a89d1' pages/map.js
          grep -q 'FieldAnchorGlyph' pages/start.js
          grep -q 'startFieldGlyph' pages/start.js
          grep -q 'column-gap:28px' <(tr -d ' ' < pages/map.js)
      - name: Frey human-layer contract
        run: |
          grep -q 'FREY_AI_READING_PACKET_HUMAN_V0_1' pages/frey.js
          grep -q 'Compare with a second date · Δ change' pages/frey.js
          grep -q 'For another AI · Reading Packet' pages/frey.js
          grep -q 'Сравнить со второй датой · Δ изменения' pages/frey.js
          grep -q 'Для другого ИИ · Пакет чтения' pages/frey.js
          grep -q 'data-frey-response-state={responseSurface.ui_state}' pages/frey.js
      - name: Frey personal commercial contract
        run: |
          grep -Fq 'FREY_PERSONAL_TEMPORAL_RESEARCH_USD79_V0_1' pages/frey.js
          grep -Fq 'offer=frey-personal' pages/frey.js
          grep -Fq 'Personal research · USD 79' pages/frey.js
          grep -Fq 'Персональное исследование · USD 79' pages/frey.js
          grep -Fq 'Frey Personal Temporal Research' pages/access.tsx
          grep -Fq 'USD 79' pages/access.tsx
          grep -Fq 'price: "79"' pages/access.tsx
          grep -Fq 'FREY_PERSONAL_TEMPORAL_RESEARCH_V0_1' pages/access.tsx
          grep -Fq 'No guaranteed prediction' pages/access.tsx
          grep -Fq 'Без гарантированного прогноза' pages/access.tsx
          test -z "$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' -- lib/frey-access-bridge.js lib/access-triage.js pages/api)"
          echo 'FREY_PERSONAL_COMMERCIAL_CONTRACT=PASS'
      - name: AI packet contract
        run: |
          node <<'NODE'
          const assert=require('assert');
          const {buildFreyExportPayload,buildFreyExportText}=require('./lib/frey-export-minimal');
          const a={date:'2026-08-28',phase_density:.62,harmonic_tension:.55,resonance_level:.71,eclipse_proximity:.25,structural_stability:.66,analysis:{}};
          const b={date:'2026-09-02',phase_density:.70,harmonic_tension:.40,resonance_level:.79,eclipse_proximity:.31,structural_stability:.73,analysis:{}};
          const p=buildFreyExportPayload({mode:'compare',locale:'ru',primaryResult:a,compareResult:b,deltaBlock:{mode:'test'},timelineResults:[{date:'2026-08-29',vector:'Stable line'}]});
          assert.equal(p.schema_version,'frey-ai-reading-packet-v1');
          assert.equal(p.protocol_version,'frey-external-ai-reading-protocol-v1');
          assert.equal(p.language,'ru');
          assert(p.prompt_for_external_ai.includes('Здесь две даты.'));
          assert(p.prompt_for_external_ai.includes('не как рейтинг «лучше / хуже»'));
          assert(p.prompt_for_external_ai.includes('СМЫСЛ МЕТРИК'));
          assert(p.prompt_for_external_ai.includes('ФОРМАТ ОТВЕТА'));
          assert(p.metric_semantics.structural_stability);
          assert(p.delta);
          assert(Array.isArray(p.timeline));
          assert(p.reference_materials.some(x=>x.includes('bhrigu-frey-ru-approved-poster-pack-v1-visual-guide.pdf')));
          const text=buildFreyExportText(p);
          assert(text.includes('INSTRUCTION FOR THE RECEIVING AI'));
          assert(text.includes('FREY DATA PACKET'));
          console.log('AI_PACKET_CONTRACT=PASS');
          NODE
      - name: Approved materials exist
        run: |
          test -f public/publications/frey/bhrigu-frey-en-brief-v4.pdf
          test -f public/publications/frey/bhrigu-frey-en-full-article-v4.pdf
          test -f public/publications/frey/bhrigu-frey-ru-v2-aligned.pdf
          test -f public/publications/frey/bhrigu-frey-en-approved-poster-pack-v5-visual-guide.pdf
          test -f public/publications/frey/bhrigu-frey-ru-approved-poster-pack-v1-visual-guide.pdf
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: First HTTP human-layer acceptance
        run: |
          npm start >/tmp/frey.log 2>&1 & echo $! >/tmp/frey.pid
          for i in $(seq 1 60); do curl -fsS 'http://127.0.0.1:3000/frey?lang=ru&d=2026-08-28' >/dev/null && break; sleep 1; done
          python3 - <<'PY'
          from urllib.request import urlopen
          import re
          assets=['bhrigu-frey-en-brief-v4.pdf','bhrigu-frey-en-full-article-v4.pdf','bhrigu-frey-ru-v2-aligned.pdf','bhrigu-frey-en-approved-poster-pack-v5-visual-guide.pdf','bhrigu-frey-ru-approved-poster-pack-v1-visual-guide.pdf']
          for lang in ('en','ru'):
            guide=urlopen(f'http://127.0.0.1:3000/guide/frey?lang={lang}',timeout=30).read().decode()
            assert f'<html lang="{lang}"' in guide.lower(),lang
            assert guide.count('rel="canonical"') == 1,(lang,'canonical',guide.count('rel="canonical"'))
            assert guide.count('name="description"') == 1,(lang,'description',guide.count('name="description"'))
            for asset in assets: assert asset in guide,(lang,asset)
          ru=urlopen('http://127.0.0.1:3000/frey?lang=ru&d=2026-08-28',timeout=30).read().decode()
          en=urlopen('http://127.0.0.1:3000/frey?lang=en&d=2026-08-28',timeout=30).read().decode()
          for x in ['Продолжить чтение','Сравнить со второй датой · Δ изменения','Для другого ИИ · Пакет чтения','Промт + данные Frey','Открыть полный Guide →','/guide/frey?lang=ru']:
            assert x in ru,x
          for x in ['Continue the reading','Compare with a second date · Δ change','For another AI · Reading Packet','Prompt + Frey data','Open the full Guide →','/guide/frey?lang=en']:
            assert x in en,x
          reading_ru=urlopen('http://127.0.0.1:3000/reading?lang=ru',timeout=30).read().decode()
          reading_en=urlopen('http://127.0.0.1:3000/reading?lang=en',timeout=30).read().decode()
          assert '/guide/frey?lang=ru' in reading_ru
          assert '/guide/frey?lang=en' in reading_en
          map_ru=urlopen('http://127.0.0.1:3000/map?lang=ru',timeout=30).read().decode()
          map_en=urlopen('http://127.0.0.1:3000/map?lang=en',timeout=30).read().decode()
          assert 'Гид Frey' in map_ru and '/guide/frey?lang=ru' in map_ru
          assert 'Frey Guide' in map_en and '/guide/frey?lang=en' in map_en
          start_ru=urlopen('http://127.0.0.1:3000/start?lang=ru',timeout=30).read().decode()
          start_en=urlopen('http://127.0.0.1:3000/start?lang=en',timeout=30).read().decode()
          for html in (start_ru,start_en):
            assert 'data-glyph-class="FIELD_ANCHOR"' in html
            assert '#62a8d8' in html and '#9a89d1' in html
          for html in (map_ru,map_en):
            assert '#62a8d8' in html and '#9a89d1' in html
            assert 'column-gap:28px' in html.replace(' ','')
          for leak in ['Baseline pressure stays moderate, yet distortion rises fast','Signal aligns in short stable bands, but resonance breaks','Core structure holds, while outer balance becomes vulnerable']:
            assert leak not in ru,leak
          assert 'data-frey-response-state="success"' in ru
          for lang in ('en','ru'):
            default_access=urlopen(f'http://127.0.0.1:3000/access?lang={lang}',timeout=30).read().decode()
            assert 'PHI_EXTERNAL_SYSTEMS_RECON_V0_1' in default_access,(lang,'default-access-marker')
            assert 'USD 300' in default_access,(lang,'default-access-price')
            personal=urlopen(f'http://127.0.0.1:3000/access?lang={lang}&offer=frey-personal',timeout=30).read().decode()
            assert 'FREY_PERSONAL_TEMPORAL_RESEARCH_V0_1' in personal,(lang,'personal-marker')
            assert 'USD 79' in personal,(lang,'personal-price')
            assert '<form' not in personal.lower(),(lang,'no-form')
            broken=urlopen(f'http://127.0.0.1:3000/access?lang={lang}&offer=frey-personal&ctx=%25%25%25',timeout=30).read().decode()
            assert 'data-frey-personal-context="missing-or-invalid"' in broken,(lang,'invalid-ctx-safe')
          print('FREY_GUIDE_DISCOVERABILITY_PHI=PASS')
          print('FREY_PERSONAL_HTTP_MATRIX=PASS')
          PY
      - name: Install browser acceptance client
        run: python3 -m pip install --disable-pip-version-check selenium==4.34.2
      - name: Frey personal RU EN desktop mobile browser acceptance
        run: |
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from urllib.parse import urlparse

          base='http://127.0.0.1:3000'
          options=webdriver.ChromeOptions()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1280,900'):
            options.add_argument(arg)
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,30)
          try:
            for viewport,w,h in (('desktop',1280,900),('mobile',390,844)):
              driver.set_window_size(w,h)
              for lang in ('en','ru'):
                driver.get(f'{base}/frey?lang={lang}&d=2026-08-28')
                wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
                link=driver.find_element(By.CSS_SELECTOR,'[data-frey-personal-commercial-entry="FREY_PERSONAL_TEMPORAL_RESEARCH_USD79_V0_1"]')
                href=link.get_attribute('href')
                assert 'offer=frey-personal' in href,(viewport,lang,'offer-selector',href)
                assert 'ctx=' in href,(viewport,lang,'ctx-transfer',href)
                path=urlparse(href).path + '?' + urlparse(href).query
                driver.get(base+path)
                wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
                body=driver.find_element(By.TAG_NAME,'body').text
                assert 'USD 79' in body,(viewport,lang,'price')
                expected='personal research' if lang=='en' else 'персональное исследование'
                assert expected in body.lower(),(viewport,lang,'localized-copy')
                ctx=driver.find_element(By.CSS_SELECTOR,'[data-frey-personal-context]').get_attribute('data-frey-personal-context')
                assert ctx == 'valid',(viewport,lang,'ctx-valid',ctx)
                assert '2026-08-28' in body,(viewport,lang,'primary-date-prefill')
                assert not driver.find_elements(By.TAG_NAME,'form'),(viewport,lang,'no-form')
                overflow=driver.execute_script('return document.documentElement.scrollWidth - window.innerWidth')
                assert overflow <= 1,(viewport,lang,'horizontal-overflow',overflow)
            print('FREY_PERSONAL_BROWSER_MATRIX=PASS')
          finally:
            driver.quit()
          PY
      - name: Stop server
        if: always()
        run: test ! -f /tmp/frey.pid || kill "$(cat /tmp/frey.pid)" || true
